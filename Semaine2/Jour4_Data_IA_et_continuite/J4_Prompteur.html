<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

</head>
<body>
<div id="stage" aria-label="Texte du prompteur">
  <article id="script"></article>
</div>
<div class="fade-top"></div><div class="fade-bot"></div>
<div id="guide" aria-hidden="true"></div>
<div id="progress"></div>
<div id="hud"><span id="where"></span><span id="left"></span></div>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>
</div>

<script>
const DATA = [{"n": 68, "title": "Risques data et IA, fin de l'analyse de risques, continuité", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Hier, vous avez posé vos échelles et conduit les deux premiers ateliers d'EBIOS Risk Manager : vous savez ce que vous protégez et qui pourrait attaquer. Aujourd'hui, nous allons au bout de l'analyse de risques, et nous ouvrons un second chantier, la continuité d'activité."}, {"cue": "Sous-titre", "text": "La journée a trois temps. D'abord le volet cybersécurité de la semaine : les vulnérabilités propres aux données et à l'intelligence artificielle, c'est le chapitre 7. Ensuite la fin du chapitre 6, avec les ateliers 3, 4 et 5. Enfin le chapitre 8, l'analyse d'impact sur l'activité. Ces trois blocs préparent les sections 3.4 à 3.6 et la partie 4 du D2. C'est une journée dense, et c'est la dernière journée de méthode sur les risques avant l'intersession. Gardez le cours ouvert : les tableaux Kestrel que je vais montrer y figurent en entier."}], "words": 144}, {"n": 69, "title": "Le matin, la menace et les décisions ; l'après-midi, la reprise", "paras": [{"cue": "Frise des cinq étapes", "text": "Voici le programme. Ce matin, nous commençons par le chapitre 7, les vulnérabilités des infrastructures de données et des systèmes d'IA. Nous le terminons par une étude de document : une fuite de données de santé qui n'a demandé aucune attaque. Puis nous reprenons l'étude Kestrel du chapitre 6 là où nous l'avions laissée hier, avec les ateliers 3, 4 et 5."}, {"cue": "Carte « Matin »", "text": "Le matin reste théorique, comme toute la semaine. Je vous montre la méthode et l'exemple Kestrel ; vous ne travaillez pas encore sur Medisecure. Prenez des notes sur la manière de justifier chaque cote : c'est ce qui fera la différence dans votre dossier. Chaque bloc se termine par une fiche de travail sur Kestrel : la FT 17 après le chapitre 7, les FT 15 et FT 16 après les ateliers 3 à 5."}, {"cue": "Carte « Après-midi », étape orange et bandeau", "text": "L'après-midi, nous voyons le chapitre 8, l'analyse d'impact sur l'activité, puis la fiche FT 18, puis je lance cinq exercices sur Medisecure : les vulnérabilités data et IA, les ateliers 3, 4 et 5, et la grille d'impact. Vous ne les terminerez pas cet après-midi : additionnées, les durées indicatives du cours font environ quatorze heures et demie. L'objectif est de les démarrer tous, de poser vos tableaux, et de repartir avec une liste claire de ce qui reste à faire pendant l'intersession. N'oubliez pas non plus la seconde partie de l'exercice du chapitre 4, la vue physique : commencez au moins à la dessiner aujourd'hui."}, {"cue": "Carte sombre « Dossier D2 »", "text": "Côté dossier, la journée couvre les sections 3.4, 3.5 et 3.6 de la partie analyse de risques, et la partie 4 sur les besoins de continuité. S'y ajoutent les annexes E et F. Le chapitre 7 touche aussi l'annexe A, pour l'usage hors inventaire."}], "words": 287}, {"n": 70, "title": "Les vulnérabilités des infrastructures data et IA", "paras": [{"cue": "Titre", "text": "Ouvrons le chapitre 7. C'est le volet cybersécurité de la semaine, et il ne reprend pas la veille. En S1, vous avez appris à qualifier une alerte : le score de gravité CVSS, le catalogue KEV de la CISA, le score EPSS, l'IA fantôme. Si ces notions vous semblent floues, relisez le chapitre 7 du cours de la S1. Ici, on change de question."}, {"cue": "Sous-titre", "text": "La veille demandait : quelles vulnérabilités sont publiées ? L'analyse de risques demande : où sont les faiblesses de ce SI-là, et comment un attaquant les enchaînerait-il ? À la fin de ce chapitre, vous saurez repérer ces faiblesses dans les données et dans l'IA, les nommer avec les référentiels, les inscrire dans la cartographie et en tirer un scénario opérationnel. C'est exactement ce que votre dossier vous demande de faire."}], "words": 135}, {"n": 71, "title": "Chaque copie d'une donnée est un bien support à part entière", "paras": [{"cue": "Titre", "text": "Partons d'un constat. Le Panorama de la cybermenace 2025 de l'ANSSI relève la progression des incidents avec exfiltration de données. Or une donnée ne vit pas seulement dans l'application qui la crée. Elle existe en plusieurs exemplaires, et elle circule."}, {"cue": "Schéma, de gauche à droite", "text": "Le schéma suit le trajet d'une donnée. Elle naît dans des sources : applications métier, appareils connectés, API d'un partenaire. Une API, c'est une interface d'échange automatique entre logiciels. La donnée est ensuite collectée par un pipeline, un export CSV ou une API, puis stockée dans une base, un stockage objet ou un entrepôt. Elle peut être traitée par un modèle d'IA, restituée dans un tableau de bord, et consultée par des utilisateurs. Chaque éclair rouge marque un point de vulnérabilité. Regardez le dernier : la flèche en pointillés vers un service d'IA grand public. C'est un flux que personne n'a inventorié."}, {"cue": "Carte de droite « Infrastructure de données »", "text": "D'où la définition du cours. L'infrastructure de données regroupe tout ce qui stocke, transporte, transforme ou expose des données en dehors du cœur des applications. Le point important est dans la deuxième phrase : chaque élément est un bien support, et il hérite de la sensibilité des données qu'il porte, même s'il n'est pas considéré comme une application. Une copie d'un fichier patients dans un tableur est aussi sensible que la base d'origine, et généralement bien moins protégée. Une question pour vous : dans votre entreprise d'alternance, combien de copies existe-t-il de votre fichier clients ?"}, {"cue": "Retour au titre", "text": "Gardez cette phrase en tête toute la matinée. La veille regarde ce qui est publié ; l'analyse de risques regarde ce SI-là, avec ses copies, ses exports et ses usages. C'est pour cela que le chapitre parle d'infrastructure de données, et pas seulement d'applications. Un pipeline d'intégration, un dossier partagé où l'on dépose des exports, un tableau de bord alimenté chaque nuit sont autant d'objets à dessiner. S'ils manquent sur votre vue applicative, ils manqueront aussi dans votre analyse de risques."}], "words": 319}, {"n": 72, "title": "Sept familles de faiblesses, rarement publiées avec un CVE", "paras": [{"cue": "Titre", "text": "Sept familles de vulnérabilités reviennent dans presque tous les audits. Le titre résume leur point commun : ce sont rarement des failles publiées avec un numéro CVE. Ce sont des faiblesses de conception, de configuration ou d'organisation. C'est pourquoi la veille seule ne les détecte pas. Et elles se combinent : c'est leur combinaison qui rend un scénario vraisemblable."}, {"cue": "Trois premières lignes", "text": "Premièrement, les droits trop larges. Une application se connecte souvent à sa base avec un compte unique qui peut tout lire, tout modifier, tout supprimer. Si plusieurs applications partagent la base, elles partagent souvent ce compte : compromettre la moins protégée donne accès à toutes les données. Deuxièmement, les données en clair : une base chiffrée sur disque peut voyager en clair sur le réseau, et les sauvegardes et les exports échappent souvent au chiffrement. Troisièmement, l'absence de journalisation. Sans journaux des accès, on ne sait pas ce qui a été copié : on ne peut ni mesurer une fuite, ni informer les personnes, ni répondre à la CNIL. Le principe de moindre privilège, qui veut que chaque compte n'ait que les droits strictement nécessaires, est simple à énoncer et rarement appliqué aux comptes techniques."}, {"cue": "Quatre lignes suivantes", "text": "La dette de dépendances, ce sont des bibliothèques dont les versions ne sont pas figées, ou qui sont hors support et ne seront jamais corrigées. La fuite par export : un CSV déposé sur un partage, envoyé par courriel, ouvert dans un tableur, sans date d'expiration. L'injection, connue depuis plus de vingt ans, figure toujours dans le Top 10 des risques des applications web de l'OWASP. Enfin le stockage mal configuré : un conteneur public, une base ouverte sur Internet. Aucune attaque sophistiquée n'est nécessaire, car des moteurs de recherche spécialisés indexent en permanence les services exposés."}, {"cue": "Colonne « Où la repérer » et bandeau", "text": "Regardez maintenant la dernière colonne, c'est elle qui compte pour vous. Chaque faiblesse se lit dans une pièce de votre cartographie : la vue de l'administration, la matrice des flux, l'inventaire applicatif, la vue des infrastructures logiques. Si votre annexe B note la protection de chaque flux, même quand elle vaut « aucune », les fuites par export apparaissent d'elles-mêmes. Les avis du CERT-FR restent utiles pour les composants, comme un moteur de base de données ; le reste se découvre en lisant la cartographie. Chez Kestrel, vous allez voir dans un instant trois de ces familles se combiner sur une seule application : des lectures non journalisées, un export sans limite et un compte applicatif aux droits trop larges."}], "words": 411}, {"n": 73, "title": "Chaque partie d'un système d'IA peut être attaquée", "paras": [{"cue": "Titre", "text": "Passons à l'IA. Un système d'IA n'est pas seulement un modèle. Le règlement européen sur l'intelligence artificielle le définit, à son article 3, comme un système automatisé qui déduit de ses entrées la manière de générer des prédictions, du contenu, des recommandations ou des décisions. Pour l'analyse de risques, retenez qu'il comprend ses données, son modèle, son infrastructure et les outils par lesquels on l'utilise. Chacun est un bien support."}, {"cue": "Quatre premières lignes du tableau", "text": "L'empoisonnement vise l'entraînement : des données fausses ou orientées modifient le comportement du modèle. Un modèle de tri d'alertes entraîné sur un historique où des alertes graves ont été classées sans suite apprendrait à les ignorer. Et des données de mauvaise qualité produisent le même effet, sans attaquant. L'évasion vise le modèle en production, avec une entrée légèrement modifiée. L'extraction reconstitue un modèle en l'interrogeant massivement par son API ; l'inversion et l'inférence d'appartenance retrouvent des informations sur les données d'entraînement. L'injection de prompt, enfin, est l'attaque emblématique de l'IA générative : un grand modèle de langage, un LLM, ne distingue pas de façon fiable les instructions de son concepteur et le contenu qu'il traite. Une instruction cachée dans un courriel ou un document peut le détourner."}, {"cue": "Trois dernières lignes", "text": "La fuite de données d'entraînement : un modèle peut restituer mot pour mot des fragments de ce sur quoi il a été entraîné ou ajusté. La chaîne d'approvisionnement : certains formats de fichiers de modèles exécutent du code au chargement, et des chercheurs signalent des modèles piégés sur des plateformes publiques depuis 2024. L'IA fantôme, vue en S1, reste la vulnérabilité IA la plus fréquente dans les organisations qui n'ont aucun projet d'IA."}, {"cue": "Carte sombre des référentiels", "text": "Pour nommer ces attaques, quatre référentiels. Le Top 10 de l'OWASP pour les applications LLM, édition 2026, publiée début août 2026 : l'injection de prompt reste au premier rang, et la capacité d'agir excessive monte au troisième. Ce classement vient de sources secondaires concordantes : vérifiez-le sur le site du projet avant de citer un numéro. MITRE ATLAS range les attaques en tactiques et en techniques, et vous servira à l'atelier 4. L'ANSSI a publié le 29 avril 2024 ses recommandations pour un système d'IA générative. L'ENISA rappelle que la sécurité de l'IA s'ajoute à l'hygiène classique, elle ne la remplace pas."}], "words": 372}, {"n": 74, "title": "SO4 : le portail B2B offre le chemin le plus faible, coté V3", "paras": [{"cue": "Titre", "text": "Voyons comment Romain Chevalier, responsable de l'infrastructure de Kestrel et RSSI à temps partiel, c'est-à-dire responsable de la sécurité des systèmes d'information, applique tout cela. Il part de la donnée la plus sensible en volume : nom, adresse et téléphone des destinataires, environ 2,5 millions de livraisons par an, dans la base PostgreSQL d'APP-03 Kestrel Track. Il relève des faits de la fiche, comme Django 3.2, hors support depuis avril 2024, et trois constats d'entretien qu'il écrit comme hypothèses : H12, comptes du portail B2B protégés par un simple mot de passe ; H13, export CSV sans limite de volume ni journal ; H15, un planificateur qui a collé un extrait du fichier des tournées dans un assistant d'IA gratuit. Il ajoute une hypothèse sur la base elle-même, H18 : aucune journalisation des lectures. Puis il les inscrit dans la cartographie : l'export devient un flux manuel, l'assistant d'IA un usage hors inventaire."}, {"cue": "Graphe, colonnes Connaître et Rentrer", "text": "Le scénario part de SS4, issu du couple SR3 : un cybercriminel veut revendre des données de destinataires, par exemple à ceux qui mènent des campagnes de SMS frauduleux du type « votre colis est en attente ». Pour connaître, il repère le portail public et sa version, et recense les contacts logistiques des e-commerçants. Pour rentrer, deux chemins : la faille de Django, ou l'hameçonnage d'un compte client du portail B2B."}, {"cue": "Colonnes Trouver et Exploiter, étiquettes Pr", "text": "Pour trouver, le compte client donne l'export CSV ; l'accès au serveur donne la base, lue par un compte aux droits complets, hypothèse H14. Pour exploiter, il extrait par petits lots, et rien ne le signale. Regardez les étiquettes de probabilité : par le portail, l'indice cumulé vaut 3 ; par Django, 2. L'attaquant prend le meilleur chemin, et ce chemin ne demande aucune compétence particulière. Romain retient donc V3, très vraisemblable, la cote de SO4."}, {"cue": "Carte de droite", "text": "Et il écrit la phrase la plus importante : si H12 et H13 se révélaient fausses, la cote tomberait à V2. Une cote qui repose sur une hypothèse doit le dire. Les ciseaux sur le graphe montrent où une seule mesure coupe le chemin : l'authentification multifacteur du portail, puis la limitation et la journalisation des exports, les deux volets de M13. Vous voyez l'atelier 5 se préparer."}, {"cue": "Retour au titre", "text": "Un mot enfin sur l'IA. Le même raisonnement s'applique à l'IA fantôme, qui est d'abord une vulnérabilité. Un attaquant repère sur les réseaux professionnels des salariés qui disent utiliser un assistant grand public, compromet le compte personnel de l'un d'eux grâce à un mot de passe réutilisé, parcourt l'historique des conversations et en extrait les données. La vraisemblance se justifie alors par un fait mesuré, comme un volume de connexions vers ces services relevé par le pare-feu. Un usage simplement négligent, sans attaquant, relève plutôt du socle de sécurité et de la cartographie."}], "words": 462}, {"n": 75, "title": "Une fuite sans attaque : la copie de migration oubliée", "paras": [{"cue": "Document de gauche", "text": "Je vous propose l'étude de document qui clôt le chapitre 7. C'est un cas réel, résumé à partir de la communication de la CNIL et du Comité européen de la protection des données, et de la presse spécialisée. L'écran n'en montre qu'un résumé : prenez cinq minutes pour lire le document complet dans le cours, puis les quatre questions."}, {"cue": "Questions 1 et 2", "text": "Nous faisons ensuite un tour de table rapide, deux ou trois voix par question. Pour la première, j'attends au moins trois familles du chapitre, chacune avec son fait : la fuite par export, avec une extraction plus large que nécessaire et jamais supprimée ; les données en clair, puisque les données du serveur n'étaient pas chiffrées ; et le stockage mal configuré, celui du serveur oublié après une migration que décrit le chapitre. Pour la deuxième, l'idée à faire émerger est simple : une copie technique préparée pour un projet légitime n'a ni les droits, ni le chiffrement, ni la durée de conservation de la base d'origine. Une matrice des flux qui note les flux manuels et leur protection l'aurait rendue visible. Certains citeront aussi l'absence de procédure encadrant les migrations : c'est une faiblesse d'organisation, et le chapitre rappelle que ces faiblesses-là n'apparaissent dans aucun avis de sécurité."}, {"cue": "Questions 3 et 4", "text": "La troisième question porte sur la responsabilité. La CNIL a sanctionné l'éditeur comme sous-traitant, 1,5 million d'euros, et relevé que ses contrats ne comportaient pas les clauses que le RGPD impose. Confier une migration ou un hébergement à un tiers ne fait pas disparaître le risque : il le déplace dans l'écosystème, ce qui nous mène tout droit à l'atelier 3. La dernière question est pour vous : quelles copies de production existent dans votre entreprise pour des tests ou des analyses, et qui sait quand elles seront détruites ? Notez vos réponses : elles vous serviront dans l'exercice de cet après-midi. Je ne donne pas de corrigé : le but est que vous sachiez reconnaître ces familles dans un texte qui ne les nomme pas."}], "words": 334}, {"n": 76, "title": "Prenez la fiche FT 17 : données de conduite et usages d'IA", "paras": [{"cue": "Titre", "text": "Le chapitre 7 se termine. Sortez la fiche FT 17 : elle applique les sept familles de faiblesses à une partie du SI de Kestrel que le cours n'a pas étudiée."}, {"cue": "Consigne", "text": "Romain Chevalier a déjà étudié les données des destinataires dans Kestrel Track. Il vous confie les temps de conduite et les positions des chauffeurs, qui passent par TeleFleet, Microsoft 365 et la paie, ainsi que les connexions vers des assistants d'IA grand public depuis le siège. Vous relevez les vulnérabilités, vous chiffrez, et vous ébauchez un scénario opérationnel. Soixante minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Posez-vous à chaque étape la même question : où cette donnée est-elle copiée, et qui peut y accéder ? Chaque copie est un bien support. C'est le réflexe que vous appliquerez ensuite à Medisecure."}], "words": 129}, {"n": 77, "title": "EBIOS Risk Manager : ateliers 3, 4 et 5", "paras": [{"cue": "Titre", "text": "Revenons au chapitre 6. Hier, l'étude Kestrel s'est arrêtée à la fin de l'atelier 2 : six événements redoutés, de ER1 à ER6, et trois couples source de risque et objectif visé retenus, SR1, SR2 et SR3."}, {"cue": "Sous-titre", "text": "Les trois ateliers qui restent répondent à trois questions. Par quels chemins, y compris par l'écosystème ? C'est l'atelier 3. Comment, concrètement, et avec quelle facilité ? C'est l'atelier 4. Et que décide-t-on ? C'est l'atelier 5. Vous allez voir les résultats d'un atelier devenir les entrées du suivant : c'est ce fil qui fait la solidité de votre partie 3."}], "words": 98}, {"n": 78, "title": "Seul l'éditeur de RoutePro est en zone de danger", "paras": [{"cue": "Titre", "text": "L'atelier 3 prend en compte l'écosystème. Les attaquants passent de plus en plus par un prestataire, un éditeur ou un partenaire moins protégé que la cible. On évalue donc chaque partie prenante avec quatre critères. La dépendance et la pénétration dans le SI augmentent la menace : ce sont les critères d'exposition. La maturité cyber et la confiance l'atténuent : ce sont les critères de fiabilité."}, {"cue": "Carte sombre, formule et seuils", "text": "La fiche méthode de l'ANSSI propose une formule générique : dépendance fois pénétration, divisé par maturité fois confiance, chaque critère coté de 1 à 4. Kestrel a fixé ses seuils : zone de danger au-dessus de 3, contrôle de 1 à 3, veille de 0,5 à moins de 1, hors périmètre en dessous. Il a aussi écrit une règle pour traduire en chiffres la dépendance notée sur la vue de l'écosystème : forte vaut 4 ; moyenne vaut 3 si un arrêt du partenaire interrompt dans la journée une activité de réalisation, 2 sinon ; faible vaut 1. Le tableau n'en montre que sept sur les dix parties prenantes évaluées ; la liste complète est dans le cours."}, {"cue": "Tableau, première ligne", "text": "Regardez la première ligne. PP-05, l'éditeur de RoutePro : dépendance 4, pénétration 4 avec son accès VPN permanent, maturité 2, confiance 2. Seize divisé par quatre, niveau 4 : zone de danger, la seule. Le groupe ne peut pas s'en séparer, puisque RoutePro porte la planification des tournées. Il agit donc sur les critères : un accès ouvert à la demande, nominatif, avec authentification multifacteur, et un avenant au contrat. La pénétration passe à 2, la confiance à 3, et la menace tombe à environ 1,3 : zone de contrôle."}, {"cue": "Bas du tableau, puis bas de la carte", "text": "En bas, le fabricant des boîtiers, à 0,22, est hors périmètre. Les parties prenantes en zones de danger et de contrôle sont dites critiques : elles doivent entrer dans les scénarios stratégiques. Kestrel en construit quatre : SS1, rançongiciel par l'éditeur de RoutePro ; SS2, rançongiciel par la passerelle VPN ; SS3, fraude au faux fournisseur ; SS4, vol des données des destinataires. Chaque scénario reprend la gravité de son événement redouté le plus grave : G4 pour les deux rançongiciels, G3 pour les deux autres. On ne cote pas encore la vraisemblance : c'est le rôle de l'atelier 4. Les trois autres parties prenantes critiques ont aussi été examinées : PP-19 est rattachée à SS1 comme chemin secondaire, PP-14 mène à ER6, de gravité G2, traité par une mesure sur l'écosystème, et PP-08 est retenue comme variante de SS4."}], "words": 414}, {"n": 79, "title": "SO1 : sept actions, un maillon faible, une vraisemblance V3", "paras": [{"cue": "Titre", "text": "L'atelier 4 descend au niveau du mode opératoire. Un scénario opérationnel est une suite d'actions élémentaires sur des biens supports, organisée en quatre phases : connaître, rentrer, trouver, exploiter. Voici SO1, le détail de SS1, le rançongiciel par l'éditeur de RoutePro."}, {"cue": "Graphe, de gauche à droite", "text": "L'attaquant repère en sources ouvertes que l'éditeur de RoutePro compte Kestrel parmi ses clients, hypothèse H8. Il hameçonne un technicien de l'éditeur et vole ses identifiants VPN ; l'achat d'identifiants sur un forum criminel est un mode alternatif, en gris, moins probable. Il se connecte par l'accès permanent de l'éditeur. Il explore un réseau du siège supposé plat, hypothèse H3, obtient un compte d'administration, localise le NAS de sauvegarde, supprime les sauvegardes, puis chiffre les 12 machines virtuelles un dimanche à 3 h. Chaque boîte nomme un bien support de la cartographie : PP-05, SEC-01, SRV-01 et SRV-02, STO-01. La dernière boîte mène à l'hexagone rouge : ER2, livraisons arrêtées sur tout le réseau plus de 3 jours, gravité G4."}, {"cue": "Carte de droite, méthode standard", "text": "Comment coter ? La méthode standard cote la probabilité de succès de chaque action de 1 à 4, puis combine. À chaque étape, l'indice cumulé est le plus petit entre l'action elle-même et le meilleur indice des étapes qui y mènent. Une chaîne vaut son maillon le plus faible, et l'attaquant choisit le meilleur chemin. Ici, le maillon faible est l'hameçonnage, coté 3 parce qu'il vise une personne précise : SO1 vaut V3, très vraisemblable. Sept actions, c'est moins que la dizaine au-delà de laquelle la fiche conseille de baisser d'un niveau."}, {"cue": "Bas de la carte", "text": "Quatre cotes reposent sur des hypothèses, H3, H8, H9 et H16 : leur vérification est inscrite au plan d'action. Une hypothèse fausse changerait la vraisemblance, c'est pourquoi on l'écrit. Les trois autres scénarios sont cotés avec la méthode expresse : SO2 par la passerelle VPN, V2 ; SO3, le faux fournisseur, V3 ; SO4, que vous avez vu ce matin, V3. Pour votre dossier, l'une ou l'autre méthode suffit, pourvu que la cote soit justifiée par des vulnérabilités sourcées. Et méfiez-vous d'une cote sans fait : écrire « l'attaquant exploite une faille » ne prouve rien ; écrire « l'accès est permanent, sans authentification multifacteur, hypothèse H9 » rend l'étape crédible."}], "words": 364}, {"n": 80, "title": "Prenez la fiche FT 15 : écosystème et scénario de fraude", "paras": [{"cue": "Titre", "text": "Nous avons vu les ateliers 3 et 4 sur l'exemple Kestrel. Sortez maintenant la fiche FT 15 : elle prolonge l'étude e-commerce que vous avez commencée avec la FT 14."}, {"cue": "Consigne", "text": "L'atelier 2 a retenu un escroc qui veut détourner les paiements des e-commerçants par un faux changement de RIB. Vous évaluez d'abord les parties prenantes avec les quatre critères, et vous placez chacune dans sa zone. Puis vous construisez le scénario stratégique, et vous cotez le scénario opérationnel en combinant les probabilités de succès étape par étape. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Retenez le principe : l'attaquant prend le chemin le plus facile, et c'est ce chemin qui fixe la vraisemblance. Nous comparerons vos calculs avant de passer à l'atelier 5."}], "words": 122}, {"n": 81, "title": "14 mesures, quatre résiduels, R4 accepté temporairement", "paras": [{"cue": "Titre", "text": "L'atelier 5 est celui de la décision. Chaque scénario devient un risque : sa gravité vient du scénario stratégique, sa vraisemblance du scénario opérationnel. Placés sur la matrice du chapitre 5, R1 et R2 sont critiques, R3 et R4 élevés. Aucun n'est sous le seuil d'acceptation : tous doivent être traités. La stratégie de traitement attribue ensuite à chacun une option : réduire, transférer, éviter ou accepter. Pour R1 et R2, Kestrel réduit, et met un transfert à l'étude avec l'assurance cyber."}, {"cue": "Carte de droite, quatre types", "text": "Kestrel propose quatorze mesures, de M1 à M14, classées en quatre types. Les mesures de gouvernance organisent : l'avenant au contrat de l'éditeur, le contre-appel avant tout changement de coordonnées bancaires, la sensibilisation, l'étude d'une assurance cyber, qui est un transfert. Les mesures de protection empêchent ou compliquent l'attaque : l'authentification multifacteur, la règle de correction en 48 heures, la migration de Django. La défense détecte : M6 centralise les journaux de la passerelle VPN et de l'annuaire. La résilience limite les conséquences : M4, une copie de sauvegarde isolée hors du site, restaurée chaque trimestre, et M11, le mode dégradé écrit. Chaque mesure a une fonction responsable ; le chiffrage relève du D3."}, {"cue": "Colonne « Résiduel »", "text": "Une mesure de protection ou de défense fait baisser la vraisemblance ; une mesure de résilience fait souvent baisser la gravité. C'est ce que montre R1 : de G4 V3 à G3 V1. La vraisemblance tombe grâce aux mesures de protection, M1 à M3 ; la gravité baisse parce que la sauvegarde isolée et le mode dégradé, M4 et M11, ramènent l'arrêt prévisible sous trois jours."}, {"cue": "Dernière ligne, R4, et bandeau", "text": "Regardez R4. M13 coupe le chemin par le portail B2B, mais le chemin par Django reste ouvert pendant les neuf mois de migration : le risque reste élevé, G3 V2. Le groupe demande donc une acceptation temporaire au comité de direction, avec une mesure compensatoire, M10, le filtrage applicatif, une échéance et un indicateur mensuel. Paul Vidal signe. Le procès-verbal indique le risque, son niveau, le motif, la mesure compensatoire et la date de réexamen. C'est cette trace écrite qui distingue un risque accepté d'un risque ignoré. L'atelier se termine par un cadre de suivi : quatre indicateurs examinés chaque trimestre par le comité de direction. Ces indicateurs sont la part des comptes protégés par authentification multifacteur, le délai de correction des équipements exposés, la date et la durée du dernier test de restauration, et le nombre d'accès de prestataires ouverts. Sans cadre de suivi, l'analyse devient un rapport rangé dans un tiroir."}], "words": 415}, {"n": 82, "title": "Prenez la fiche FT 16 : décider et mesurer le résiduel", "paras": [{"cue": "Titre", "text": "Dernière fiche sur EBIOS Risk Manager : la FT 16, l'atelier 5. Elle clôt l'étude e-commerce de Kestrel que vous suivez depuis la FT 14."}, {"cue": "Consigne", "text": "Isabelle Roux, Sébastien Morin, Hélène Garnier et Romain Chevalier se réunissent pour décider. Vous placez les quatre risques sur la matrice, vous classez les mesures dans leurs quatre types, vous estimez le risque résiduel et vous dites qui l'accepte. Enfin, vous construisez un cadre de suivi et vous lisez un indicateur avec prudence. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Le message de la fiche est le même que celui de la diapositive précédente : un risque accepté sans trace écrite est un risque ignoré. Nous en discuterons à la mise en commun."}], "words": 117}, {"n": 83, "title": "Analyse d'impact sur l'activité et besoins de continuité", "paras": [{"cue": "Titre", "text": "Nous voici à l'après-midi, avec le chapitre 8. Il pose une question plus simple en apparence : si une application s'arrête, combien de temps l'organisation peut-elle tenir, et combien de données peut-elle perdre ?"}, {"cue": "Sous-titre", "text": "La cause de l'arrêt importe peu ici. Une panne de disque, un incendie, un rançongiciel ou l'erreur d'un prestataire produisent le même effet pour un chauffeur ou un agent d'accueil : l'outil ne répond plus. Ce chapitre prépare la partie 4 du dossier et l'annexe F. Et il s'arrête au constat : le plan de reprise lui-même, ses solutions, ses coûts et ses tests relèvent du D3."}], "words": 101}, {"n": 84, "title": "La PDMA regarde en arrière, la DMIA et la MTPD en avant", "paras": [{"cue": "Bandeau du bas", "text": "Trois sigles d'abord. Le PCA, plan de continuité d'activité, vise à ne pas s'arrêter, ou à fonctionner autrement pendant l'arrêt ; il dépasse l'informatique et touche les locaux, les personnes, les fournisseurs. Le PRA, plan de reprise d'activité, organise le redémarrage du SI après un sinistre. Entre les deux, le mode dégradé : des formulaires papier, une liste imprimée la veille. La norme de référence est l'ISO 22301, édition de 2019, amendée en 2024. Et toute démarche commence par le BIA, le bilan d'impact sur l'activité, qui part des métiers et mesure ce que coûte un arrêt, quelle qu'en soit la cause."}, {"cue": "Schéma, à gauche de l'éclair", "text": "Regardez l'axe du temps. Au centre, le sinistre. À gauche, la dernière sauvegarde utilisable. Tout ce qui a été saisi entre les deux est perdu : cette durée doit rester inférieure à la PDMA, la perte de données maximale admissible, en anglais RPO, recovery point objective. Une PDMA de 1 heure signifie qu'il faut pouvoir restaurer les données dans leur état d'au plus 1 heure avant le sinistre."}, {"cue": "Schéma, à droite de l'éclair", "text": "À droite, on regarde en avant. La DMIA, durée maximale d'interruption admissible, ou RTO, recovery time objective, est l'objectif de reprise. Plus loin, la MTPD, durée maximale tolérable de perturbation, est le seuil au-delà duquel les impacts menacent la survie, les contrats essentiels ou la sécurité des personnes. La DMIA est choisie en deçà, pour garder une marge. Chez Kestrel, la direction des opérations demande 2 heures pour RoutePro : les camions partent à 5 h."}, {"cue": "Carte de droite, puis courbe du bas", "text": "Attention à un piège de vocabulaire : certains documents français appellent « DMIA » ce qui est en réalité la MTPD. Dans le cours et dans le D2, la DMIA est l'objectif de reprise, comme le RTO. Et la courbe du bas rappelle que l'impact monte par paliers : une heure d'arrêt de RoutePro l'après-midi peut passer inaperçue ; la même heure à 4 h du matin, quand les camions partent à 5 h, désorganise toute la journée. Vous n'avez pas à mettre en place un système de management de la continuité selon l'ISO 22301 ; vous devez parler sa langue avec exactitude."}], "words": 349}, {"n": 85, "title": "RoutePro : 7 heures d'écart, même dans le meilleur scénario", "paras": [{"cue": "Titre et première ligne", "text": "Voici l'extrait de la grille d'impact de Kestrel : six applications sur les huit pour lesquelles les directions ont exprimé un besoin. Les besoins viennent des directions ; les capacités sont estimées à partir des faits, avec trois hypothèses du registre : H1, sauvegarde chaque nuit sur le NAS ; H2, cinq jours pour tout reconstruire après la perte de la salle serveur ; H19, environ 24 heures pour restaurer l'ERP finance, estimation jamais testée. Première ligne, RoutePro : besoin de 2 heures. La panne de disque de novembre 2024 a duré 9 heures : l'écart est de 7 heures dans le scénario le plus favorable, celui qui a déjà été vécu. En cas de perte de la salle, il monte à 118 heures. Rapporté à la marge, les 38 k€ de pénalités de cette seule panne représentent près de 3 % de la marge opérationnelle annuelle."}, {"cue": "Lignes « Non estimable »", "text": "Pour quatre applications sur six, l'écart n'est pas estimable : engagement du prestataire non documenté, sauvegardes de Kestrel Track à documenter. Ce n'est pas un échec de l'analyse. Écrire « non estimable » et dire quelle information manque, c'est la bonne pratique, et ce manque devient un constat du diagnostic. Méfiez-vous aussi des taux de disponibilité : 99,8 % sur une année autorisent environ 17,5 heures d'arrêt cumulé, qui peuvent tomber en une seule fois. Autre piège voisin : un taux de sauvegardes réussies ne dit rien de la capacité à restaurer. Seul un test de restauration le prouve."}, {"cue": "Colonne « Classe » et bandeau", "text": "La classe suit une règle écrite avant d'être appliquée : classe 1 jusqu'à 4 heures de DMIA, classe 2 jusqu'à 24 heures, classe 3 jusqu'à 72 heures, classe 4 au-delà. Deux compléments : une application qui porte une activité pouvant mettre des personnes en danger est au moins en classe 2, et une application hérite de la classe de celles qui dépendent d'elle. Kestrel Track reçoit ainsi au moins la classe de KDriver, qui en dépend entièrement. C'est la cartographie qui révèle ces dépendances."}, {"cue": "Retour au titre", "text": "Dernier point : discuter les demandes des métiers. La direction des opérations acceptait 8 heures d'arrêt pour KDriver et Kestrel Track. On lui montre le schéma des dépendances, et on lui rappelle que les camions partent à 5 h. Elle ramène son besoin à 2 heures entre 4 h et 7 h. Une incohérence, une dépendance cachée, un coût probable : ce sont les trois motifs de discussion, et il en faut deux dans votre partie 4."}], "words": 407}, {"n": 86, "title": "Prenez la fiche FT 18 : compléter la grille d'impact", "paras": [{"cue": "Titre", "text": "Avant de lancer la grille d'impact de Medisecure, sortez la fiche FT 18. Elle reprend la grille de Kestrel là où le cours l'a laissée : sur les lignes que la DSI n'avait pas pu estimer."}, {"cue": "Consigne", "text": "Hélène Garnier a obtenu trois contrats et interrogé le DRH, le directeur des opérations et le responsable de l'agence de Clermont-Ferrand. Vous relevez et convertissez les besoins de continuité, vous calculez un taux de disponibilité et un arrêt autorisé, vous estimez la capacité de reprise, puis vous chiffrez les écarts en heures. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Attention au sens du calcul : l'écart, c'est la capacité moins le besoin. Un écart négatif signifie que le besoin est tenu. Nous vérifierons ensemble deux lignes avant que vous passiez à Medisecure."}], "words": 127}, {"n": 87, "title": "Vulnérabilités data et IA, puis un scénario opérationnel", "paras": [{"cue": "Cadre de gauche, consigne", "text": "Je lance maintenant les exercices. Le premier est celui du chapitre 7. Durée indicative dans le cours : 2 h 30. Vous travaillez seuls, mais vous pouvez comparer votre liste de vulnérabilités avec votre voisin au bout de quarante minutes. Commencez par le tableau : un bien support, une famille du chapitre, un critère atteint, un fait avec sa section entre parenthèses. Les cinq points de la consigne sont un minimum à examiner, pas une liste de réponses. D const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
