<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

<body>
<div id="stage" aria-label="Texte du prompteur">
  <article id="script"></article>
</div>
<div class="fade-top"></div><div class="fade-bot"></div>
<div id="guide" aria-hidden="true"></div>
<div id="progress"></div>
<div id="hud"><span id="where"></span><span id="left"></span></div>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>
</div>

<script>
const DATA = [{"n": 18, "title": "De la stratégie SI à la cartographie : décrire avant de décider", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Hier, nous avons lancé le dossier D2 et posé les notions de base : l'organisation, le système d'information, la stratégie. Aujourd'hui, nous passons du vocabulaire à la méthode. La journée a un fil simple : on ne décide pas de l'avenir d'un système d'information sans savoir d'abord ce qu'il est."}, {"cue": "Sous-titre", "text": "Le matin est consacré à la théorie. D'abord le chapitre 2, sur la stratégie SI, la gouvernance et l'urbanisation. Puis le chapitre 3, sur la cartographie, avec le guide de l'ANSSI, l'Agence nationale de la sécurité des systèmes d'information. L'après-midi, le chapitre 4, puis les ateliers sur Medisecure. Ce soir, votre cartographie doit exister dans un outil, même à l'état d'ébauche."}, {"cue": "Mentionnez le cours sur Moodle", "text": "Comme hier, ce support suit le cours rédigé, sur Moodle. Je vous donne les idées et les exemples ; les tableaux complets, les méthodes pas à pas et les exercices sont dans les chapitres 2, 3 et 4. Gardez-les ouverts à côté de vous."}], "words": 161}, {"n": 19, "title": "Aujourd'hui : penser le SI, puis le cartographier", "paras": [{"cue": "Titre", "text": "Voici le programme. Il suit la logique du cours : on comprend la place du SI dans la stratégie, puis on apprend à le cartographier, puis on construit la cartographie."}, {"cue": "Carte « Chapitre 2 »", "text": "Ce matin, d'abord, le chapitre 2. Quatre outils : la grille de McFarlan, pour qualifier le rôle de chaque application ; le modèle d'alignement de Henderson et Venkatraman ; la gouvernance et ses référentiels ; et l'urbanisation, qui découpe le SI comme une ville. Nous terminerons par une étude de document : un comité de direction de Kestrel qui arbitre ses projets informatiques."}, {"cue": "Carte « Chapitre 3 »", "text": "Ensuite, le chapitre 3, le cœur théorique de la journée. Ce qu'est une cartographie, la démarche en cinq étapes et les six vues du guide de l'ANSSI, les objets pivots, et le modèle de cartographie, que l'on écrit avant de dessiner quoi que ce soit."}, {"cue": "Carte sombre « Chapitre 4 et ateliers »", "text": "L'après-midi, le chapitre 4 : comment collecter, comment tenir les inventaires, quoi chercher sur les vues, quel outil choisir. Puis deux ateliers sur Medisecure. Le premier : le modèle de cartographie et la vue de l'écosystème. Le second : l'inventaire applicatif, la matrice des flux et la vue applicative. Vous ne les finirez pas cet après-midi ; vous les achèverez pendant la première période de l'intersession. Mais ils doivent être bien lancés."}, {"cue": "Bandeau du bas", "text": "Le bandeau dit l'objectif de la journée. Retenez-le : la cartographie est la base de tout le reste. Demain, l'analyse de risques nommera ses biens supports, et ce seront des objets de votre cartographie. Sans outil ni modèle ce soir, vous écrirez les risques sur des objets qui n'existent pas encore, et vous devrez tout renommer ensuite."}], "words": 267}, {"n": 20, "title": "Du SI à la stratégie SI : alignement, gouvernance, urbanisation", "paras": [{"cue": "Titre du chapitre", "text": "Commençons par le chapitre 2. Il relie les trois notions d'hier et répond à trois questions. Le SI doit-il seulement suivre la stratégie de l'entreprise, ou peut-il la transformer ? Qui décide de ce que devient le SI, et selon quelles règles ? Comment organiser un SI pour qu'il évolue sans tout casser ? Ce sont l'alignement, la gouvernance et l'urbanisation."}, {"cue": "Sous-titre", "text": "Le schéma directeur rassemble les trois. C'est précisément ce que le directeur général de Medisecure a demandé, et votre dossier D2 en est la première pièce : l'état des lieux. Ce chapitre sert surtout la section 2.4, la vue fonctionnelle, et le domaine « gouvernance du SI » du diagnostic, en section 5.2."}], "words": 114}, {"n": 21, "title": "Les applications stratégiques de Kestrel sont les plus fragiles", "paras": [{"cue": "Titre", "text": "Partons d'une idée simple. Pendant longtemps, l'informatique a été vue comme un outil de productivité : on automatisait la paie et la comptabilité pour faire la même chose plus vite. Cette vision reste juste pour une partie du SI. Mais quand les clients suivent leurs colis en ligne, le SI fait partie de l'offre. On distingue alors le SI support, qui exécute la stratégie au moindre coût, et le SI levier, qui rend possible une stratégie nouvelle. La stratégie SI, c'est l'ensemble des choix à moyen terme qui fixent ce que le SI doit devenir pour servir la stratégie de l'organisation, et parfois pour l'infléchir."}, {"cue": "Introduction et en-tête du tableau", "text": "Pour savoir quelle partie du SI joue quel rôle, McFarlan et McKenney ont proposé une grille en 1983, popularisée par un article de McFarlan dans la Harvard Business Review en 1984. Elle croise deux questions : l'impact actuel du SI sur l'activité, et son impact futur sur la stratégie. Quatre positions en sortent : support, production, avenir et stratégique. À l'origine, la grille qualifie le SI d'une entreprise entière. L'usage français l'applique aussi application par application : c'est une adaptation, et il faut la présenter comme telle."}, {"cue": "Les quatre lignes, puis la colonne de droite", "text": "Chez Kestrel, la DSI, la direction des systèmes d'information, a placé ses douze applications. Pour l'impact actuel, elle s'est demandé ce qui se passe si l'application s'arrête une journée. Pour l'impact futur, si elle porte un objectif du plan « Cap 2029 ». Regardez la ligne en couleur. Quatre applications sont stratégiques : Kestrel Track, RoutePro, KDriver et la planification des tournées. Or RoutePro est un progiciel de 2017 sur SQL Server 2016 ; Kestrel Track repose sur Django 3.2, hors support depuis avril 2024 ; et la planification se fait dans des fichiers Excel. Les applications que la stratégie va le plus solliciter sont les plus fragiles. C'est le message de la diapositive."}, {"cue": "Bandeau du bas", "text": "Deux applications étaient des cas limites : l'ERP finance et Microsoft 365, d'impact actuel moyen. La DSI a écrit une règle : un impact moyen va avec les forts si une direction a exprimé un besoin de continuité, avec les faibles sinon. L'ERP finance passe donc en production, Microsoft 365 en support. Les consignes du D2 n'exigent pas cette grille. Mais appliquée avec des faits, elle vous aidera à argumenter la hiérarchie des faiblesses du diagnostic."}], "words": 382}, {"n": 22, "title": "L'alignement relie quatre domaines et se corrige en continu", "paras": [{"cue": "Titre et figure", "text": "La grille de McFarlan dit quel rôle joue le SI ; elle ne dit pas comment l'ajuster à la stratégie. C'est l'objet du modèle d'alignement stratégique de John Henderson et N. Venkatraman, publié en 1993 dans l'IBM Systems Journal. Le carré compte quatre domaines. En haut, les deux stratégies : celle de l'entreprise à gauche, celle des technologies de l'information à droite. En bas, les deux infrastructures : l'organisation et ses processus, puis l'infrastructure et les processus du SI."}, {"cue": "Les flèches de la figure", "text": "Deux types de cohérence relient ces cases. Les flèches verticales, c'est la cohérence stratégique : entre le choix externe, sur quel marché et avec quelles compétences, et l'organisation interne qui le met en œuvre. Les flèches horizontales, c'est l'intégration fonctionnelle, entre le monde des métiers et celui des technologies. Les auteurs décrivent quatre perspectives, quatre manières de parcourir le carré : exécution de la stratégie, transformation technologique, potentiel concurrentiel et niveau de service. Le tableau du chapitre 2 précise, pour chacune, le rôle de la direction générale et celui de la DSI."}, {"cue": "Carte de droite « Kestrel »", "text": "Kestrel se trouve dans la première perspective sans l'avoir choisie : la direction fixe des objectifs, la DSI exécute ce qu'on lui demande. Or l'objectif de réduire de 20 % les kilomètres à vide suppose de choisir une technologie d'optimisation avant d'adapter l'infrastructure : c'est une transformation technologique. Personne chez Kestrel n'a formulé ce choix. Une question pour vous : dans votre entreprise d'alternance, qui part de quoi ? La direction, ou la technologie ?"}, {"cue": "Bandeau du bas", "text": "Connaissez les limites du modèle. Il suppose une stratégie explicite et stable, alors qu'elle est souvent implicite. Il présente l'alignement comme un réglage rationnel, alors qu'il résulte aussi de négociations entre directions. Il ignore les usages informels et les contournements. Claudio Ciborra l'a critiqué dans un article de 1997. Enfin, un SI trop étroitement aligné devient rigide quand la stratégie change. Utilisez le modèle pour poser des questions, pas comme une recette."}], "words": 318}, {"n": 23, "title": "Prenez la fiche FT 05 : place du SI et alignement", "paras": [{"cue": "Titre", "text": "Prenez la fiche FT 05. Elle met en pratique les deux outils que nous venons de voir : la grille de McFarlan et le modèle d'alignement."}, {"cue": "Consigne", "text": "Vous êtes l'alternant d'Hélène Garnier. Le directeur général veut changer la place de la DSI et créer une instance dédiée au SI ; vous préparez les éléments de la note. Vous calculerez la structure du budget et un dépassement, puis vous placerez des demandes dans la grille. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Une question vous demande les limites du modèle : ne la sautez pas. Un modèle sert à poser des questions, pas à donner la réponse. Nous corrigerons ensemble le placement dans la grille."}], "words": 114}, {"n": 24, "title": "La gouvernance décide et contrôle ; le management exécute", "paras": [{"cue": "Titre", "text": "L'alignement est un résultat ; la gouvernance est le dispositif qui permet de l'obtenir. Elle répond à une question : qui décide de quoi en matière de SI, selon quelles règles, et comment vérifie-t-on que les décisions sont appliquées ? Retenez la distinction du titre. La gouvernance fixe les orientations, arbitre et contrôle ; elle relève des instances dirigeantes, pas de la seule DSI. Le management planifie, construit, exploite et surveille dans le cadre ainsi fixé."}, {"cue": "Carte « ISO/IEC 38500 »", "text": "Trois référentiels sont à citer avec exactitude. La norme ISO/IEC 38500 est le texte international de référence ; sa troisième édition date de février 2024. Elle s'adresse aux organes de direction, quelle que soit la taille de l'organisation, et décrit un cycle en trois verbes : évaluer, diriger, surveiller. L'édition de 2024 a été restructurée : vérifiez la formulation de ses principes dans le texte avant de les citer."}, {"cue": "Cartes « COBIT » et « ITIL »", "text": "COBIT est publié par l'ISACA, une association internationale de professionnels de l'audit et de la gouvernance des SI. COBIT 2019 organise quarante objectifs en cinq domaines, dont un de gouvernance : évaluer, diriger, surveiller. L'ISACA annonce COBIT 7 pour le 19 novembre 2026 : vérifiez sur son site qu'il est paru avant de le citer, sinon citez COBIT 2019. ITIL est un recueil de bonnes pratiques pour gérer les services informatiques : incidents, demandes, changements. Aucun de ces textes n'est une obligation légale ; une PME n'en appliquera qu'une faible partie."}, {"cue": "Carte sombre « Kestrel »", "text": "Chez Kestrel, la DSI est rattachée à la directrice administrative et financière, pas au comité de direction. Il n'y a ni instance dédiée au SI, ni schéma directeur, ni recensement des projets. La sécurité est portée à temps partiel par le responsable de l'infrastructure. Le maillon manquant, souvent, c'est la gestion de portefeuille : recenser toutes les demandes, les évaluer sur des critères communs, les classer, puis suivre les projets retenus. Sans elle, le plus insistant l'emporte."}, {"cue": "Bandeau rouge", "text": "Deux erreurs reviennent dans les diagnostics. La première : décrire l'organigramme de la DSI et l'appeler gouvernance. La gouvernance, ce sont des décisions ; un fait comme « les demandes arrivent par courriel et sont arbitrées au cas par cas » en dit plus qu'un organigramme. La seconde : noter une organisation sur COBIT comme si elle devait l'appliquer en entier. Dites quel référentiel vous utilisez, pour quels critères, et adaptez-le à la taille de l'organisation."}], "words": 389}, {"n": 25, "title": "Prenez la fiche FT 06 : arbitrer sept demandes de projets", "paras": [{"cue": "Titre", "text": "Fiche FT 06. Après la gouvernance, vous allez arbitrer vous-mêmes un portefeuille de projets."}, {"cue": "Consigne", "text": "La DSI propose une grille de critères pondérés. Vous la testez sur les sept demandes, vous calculez les scores et vous classez. Puis vous regardez ce que ce classement dit de la gouvernance de Kestrel : qui décide, selon quelles règles, avec quel suivi. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Vérifiez vos calculs à deux avant de classer : une erreur de pondération change tout l'ordre. Nous comparerons les classements obtenus."}], "words": 87}, {"n": 26, "title": "Le plan d'urbanisation fait apparaître redondances et trous", "paras": [{"cue": "Titre", "text": "Troisième pilier : l'urbanisation. Elle répond à une question d'architecture : comment organiser un SI pour qu'il évolue par morceaux, sans qu'une modification locale casse l'ensemble ? La démarche s'est développée en France à la fin des années 1990 ; Christophe Longépé l'a présentée dans « Le projet d'urbanisation du système d'information ». L'image est celle de la ville : elle évolue sans jamais être rasée, selon un plan qui fixe des zones, des réseaux communs et des règles de construction."}, {"cue": "Carte de droite", "text": "Le plan d'urbanisation découpe le SI en zones, qui sont les grandes familles d'activités ; puis en quartiers, en îlots si besoin, et enfin en blocs fonctionnels. Un bloc est un ensemble cohérent de fonctions qui partagent leurs données. Il se nomme par un verbe et un objet, sans nom de logiciel : « Construire les tournées du lendemain ». C'est le niveau fonctionnel, le plus difficile à saisir : il dit ce que le SI doit faire, pas avec quel outil. Les quatre niveaux du référentiel sont donc métier, fonctionnel, applicatif et infrastructure."}, {"cue": "La figure : contour orange, hachures rouges, pointillé", "text": "Regardez le plan de Kestrel. On place les applications sur les blocs, et les défauts apparaissent. Le bloc « Construire les tournées du lendemain » est servi par RoutePro et par la planification sous Excel, inscrite au parc comme application : c'est une redondance. Le bloc « Optimiser les tournées » n'a aucune application : c'est un trou. De même pour « Suivre les prospects et les devis », fait par courriel, et pour « Produire les indicateurs de Cap 2029 », fait sous Excel au cas par cas : la messagerie et la bureautique ne comblent pas un trou. Le trait pointillé entre TeleFleet et la paie, lui, est une ressaisie : ni redondance ni trou, mais un flux manuel."}, {"cue": "Dernière ligne de la carte de droite : Medisecure", "text": "Pour Medisecure, vos blocs couvrent toutes les activités de la vue métier, chaque application de l'annexe A est placée sur au moins un bloc, et vous signalez au moins deux redondances et deux trous, sourcés. Kestrel n'a qu'une redondance : l'exemple montre la méthode, pas le nombre attendu. Et une adresse saisie dans trois applications de fonctions différentes est un défaut de donnée de référence, pas une redondance."}], "words": 364}, {"n": 27, "title": "Prenez la fiche FT 07 : redondances, trous, flux manuels", "paras": [{"cue": "Titre", "text": "Prenez la fiche FT 07. C'est la plus utile pour votre vue fonctionnelle : elle vous entraîne à appliquer les quatre définitions sans les confondre."}, {"cue": "Consigne", "text": "Vous êtes stagiaire à la DSI et vous aidez à compléter la vue fonctionnelle. Vous avez interrogé le responsable de l'agence de Clermont-Ferrand. Pour chaque constat, demandez-vous : est-ce une redondance, un trou, un flux manuel ou un défaut de donnée de référence ? Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Revenez aux définitions exactes du cours à chaque doute. Nous corrigerons le classement ensemble, ligne par ligne."}], "words": 94}, {"n": 28, "title": "L'état des lieux ouvre le schéma directeur : c'est le D2", "paras": [{"cue": "Titre et carte de droite « Schéma directeur »", "text": "Le schéma directeur rassemble tout ce que nous venons de voir. C'est un plan pluriannuel, en général sur trois à cinq ans, qui fixe la cible du SI, les projets pour l'atteindre, leur ordre, leur budget et l'organisation nécessaire. Il part d'un état des lieux et des orientations stratégiques. Il est validé par la direction générale et révisé au moins une fois par an."}, {"cue": "Les quatre chevrons", "text": "Son élaboration suit un cycle en quatre temps. L'état des lieux décrit le SI actuel. Les orientations traduisent la stratégie en exigences pour le SI. La cible décrit le SI visé et les scénarios pour l'atteindre. La trajectoire ordonne les projets dans le temps et le budget. Le premier chevron est en couleur : c'est le vôtre."}, {"cue": "Cartes « Dossier D2 » et « Dossier D3 »", "text": "Votre dossier D2 est l'état des lieux qui ouvre le schéma directeur de Medisecure. Il ne choisit ni la cible ni les projets : cela relève du dossier D3. Il fournit à ceux qui décideront une carte fiable, des risques classés et des enjeux formulés sans solution. Retenez cette frontière : un diagnostic qui recommande déjà de tout migrer dans le cloud sort de son rôle et perd en crédibilité."}, {"cue": "Bandeau du bas", "text": "Un mot sur les indicateurs de la DSI, que vous développerez dans le D3. Chez Kestrel, le budget SI représente 3,1 % du chiffre d'affaires, soit environ 4 330 € par salarié, et 80 % de ce budget va au fonctionnement. Un indicateur ne vaut que comparé à une référence : une cible, un seuil, une valeur passée ou une étude citée."}], "words": 253}, {"n": 29, "title": "Un comité arbitre cinq demandes de projets sans règle écrite", "paras": [{"cue": "Le document à gauche", "text": "Passons à l'étude de document du chapitre 2. C'est un compte rendu fictif, écrit pour le cours : le comité de direction de Kestrel, en février 2026, examine les projets informatiques. L'écran en donne un résumé ; le texte complet est dans le cours. Lisez-le seuls, cinq minutes. Répondez ensuite par deux aux questions 1 à 4, pendant quinze minutes. Puis nous ferons un tour de table, un binôme par question."}, {"cue": "Questions 1 et 2", "text": "Sur la question 1, faites émerger que les critères ne sont écrits nulle part : il faut les reconstituer à partir des décisions. On trouve le lien avec « Cap 2029 », le coût, et le fait que l'application « fonctionne ». Ils ne sont pas appliqués de la même façon : le module d'optimisation est jugé prioritaire mais reporté, l'outil client est accordé sous condition. Sur la question 2, revenez à la grille : Kestrel Track est stratégique, exposée au public et hors support, et le directeur général dit lui-même que le principal client veut du concret sur le suivi. Reporter sa migration parce qu'elle fonctionne, c'est traiter une application stratégique comme une application support."}, {"cue": "Questions 3 et 4", "text": "Pour la question 3, les notions du chapitre suffisent : aucune instance dédiée, aucun portefeuille, aucune demande chiffrée, aucun critère écrit, aucune date de suivi, une demande non examinée, et une demande de sécurité arrivée par courriel, que personne ne porte en comité. La question 4 vous entraîne à distinguer enjeu et solution : un enjeu est une question à trancher, pas une solution. « Comment arbitrer les demandes de projets SI selon des critères connus de tous ? » est un enjeu. « Créer un comité SI » est une solution, qui relève du D3."}, {"cue": "Question 5", "text": "La question 5 porte sur votre entreprise d'alternance. Gardez-la pour ce soir, par écrit, en quelques lignes. Enfin, l'exercice du chapitre 2, McFarlan et gouvernance chez Medisecure, est facultatif. Faites-le en autonomie si le temps le permet : il peut nourrir le domaine « gouvernance du SI » de votre section 5.2."}], "words": 335}, {"n": 30, "title": "Cartographier le SI : finalités, vues, niveaux, modèle", "paras": [{"cue": "Titre du chapitre", "text": "Deuxième temps de la matinée : le chapitre 3. Le chapitre 2 a présenté l'urbanisation comme une idée ; celui-ci passe au plan. Cartographier, c'est décrire ce qui existe, avant de décider ce qui doit changer. Le RSSI de Medisecure, le responsable de la sécurité des systèmes d'information, le résume en une phrase : sans cartographie, il ne saura pas ce qui a été touché en cas d'attaque."}, {"cue": "Sous-titre", "text": "Ce chapitre fixe les règles du jeu ; le chapitre 4, cet après-midi, montrera comment collecter et dessiner. Il prépare trois sections de votre dossier : la 1.2, mission, périmètre et méthode ; la 2.1, le modèle de cartographie ; la 2.2, la vue de l'écosystème."}], "words": 114}, {"n": 31, "title": "Une cartographie : un inventaire et des vues, indissociables", "paras": [{"cue": "Titre", "text": "Première idée, et elle corrige une erreur fréquente : une cartographie n'est pas un schéma. Une carte routière s'appuie sur un relevé précis du terrain, et c'est ce relevé qui la rend fiable. De même, une cartographie du SI repose sur deux éléments indissociables : un inventaire, qui recense et décrit les composants, et des vues, qui les représentent selon un point de vue."}, {"cue": "Encadré sombre de la définition", "text": "La définition est celle du guide de l'ANSSI, publié en novembre 2018 sous Licence ouverte. L'inventaire est une base de données, même s'il tient dans un tableur : une ligne par objet, une colonne par attribut. Les vues sont des extraits de cet inventaire mis en image, pour répondre à une question. Le guide s'adresse d'abord aux opérateurs d'importance vitale, mais il se présente comme utilisable par toute organisation, quelle que soit sa taille."}, {"cue": "Carte de droite « Cinq finalités »", "text": "Une cartographie coûte du temps ; elle se justifie par ce qu'elle permet. Le chapitre 3 retient cinq finalités : maîtrise, sécurité, gestion de crise, transformation et conformité. Elles ne demandent pas la même cartographie. La gestion de crise exige des dépendances exactes et une version accessible hors ligne ; la conformité, des attributs précis sur les données. Chez Kestrel, la finalité retenue est d'abord la gestion de crise, après la panne de RoutePro de novembre 2024, puis la préparation d'un schéma directeur. Dans votre dossier, la finalité est donnée : un état des lieux fiable pour le futur schéma directeur, réutilisable pour l'analyse de risques."}, {"cue": "Bandeau du bas", "text": "Les consignes reprennent cette double exigence. Une vue sans inventaire ne compte pas comme cartographie ; un inventaire sans vue non plus. Vos annexes A à D font donc partie de la cartographie : ce ne sont pas des compléments."}], "words": 284}, {"n": 32, "title": "Cinq étapes, et chacune a sa place dans le plan du D2", "paras": [{"cue": "Titre et tableau", "text": "Le guide découpe le projet en cinq étapes. Il insiste sur trois qualités : la démarche doit être pragmatique, participative et pérenne. Elle est aussi incrémentale, parce qu'on ajoute des vues au fil du temps, et itérative, parce qu'on affine les vues déjà construites. La dernière colonne vous montre où chaque étape se retrouve dans votre dossier."}, {"cue": "Ligne 1", "text": "L'étape 1 est souvent bâclée. Le guide demande un sponsor, membre de la direction, qui valide les objectifs. Une démarche orientée sur la sécurité est coordonnée par le RSSI ; une démarche plus globale peut être confiée au DSI. Le guide recommande aussi de commencer par les systèmes les plus exposés ou les plus critiques, puis d'élargir. Chez Kestrel, Romain Chevalier lance la cartographie, et la directrice administrative et financière, Isabelle Roux, accepte d'être le sponsor."}, {"cue": "Lignes 2 à 5", "text": "L'étape 2, le modèle, se mène en parallèle de la collecte : on définit le modèle, on recueille l'existant, on ajuste. Les étapes 3 à 5, outiller, construire et pérenniser, sont l'objet du chapitre 4 cet après-midi. Retenez déjà que le guide ne prescrit aucun outil. Il exige seulement que l'outil tienne l'inventaire, relie les vues et permette la mise à jour."}, {"cue": "Bandeau du bas", "text": "L'étape 1 fixe aussi la granularité, c'est-à-dire le niveau de détail des objets et des attributs. Le guide en distingue trois : le niveau 1 pour les informations indispensables, le niveau 2 pour les importantes, le niveau 3 pour les utiles. Ne la confondez pas avec la maturité, qui qualifie la cartographie entière : au niveau 2, elle représente toutes les vues et elle est orientée sécurité. En section 1.2, vous écrivez la granularité visée pour chaque vue. Attention, le D2 exige parfois plus que le niveau 1 : la vue métier demande deux processus détaillés en activités avec leurs acteurs."}], "words": 296}, {"n": 33, "title": "Prenez la fiche FT 08 : cadrer selon l'ANSSI", "paras": [{"cue": "Titre", "text": "Fiche FT 08. Elle reprend les cinq étapes du guide de l'ANSSI que nous venons de parcourir."}, {"cue": "Consigne", "text": "Romain Chevalier vous accueille en alternance. Le chef de projet applicatif a rédigé un projet de note de cadrage ; vous le confrontez au guide avant qu'il parte en comité. Vous estimerez une charge de travail, et vous ne confondrez pas granularité et maturité. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "La dernière question vous demande une proposition : une cible et une trajectoire réalistes pour une DSI de dix personnes. Nous en discuterons ensemble."}], "words": 93}, {"n": 34, "title": "Sept vues, du métier à la technique, reliées par des pivots", "paras": [{"cue": "La figure, de haut en bas", "text": "Le guide organise la cartographie en trois visions, du métier vers la technique, et chacune compte deux vues. La vision métier : la vue de l'écosystème, qui montre les entités avec lesquelles le SI interagit et délimite le périmètre, et la vue métier du SI, avec les processus et les informations. La vision applicative : la vue des applications et de leurs flux, et la vue de l'administration, qui montre les périmètres et les privilèges des administrateurs. La vision infrastructure : la vue logique, réseaux, filtrage et cloisonnement, et la vue physique, équipements et sites."}, {"cue": "La bande en pointillé : la vue fonctionnelle", "text": "Le guide n'a pas de vue fonctionnelle : il passe directement des processus aux applications. Or l'urbanisation raisonne en quatre niveaux : métier, fonctionnel, applicatif, infrastructure. Le D2 ajoute donc une septième vue, issue de l'urbanisation : le plan d'urbanisation du chapitre 2. La section 2.1 contient un tableau qui fait correspondre vos vues aux quatre niveaux."}, {"cue": "Carte de droite « Objet pivot »", "text": "Les flèches de la figure portent des noms : ce sont les objets pivots. Un objet pivot apparaît dans plusieurs vues sous le même nom et permet de passer de l'une à l'autre. Grâce à eux, on suit une chaîne du métier jusqu'au câble : le processus « Planifier les tournées » dépend de RoutePro, qui tourne sur une machine virtuelle, hébergée sur un serveur physique, dans la seule salle serveur de Kestrel. Si un maillon change de nom, la chaîne se rompt : un seul nom différent suffit à rendre la cartographie inexploitable."}, {"cue": "Vues métier et administration sur la figure", "text": "Deux remarques. La vue métier est la plus importante et la plus négligée par les informaticiens : un serveur n'a de valeur que par les activités qu'il soutient. Quant à la vue de l'administration, le guide n'en fait un schéma que s'il existe une gestion centralisée des droits sur plusieurs périmètres d'administration. Le D2 vous en demande un : cherchez dans le dossier ce qui centralise les droits et quels périmètres coexistent."}], "words": 318}, {"n": 35, "title": "Fixer le langage commun avant de dessiner la première vue", "paras": [{"cue": "Titre", "text": "Avant de dessiner, il faut un langage commun. Sans modèle, chaque contributeur dessine à sa façon : l'un met les applications en vert, l'autre en bleu ; l'un écrit « TMS », l'autre « RoutePro ». Les vues deviennent incomparables et les objets pivots se perdent. Le modèle de cartographie fixe, pour chaque vue, les objets, leurs attributs, la légende et la nomenclature. C'est l'étape 2 du guide et la section 2.1 de votre dossier."}, {"cue": "Cartes 1 et 2", "text": "La première composante est le tableau objets × vues : quels objets apparaissent dans quelle vue. Partez de l'annexe 1 du guide, et ajoutez les objets propres au cas, comme le bloc fonctionnel ou l'usage hors inventaire. La deuxième, ce sont les attributs et leur format. Préférez les listes fermées. « Maintenu par l'éditeur », « fin de support annoncée », « hors support », « non documenté » se comparent ; « vieux » et « pas terrible » ne se comparent pas. Une précision qui n'entre pas dans la liste va dans une remarque, pas dans la valeur."}, {"cue": "Carte 3 « La légende commune »", "text": "La troisième, la légende. Une forme par type d'objet, un style de trait par type de relation. Le D2 impose deux lectures : distinguer les flux automatiques des flux manuels, et repérer les applications hors support. Trait plein et trait pointillé ; bordure épaisse ou pictogramme. Et ne codez jamais une information par la seule couleur : un schéma imprimé en noir et blanc, ou lu par un daltonien, la perd."}, {"cue": "Carte sombre « La nomenclature »", "text": "La quatrième, la nomenclature : un préfixe de type, un numéro, puis le nom usuel employé par les métiers. « APP-03 Kestrel Track », « SRV-01 Virtualisation 1 ». Les flux, qui n'ont pas de nom d'usage, gardent le préfixe et le numéro : « FLX-12 ». La version n'entre pas dans le nom, car elle change : c'est un attribut. La méthode du cours demande de tester la règle sur dix objets réels, puis de la figer. Toute exception ultérieure est une erreur à corriger."}], "words": 332}, {"n": 36, "title": "La vue de l'écosystème montre déjà de qui dépend Kestrel", "paras": [{"cue": "La figure", "text": "Voici l'exemple travaillé du chapitre 3 : la vue de l'écosystème de Kestrel. Romain Chevalier a recensé vingt parties prenantes, chacune avec son identifiant, de PP-01 à PP-20. Au centre, Kestrel et ses trois sites ; autour, quatre secteurs : clients et usagers, fournisseurs de services numériques, partenaires opérationnels, autorités. L'épaisseur du trait code la dépendance, forte, moyenne ou faible ; les autorités sont reliées par un trait propre à l'obligation légale, sans niveau de dépendance."}, {"cue": "Carte de droite", "text": "La vue montre déjà un constat. Trois des quatre parties prenantes de dépendance forte sont des fournisseurs de services numériques : le prestataire EDI, l'éditeur de RoutePro et l'opérateur télécom. Et l'éditeur de RoutePro dispose d'un accès permanent au réseau interne, en rouge sur la figure. Remarquez ce qui est écrit quand on ne sait pas : « nom non documenté » pour l'opérateur, et « à confirmer » pour l'ANSSI, puisque Kestrel pourrait relever de NIS2, la directive européenne sur la sécurité des réseaux et des systèmes d'information. On ne cache pas l'incertitude : on l'écrit."}, {"cue": "Dernière ligne de la carte de droite", "text": "Cet exemple est un modèle de raisonnement, pas un gabarit à recopier. Les consignes sont claires : un passage qui reprend la structure et les formulations d'un exemple Kestrel en changeant seulement les noms et les chiffres ne rapporte aucun point. Medisecure n'a ni les mêmes partenaires ni les mêmes dépendances ; elle a en outre deux structures juridiques, que votre vue doit montrer avec leur relation."}], "words": 240}, {"n": 37, "title": "Prenez la fiche FT 09 : vues, pivots et écosystème", "paras": [{"cue": "Titre", "text": "Prenez la fiche FT 09 avant l'atelier : elle vous fait construire, sur Kestrel, ce que vous construirez ensuite sur Medisecure."}, {"cue": "Consigne", "text": "Vous êtes stagiaire à la DSI. À partir d'un courriel de la directrice administrative et financière et de la règle de dépendance écrite par Romain, vous décrivez sept parties prenantes. Vous vérifiez aussi qu'un objet pivot porte le même nom dans tous les documents. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Appliquez la règle de dépendance telle qu'elle est écrite, sans la réinterpréter : c'est tout l'intérêt d'une règle. Nous comparerons vos cotations."}], "words": 95}, {"n": 38, "title": "Construire et faire vivre la cartographie", "paras": [{"cue": "Titre du chapitre", "text": "Nous voici à l'après-midi, avec le chapitre 4. Le chapitre 3 a posé le cadre ; celui-ci suit les étapes 3 à 5 du guide : outiller, construire pas à pas, pérenniser. Il suit aussi l'ordre de votre travail pendant l'intersession. Vous collectez d'abord, vous inventoriez ensuite, vous dessinez enfin."}, {"cue": "Sous-titre", "text": "Je vous le dis comme le cours le dit : dessiner avant d'inventorier est la manière la plus sûre de produire de beaux schémas faux. Ce chapitre prépare les sections 2.3 à 2.8 et les annexes A, B, C, D et G."}], "words": 92}, {"n": 39, "title": "Documents, entretiens, outils : recouper les sources", "paras": [{"cue": "Titre et tableau", "text": "Aucune cartographie ne part de zéro. Le guide recommande de commencer par l'existant : inventaires, anciens schémas, contrats, factures, plans de continuité, rapports d'incident. L'outil de tickets montre ce qui casse. Chaque document a une date et un auteur : un schéma réseau de 2024 décrit le réseau de 2024. Le tableau montre ce que chaque type de source dit bien et ce qu'il dit mal. Une information confirmée par deux sources de nature différente vaut plus qu'une information répétée par deux personnes du même service."}, {"cue": "Ligne « Outils de collecte »", "text": "Les outils de collecte donnent l'état technique exact à une date : outil de gestion de parc comme GLPI, logiciel libre très répandu en France, outil de supervision, annuaire Active Directory, consoles des hébergeurs. Une CMDB, base de données de gestion des configurations, recense les éléments de configuration et leurs relations ; la notion vient d'ITIL. C'est une excellente source pour l'inventaire, mais elle ignore en général les processus métier, les flux manuels et les zones de confiance."}, {"cue": "Carte sombre « Entretien »", "text": "Les documents ignorent les usages réels : le fichier Excel qui remplace une fonction absente, la ressaisie quotidienne, le mot de passe partagé. D'où les entretiens. On les prépare à partir des trous de l'inventaire, et on envoie le schéma provisoire : on corrige plus volontiers un schéma qu'on ne décrit son travail à partir de rien. On pose des questions ouvertes : « Racontez-moi une journée type », « Que faites-vous quand l'application ne répond pas ? ». La plus productive est souvent la dernière : « Qu'est-ce que je n'ai pas demandé et que je devrais savoir ? ». Un compte rendu court, envoyé dans les 48 heures et validé par l'interlocuteur, devient une source citable."}, {"cue": "Bandeau du bas", "text": "Pour le D2, vous n'avez ni entretien ni outil de collecte. Le dossier de présentation de Medisecure joue le rôle de l'existant : c'est votre seule source de faits, et chaque fait se cite avec sa section. Ce que vous ne pouvez pas vérifier, vous le dites en partie 6 : quels entretiens, quels outils faudrait-il pour le confirmer ?"}], "words": 342}, {"n": 40, "title": "Quatre attributs de sécurité, sept champs par flux", "paras": [{"cue": "Titre", "text": "L'inventaire applicatif est la pièce maîtresse de la cartographie : c'est l'annexe A. Chaque application y occupe une ligne, avec au moins dix attributs en plus de son nom. Quatre sont des attributs de sécurité exigés par le D2 : les besoins de sécurité, l'exposition à Internet, l'hébergement et l'état du support. Le tableau en montre un extrait chez Kestrel."}, {"cue": "Les colonnes du tableau", "text": "Les besoins de sécurité se notent DICT : disponibilité, intégrité, confidentialité, traçabilité. Kestrel les cote de 1 à 4 ; la disponibilité vient des besoins exprimés par les directions, le reste est à valider avec les métiers. Les autres colonnes prennent leurs valeurs dans des listes fermées : pour l'hébergement, salle interne, cloud d'un hébergeur, SaaS du fournisseur, c'est-à-dire un logiciel fourni en ligne, ou poste ou terminal. Attention, l'état du support porte aussi sur les composants. RoutePro tourne sur SQL Server 2016, dont le support étendu a pris fin le 14 juillet 2026 : il est repéré comme reposant sur un composant hors support."}, {"cue": "Carte sombre « Annexe B »", "text": "Le détail des échanges va dans la matrice des flux, l'annexe B : au moins quinze flux, sept champs chacun. Source et cible sous leur nom exact ; données échangées, avec leur sensibilité ; format ; fréquence ; mode, automatique ou manuel ; protection du canal. Le flux FLX-02 de Kestrel en est un exemple : les tournées construites sous Excel sont saisies au clavier dans RoutePro, chaque soir. Quand une valeur manque, on écrit « non documentée », ou on pose une hypothèse numérotée. Chez Kestrel, le flux le plus critique, FLX-01, du Portail EDI vers RoutePro, n'a aucune protection documentée : c'est déjà un constat."}, {"cue": "Bandeau du bas", "text": "L'annexe A comprend aussi au moins un usage hors inventaire, ce qu'on appelle l'informatique fantôme : un outil utilisé sans être connu ni validé par la DSI. L'inventorier ne revient pas à l'approuver ; c'est rendre visible un risque. Le chapitre 4 présente enfin l'annexe C, la matrice processus × applications, et l'annexe D, l'inventaire de l'infrastructure, que vous ouvrirez plus tard."}], "words": 334}, {"n": 41, "title": "Prenez la fiche FT 10 : inventaire applicatif et flux", "paras": [{"cue": "Titre", "text": "Fiche FT 10. Elle vous entraîne exactement au travail de l'atelier : un inventaire et une matrice des flux, mais sur Kestrel."}, {"cue": "Consigne", "text": "Vous assistez le chef de projet applicatif. Les sources sont de natures différentes : deux entretiens et un relevé technique. Certains flux n'apparaissent que dans l'une d'elles. Utilisez les listes fermées du modèle, et calculez le taux de complétude de l'inventaire. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Un flux manuel est un flux : ne l'oubliez pas parce qu'aucune application ne le porte. Nous corrigerons la matrice des flux ensemble."}], "words": 94}, {"n": 42, "title": "Quatre anomalies à chercher systématiquement sur les vues", "paras": [{"cue": "Titre", "text": "Une vue n'est pas une fin : elle sert à voir ce qu'un tableau cache. Le cours demande de chercher systématiquement quatre anomalies, chacune sur une vue précise. Et c'est là que naissent vos constats de la section 2.8 : une relation entre plusieurs faits, que seule la mise en image révèle."}, {"cue": "Carte « Point unique de défaillance »", "text": "Un point unique de défaillance, single point of failure en anglais, est un élément dont la panne suffit à arrêter un service, faute de redondance ou de repli : un serveur, un lien, une salle, un fournisseur, une personne. Chez Kestrel, la vue physique en montre quatre : la salle serveur SAL-01, les liens RES-01 et RES-02 vers Moirans et Clermont-Ferrand, et la passerelle SEC-01. S'y ajoute un point humain : Romain Chevalier, seul à connaître la configuration du réseau. Attention au piège : le NAS de sauvegarde rangé dans la même pièce n'est pas un point unique de défaillance, puisque sa panne n'arrête rien. C'est un défaut d'isolement des sauvegardes, à signaler à part."}, {"cue": "Cartes « Flux manuel » et « Redondance et trou »", "text": "Les flux manuels se lisent sur la vue applicative, grâce aux traits pointillés : ce sont des ressaisies, donc des erreurs et des délais. Les redondances et les trous se lisent sur la vue fonctionnelle, avec les définitions des consignes vues ce matin."}, {"cue": "Carte rouge « Zone de confiance et franchissement »", "text": "Une zone de confiance regroupe des ressources auxquelles on accorde le même niveau de confiance : Internet, les prestataires, le réseau interne. Un franchissement est un passage autorisé vers une zone de niveau différent : un point de contrôle nécessaire et un chemin d'attaque possible. Le constat central chez Kestrel : FR-01 et FR-02, l'éditeur de RoutePro et les chauffeurs, entrent en permanence dans le réseau interne par SEC-01, une passerelle de réseau privé virtuel, ou VPN, dont une vulnérabilité critique a été corrigée 11 jours après sa publication en 2025. Si le réseau est plat, c'est précisément le constat à montrer. Ne confondez pas cette zone avec la zone d'administration du guide."}], "words": 323}, {"n": 43, "title": "Prenez la fiche FT 11 : points uniques et zones de confiance", "paras": [{"cue": "Titre", "text": "Dernière fiche de la journée, la fiche FT 11. Elle reprend les quatre anomalies que nous venons de voir, sur un incident de Kestrel : la coupure de la fibre de Clermont-Ferrand."}, {"cue": "Consigne", "text": "Vous êtes en alternance auprès de Romain Chevalier et vous mettez à jour la vue physique et la vue de l'administration du site. Testez chaque élément avec la définition exacte : sa panne suffit-elle à arrêter un service ? Nommez les objets selon la règle de nommage. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Souvenez-vous du piège de la sauvegarde rangée près de ce qu'elle protège. Nous corrigerons ensemble la liste des points uniques de défaillance."}], "words": 109}, {"n": 44, "title": "Un outil, des noms constants, une carte à jour et protégée", "paras": [{"cue": "Titre et cartes « Archi » et « draw.io »", "text": "Le guide attend un outil qui tienne l'inventaire, réalise les vues, représente leurs liens et soutienne la mise à jour ; il souligne que la simplicité est un atout. Pour le D2, deux outils gratuits sont acceptés. Archi, logiciel libre, impose la notation ArchiMate, mais gère un modèle unique : un objet renommé l'est dans toutes les vues, et la liste des objets s'exporte. draw.io est très simple et fonctionne hors ligne, mais chaque forme est indépendante : la cohérence repose sur vous. Avec draw.io, vos annexes servent de liste des objets ; copiez chaque nom au lieu de le retaper. Un outil payant de votre entreprise, comme Hopex, SAP LeanIX ou Bizzdesign, est accepté si vous exportez les vues et la liste des objets."}, {"cue": "Carte « Maintenir »", "text": "Une cartographie périmée est plus dangereuse que l'absence de cartographie, car on lui fait confiance. Le processus de maintien à jour répond à quatre questions. Qui est responsable : une fonction nommée, pas « la DSI ». À quel rythme : par exemple une revue trimestrielle des vues techniques et une validation annuelle de la vue métier. Quels événements déclenchent une mise à jour sans attendre la revue. Et où la stocker."}, {"cue": "Carte rouge « Protéger »", "text": "Un attaquant qui possède la cartographie connaît le terrain. Le guide en tire trois règles : ne pas la stocker sur le SI qu'elle représente ; la garder accessible en cas de coupure du réseau, par exemple sur papier, conservée de manière sécurisée ; limiter ses accès à ceux qui ont besoin d'en connaître. Appliquez-le dès maintenant : la mention « Diffusion restreinte – exercice pédagogique » sur votre couverture, et jamais de lien de partage ouvert à tous."}, {"cue": "Bandeau rouge", "text": "Et PowerPoint est exclu. Les vues se construisent avec un outil, et chaque objet porte le même nom d'une vue à l'autre et dans les annexes. Choisissez votre outil maintenant, même imparfaitement."}], "words": 308}, {"n": 45, "title": "Atelier : le modèle de cartographie et la vue de l'écosystème", "paras": [{"cue": "Titre", "text": "Place aux ateliers. Le premier est l'exercice du chapitre 3 : le modèle de cartographie et la vue de l'écosystème de Medisecure. Durée indicative, trois heures ; vous le commencez maintenant et l'achèverez pendant la première période de l'intersession. Vous travaillez seuls, car vos schémas sont personnels. Vous pouvez en revanche comparer vos outils et vos notations avec vos voisins. Si vous n'avez pas encore choisi d'outil, faites-le en premier."}, {"cue": "Première phrase de la consigne", "text": "Commencez par le modèle, pas par le dessin. Le tableau objets × vues pour les sept vues, les attributs avec leur format, la légende commune, la règle de nommage, et le tableau de correspondance avec les quatre niveaux. Testez votre règle de nommage sur dix objets tirés du parc applicatif et des contrats : elle ne doit produire aucune ambiguïté."}, {"cue": "Deuxième et troisième phrases", "text": "Pour l'écosystème, relisez d'abord « Carte d'identité » et « Structure juridique et effectifs » : quelle relation lie l'association et la société, et comment la représenter ? Parcourez ensuite « Principaux contrats », « Parc applicatif », « Échanges avec l'extérieur et entre applications » et « La télésurveillance (MediSuivi) ». Pour chaque partenaire, demandez-vous ce qui se passerait s'il disparaissait demain. Classez-les par type : financeur, autorité, éditeur, hébergeur, opérateur, fabricant, partenaire de soins. Relisez enfin « Conformité » pour les autorités."}, {"cue": "Carte « Livrable »", "text": "En passant dans les rangs, je vérifierai trois choses : que l'outil est installé et que votre fichier porte un nom, que la règle de nommage est écrite avant le dessin, et que votre vue a un titre, une date, une version et une légende. La vue de l'écosystème de Medisecure compte au moins dix parties prenantes externes, dont un financeur, une autorité, un éditeur, un hébergeur, un opérateur et le fabricant des appareils de télésurveillance, chacune avec la relation, les données échangées et un niveau de dépendance."}], "words": 302}, {"n": 46, "title": "Atelier : inventaire applicatif, flux et vue applicative", "paras": [{"cue": "Titre", "text": "Le second atelier est l'exercice du chapitre 4. Durée indicative, quatre heures en deux séances. Vous l'ouvrez cet après-midi ; vous y reviendrez plus tard dans la semaine pour la vue physique, quand nous traiterons les infrastructures, puis vous l'achèverez en première période. Toujours seul."}, {"cue": "Consigne, séance 1", "text": "Première séance : les annexes A et B. Fixez d'abord la liste fermée des valeurs de chaque attribut, puis décrivez les applications du parc et au moins un usage hors inventaire. Recensez ensuite les flux et renseignez leurs sept champs. Partez de « Parc applicatif » et de « La plateforme Medisecure Connect ». Pour l'état du support, relisez l'état des lieux du RSSI dans « Sécurité et conformité » : quels composants hors support sont cités, et à quelles applications appartiennent-ils ? Pour les flux, partez de « Échanges avec l'extérieur et entre applications », puis cherchez ceux qui sont décrits ailleurs, dans « Activités et processus métier » et « Architecture actuelle »."}, {"cue": "Consigne, séance 2", "text": "Seconde séance : la vue applicative dans votre outil. Les flux automatiques et manuels doivent se distinguer, et les applications hors support se repérer à la lecture de la légende. Posez-vous deux questions : quels flux sont manuels ? Pour quels flux la protection du canal est-elle connue, et pour lesquels faut-il écrire « non documentée » ? Commencez ensuite la vue métier, à partir du tableau des processus du chapitre 1."}, {"cue": "Carte « Livrable »", "text": "Je passerai vérifier que vos listes fermées sont écrites avant le remplissage, que les noms de l'annexe A sont exactement ceux de votre vue, et que chaque hypothèse porte un numéro. Ce soir, si tout va bien, vous aurez un outil, un modèle, trois vues commencées et deux annexes ouvertes. Demain, nous passerons au risque, et vos biens supports seront ces objets-là. Bon travail."}], "words": 296}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
