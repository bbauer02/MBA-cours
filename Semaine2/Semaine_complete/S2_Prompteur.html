orrigée 11 jours après sa publication en 2025. Si le réseau est plat, c'est précisément le constat à montrer. Ne confondez pas cette zone avec la zone d'administration du guide."}], "words": 323}, {"n": 43, "title": "Prenez la fiche FT 11 : points uniques et zones de confiance", "paras": [{"cue": "Titre", "text": "Dernière fiche de la journée, la fiche FT 11. Elle reprend les quatre anomalies que nous venons de voir, sur un incident de Kestrel : la coupure de la fibre de Clermont-Ferrand."}, {"cue": "Consigne", "text": "Vous êtes en alternance auprès de Romain Chevalier et vous mettez à jour la vue physique et la vue de l'administration du site. Testez chaque élément avec la définition exacte : sa panne suffit-elle à arrêter un service ? Nommez les objets selon la règle de nommage. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Souvenez-vous du piège de la sauvegarde rangée près de ce qu'elle protège. Nous corrigerons ensemble la liste des points uniques de défaillance."}], "words": 109}, {"n": 44, "title": "Un outil, des noms constants, une carte à jour et protégée", "paras": [{"cue": "Titre et cartes « Archi » et « draw.io »", "text": "Le guide attend un outil qui tienne l'inventaire, réalise les vues, représente leurs liens et soutienne la mise à jour ; il souligne que la simplicité est un atout. Pour le D2, deux outils gratuits sont acceptés. Archi, logiciel libre, impose la notation ArchiMate, mais gère un modèle unique : un objet renommé l'est dans toutes les vues, et la liste des objets s'exporte. draw.io est très simple et fonctionne hors ligne, mais chaque forme est indépendante : la cohérence repose sur vous. Avec draw.io, vos annexes servent de liste des objets ; copiez chaque nom au lieu de le retaper. Un outil payant de votre entreprise, comme Hopex, SAP LeanIX ou Bizzdesign, est accepté si vous exportez les vues et la liste des objets."}, {"cue": "Carte « Maintenir »", "text": "Une cartographie périmée est plus dangereuse que l'absence de cartographie, car on lui fait confiance. Le processus de maintien à jour répond à quatre questions. Qui est responsable : une fonction nommée, pas « la DSI ». À quel rythme : par exemple une revue trimestrielle des vues techniques et une validation annuelle de la vue métier. Quels événements déclenchent une mise à jour sans attendre la revue. Et où la stocker."}, {"cue": "Carte rouge « Protéger »", "text": "Un attaquant qui possède la cartographie connaît le terrain. Le guide en tire trois règles : ne pas la stocker sur le SI qu'elle représente ; la garder accessible en cas de coupure du réseau, par exemple sur papier, conservée de manière sécurisée ; limiter ses accès à ceux qui ont besoin d'en connaître. Appliquez-le dès maintenant : la mention « Diffusion restreinte – exercice pédagogique » sur votre couverture, et jamais de lien de partage ouvert à tous."}, {"cue": "Bandeau rouge", "text": "Et PowerPoint est exclu. Les vues se construisent avec un outil, et chaque objet porte le même nom d'une vue à l'autre et dans les annexes. Choisissez votre outil maintenant, même imparfaitement."}], "words": 308}, {"n": 45, "title": "Atelier : le modèle de cartographie et la vue de l'écosystème", "paras": [{"cue": "Titre", "text": "Place aux ateliers. Le premier est l'exercice du chapitre 3 : le modèle de cartographie et la vue de l'écosystème de Medisecure. Durée indicative, trois heures ; vous le commencez maintenant et l'achèverez pendant la première période de l'intersession. Vous travaillez seuls, car vos schémas sont personnels. Vous pouvez en revanche comparer vos outils et vos notations avec vos voisins. Si vous n'avez pas encore choisi d'outil, faites-le en premier."}, {"cue": "Première phrase de la consigne", "text": "Commencez par le modèle, pas par le dessin. Le tableau objets × vues pour les sept vues, les attributs avec leur format, la légende commune, la règle de nommage, et le tableau de correspondance avec les quatre niveaux. Testez votre règle de nommage sur dix objets tirés du parc applicatif et des contrats : elle ne doit produire aucune ambiguïté."}, {"cue": "Deuxième et troisième phrases", "text": "Pour l'écosystème, relisez d'abord « Carte d'identité » et « Structure juridique et effectifs » : quelle relation lie l'association et la société, et comment la représenter ? Parcourez ensuite « Principaux contrats », « Parc applicatif », « Échanges avec l'extérieur et entre applications » et « La télésurveillance (MediSuivi) ». Pour chaque partenaire, demandez-vous ce qui se passerait s'il disparaissait demain. Classez-les par type : financeur, autorité, éditeur, hébergeur, opérateur, fabricant, partenaire de soins. Relisez enfin « Conformité » pour les autorités."}, {"cue": "Carte « Livrable »", "text": "En passant dans les rangs, je vérifierai trois choses : que l'outil est installé et que votre fichier porte un nom, que la règle de nommage est écrite avant le dessin, et que votre vue a un titre, une date, une version et une légende. La vue de l'écosystème de Medisecure compte au moins dix parties prenantes externes, dont un financeur, une autorité, un éditeur, un hébergeur, un opérateur et le fabricant des appareils de télésurveillance, chacune avec la relation, les données échangées et un niveau de dépendance."}], "words": 302}, {"n": 46, "title": "Atelier : inventaire applicatif, flux et vue applicative", "paras": [{"cue": "Titre", "text": "Le second atelier est l'exercice du chapitre 4. Durée indicative, quatre heures en deux séances. Vous l'ouvrez cet après-midi ; vous y reviendrez plus tard dans la semaine pour la vue physique, quand nous traiterons les infrastructures, puis vous l'achèverez en première période. Toujours seul."}, {"cue": "Consigne, séance 1", "text": "Première séance : les annexes A et B. Fixez d'abord la liste fermée des valeurs de chaque attribut, puis décrivez les applications du parc et au moins un usage hors inventaire. Recensez ensuite les flux et renseignez leurs sept champs. Partez de « Parc applicatif » et de « La plateforme Medisecure Connect ». Pour l'état du support, relisez l'état des lieux du RSSI dans « Sécurité et conformité » : quels composants hors support sont cités, et à quelles applications appartiennent-ils ? Pour les flux, partez de « Échanges avec l'extérieur et entre applications », puis cherchez ceux qui sont décrits ailleurs, dans « Activités et processus métier » et « Architecture actuelle »."}, {"cue": "Consigne, séance 2", "text": "Seconde séance : la vue applicative dans votre outil. Les flux automatiques et manuels doivent se distinguer, et les applications hors support se repérer à la lecture de la légende. Posez-vous deux questions : quels flux sont manuels ? Pour quels flux la protection du canal est-elle connue, et pour lesquels faut-il écrire « non documentée » ? Commencez ensuite la vue métier, à partir du tableau des processus du chapitre 1."}, {"cue": "Carte « Livrable »", "text": "Je passerai vérifier que vos listes fermées sont écrites avant le remplissage, que les noms de l'annexe A sont exactement ceux de votre vue, et que chaque hypothèse porte un numéro. Ce soir, si tout va bien, vous aurez un outil, un modèle, trois vues commencées et deux annexes ouvertes. Demain, nous passerons au risque, et vos biens supports seront ces objets-là. Bon travail."}], "words": 296}, {"n": 47, "title": "Sécurité, risque et EBIOS Risk Manager : cadrer l'analyse", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Hier, vous avez appris à décrire le système d'information : ses vues, ses objets, ses flux, ses points uniques de défaillance. Aujourd'hui, on change de question. On ne demande plus « qu'y a-t-il dans le SI ? », mais « qu'est-ce qui peut lui arriver, et combien cela coûterait-il ? ». On passe de la carte au jugement."}, {"cue": "Sous-titre", "text": "Ce passage exige un vocabulaire précis. Dans la vie courante, on emploie « risque », « menace » et « vulnérabilité » à tort et à travers. Dans une analyse de risques, chacun de ces mots a un sens exact, et les confondre fausse tout le raisonnement. Nous allons donc poser les notions, les normes, le socle réglementaire et les échelles, puis entrer dans la méthode de l'ANSSI, l'Agence nationale de la sécurité des systèmes d'information : EBIOS Risk Manager. Tout cela prépare la partie 3 de votre dossier D2, l'analyse de risques. Gardez en tête une idée simple pour toute la journée : une analyse de risques ne vaut que par le fil qui la relie à votre cartographie."}], "words": 184}, {"n": 48, "title": "Le matin, les notions et la méthode ; l'après-midi, Medisecure", "paras": [{"cue": "Frise des cinq étapes", "text": "Voici le programme de la journée. La frise se lit de gauche à droite, et c'est aussi l'ordre dans lequel une analyse de risques se construit. D'abord les notions : les critères de sécurité, que l'on résume par le sigle DICT, puis le vocabulaire du risque. Ensuite les normes et le socle : ce que disent ISO/IEC 27001, 27002 et 27005, et quelles règles s'imposent déjà à une organisation avant même qu'elle analyse ses risques. Puis les échelles de gravité et de vraisemblance, et la matrice qui les croise. Enfin, la méthode EBIOS Risk Manager, avec ses principes et ses deux premiers ateliers."}, {"cue": "Carte « Matin »", "text": "Toute la matinée suit un seul exemple, Kestrel Logistique, le transporteur que vous connaissez depuis le début de la semaine. Vous verrez ses échelles, ses écarts au socle, ses valeurs métier, ses sources de risque. Nous ferons aussi une étude de document sur une attaque réelle contre un hôpital français : c'est le chapitre 5 qui la propose. Gardez le cours ouvert à côté de vous : les tableaux que je montre sont ceux des chapitres 5 et 6, parfois raccourcis pour l'écran. Quand je dis « le cours », c'est là que se trouvent les versions complètes, les définitions encadrées et les gabarits. Trois fiches de travail ponctuent la matinée : la FT 12 sur les critères de sécurité, la FT 13 sur la cotation, la FT 14 sur les ateliers 1 et 2. Je vous dirai à quel moment sortir chacune."}, {"cue": "Carte orangée « Après-midi », puis carte « Dossier D2 »", "text": "L'après-midi, vous passez à Medisecure avec trois ateliers. Je vous préviens tout de suite : le cours leur donne sept heures au total. Vous ne les finirez pas cet après-midi, et ce n'est pas le but. Le but est de les commencer ici, avec moi, pour que les questions de méthode soient réglées avant l'intersession. Ces trois ateliers alimentent les sections 3.1, 3.2 et 3.3 de votre dossier. Demain, nous terminerons la méthode avec les ateliers 3 à 5."}], "words": 325}, {"n": 49, "title": "Sécurité et risque : notions et cadre normatif", "paras": [{"cue": "Écran de chapitre", "text": "Nous ouvrons le chapitre 5. Il pose les fondations de l'analyse de risques : les notions, les normes, le socle réglementaire et les échelles. Le chapitre 6 les met ensuite en œuvre avec EBIOS Risk Manager. Les deux chapitres préparent ensemble la partie 3 du dossier."}, {"cue": "Sous-titre : ce que vous saurez faire", "text": "À la fin de ce chapitre, vous saurez exprimer un besoin de sécurité avec quatre critères, et décomposer un incident en actif, menace, vulnérabilité et impact. Vous saurez situer trois normes l'une par rapport à l'autre, et faire correspondre la démarche d'ISO/IEC 27005 avec les ateliers d'EBIOS Risk Manager. Vous saurez enfin identifier le socle de sécurité d'une organisation, en mesurer les écarts, et construire des échelles adaptées à son métier. Ce dernier point est le plus important pour votre dossier : sans échelles écrites à l'avance, aucune cotation ne tient."}], "words": 137}, {"n": 50, "title": "La sécurité protège quatre propriétés, pas des machines", "paras": [{"cue": "Titre", "text": "Première idée du chapitre, et elle surprend souvent : la sécurité de l'information ne protège pas des machines. Elle protège des propriétés de l'information et des processus qui l'utilisent. On les appelle critères de sécurité, ou besoins de sécurité quand on les exprime pour un élément donné."}, {"cue": "Bandeau d'introduction et colonne « Critère »", "text": "Il y en a quatre. La disponibilité, c'est être accessible et utilisable au moment voulu par une personne autorisée. L'intégrité, c'est être exact et complet, non modifié de façon illégitime. La confidentialité, c'est n'être accessible qu'aux personnes autorisées. La traçabilité, que l'on appelle aussi preuve, c'est pouvoir retrouver qui a fait quoi et quand. D'où les sigles DICT ou DICP. Les trois premiers viennent de la norme ISO/IEC 27000 ; le quatrième est un ajout courant des méthodes françaises."}, {"cue": "Colonne « Question à poser au métier »", "text": "Regardez la deuxième colonne : c'est la plus utile en entretien. Vous ne demandez pas à un directeur des opérations « quel est votre besoin d'intégrité ? ». Il ne saurait pas répondre. Vous lui demandez : « que se passe-t-il si les données sont fausses sans que vous le sachiez ? ». Chez Kestrel, la réponse est concrète : une commande EDI, c'est-à-dire reçue par échange de données informatisé, modifiée, et trente palettes partent à la mauvaise adresse."}, {"cue": "Bandeau du bas", "text": "Un même élément n'a pas les mêmes besoins sur chaque critère. RoutePro, l'application de gestion du transport, a un besoin de disponibilité très fort : les camions partent à 5 heures, et les directions tolèrent 2 heures d'arrêt au plus. Son besoin de confidentialité est moyen : un ordre de transport n'est pas un secret. À l'inverse, les données des destinataires ont un besoin de confidentialité élevé, car leur fuite exposerait Kestrel à une sanction de la CNIL. Vous avez déjà renseigné ces besoins dans l'inventaire applicatif du chapitre 4 : ils deviennent ici la matière première de l'analyse. La disponibilité, elle, s'exprimera en durée d'interruption admissible, la DMIA, que nous verrons demain au chapitre 8."}], "words": 321}, {"n": 51, "title": "Décomposer un incident montre où agir", "paras": [{"cue": "Bandeau d'introduction", "text": "Le langage courant dit « il y a un risque de piratage », sans préciser qui pirate, par quel moyen, ni avec quelles conséquences. Une analyse de risques fait l'inverse : elle décompose chaque risque en éléments distincts, que l'on peut vérifier et traiter séparément. La norme ISO 31000 définit le risque comme l'effet de l'incertitude sur les objectifs. En sécurité de l'information, c'est la possibilité qu'une menace exploite une vulnérabilité d'un actif et cause un impact. On le décrit comme un scénario, d'une cause à une conséquence, et on l'estime en combinant gravité et vraisemblance."}, {"cue": "Cartes « Valeur métier » et « Bien support »", "text": "Prenons la panne de novembre 2024 chez Kestrel : un disque du serveur de RoutePro lâche, l'affectation des tournées s'arrête 9 heures. L'actif, c'est tout ce qui a de la valeur. EBIOS Risk Manager le dédouble. La valeur métier est le processus ou l'information essentiels : ici « planifier les tournées ». Le bien support est l'élément du SI sur lequel elle repose : le serveur de virtualisation qui portait APP-01 RoutePro, dans la salle SAL-01. Retenez bien cette distinction : c'est le pont entre votre cartographie et votre analyse de risques. Les biens supports, ce sont vos objets de cartographie."}, {"cue": "Cartes « Menace » et « Vulnérabilité »", "text": "La menace est la cause potentielle : ici une panne matérielle, sans intention malveillante. La vulnérabilité est la faiblesse que la menace exploite : pas de stockage redondant, pas de bascule documentée vers l'autre serveur. Une menace sans vulnérabilité reste théorique ; une vulnérabilité sans menace crédible reste une faiblesse dormante. Et la vraisemblance, j'y insiste, n'est pas une prédiction : EBIOS Risk Manager la définit comme la facilité avec laquelle un attaquant décidé réussirait."}, {"cue": "Carte sombre « Impact », puis carte « Où agir »", "text": "L'impact est mesuré : 2 300 colis en retard et 38 000 euros de pénalités. Et voici l'intérêt de la décomposition : elle montre où agir. On ne supprime pas la menace, un disque finit toujours par tomber en panne. On traite la vulnérabilité, ou on réduit l'impact par une procédure dégradée. La même grille s'applique à la tentative de fraude au virement de septembre 2025 : la menace est un escroc, la vulnérabilité est l'absence de contre-appel avant un changement de coordonnées bancaires. Comme la fiche de Kestrel ne décrit pas cette procédure, le cours l'écrit comme hypothèse numérotée, H17, et non comme un fait. Une dernière remarque : les pannes et accidents relèvent surtout du socle et de l'analyse d'impact du chapitre 8 ; les scénarios d'EBIOS Risk Manager portent sur les attaques."}], "words": 407}, {"n": 52, "title": "Prenez la fiche FT 12 : qualifier les incidents de Kestrel", "paras": [{"cue": "Titre et bandeau vert", "text": "Avant d'aller plus loin, sortez la fiche de travail FT 12. Elle reprend exactement ce que nous venons de voir : les quatre critères de sécurité et la décomposition d'un incident. Vous la faites maintenant, en soixante minutes, seuls ou à deux."}, {"cue": "Consigne", "text": "La situation : nous sommes en janvier 2026, vous êtes stagiaire auprès de Romain Chevalier, le RSSI à temps partiel de Kestrel. Il veut que le bilan des incidents de 2025 parle le langage du risque, et non celui des pannes. Vous qualifiez chaque incident, puis vous décomposez les plus instructifs, et vous calculez l'écart entre l'interruption constatée et la durée tolérée par les métiers."}, {"cue": "Carte « À la fin de la fiche »", "text": "Terminez par l'encadré « Je retiens » : il reprend les définitions du cours avec des mots manquants. Nous mettrons en commun deux ou trois décompositions avant de passer aux échelles."}], "words": 138}, {"n": 53, "title": "Traiter un risque : quatre options, une acceptation écrite", "paras": [{"cue": "Bandeau d'introduction", "text": "Un même risque peut être estimé à trois moments. Le risque inhérent est estimé comme si aucune mesure n'existait : c'est le sens qu'il a en audit interne. Le risque initial, terme d'EBIOS Risk Manager, est le risque tel qu'il existe aujourd'hui, avec les mesures en place et leurs défauts. Le risque résiduel est celui qui subsiste après les mesures décidées. Ne confondez pas inhérent et initial : dans le cours et dans votre dossier, on parle de risque initial et de risque résiduel. Et un risque résiduel n'est jamais nul. Il doit être accepté par quelqu'un qui en a l'autorité : pour un risque significatif, c'est la direction, pas l'équipe technique qui a posé les mesures."}, {"cue": "Tableau, lignes « Réduire » et « Transférer »", "text": "Face à un risque, quatre options. La norme ISO/IEC 27005 parle de modifier, partager, éviter ou maintenir le risque ; le dossier D2 retient réduire, transférer, éviter et accepter. Réduire, c'est agir par des mesures, par exemple une copie des sauvegardes hors ligne. C'est l'option la plus fréquente, mais elle ne supprime jamais tout. Transférer, c'est faire porter une partie des conséquences par un tiers, typiquement un assureur. Attention à sa limite : une assurance rembourse, elle ne fait pas partir les camions et ne répare pas l'image."}, {"cue": "Lignes « Éviter » et « Accepter »", "text": "Éviter, c'est renoncer à ce qui crée le risque. Chez Kestrel, les chauffeurs ont un accès VPN au réseau interne uniquement pour déclarer leurs frais : le supprimer évite le risque, au prix d'un service. Accepter, c'est décider en connaissance de cause de ne rien faire de plus : par exemple, 24 heures d'arrêt de TeleFleet, la télématique, jugées tolérables par les opérations."}, {"cue": "Bandeau rouge du bas", "text": "Et voici le piège. Un risque que personne n'a traité n'est pas un risque accepté : c'est un risque ignoré. L'acceptation est une décision écrite, prise par un responsable identifié, avec un motif. Votre dossier en demande au moins une. Une phrase comme « risque accepté car le budget manque » est recevable si elle est assumée et datée. « Risque faible », sans autre explication, ne l'est pas. Question à la salle : dans votre entreprise d'alternance, savez-vous qui a le droit d'accepter un risque ?"}], "words": 355}, {"n": 54, "title": "ISO/IEC 27005 décrit la démarche, EBIOS RM la met en œuvre", "paras": [{"cue": "Carte de droite, en-tête « SMSI »", "text": "Une analyse de risques isolée vieillit vite. Les normes de la famille ISO/IEC 27000 l'insèrent dans un dispositif permanent : le système de management de la sécurité de l'information, le SMSI. C'est l'ensemble des politiques, responsabilités, processus et ressources par lesquels une organisation gère sa sécurité, selon la boucle planifier, faire, vérifier, agir. Ses exigences sont fixées par ISO/IEC 27001, dont l'édition en vigueur date de 2022. La transition depuis l'édition 2013 s'est achevée le 31 octobre 2025."}, {"cue": "Carte de droite, les trois normes", "text": "Distinguez bien les trois normes. 27001 fixe les exigences ; elle est certifiable, et son annexe A liste 93 mesures. 27002 détaille ces 93 mesures, réparties en quatre thèmes : organisationnelles, liées aux personnes, physiques et technologiques. Ce n'est qu'un catalogue, non certifiable. 27005, enfin, donne la démarche de gestion des risques. Chez Kestrel, personne ne demande de certificat, mais les clients de la grande distribution posent des questions de sécurité dans leurs appels d'offres : adopter la démarche sans viser le certificat est un choix fréquent pour une PME."}, {"cue": "Schéma : du contexte à l'acceptation", "text": "Le schéma reprend la figure du chapitre 5. Tout commence par l'établissement du contexte : périmètre, critères de risque, critère d'acceptation. Vient l'appréciation du risque, en trois activités : identifier, analyser, évaluer. Puis le traitement, et l'acceptation des risques résiduels. Sur les côtés, deux activités accompagnent tout le processus : la communication et la concertation, la surveillance et la revue. L'édition 2022 décrit deux approches pour identifier les risques : par les événements, qui part des sources de risque, et par les biens, qui part des actifs. Vous les reconnaîtrez demain, aux ateliers 3 et 4 : ce sont les scénarios stratégiques et opérationnels d'EBIOS."}, {"cue": "Bandeau « Pour votre dossier D2 »", "text": "Les consignes vous laissent le choix entre EBIOS Risk Manager et ISO/IEC 27005, à condition de produire des résultats équivalents. Le chapitre 5 contient un tableau de correspondance, activité par activité, avec son équivalent dans EBIOS Risk Manager : lisez-le. Mais sachez que la norme ne vous donne ni grille d'évaluation des parties prenantes, ni séquence d'attaque toute faite : il faudrait les construire et les justifier. C'est pourquoi le cours recommande EBIOS. Et quelle que soit la méthode, gardez un seul vocabulaire du début à la fin : « actif primordial » dans un tableau et « valeur métier » dans le suivant, c'est une erreur fréquente."}], "words": 381}, {"n": 55, "title": "Un écart au socle se prouve par un fait, sinon c'est une opinion", "paras": [{"cue": "Bandeau d'introduction", "text": "Toute organisation est soumise à des règles de sécurité avant même d'analyser ses risques : la loi, les contrats, les bonnes pratiques de son secteur, sa propre politique. EBIOS Risk Manager appelle cet ensemble le socle de sécurité. On liste les référentiels, on évalue l'état d'application de chacun, on relève les écarts. Et ces écarts ne restent pas dans un coin : ils deviennent souvent les vulnérabilités exploitées dans les scénarios."}, {"cue": "Colonne « Référentiel »", "text": "Quels référentiels ? D'abord le guide d'hygiène informatique de l'ANSSI, « Renforcer la sécurité de son système d'information en 42 mesures », version 2 de 2017 : c'est le minimum attendu de toute organisation. Ensuite le RGPD, le règlement général sur la protection des données, dès qu'il y a des données personnelles : son article 32 impose une sécurité adaptée au risque, son article 33 la notification d'une violation à la CNIL dans les 72 heures si possible. Pour la santé s'ajoute la certification HDS, hébergement de données de santé, référentiel en version 2 depuis 2024 ; elle ne concerne pas Kestrel. Enfin la PSSI, la politique de sécurité interne : une PSSI ancienne jamais révisée reste un référentiel, et son ancienneté est elle-même un écart."}, {"cue": "Lignes du tableau, colonnes « Constat » et « État »", "text": "Regardez la méthode sur Kestrel. On cite l'exigence, on décrit un constat appuyé sur un fait vérifiable, on qualifie : appliqué, partiellement appliqué, non appliqué. L'authentification multifacteur existe sur Microsoft 365, mais pour les cadres seulement : partiellement appliqué. L'éditeur de RoutePro dispose d'un accès VPN permanent : non appliqué. Les positions GPS de TeleFleet sont conservées sans durée définie : écart au RGPD. Notez que les biens portent leur nom de cartographie, identifiant compris. Un écart sans fait n'est qu'une opinion."}, {"cue": "Bandeau rouge sur NIS2", "text": "Un mot sur NIS2, la directive européenne 2022/2555. Elle étend les obligations de cybersécurité à la santé et aux services postaux et d'expédition, ce qui pourrait concerner Kestrel, point à confirmer. Les États devaient la transposer avant le 17 octobre 2024 ; la France ne l'a pas fait, et le projet de loi est toujours en discussion à la date du cours. Ne l'écrivez donc jamais de mémoire dans votre dossier : vérifiez sur le site de l'Assemblée nationale et sur Légifrance le jour où vous rédigez."}], "words": 366}, {"n": 56, "title": "Une gravité se lit sur une échelle ancrée dans les faits", "paras": [{"cue": "Titre", "text": "Une gravité n'a de sens que lue sur une échelle écrite à l'avance. Sans échelle, chacun note selon son intuition, et deux analyses du même risque divergent. Retenez la règle : l'échelle est définie avant toute cotation. La fiche méthode de l'ANSSI donne trois conseils : construire l'échelle avec les métiers, reprendre l'échelle de gestion des risques de l'organisation si elle existe, et choisir quatre niveaux, cinq seulement pour les organisations dont une crise toucherait tout un secteur ou une mission de l'État."}, {"cue": "Bandeau d'introduction et colonne « Finances »", "text": "Chez Kestrel, l'échelle a été construite avec la directrice administrative et financière et le directeur des opérations. Les seuils financiers sont ancrés sur la marge opérationnelle de 2025 : environ 1,3 million d'euros, soit 3,1 % de 42 millions. G4 commence donc à une année de marge. Ce n'est pas un chiffre au hasard : c'est un seuil que la direction comprend immédiatement. Les seuils d'activité, eux, sont ancrés sur l'heure de départ des camions et sur la panne de novembre 2024. Autrement dit, chaque frontière entre deux niveaux correspond à quelque chose que les directeurs ont déjà vécu ou déjà chiffré. C'est cela, une échelle propre à l'organisation : elle parle la langue de ceux qui l'utiliseront."}, {"cue": "Colonnes d'impact, lignes G1 à G4", "text": "Quatre dimensions ici : les livraisons, les finances, le juridique, l'image et les personnes. Chaque case est un descripteur concret, chiffré quand c'est possible. Et la règle de lecture est simple : une seule dimension atteinte suffit à classer l'événement à ce niveau. Une fuite de données de destinataires est G3, même si elle ne coûte rien sur le moment. Pour Medisecure, attention : la grille du D2 impose cinq dimensions, dont la santé des patients. Vous ne pouvez pas reprendre ces quatre colonnes."}, {"cue": "Bandeau sombre du bas", "text": "Dernière étape, indispensable : tester l'échelle sur un incident réel. La panne de novembre 2024 donne G2 : 9 heures, moins d'une journée, 2 300 colis, 38 000 euros, tout reste sous les seuils de G3. Les directeurs ont jugé ce niveau juste. Si le test avait donné G4, l'échelle aurait été trop sensible et aurait écrasé toutes les différences. Vous ferez le même test cet après-midi avec l'incident de Medisecure."}], "words": 356}, {"n": 57, "title": "La matrice croise les échelles et dit qui peut accepter", "paras": [{"cue": "Carte sombre de droite : V1 à V4", "text": "Passons à la vraisemblance. Le point de méthode est le suivant : on ne décrit pas une probabilité chiffrée, on décrit ce que l'attaquant doit faire pour réussir. V1, peu vraisemblable : il doit lever plusieurs protections efficaces, avec des moyens importants. V2, vraisemblable : l'attaque demande un vrai savoir-faire et la combinaison de plusieurs faiblesses. V3, très vraisemblable : la faiblesse est connue, documentée, et les outils existent. V4, quasi certain : un attaquant peu qualifié y arrive, ou le scénario s'est déjà produit. Les libellés reprennent ceux de l'échelle générique de l'ANSSI. Remarquez qu'aucun pourcentage n'apparaît. Dire « une chance sur dix » donnerait une fausse précision que personne ne pourrait justifier. Décrire l'effort de l'attaquant, en revanche, se vérifie : la faille est-elle publique, corrigée, exposée ?"}, {"cue": "Matrice, case G4 × V1 puis ligne G1", "text": "La matrice croise les deux échelles et donne quatre niveaux de risque. Regardez-la bien : elle n'est pas symétrique. Une gravité G4 donne un risque élevé même peu vraisemblable, et critique dès qu'elle est vraisemblable. Une gravité G1, elle, ne dépasse jamais le niveau moyen, même quasi certaine. C'est un choix assumé, qui traduit l'aversion de Kestrel pour l'arrêt total de ses livraisons. Pour Medisecure, vous pouvez faire un autre choix, à condition de l'écrire et de le justifier."}, {"cue": "Bandeau du bas : le seuil d'acceptation", "text": "La matrice ne suffit pas : il faut dire qui décide. C'est le seuil d'acceptation, fixé par la direction. Chez Kestrel, un risque faible peut être accepté par le responsable de l'infrastructure ; un risque moyen, par le comité de direction, avec un motif écrit ; un risque élevé ou critique doit être traité. Tant que son traitement est en cours, un risque élevé ne peut être accepté que temporairement, par le directeur général, avec une mesure compensatoire et une date de réexamen. Dans votre dossier, la matrice et ce seuil doivent figurer en section 3.1, avant le premier risque coté."}], "words": 310}, {"n": 58, "title": "Un hôpital paralysé : lire une crise avec les critères de sécurité", "paras": [{"cue": "Document à gauche", "text": "Nous terminons le chapitre 5 par une étude de document. C'est un cas réel, résumé dans le cours à partir de la presse professionnelle : la cyberattaque du centre hospitalier Sud Francilien, en août 2022. Je vous laisse cinq minutes pour lire la version complète, dans l'encadré ÉTUDE du chapitre 5, et pour noter une réponse courte à chacune des cinq questions. Travaillez seuls d'abord."}, {"cue": "Questions 1 et 2", "text": "Puis nous faisons un tour de table rapide, une question par personne. Sur la première question, je veux entendre les quatre critères. La disponibilité saute aux yeux : logiciels inaccessibles, retour au papier, patients orientés ailleurs. La confidentialité aussi : 11 gigaoctets publiés. Mais cherchez l'intégrité et la traçabilité : le texte dit que les bases métier n'ont pas été compromises. Sur la deuxième, faites remarquer que l'échelle de Kestrel n'a pas de dimension « santé des personnes » au sens des soins : une échelle hospitalière doit l'ajouter, et c'est justement l'une des cinq dimensions exigées pour Medisecure."}, {"cue": "Questions 3 à 5", "text": "La troisième question est la plus formatrice. Le texte ne dit rien de la porte d'entrée. Sans elle, impossible de nommer la vulnérabilité ni le bien support : on ne peut décrire que la menace et l'impact. Retenez-le : une décomposition incomplète se signale, elle ne s'invente pas. Pour la quatrième, je ne donne aucune réponse sur Medisecure : je vous demande seulement de comparer durée d'arrêt, exfiltration et coût rapporté à la taille de l'organisation. Sur la cinquième, laissez le débat s'ouvrir : refuser la rançon est une décision, mais elle se prépare avant la crise, pas pendant."}, {"cue": "Retour sur le titre", "text": "Pour conclure la discussion, je fais le lien avec la suite. Cette étude montre trois choses que vous retrouverez dans votre dossier. Une crise réelle touche plusieurs critères à la fois. Une échelle de gravité doit avoir des dimensions propres au métier, ici la santé des patients. Et une décomposition honnête signale ce qu'elle ignore. Le chapitre 5 rappelle que ces chiffres viennent de la presse et des communiqués de l'établissement : si vous les citez, vérifiez-les et donnez la source."}], "words": 344}, {"n": 59, "title": "Prenez la fiche FT 13 : coter quatre risques de Kestrel", "paras": [{"cue": "Titre", "text": "Deuxième fiche de la matinée : la FT 13. Elle vous fait manipuler les échelles et la matrice que nous venons de voir, avant que vous construisiez celles de Medisecure cet après-midi."}, {"cue": "Consigne", "text": "Vous assistez Isabelle Roux, la directrice administrative et financière. Romain Chevalier lui a signalé quatre risques hors de l'étude en cours : deux sur la paie, un sur le site web, un sur StockFlow. Pour chacun, vous citez le descripteur qui justifie le niveau de gravité et de vraisemblance, vous placez le risque sur la matrice, puis vous choisissez une option de traitement et vous désignez qui décide. Soixante minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Le piège à éviter : coter au jugé. Chaque niveau doit renvoyer à une phrase de l'échelle. Nous comparerons vos cotes ; quand elles divergent, c'est presque toujours un descripteur mal lu."}], "words": 138}, {"n": 60, "title": "Analyser les risques avec EBIOS Risk Manager", "paras": [{"cue": "Écran de chapitre", "text": "Nous ouvrons le chapitre 6, le plus long du cours. Il met en œuvre tout ce que nous venons de voir avec la méthode de l'ANSSI. Il suit une seule étude, conduite sur Kestrel, du premier au cinquième atelier : vous verrez comment les résultats d'un atelier deviennent les entrées du suivant. Ce matin, nous voyons les principes et les ateliers 1 et 2 ; demain, les ateliers 3 à 5."}, {"cue": "Sous-titre", "text": "Un avertissement dès maintenant. Les tableaux du chapitre sont simplifiés, et les consignes précisent que les livrables complets du guide de l'ANSSI ne sont pas exigés. Mais ces tableaux ne sont pas facultatifs : chaque colonne porte une information dont l'atelier suivant a besoin. Et l'étude Kestrel montre une manière de faire, pas la réponse. Un passage qui reprend la structure et les formulations de Kestrel en changeant seulement les noms ne rapporte aucun point."}], "words": 146}, {"n": 61, "title": "Cinq ateliers : les sorties de l'un nourrissent le suivant", "paras": [{"cue": "Carte de droite : la méthode", "text": "EBIOS signifie « Expression des besoins et identification des objectifs de sécurité ». La première méthode date de 1995. EBIOS 2010 était centrée sur les biens et leurs vulnérabilités. EBIOS Risk Manager, publiée par l'ANSSI en octobre 2018 avec le Club EBIOS, a renouvelé la démarche en partant de la menace et de l'écosystème. La version en vigueur est la 1.5, annoncée en mars 2024 ; le guide téléchargeable est daté de septembre 2024. Certains sites commerciaux parlent d'une version 2 : aucune source officielle ne la confirme. Citez donc la 1.5, avec sa référence exacte, en section 3.1. Le guide est complété par des fiches méthodes, mises à jour régulièrement, qui détaillent chaque étape avec des exemples."}, {"cue": "Carte de droite : conformité, puis scénarios", "text": "La méthode combine deux approches. L'approche par conformité vérifie d'abord le socle : elle traite les risques courants par les bonnes pratiques. L'approche par scénarios traite ensuite les attaquants motivés, qui contournent le socle. L'ANSSI le représente par une pyramide : la conformité protège contre la menace fréquente et peu élaborée, les scénarios servent pour la menace plus rare et plus sophistiquée."}, {"cue": "Schéma des cinq ateliers et flèches en pointillés", "text": "Le schéma reprend la figure du chapitre 6. Atelier 1 : que protège-t-on, et quelles règles s'appliquent déjà ? Atelier 2 : qui pourrait attaquer, et pour obtenir quoi ? Atelier 3 : par quels chemins, y compris par l'écosystème ? Atelier 4 : comment, concrètement, et avec quelle facilité ? Atelier 5 : que décide-t-on ? Regardez les flèches en pointillés : la gravité de l'atelier 1 sert à l'atelier 3, ses biens supports à l'atelier 4, ses écarts au socle à l'atelier 5. Et les deux boucles de retour : le cycle stratégique revisite toute l'étude à un rythme de quelques années, le cycle opérationnel revoit les scénarios et les mesures, souvent chaque année."}, {"cue": "Bandeau « Pour votre dossier D2 »", "text": "Pour le dossier, la correspondance est directe : un atelier, une section. L'atelier 1 remplit la section 3.2, et ainsi de suite jusqu'à l'atelier 5, section 3.6. La partie 3 présente les résultats et les choix ; les tableaux complets vont en annexe E. Pour outiller la méthode, un tableur et votre outil de cartographie suffisent. L'ANSSI labellise des logiciels, mais aucun ne réfléchira à votre place."}], "words": 363}, {"n": 62, "title": "Atelier 1 : ce que l'on protège, et à quel point c'est grave", "paras": [{"cue": "Carte de droite : VM1 à VM5", "text": "L'atelier 1 dit ce que l'on protège, à quel point c'est important, et quelles règles s'appliquent déjà. On commence par les valeurs métier, tirées de la vue métier : cinq à dix processus ou informations suffisent. Chez Kestrel, le groupe de travail en a retenu cinq, que vous voyez à droite : quatre processus et une information, les données des destinataires. Les valeurs métier sont sous la responsabilité des métiers ; les biens supports, sous celle de la DSI ou d'un tiers."}, {"cue": "Toujours la carte de droite : les biens supports", "text": "On relie ensuite chaque valeur métier à ses biens supports, en suivant la matrice processus × applications, puis la vue d'infrastructure. Par exemple, VM1 « Planifier les tournées » repose sur APP-01 RoutePro et sa base SQL Server 2016, sur SRV-01 et SRV-02, les deux serveurs de virtualisation, sur APP-09 Planification des tournées, et sur les planificateurs eux-mêmes : une personne est un bien support. Et la salle SAL-01, le NAS STO-01 et la passerelle SEC-01 servent toutes les valeurs métier. Un bien support partagé est un signal d'alerte : il concentre le risque. Règle du dossier : chaque bien support est un objet de votre cartographie, sous le même nom."}, {"cue": "Bandeau d'introduction et colonne « Événement redouté »", "text": "Viennent ensuite les événements redoutés. Lisez la formulation : « Tournées impossibles à affecter pendant deux à trois jours ». Pas « piratage de RoutePro ». L'événement redouté décrit la conséquence pour le métier, avec le critère atteint ; il ne dit ni qui attaque ni comment. Écrire une attaque à la place d'une conséquence est l'une des erreurs les plus fréquentes du chapitre 6."}, {"cue": "Colonne « Gravité », lignes ER1 et ER2", "text": "La gravité se lit sur l'échelle, avec les métiers, et elle reste attachée à l'événement dans tous les ateliers suivants. Le cours raconte la discussion sur ER1. Le directeur des opérations veut G4 : « sans RoutePro, on ne livre plus ». Romain Chevalier relit l'échelle avec lui. Deux jours d'arrêt dépassent G2 et correspondent exactement au descripteur de G3. G4 suppose un arrêt de plus de trois jours sur tout le réseau : c'est ER2. Le groupe retient G3 pour ER1, G4 pour ER2. Et la discussion fait apparaître un mode dégradé sur Excel, écrit nulle part : il est noté comme mesure existante à formaliser. L'atelier se termine par le socle et ses écarts, ceux que nous avons vus tout à l'heure."}], "words": 382}, {"n": 63, "title": "Atelier 2 : qui attaquerait, pour obtenir quoi, et le croit-on ?", "paras": [{"cue": "Titre", "text": "L'atelier 2 identifie qui pourrait vouloir atteindre les valeurs métier, et dans quel but. On ne parle pas encore de moyens techniques. Une source de risque est une personne, un groupe ou une organisation susceptible d'engendrer un risque : groupe cybercriminel, escroc, concurrent, salarié malveillant, militant, État. L'objectif visé est ce qu'elle cherche : extorquer, revendre, saboter, se venger. On raisonne sur le couple, noté SR/OV, parce qu'une même source peut poursuivre plusieurs objectifs. Les entrées sont les valeurs métier, les incidents passés et la veille sur la menace, par exemple le panorama de la cybermenace de l'ANSSI, que vous avez rencontré en S1."}, {"cue": "Bandeau d'introduction et colonne « M · R · A »", "text": "La démarche a trois temps. On dresse d'abord une liste large, sans censure. On évalue ensuite chaque couple selon des critères explicites : la motivation de la source, ses ressources, c'est-à-dire son argent, ses compétences et ses outils, et son activité, ce que l'on sait de ses attaques récentes contre des organisations comparables. Chez Kestrel, chaque critère est coté de 1 à 3, et la somme donne la pertinence. On retient enfin les couples les plus pertinents, en général trois à cinq."}, {"cue": "Lignes SR1 à SR3 et colonne « Justification »", "text": "Regardez la dernière colonne, c'est elle qui rapporte les points. Chaque couple retenu s'appuie sur un fait ou une source. SR1, le rançongiciel : le panorama de l'ANSSI compte les PME et les ETI parmi les premières victimes, et un arrêt de RoutePro au-delà de 2 heures pousse à payer. SR2, l'escroc : la tentative de septembre 2025 est un fait vécu, la meilleure justification qui soit. SR3 : les données de 2,5 millions de livraisons par an se revendent pour des campagnes de SMS frauduleux « colis en attente »."}, {"cue": "Lignes SR4 à SR6, puis bandeau du bas", "text": "Un couple écarté n'est pas oublié : on écrit pourquoi. C'est la preuve que la question a été posée. Et l'exclusion peut se discuter. Isabelle Roux, la DAF, conteste celle de SR5 : des chauffeurs licenciés auraient gardé leur accès VPN. Romain Chevalier vérifie : c'est exact pour l'un des trois. Le groupe maintient la pertinence faible, mais il ajoute un écart au socle, « comptes non désactivés au départ », qui sera traité à l'atelier 5. L'atelier 2 a enrichi l'atelier 1 : la méthode est itérative. Question pour vous : dans votre entreprise, qui vérifie que les comptes sont fermés au départ d'un salarié ?"}], "words": 384}, {"n": 64, "title": "Prenez la fiche FT 14 : ateliers 1 et 2 sur le e-commerce", "paras": [{"cue": "Titre", "text": "Avant de lancer les ateliers sur Medisecure, une dernière fiche ce matin : la FT 14. Elle vous fait refaire les ateliers 1 et 2 sur Kestrel, mais sur un autre périmètre que celui de l'exemple : l'activité e-commerce, à l'entrepôt de Moirans."}, {"cue": "Consigne", "text": "Hélène Garnier lance une étude complémentaire ; Romain Chevalier anime, et vous préparez les tableaux. Vous identifiez les valeurs métier, vous les reliez à des biens supports nommés comme dans la cartographie, vous formulez les événements redoutés et vous cotez leur gravité. Puis vous évaluez les couples source de risque et objectif visé, et vous justifiez par des faits ceux que vous retenez et ceux que vous écartez. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Vérifiez une chose avant de rendre : aucun événement redouté ne doit nommer l'attaquant ni le moyen. Si c'est le cas, il décrit un scénario, pas une conséquence. Ensuite, vous ferez la même démarche sur Medisecure."}], "words": 153}, {"n": 65, "title": "Premier atelier : les échelles de Medisecure et le socle", "paras": [{"cue": "Titre et consigne", "text": "Place aux ateliers. Le premier est l'exercice du chapitre 5. Vous construisez l'échelle de gravité de Medisecure à quatre niveaux, avec cinq dimensions : santé des patients, activité, finances, conformité, image. Ancrez vos seuils sur des faits du dossier de présentation, dans les sections citées à l'écran. Puis testez l'échelle sur l'incident de Lens : quel niveau obtenez-vous, et ce niveau vous paraît-il juste ? Ensuite viennent l'échelle de vraisemblance, la matrice et le seuil d'acceptation, en précisant qui peut accepter quoi chez Medisecure."}, {"cue": "Dernière ligne de la consigne", "text": "Dans un second temps, vous listez les référentiels du socle à partir de la section « Conformité », et vous relevez cinq écarts. Pour chacun : l'exigence, le constat avec sa section, l'état d'application. Pour NIS2, dites ce qui reste à vérifier."}, {"cue": "Carte « Livrable »", "text": "Vous travaillez seuls : ce sont vos échelles, elles serviront dans tout le dossier et au pitch d'étape. Vous pouvez comparer vos dimensions avec votre voisin au bout d'une heure. Je passe dans les rangs et je vérifie trois choses : que chaque niveau de gravité a un descripteur pour les cinq dimensions, que vos seuils renvoient à un chiffre du dossier de présentation, et que votre test sur Lens est écrit. Je ne vous dirai pas quel niveau vous devez trouver. Si vous terminez vos échelles avant la fin de l'après-midi, passez au socle, puis à l'atelier suivant. Sinon, terminez-les en priorité en intersession : sans elles, aucune gravité de l'atelier 1 ne pourra être justifiée, et la matrice comme le seuil d'acceptation doivent être définis avant d'être utilisés."}], "words": 256}, {"n": 66, "title": "Deuxième atelier : valeurs métier et événements redoutés", "paras": [{"cue": "Titre et deux premières lignes de la consigne", "text": "Deuxième atelier : l'atelier 1 d'EBIOS sur Medisecure. Partez de votre vue métier et des sections « Activités et processus métier » et « Données et échanges ». Choisissez au moins cinq valeurs métier, dont au moins une liée aux soins et une liée à la télésurveillance. Reliez-les à au moins dix biens supports pris dans votre cartographie. Si un bien d'infrastructure n'est pas encore dessiné, créez-le d'abord dans votre outil, avec son nom définitif, puis reprenez ce nom ici."}, {"cue": "Troisième et quatrième lignes de la consigne", "text": "Formulez ensuite au moins six événements redoutés, comme des conséquences pour le métier, jamais comme des attaques. Pour chacun, décrivez les impacts et lisez la gravité sur l'échelle que vous venez de construire, en citant le descripteur qui la justifie. Les deux questions finales sont là pour vous faire réfléchir : un bien support partagé concentre le risque, et un événement qui touche la santé des patients n'a pas le même poids qu'un événement qui touche seulement l'activité."}, {"cue": "Carte « Livrable »", "text": "Vous travaillez seuls. En passant, je vérifie trois choses : que vos biens supports portent exactement le nom de vos objets de cartographie, que vos événements redoutés sont écrits du point de vue du métier, et que chaque gravité cite un descripteur de votre échelle. Si je lis « piratage » dans la colonne des événements redoutés, je vous le signalerai. Un conseil pour l'ordre de travail : écrivez d'abord vos valeurs métier et vos biens supports, montrez-les à votre voisin, puis passez aux événements redoutés. Le regard d'un autre repère vite un bien support qui manque ou un nom qui ne correspond pas à la cartographie. Le tableau des écarts au socle, vous l'avez déjà : il est repris tel quel."}], "words": 280}, {"n": 67, "title": "Troisième atelier : les sources de risque de Medisecure", "paras": [{"cue": "Titre et consigne", "text": "Troisième atelier, le plus court : l'atelier 2. Dressez une liste d'au moins cinq couples source de risque et objectif visé. Pensez aux attaquants qui visent les données de santé, à ceux qui veulent interrompre les soins pour obtenir une rançon, et à ceux qui exploitent les usages non encadrés. Évaluez chaque couple avec la motivation, les ressources et l'activité, selon un barème que vous écrivez avant de coter, en section 3.1."}, {"cue": "Troisième ligne de la consigne", "text": "Retenez-en au moins trois, et justifiez chaque choix par un fait du dossier de présentation, ou par une source publique citée en annexe H, comme le panorama de la cybermenace de l'ANSSI ou l'observatoire du CERT Santé. Justifiez aussi chaque exclusion. La dernière question vous aide à argumenter : réfléchissez à la valeur des données pour celui qui les vole. Et souvenez-vous de l'exemple de Kestrel : un couple écarté peut révéler un écart au socle. Si cela vous arrive, ajoutez cet écart à votre tableau de l'atelier 1 : c'est le caractère itératif de la méthode, et c'est un signe de rigueur."}, {"cue": "Carte « Livrable »", "text": "Si vous n'avez pas le temps de commencer cet atelier aujourd'hui, ce n'est pas grave : il se termine en autonomie. Mais avant de partir, relisez votre échelle : c'est elle que tout le reste utilisera. Demain, nous continuons avec les ateliers 3 à 5."}], "words": 220}, {"n": 68, "title": "Risques data et IA, fin de l'analyse de risques, continuité", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Hier, vous avez posé vos échelles et conduit les deux premiers ateliers d'EBIOS Risk Manager : vous savez ce que vous protégez et qui pourrait attaquer. Aujourd'hui, nous allons au bout de l'analyse de risques, et nous ouvrons un second chantier, la continuité d'activité."}, {"cue": "Sous-titre", "text": "La journée a trois temps. D'abord le volet cybersécurité de la semaine : les vulnérabilités propres aux données et à l'intelligence artificielle, c'est le chapitre 7. Ensuite la fin du chapitre 6, avec les ateliers 3, 4 et 5. Enfin le chapitre 8, l'analyse d'impact sur l'activité. Ces trois blocs préparent les sections 3.4 à 3.6 et la partie 4 du D2. C'est une journée dense, et c'est la dernière journée de méthode sur les risques avant l'intersession. Gardez le cours ouvert : les tableaux Kestrel que je vais montrer y figurent en entier."}], "words": 144}, {"n": 69, "title": "Le matin, la menace et les décisions ; l'après-midi, la reprise", "paras": [{"cue": "Frise des cinq étapes", "text": "Voici le programme. Ce matin, nous commençons par le chapitre 7, les vulnérabilités des infrastructures de données et des systèmes d'IA. Nous le terminons par une étude de document : une fuite de données de santé qui n'a demandé aucune attaque. Puis nous reprenons l'étude Kestrel du chapitre 6 là où nous l'avions laissée hier, avec les ateliers 3, 4 et 5."}, {"cue": "Carte « Matin »", "text": "Le matin reste théorique, comme toute la semaine. Je vous montre la méthode et l'exemple Kestrel ; vous ne travaillez pas encore sur Medisecure. Prenez des notes sur la manière de justifier chaque cote : c'est ce qui fera la différence dans votre dossier. Chaque bloc se termine par une fiche de travail sur Kestrel : la FT 17 après le chapitre 7, les FT 15 et FT 16 après les ateliers 3 à 5."}, {"cue": "Carte « Après-midi », étape orange et bandeau", "text": "L'après-midi, nous voyons le chapitre 8, l'analyse d'impact sur l'activité, puis la fiche FT 18, puis je lance cinq exercices sur Medisecure : les vulnérabilités data et IA, les ateliers 3, 4 et 5, et la grille d'impact. Vous ne les terminerez pas cet après-midi : additionnées, les durées indicatives du cours font environ quatorze heures et demie. L'objectif est de les démarrer tous, de poser vos tableaux, et de repartir avec une liste claire de ce qui reste à faire pendant l'intersession. N'oubliez pas non plus la seconde partie de l'exercice du chapitre 4, la vue physique : commencez au moins à la dessiner aujourd'hui."}, {"cue": "Carte sombre « Dossier D2 »", "text": "Côté dossier, la journée couvre les sections 3.4, 3.5 et 3.6 de la partie analyse de risques, et la partie 4 sur les besoins de continuité. S'y ajoutent les annexes E et F. Le chapitre 7 touche aussi l'annexe A, pour l'usage hors inventaire."}], "words": 287}, {"n": 70, "title": "Les vulnérabilités des infrastructures data et IA", "paras": [{"cue": "Titre", "text": "Ouvrons le chapitre 7. C'est le volet cybersécurité de la semaine, et il ne reprend pas la veille. En S1, vous avez appris à qualifier une alerte : le score de gravité CVSS, le catalogue KEV de la CISA, le score EPSS, l'IA fantôme. Si ces notions vous semblent floues, relisez le chapitre 7 du cours de la S1. Ici, on change de question."}, {"cue": "Sous-titre", "text": "La veille demandait : quelles vulnérabilités sont publiées ? L'analyse de risques demande : où sont les faiblesses de ce SI-là, et comment un attaquant les enchaînerait-il ? À la fin de ce chapitre, vous saurez repérer ces faiblesses dans les données et dans l'IA, les nommer avec les référentiels, les inscrire dans la cartographie et en tirer un scénario opérationnel. C'est exactement ce que votre dossier vous demande de faire."}], "words": 135}, {"n": 71, "title": "Chaque copie d'une donnée est un bien support à part entière", "paras": [{"cue": "Titre", "text": "Partons d'un constat. Le Panorama de la cybermenace 2025 de l'ANSSI relève la progression des incidents avec exfiltration de données. Or une donnée ne vit pas seulement dans l'application qui la crée. Elle existe en plusieurs exemplaires, et elle circule."}, {"cue": "Schéma, de gauche à droite", "text": "Le schéma suit le trajet d'une donnée. Elle naît dans des sources : applications métier, appareils connectés, API d'un partenaire. Une API, c'est une interface d'échange automatique entre logiciels. La donnée est ensuite collectée par un pipeline, un export CSV ou une API, puis stockée dans une base, un stockage objet ou un entrepôt. Elle peut être traitée par un modèle d'IA, restituée dans un tableau de bord, et consultée par des utilisateurs. Chaque éclair rouge marque un point de vulnérabilité. Regardez le dernier : la flèche en pointillés vers un service d'IA grand public. C'est un flux que personne n'a inventorié."}, {"cue": "Carte de droite « Infrastructure de données »", "text": "D'où la définition du cours. L'infrastructure de données regroupe tout ce qui stocke, transporte, transforme ou expose des données en dehors du cœur des applications. Le point important est dans la deuxième phrase : chaque élément est un bien support, et il hérite de la sensibilité des données qu'il porte, même s'il n'est pas considéré comme une application. Une copie d'un fichier patients dans un tableur est aussi sensible que la base d'origine, et généralement bien moins protégée. Une question pour vous : dans votre entreprise d'alternance, combien de copies existe-t-il de votre fichier clients ?"}, {"cue": "Retour au titre", "text": "Gardez cette phrase en tête toute la matinée. La veille regarde ce qui est publié ; l'analyse de risques regarde ce SI-là, avec ses copies, ses exports et ses usages. C'est pour cela que le chapitre parle d'infrastructure de données, et pas seulement d'applications. Un pipeline d'intégration, un dossier partagé où l'on dépose des exports, un tableau de bord alimenté chaque nuit sont autant d'objets à dessiner. S'ils manquent sur votre vue applicative, ils manqueront aussi dans votre analyse de risques."}], "words": 319}, {"n": 72, "title": "Sept familles de faiblesses, rarement publiées avec un CVE", "paras": [{"cue": "Titre", "text": "Sept familles de vulnérabilités reviennent dans presque tous les audits. Le titre résume leur point commun : ce sont rarement des failles publiées avec un numéro CVE. Ce sont des faiblesses de conception, de configuration ou d'organisation. C'est pourquoi la veille seule ne les détecte pas. Et elles se combinent : c'est leur combinaison qui rend un scénario vraisemblable."}, {"cue": "Trois premières lignes", "text": "Premièrement, les droits trop larges. Une application se connecte souvent à sa base avec un compte unique qui peut tout lire, tout modifier, tout supprimer. Si plusieurs applications partagent la base, elles partagent souvent ce compte : compromettre la moins protégée donne accès à toutes les données. Deuxièmement, les données en clair : une base chiffrée sur disque peut voyager en clair sur le réseau, et les sauvegardes et les exports échappent souvent au chiffrement. Troisièmement, l'absence de journalisation. Sans journaux des accès, on ne sait pas ce qui a été copié : on ne peut ni mesurer une fuite, ni informer les personnes, ni répondre à la CNIL. Le principe de moindre privilège, qui veut que chaque compte n'ait que les droits strictement nécessaires, est simple à énoncer et rarement appliqué aux comptes techniques."}, {"cue": "Quatre lignes suivantes", "text": "La dette de dépendances, ce sont des bibliothèques dont les versions ne sont pas figées, ou qui sont hors support et ne seront jamais corrigées. La fuite par export : un CSV déposé sur un partage, envoyé par courriel, ouvert dans un tableur, sans date d'expiration. L'injection, connue depuis plus de vingt ans, figure toujours dans le Top 10 des risques des applications web de l'OWASP. Enfin le stockage mal configuré : un conteneur public, une base ouverte sur Internet. Aucune attaque sophistiquée n'est nécessaire, car des moteurs de recherche spécialisés indexent en permanence les services exposés."}, {"cue": "Colonne « Où la repérer » et bandeau", "text": "Regardez maintenant la dernière colonne, c'est elle qui compte pour vous. Chaque faiblesse se lit dans une pièce de votre cartographie : la vue de l'administration, la matrice des flux, l'inventaire applicatif, la vue des infrastructures logiques. Si votre annexe B note la protection de chaque flux, même quand elle vaut « aucune », les fuites par export apparaissent d'elles-mêmes. Les avis du CERT-FR restent utiles pour les composants, comme un moteur de base de données ; le reste se découvre en lisant la cartographie. Chez Kestrel, vous allez voir dans un instant trois de ces familles se combiner sur une seule application : des lectures non journalisées, un export sans limite et un compte applicatif aux droits trop larges."}], "words": 411}, {"n": 73, "title": "Chaque partie d'un système d'IA peut être attaquée", "paras": [{"cue": "Titre", "text": "Passons à l'IA. Un système d'IA n'est pas seulement un modèle. Le règlement européen sur l'intelligence artificielle le définit, à son article 3, comme un système automatisé qui déduit de ses entrées la manière de générer des prédictions, du contenu, des recommandations ou des décisions. Pour l'analyse de risques, retenez qu'il comprend ses données, son modèle, son infrastructure et les outils par lesquels on l'utilise. Chacun est un bien support."}, {"cue": "Quatre premières lignes du tableau", "text": "L'empoisonnement vise l'entraînement : des données fausses ou orientées modifient le comportement du modèle. Un modèle de tri d'alertes entraîné sur un historique où des alertes graves ont été classées sans suite apprendrait à les ignorer. Et des données de mauvaise qualité produisent le même effet, sans attaquant. L'évasion vise le modèle en production, avec une entrée légèrement modifiée. L'extraction reconstitue un modèle en l'interrogeant massivement par son API ; l'inversion et l'inférence d'appartenance retrouvent des informations sur les données d'entraînement. L'injection de prompt, enfin, est l'attaque emblématique de l'IA générative : un grand modèle de langage, un LLM, ne distingue pas de façon fiable les instructions de son concepteur et le contenu qu'il traite. Une instruction cachée dans un courriel ou un document peut le détourner."}, {"cue": "Trois dernières lignes", "text": "La fuite de données d'entraînement : un modèle peut restituer mot pour mot des fragments de ce sur quoi il a été entraîné ou ajusté. La chaîne d'approvisionnement : certains formats de fichiers de modèles exécutent du code au chargement, et des chercheurs signalent des modèles piégés sur des plateformes publiques depuis 2024. L'IA fantôme, vue en S1, reste la vulnérabilité IA la plus fréquente dans les organisations qui n'ont aucun projet d'IA."}, {"cue": "Carte sombre des référentiels", "text": "Pour nommer ces attaques, quatre référentiels. Le Top 10 de l'OWASP pour les applications LLM, édition 2026, publiée début août 2026 : l'injection de prompt reste au premier rang, et la capacité d'agir excessive monte au troisième. Ce classement vient de sources secondaires concordantes : vérifiez-le sur le site du projet avant de citer un numéro. MITRE ATLAS range les attaques en tactiques et en techniques, et vous servira à l'atelier 4. L'ANSSI a publié le 29 avril 2024 ses recommandations pour un système d'IA générative. L'ENISA rappelle que la sécurité de l'IA s'ajoute à l'hygiène classique, elle ne la remplace pas."}], "words": 372}, {"n": 74, "title": "SO4 : le portail B2B offre le chemin le plus faible, coté V3", "paras": [{"cue": "Titre", "text": "Voyons comment Romain Chevalier, responsable de l'infrastructure de Kestrel et RSSI à temps partiel, c'est-à-dire responsable de la sécurité des systèmes d'information, applique tout cela. Il part de la donnée la plus sensible en volume : nom, adresse et téléphone des destinataires, environ 2,5 millions de livraisons par an, dans la base PostgreSQL d'APP-03 Kestrel Track. Il relève des faits de la fiche, comme Django 3.2, hors support depuis avril 2024, et trois constats d'entretien qu'il écrit comme hypothèses : H12, comptes du portail B2B protégés par un simple mot de passe ; H13, export CSV sans limite de volume ni journal ; H15, un planificateur qui a collé un extrait du fichier des tournées dans un assistant d'IA gratuit. Il ajoute une hypothèse sur la base elle-même, H18 : aucune journalisation des lectures. Puis il les inscrit dans la cartographie : l'export devient un flux manuel, l'assistant d'IA un usage hors inventaire."}, {"cue": "Graphe, colonnes Connaître et Rentrer", "text": "Le scénario part de SS4, issu du couple SR3 : un cybercriminel veut revendre des données de destinataires, par exemple à ceux qui mènent des campagnes de SMS frauduleux du type « votre colis est en attente ». Pour connaître, il repère le portail public et sa version, et recense les contacts logistiques des e-commerçants. Pour rentrer, deux chemins : la faille de Django, ou l'hameçonnage d'un compte client du portail B2B."}, {"cue": "Colonnes Trouver et Exploiter, étiquettes Pr", "text": "Pour trouver, le compte client donne l'export CSV ; l'accès au serveur donne la base, lue par un compte aux droits complets, hypothèse H14. Pour exploiter, il extrait par petits lots, et rien ne le signale. Regardez les étiquettes de probabilité : par le portail, l'indice cumulé vaut 3 ; par Django, 2. L'attaquant prend le meilleur chemin, et ce chemin ne demande aucune compétence particulière. Romain retient donc V3, très vraisemblable, la cote de SO4."}, {"cue": "Carte de droite", "text": "Et il écrit la phrase la plus importante : si H12 et H13 se révélaient fausses, la cote tomberait à V2. Une cote qui repose sur une hypothèse doit le dire. Les ciseaux sur le graphe montrent où une seule mesure coupe le chemin : l'authentification multifacteur du portail, puis la limitation et la journalisation des exports, les deux volets de M13. Vous voyez l'atelier 5 se préparer."}, {"cue": "Retour au titre", "text": "Un mot enfin sur l'IA. Le même raisonnement s'applique à l'IA fantôme, qui est d'abord une vulnérabilité. Un attaquant repère sur les réseaux professionnels des salariés qui disent utiliser un assistant grand public, compromet le compte personnel de l'un d'eux grâce à un mot de passe réutilisé, parcourt l'historique des conversations et en extrait les données. La vraisemblance se justifie alors par un fait mesuré, comme un volume de connexions vers ces services relevé par le pare-feu. Un usage simplement négligent, sans attaquant, relève plutôt du socle de sécurité et de la cartographie."}], "words": 462}, {"n": 75, "title": "Une fuite sans attaque : la copie de migration oubliée", "paras": [{"cue": "Document de gauche", "text": "Je vous propose l'étude de document qui clôt le chapitre 7. C'est un cas réel, résumé à partir de la communication de la CNIL et du Comité européen de la protection des données, et de la presse spécialisée. L'écran n'en montre qu'un résumé : prenez cinq minutes pour lire le document complet dans le cours, puis les quatre questions."}, {"cue": "Questions 1 et 2", "text": "Nous faisons ensuite un tour de table rapide, deux ou trois voix par question. Pour la première, j'attends au moins trois familles du chapitre, chacune avec son fait : la fuite par export, avec une extraction plus large que nécessaire et jamais supprimée ; les données en clair, puisque les données du serveur n'étaient pas chiffrées ; et le stockage mal configuré, celui du serveur oublié après une migration que décrit le chapitre. Pour la deuxième, l'idée à faire émerger est simple : une copie technique préparée pour un projet légitime n'a ni les droits, ni le chiffrement, ni la durée de conservation de la base d'origine. Une matrice des flux qui note les flux manuels et leur protection l'aurait rendue visible. Certains citeront aussi l'absence de procédure encadrant les migrations : c'est une faiblesse d'organisation, et le chapitre rappelle que ces faiblesses-là n'apparaissent dans aucun avis de sécurité."}, {"cue": "Questions 3 et 4", "text": "La troisième question porte sur la responsabilité. La CNIL a sanctionné l'éditeur comme sous-traitant, 1,5 million d'euros, et relevé que ses contrats ne comportaient pas les clauses que le RGPD impose. Confier une migration ou un hébergement à un tiers ne fait pas disparaître le risque : il le déplace dans l'écosystème, ce qui nous mène tout droit à l'atelier 3. La dernière question est pour vous : quelles copies de production existent dans votre entreprise pour des tests ou des analyses, et qui sait quand elles seront détruites ? Notez vos réponses : elles vous serviront dans l'exercice de cet après-midi. Je ne donne pas de corrigé : le but est que vous sachiez reconnaître ces familles dans un texte qui ne les nomme pas."}], "words": 334}, {"n": 76, "title": "Prenez la fiche FT 17 : données de conduite et usages d'IA", "paras": [{"cue": "Titre", "text": "Le chapitre 7 se termine. Sortez la fiche FT 17 : elle applique les sept familles de faiblesses à une partie du SI de Kestrel que le cours n'a pas étudiée."}, {"cue": "Consigne", "text": "Romain Chevalier a déjà étudié les données des destinataires dans Kestrel Track. Il vous confie les temps de conduite et les positions des chauffeurs, qui passent par TeleFleet, Microsoft 365 et la paie, ainsi que les connexions vers des assistants d'IA grand public depuis le siège. Vous relevez les vulnérabilités, vous chiffrez, et vous ébauchez un scénario opérationnel. Soixante minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Posez-vous à chaque étape la même question : où cette donnée est-elle copiée, et qui peut y accéder ? Chaque copie est un bien support. C'est le réflexe que vous appliquerez ensuite à Medisecure."}], "words": 129}, {"n": 77, "title": "EBIOS Risk Manager : ateliers 3, 4 et 5", "paras": [{"cue": "Titre", "text": "Revenons au chapitre 6. Hier, l'étude Kestrel s'est arrêtée à la fin de l'atelier 2 : six événements redoutés, de ER1 à ER6, et trois couples source de risque et objectif visé retenus, SR1, SR2 et SR3."}, {"cue": "Sous-titre", "text": "Les trois ateliers qui restent répondent à trois questions. Par quels chemins, y compris par l'écosystème ? C'est l'atelier 3. Comment, concrètement, et avec quelle facilité ? C'est l'atelier 4. Et que décide-t-on ? C'est l'atelier 5. Vous allez voir les résultats d'un atelier devenir les entrées du suivant : c'est ce fil qui fait la solidité de votre partie 3."}], "words": 98}, {"n": 78, "title": "Seul l'éditeur de RoutePro est en zone de danger", "paras": [{"cue": "Titre", "text": "L'atelier 3 prend en compte l'écosystème. Les attaquants passent de plus en plus par un prestataire, un éditeur ou un partenaire moins protégé que la cible. On évalue donc chaque partie prenante avec quatre critères. La dépendance et la pénétration dans le SI augmentent la menace : ce sont les critères d'exposition. La maturité cyber et la confiance l'atténuent : ce sont les critères de fiabilité."}, {"cue": "Carte sombre, formule et seuils", "text": "La fiche méthode de l'ANSSI propose une formule générique : dépendance fois pénétration, divisé par maturité fois confiance, chaque critère coté de 1 à 4. Kestrel a fixé ses seuils : zone de danger au-dessus de 3, contrôle de 1 à 3, veille de 0,5 à moins de 1, hors périmètre en dessous. Il a aussi écrit une règle pour traduire en chiffres la dépendance notée sur la vue de l'écosystème : forte vaut 4 ; moyenne vaut 3 si un arrêt du partenaire interrompt dans la journée une activité de réalisation, 2 sinon ; faible vaut 1. Le tableau n'en montre que sept sur les dix parties prenantes évaluées ; la liste complète est dans le cours."}, {"cue": "Tableau, première ligne", "text": "Regardez la première ligne. PP-05, l'éditeur de RoutePro : dépendance 4, pénétration 4 avec son accès VPN permanent, maturité 2, confiance 2. Seize divisé par quatre, niveau 4 : zone de danger, la seule. Le groupe ne peut pas s'en séparer, puisque RoutePro porte la planification des tournées. Il agit donc sur les critères : un accès ouvert à la demande, nominatif, avec authentification multifacteur, et un avenant au contrat. La pénétration passe à 2, la confiance à 3, et la menace tombe à environ 1,3 : zone de contrôle."}, {"cue": "Bas du tableau, puis bas de la carte", "text": "En bas, le fabricant des boîtiers, à 0,22, est hors périmètre. Les parties prenantes en zones de danger et de contrôle sont dites critiques : elles doivent entrer dans les scénarios stratégiques. Kestrel en construit quatre : SS1, rançongiciel par l'éditeur de RoutePro ; SS2, rançongiciel par la passerelle VPN ; SS3, fraude au faux fournisseur ; SS4, vol des données des destinataires. Chaque scénario reprend la gravité de son événement redouté le plus grave : G4 pour les deux rançongiciels, G3 pour les deux autres. On ne cote pas encore la vraisemblance : c'est le rôle de l'atelier 4. Les trois autres parties prenantes critiques ont aussi été examinées : PP-19 est rattachée à SS1 comme chemin secondaire, PP-14 mène à ER6, de gravité G2, traité par une mesure sur l'écosystème, et PP-08 est retenue comme variante de SS4."}], "words": 414}, {"n": 79, "title": "SO1 : sept actions, un maillon faible, une vraisemblance V3", "paras": [{"cue": "Titre", "text": "L'atelier 4 descend au niveau du mode opératoire. Un scénario opérationnel est une suite d'actions élémentaires sur des biens supports, organisée en quatre phases : connaître, rentrer, trouver, exploiter. Voici SO1, le détail de SS1, le rançongiciel par l'éditeur de RoutePro."}, {"cue": "Graphe, de gauche à droite", "text": "L'attaquant repère en sources ouvertes que l'éditeur de RoutePro compte Kestrel parmi ses clients, hypothèse H8. Il hameçonne un technicien de l'éditeur et vole ses identifiants VPN ; l'achat d'identifiants sur un forum criminel est un mode alternatif, en gris, moins probable. Il se connecte par l'accès permanent de l'éditeur. Il explore un réseau du siège supposé plat, hypothèse H3, obtient un compte d'administration, localise le NAS de sauvegarde, supprime les sauvegardes, puis chiffre les 12 machines virtuelles un dimanche à 3 h. Chaque boîte nomme un bien support de la cartographie : PP-05, SEC-01, SRV-01 et SRV-02, STO-01. La dernière boîte mène à l'hexagone rouge : ER2, livraisons arrêtées sur tout le réseau plus de 3 jours, gravité G4."}, {"cue": "Carte de droite, méthode standard", "text": "Comment coter ? La méthode standard cote la probabilité de succès de chaque action de 1 à 4, puis combine. À chaque étape, l'indice cumulé est le plus petit entre l'action elle-même et le meilleur indice des étapes qui y mènent. Une chaîne vaut son maillon le plus faible, et l'attaquant choisit le meilleur chemin. Ici, le maillon faible est l'hameçonnage, coté 3 parce qu'il vise une personne précise : SO1 vaut V3, très vraisemblable. Sept actions, c'est moins que la dizaine au-delà de laquelle la fiche conseille de baisser d'un niveau."}, {"cue": "Bas de la carte", "text": "Quatre cotes reposent sur des hypothèses, H3, H8, H9 et H16 : leur vérification est inscrite au plan d'action. Une hypothèse fausse changerait la vraisemblance, c'est pourquoi on l'écrit. Les trois autres scénarios sont cotés avec la méthode expresse : SO2 par la passerelle VPN, V2 ; SO3, le faux fournisseur, V3 ; SO4, que vous avez vu ce matin, V3. Pour votre dossier, l'une ou l'autre méthode suffit, pourvu que la cote soit justifiée par des vulnérabilités sourcées. Et méfiez-vous d'une cote sans fait : écrire « l'attaquant exploite une faille » ne prouve rien ; écrire « l'accès est permanent, sans authentification multifacteur, hypothèse H9 » rend l'étape crédible."}], "words": 364}, {"n": 80, "title": "Prenez la fiche FT 15 : écosystème et scénario de fraude", "paras": [{"cue": "Titre", "text": "Nous avons vu les ateliers 3 et 4 sur l'exemple Kestrel. Sortez maintenant la fiche FT 15 : elle prolonge l'étude e-commerce que vous avez commencée avec la FT 14."}, {"cue": "Consigne", "text": "L'atelier 2 a retenu un escroc qui veut détourner les paiements des e-commerçants par un faux changement de RIB. Vous évaluez d'abord les parties prenantes avec les quatre critères, et vous placez chacune dans sa zone. Puis vous construisez le scénario stratégique, et vous cotez le scénario opérationnel en combinant les probabilités de succès étape par étape. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Retenez le principe : l'attaquant prend le chemin le plus facile, et c'est ce chemin qui fixe la vraisemblance. Nous comparerons vos calculs avant de passer à l'atelier 5."}], "words": 122}, {"n": 81, "title": "14 mesures, quatre résiduels, R4 accepté temporairement", "paras": [{"cue": "Titre", "text": "L'atelier 5 est celui de la décision. Chaque scénario devient un risque : sa gravité vient du scénario stratégique, sa vraisemblance du scénario opérationnel. Placés sur la matrice du chapitre 5, R1 et R2 sont critiques, R3 et R4 élevés. Aucun n'est sous le seuil d'acceptation : tous doivent être traités. La stratégie de traitement attribue ensuite à chacun une option : réduire, transférer, éviter ou accepter. Pour R1 et R2, Kestrel réduit, et met un transfert à l'étude avec l'assurance cyber."}, {"cue": "Carte de droite, quatre types", "text": "Kestrel propose quatorze mesures, de M1 à M14, classées en quatre types. Les mesures de gouvernance organisent : l'avenant au contrat de l'éditeur, le contre-appel avant tout changement de coordonnées bancaires, la sensibilisation, l'étude d'une assurance cyber, qui est un transfert. Les mesures de protection empêchent ou compliquent l'attaque : l'authentification multifacteur, la règle de correction en 48 heures, la migration de Django. La défense détecte : M6 centralise les journaux de la passerelle VPN et de l'annuaire. La résilience limite les conséquences : M4, une copie de sauvegarde isolée hors du site, restaurée chaque trimestre, et M11, le mode dégradé écrit. Chaque mesure a une fonction responsable ; le chiffrage relève du D3."}, {"cue": "Colonne « Résiduel »", "text": "Une mesure de protection ou de défense fait baisser la vraisemblance ; une mesure de résilience fait souvent baisser la gravité. C'est ce que montre R1 : de G4 V3 à G3 V1. La vraisemblance tombe grâce aux mesures de protection, M1 à M3 ; la gravité baisse parce que la sauvegarde isolée et le mode dégradé, M4 et M11, ramènent l'arrêt prévisible sous trois jours."}, {"cue": "Dernière ligne, R4, et bandeau", "text": "Regardez R4. M13 coupe le chemin par le portail B2B, mais le chemin par Django reste ouvert pendant les neuf mois de migration : le risque reste élevé, G3 V2. Le groupe demande donc une acceptation temporaire au comité de direction, avec une mesure compensatoire, M10, le filtrage applicatif, une échéance et un indicateur mensuel. Paul Vidal signe. Le procès-verbal indique le risque, son niveau, le motif, la mesure compensatoire et la date de réexamen. C'est cette trace écrite qui distingue un risque accepté d'un risque ignoré. L'atelier se termine par un cadre de suivi : quatre indicateurs examinés chaque trimestre par le comité de direction. Ces indicateurs sont la part des comptes protégés par authentification multifacteur, le délai de correction des équipements exposés, la date et la durée du dernier test de restauration, et le nombre d'accès de prestataires ouverts. Sans cadre de suivi, l'analyse devient un rapport rangé dans un tiroir."}], "words": 415}, {"n": 82, "title": "Prenez la fiche FT 16 : décider et mesurer le résiduel", "paras": [{"cue": "Titre", "text": "Dernière fiche sur EBIOS Risk Manager : la FT 16, l'atelier 5. Elle clôt l'étude e-commerce de Kestrel que vous suivez depuis la FT 14."}, {"cue": "Consigne", "text": "Isabelle Roux, Sébastien Morin, Hélène Garnier et Romain Chevalier se réunissent pour décider. Vous placez les quatre risques sur la matrice, vous classez les mesures dans leurs quatre types, vous estimez le risque résiduel et vous dites qui l'accepte. Enfin, vous construisez un cadre de suivi et vous lisez un indicateur avec prudence. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Le message de la fiche est le même que celui de la diapositive précédente : un risque accepté sans trace écrite est un risque ignoré. Nous en discuterons à la mise en commun."}], "words": 117}, {"n": 83, "title": "Analyse d'impact sur l'activité et besoins de continuité", "paras": [{"cue": "Titre", "text": "Nous voici à l'après-midi, avec le chapitre 8. Il pose une question plus simple en apparence : si une application s'arrête, combien de temps l'organisation peut-elle tenir, et combien de données peut-elle perdre ?"}, {"cue": "Sous-titre", "text": "La cause de l'arrêt importe peu ici. Une panne de disque, un incendie, un rançongiciel ou l'erreur d'un prestataire produisent le même effet pour un chauffeur ou un agent d'accueil : l'outil ne répond plus. Ce chapitre prépare la partie 4 du dossier et l'annexe F. Et il s'arrête au constat : le plan de reprise lui-même, ses solutions, ses coûts et ses tests relèvent du D3."}], "words": 101}, {"n": 84, "title": "La PDMA regarde en arrière, la DMIA et la MTPD en avant", "paras": [{"cue": "Bandeau du bas", "text": "Trois sigles d'abord. Le PCA, plan de continuité d'activité, vise à ne pas s'arrêter, ou à fonctionner autrement pendant l'arrêt ; il dépasse l'informatique et touche les locaux, les personnes, les fournisseurs. Le PRA, plan de reprise d'activité, organise le redémarrage du SI après un sinistre. Entre les deux, le mode dégradé : des formulaires papier, une liste imprimée la veille. La norme de référence est l'ISO 22301, édition de 2019, amendée en 2024. Et toute démarche commence par le BIA, le bilan d'impact sur l'activité, qui part des métiers et mesure ce que coûte un arrêt, quelle qu'en soit la cause."}, {"cue": "Schéma, à gauche de l'éclair", "text": "Regardez l'axe du temps. Au centre, le sinistre. À gauche, la dernière sauvegarde utilisable. Tout ce qui a été saisi entre les deux est perdu : cette durée doit rester inférieure à la PDMA, la perte de données maximale admissible, en anglais RPO, recovery point objective. Une PDMA de 1 heure signifie qu'il faut pouvoir restaurer les données dans leur état d'au plus 1 heure avant le sinistre."}, {"cue": "Schéma, à droite de l'éclair", "text": "À droite, on regarde en avant. La DMIA, durée maximale d'interruption admissible, ou RTO, recovery time objective, est l'objectif de reprise. Plus loin, la MTPD, durée maximale tolérable de perturbation, est le seuil au-delà duquel les impacts menacent la survie, les contrats essentiels ou la sécurité des personnes. La DMIA est choisie en deçà, pour garder une marg
