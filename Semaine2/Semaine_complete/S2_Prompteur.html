e. Chez Kestrel, la direction des opérations demande 2 heures pour RoutePro : les camions partent à 5 h."}, {"cue": "Carte de droite, puis courbe du bas", "text": "Attention à un piège de vocabulaire : certains documents français appellent « DMIA » ce qui est en réalité la MTPD. Dans le cours et dans le D2, la DMIA est l'objectif de reprise, comme le RTO. Et la courbe du bas rappelle que l'impact monte par paliers : une heure d'arrêt de RoutePro l'après-midi peut passer inaperçue ; la même heure à 4 h du matin, quand les camions partent à 5 h, désorganise toute la journée. Vous n'avez pas à mettre en place un système de management de la continuité selon l'ISO 22301 ; vous devez parler sa langue avec exactitude."}], "words": 349}, {"n": 85, "title": "RoutePro : 7 heures d'écart, même dans le meilleur scénario", "paras": [{"cue": "Titre et première ligne", "text": "Voici l'extrait de la grille d'impact de Kestrel : six applications sur les huit pour lesquelles les directions ont exprimé un besoin. Les besoins viennent des directions ; les capacités sont estimées à partir des faits, avec trois hypothèses du registre : H1, sauvegarde chaque nuit sur le NAS ; H2, cinq jours pour tout reconstruire après la perte de la salle serveur ; H19, environ 24 heures pour restaurer l'ERP finance, estimation jamais testée. Première ligne, RoutePro : besoin de 2 heures. La panne de disque de novembre 2024 a duré 9 heures : l'écart est de 7 heures dans le scénario le plus favorable, celui qui a déjà été vécu. En cas de perte de la salle, il monte à 118 heures. Rapporté à la marge, les 38 k€ de pénalités de cette seule panne représentent près de 3 % de la marge opérationnelle annuelle."}, {"cue": "Lignes « Non estimable »", "text": "Pour quatre applications sur six, l'écart n'est pas estimable : engagement du prestataire non documenté, sauvegardes de Kestrel Track à documenter. Ce n'est pas un échec de l'analyse. Écrire « non estimable » et dire quelle information manque, c'est la bonne pratique, et ce manque devient un constat du diagnostic. Méfiez-vous aussi des taux de disponibilité : 99,8 % sur une année autorisent environ 17,5 heures d'arrêt cumulé, qui peuvent tomber en une seule fois. Autre piège voisin : un taux de sauvegardes réussies ne dit rien de la capacité à restaurer. Seul un test de restauration le prouve."}, {"cue": "Colonne « Classe » et bandeau", "text": "La classe suit une règle écrite avant d'être appliquée : classe 1 jusqu'à 4 heures de DMIA, classe 2 jusqu'à 24 heures, classe 3 jusqu'à 72 heures, classe 4 au-delà. Deux compléments : une application qui porte une activité pouvant mettre des personnes en danger est au moins en classe 2, et une application hérite de la classe de celles qui dépendent d'elle. Kestrel Track reçoit ainsi au moins la classe de KDriver, qui en dépend entièrement. C'est la cartographie qui révèle ces dépendances."}, {"cue": "Retour au titre", "text": "Dernier point : discuter les demandes des métiers. La direction des opérations acceptait 8 heures d'arrêt pour KDriver et Kestrel Track. On lui montre le schéma des dépendances, et on lui rappelle que les camions partent à 5 h. Elle ramène son besoin à 2 heures entre 4 h et 7 h. Une incohérence, une dépendance cachée, un coût probable : ce sont les trois motifs de discussion, et il en faut deux dans votre partie 4."}], "words": 407}, {"n": 86, "title": "Prenez la fiche FT 18 : compléter la grille d'impact", "paras": [{"cue": "Titre", "text": "Avant de lancer la grille d'impact de Medisecure, sortez la fiche FT 18. Elle reprend la grille de Kestrel là où le cours l'a laissée : sur les lignes que la DSI n'avait pas pu estimer."}, {"cue": "Consigne", "text": "Hélène Garnier a obtenu trois contrats et interrogé le DRH, le directeur des opérations et le responsable de l'agence de Clermont-Ferrand. Vous relevez et convertissez les besoins de continuité, vous calculez un taux de disponibilité et un arrêt autorisé, vous estimez la capacité de reprise, puis vous chiffrez les écarts en heures. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Attention au sens du calcul : l'écart, c'est la capacité moins le besoin. Un écart négatif signifie que le besoin est tenu. Nous vérifierons ensemble deux lignes avant que vous passiez à Medisecure."}], "words": 127}, {"n": 87, "title": "Vulnérabilités data et IA, puis un scénario opérationnel", "paras": [{"cue": "Cadre de gauche, consigne", "text": "Je lance maintenant les exercices. Le premier est celui du chapitre 7. Durée indicative dans le cours : 2 h 30. Vous travaillez seuls, mais vous pouvez comparer votre liste de vulnérabilités avec votre voisin au bout de quarante minutes. Commencez par le tableau : un bien support, une famille du chapitre, un critère atteint, un fait avec sa section entre parenthèses. Les cinq points de la consigne sont un minimum à examiner, pas une liste de réponses. Demandez-vous aussi ce que le projet de tri des alertes de télésurveillance changerait à ces vulnérabilités."}, {"cue": "Dernière phrase de la consigne", "text": "Pour le scénario, choisissez le chemin le plus faible, pas le plus spectaculaire. Rappelez-vous l'encadré « Attention » du chapitre : un scénario d'empoisonnement sur un projet d'IA qui n'existe pas encore n'est pas un scénario sourcé. Un projet futur peut être cité comme facteur aggravant ; il ne remplace pas un scénario sur le SI tel qu'il est."}, {"cue": "Carte « Livrable »", "text": "En passant dans les rangs, je vérifie deux choses : que chaque étape nomme un objet de votre cartographie sous son nom exact, et que votre justification cite chaque fait avec sa section du dossier de présentation. Ce scénario, sur les données ou l'IA, est celui que demande votre dossier. Si votre scénario porte sur l'IA, demandez-vous quel fait mesuré, et non quelle impression, justifie sa vraisemblance."}], "words": 220}, {"n": 88, "title": "Atelier 3 : évaluer l'écosystème et construire les scénarios", "paras": [{"cue": "Consigne", "text": "Deuxième exercice, l'atelier 3 sur Medisecure. Durée indicative : trois heures. Partez de votre vue de l'écosystème et de la section « Principaux contrats ». Parcourez toute la vue : les prestataires qui ont un accès à votre SI, ou dont dépend un processus vital, sont les premiers candidats. Écrivez votre barème avant de coter, comme Kestrel a écrit sa règle pour la dépendance. Attention à une erreur fréquente du tableau du chapitre 6 : un écosystème réduit aux seuls prestataires informatiques fait oublier des chemins d'attaque."}, {"cue": "Dernière phrase de la consigne", "text": "Relisez la section « L'incident de mars 2025 » avec une seule question : quel rôle l'écosystème y a-t-il joué ? Ne détaillez pas encore les étapes techniques, elles relèvent de l'atelier 4. Ici, on reste à grandes mailles."}, {"cue": "Carte « Livrable »", "text": "Le livrable compte quatre pièces, dont la cartographie de la menace en radar. Je vérifie en passant que vos seuils sont écrits, qu'au moins un scénario passe par une partie prenante, et que chaque scénario reprend la gravité de son événement redouté de l'atelier 1, sans la recalculer."}], "words": 174}, {"n": 89, "title": "Atelier 4 : trois scénarios, dont l'incident de mars 2025", "paras": [{"cue": "Consigne", "text": "Troisième exercice, l'atelier 4. C'est le plus long : trois heures et demie. Trois scénarios au moins. Le premier rejoue l'incident de mars 2025 : quelle était la porte d'entrée, qu'a trouvé l'attaquant, qu'a-t-il exploité ? Puis la question qui compte : cela pourrait-il se reproduire aujourd'hui dans un autre centre ? Appuyez-vous sur les sections « État des lieux » et « Infrastructure, réseau et postes de travail »."}, {"cue": "Dernière phrase de la consigne", "text": "Le dossier de présentation ne documente pas tout, par exemple la reconnaissance menée par l'attaquant. Une telle étape repose sur une hypothèse numérotée, inscrite en annexe H, et votre justification de la vraisemblance le signale. Le deuxième scénario, sur les données ou l'IA, est celui de l'exercice du chapitre 7 : réservez-lui sa place."}, {"cue": "Carte « Livrable »", "text": "Travail individuel. Je passe vérifier que chaque boîte de vos graphes nomme un bien support, et que vos cotes sont combinées selon une règle que vous savez expliquer, méthode expresse ou méthode standard. Pour le premier scénario, je regarde aussi si vous répondez vraiment à la question de la reproduction aujourd'hui, avec des faits, et pas seulement par oui ou par non."}], "words": 186}, {"n": 90, "title": "Atelier 5 : décider, mesurer le résiduel, accepter par écrit", "paras": [{"cue": "Consigne", "text": "Quatrième exercice, l'atelier 5, trois heures. Placez vos risques initiaux sur la matrice définie en section 3.1, puis donnez une option à chacun : réduire, transférer, éviter ou accepter. Ensuite, au moins dix mesures, chacune typée en gouvernance, protection, défense ou résilience, et rattachée à une fonction responsable chez Medisecure. Cherchez ces fonctions dans les sections « Organisation », « La DSI » et « Projets envisagés et contraintes ». Gardez l'ordre : la matrice et le seuil d'acceptation sont ceux que vous avez définis en section 3.1, avant l'analyse ; on ne les modifie pas pour que les résultats paraissent meilleurs."}, {"cue": "Phrase « Ne chiffrez pas »", "text": "Une mesure n'est pas un projet. « Passer au cloud » est un projet, il relève du D3 ; une authentification multifacteur sur un accès précis est une mesure. Ne chiffrez pas, ne choisissez pas d'architecture."}, {"cue": "Carte « Livrable »", "text": "Deux matrices, avant et après, et au moins une acceptation explicite : le risque, son motif, l'instance qui l'accepte, la date de réexamen. Pour le cadre de suivi, regardez la section « Indicateurs du service informatique ». Je vérifie que vos risques résiduels changent pour une raison : protection ou défense sur la vraisemblance, résilience sur la gravité."}], "words": 196}, {"n": 91, "title": "La grille d'impact : onze lignes, des écarts chiffrés en heures", "paras": [{"cue": "Consigne", "text": "Dernier exercice, la grille d'impact, deux heures et demie. Partez du tableau « Continuité d'activité : ce que demandent les métiers ». Écrivez d'abord votre règle de classement, avant de regarder les lignes, et tenez compte de la nature de l'activité : chez Medisecure, l'arrêt de certains outils peut toucher la sécurité des patients. Le travail ressemble à celui de Kestrel que vous venez de voir, mais ne recopiez pas sa règle : vos classes doivent refléter une activité de soins, pas une activité de livraison."}, {"cue": "Liste des sections", "text": "Pour chacune des 11 lignes, cherchez les faits de capacité dans les sections indiquées. Posez-vous les questions du cours : que vous apprend la durée de restauration constatée en mars 2025, et pour quel périmètre vaut-elle ? Que deviennent les sauvegardes si la salle serveur du siège est détruite, ou chiffrée ? Que vaut un engagement de disponibilité d'éditeur ? Et écrivez une fois pour toutes la correspondance entre les noms du tableau des métiers et ceux du parc applicatif."}, {"cue": "Carte « Livrable »", "text": "Je vérifie que chaque écart est en heures, qu'une valeur sans objet reste sans objet, et que « non estimable » est toujours suivi de l'information qui manque. Avant de partir, faites le point : pour chacun des cinq exercices, ce qui est commencé et ce qui reste pour l'intersession. Demain, nous passons à l'environnement du SI et au diagnostic critique."}], "words": 227}, {"n": 92, "title": "Juger l'état du SI, puis poursuivre le D2 en autonomie", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Nous voici au dernier jour de la semaine S2, le dernier jour encadré avant l'intersession. Depuis le début de la semaine, vous avez décrit le SI de Medisecure, vous en avez analysé les risques et vous avez confronté ses besoins de continuité à la réalité. Aujourd'hui, nous passons de la description au jugement."}, {"cue": "Sous-titre : les cinq temps de la journée", "text": "La journée a quatre temps. L'environnement du SI d'abord, c'est le chapitre 9. Le diagnostic critique ensuite, c'est le chapitre 10. Puis le QCM de l'UE2, l'unité d'enseignement numéro deux, celle de cette semaine. L'après-midi, les ateliers et vos pitchs d'étape."}, {"cue": "Décor de droite", "text": "Ce soir, vous repartez seuls avec votre dossier D2. Mon objectif est simple : que vous partiez avec une méthode pour juger un SI, des ateliers lancés et un retour personnel sur l'état de votre cartographie. Gardez le cours ouvert à côté de vous. Les chapitres 9 et 10 contiennent tous les tableaux que je vais vous montrer, et bien d'autres."}], "words": 161}, {"n": 93, "title": "Une journée pour juger le SI et lancer le diagnostic", "paras": [{"cue": "Titre", "text": "Voici le programme. Comme chaque jour, la théorie occupe le matin et les ateliers sur Medisecure l'après-midi. Mais la journée est plus dense que les autres, parce qu'elle contient deux temps d'organisation : le QCM et le pitch."}, {"cue": "Les deux lignes « Matin »", "text": "Ce matin, deux chapitres. Le chapitre 9 analyse l'environnement externe du SI : il prépare la section 5.1 du dossier. Le chapitre 10 construit le diagnostic interne, la hiérarchie des faiblesses, le SWOT et les enjeux. Il prépare les sections 5.2 à 5.4, la synthèse d'une page et la partie 6. C'est le moment où votre dossier cesse de décrire pour commencer à juger. Chaque chapitre s'accompagne de sa fiche de travail sur Kestrel : la FT 19 pour l'environnement, les FT 20 et FT 21 pour le diagnostic."}, {"cue": "Ligne « Fin de matinée »", "text": "En fin de matinée, le QCM de l'UE2. Il porte sur les notions des chapitres 1 à 10. J'y reviendrai juste avant de le lancer."}, {"cue": "Lignes « Après-midi »", "text": "L'après-midi, vous commencez deux ateliers : le PESTEL du SI de Medisecure, puis le diagnostic de deux domaines. Vous ne les finirez pas aujourd'hui : vous les achèverez pendant l'intersession. Pendant que vous travaillez, chacun passe son pitch de cinq minutes."}, {"cue": "Bandeau du bas", "text": "Un dernier mot d'organisation. Le contenu exact de chaque atelier peut être ajusté. En cas de doute, c'est le planning publié sur Moodle qui fait foi, pas ma diapositive. Et regardez la dernière colonne : ce soir, vous devez repartir avec chacune de ces productions, même inachevée. C'est elle qui vous permettra de démarrer l'intersession dès demain matin."}], "words": 251}, {"n": 94, "title": "Ce qui pèse sur le SI vient aussi de l'extérieur", "paras": [{"cue": "Titre", "text": "Commençons par le chapitre 9 : analyser l'environnement du SI. Jusqu'ici, nous avons regardé le SI de l'intérieur : ses vues, ses risques, ses besoins de continuité. Ce chapitre lève les yeux."}, {"cue": "Sous-titre", "text": "Un SI ne vit pas en vase clos. Une loi nouvelle l'oblige à évoluer. Un concurrent mieux outillé le fait paraître vieilli. Un fournisseur qui arrête un produit le met en danger. La question du chapitre est donc simple : qu'est-ce qui, hors du contrôle de l'organisation, va peser sur son SI dans les prochaines années, et dans quel sens ? La réponse forme la section 5.1 de votre dossier. Elle alimente aussi la moitié externe du SWOT de la section 5.4. Le diagnostic de tout à l'heure n'a de sens que si l'on sait dans quel monde ce SI devra fonctionner demain."}], "words": 135}, {"n": 95, "title": "Identifier, collecter, analyser, évaluer : un état des lieux daté", "paras": [{"cue": "Titre et les quatre chevrons", "text": "L'analyse de l'environnement suit quatre étapes. Elles reprennent la logique de votre veille de la S1, avec une différence : il ne s'agit plus de surveiller en continu, mais de faire un état des lieux à une date donnée. Identifier, c'est lister les facteurs candidats, à partir des grilles, des objectifs stratégiques et des questions déjà ouvertes. Collecter, c'est trouver pour chaque facteur un fait vérifiable et sa source : un texte sur Légifrance ou EUR-Lex, une page de la Commission nationale de l'informatique et des libertés, la CNIL, ou de l'ANSSI, ou encore une section du dossier de présentation. Un facteur sans source reste une hypothèse."}, {"cue": "Chevron orange « Analyser »", "text": "L'étape en orange est celle qui compte le plus. Analyser, c'est écrire l'effet du facteur sur le SI : quelle application, quelles données, quel processus, quelle compétence sont touchés, et comment. C'est elle qui distingue une analyse d'une revue de presse. Évaluer, enfin, c'est classer le facteur et lui donner un niveau d'impact. Nous y venons dans un instant."}, {"cue": "Cartes « Interne ou externe ? » et « Macro et micro »", "text": "Deux distinctions avant d'aller plus loin. L'environnement interne, c'est ce que l'organisation maîtrise : on l'analyse en forces et en faiblesses, en section 5.2. L'environnement externe, c'est ce qu'elle ne maîtrise pas mais qui agit sur elle : on l'analyse en opportunités et en menaces, en section 5.1. Dans l'externe, on distingue le macro-environnement, terrain du PESTEL, et le micro-environnement, celui des acteurs du marché, terrain des cinq forces de Porter. Attention aux frontières : quand un éditeur annonce une fin de maintenance, l'annonce est externe ; la présence du logiciel dans votre parc est interne."}, {"cue": "Carte sombre « Du facteur à l'effet sur le SI », puis bandeau rouge", "text": "Et voici le cœur de la méthode, expliqué au début du chapitre 9. La hausse du prix du gazole est un facteur économique pour un transporteur. Elle devient un facteur pour le SI quand on écrit sa conséquence : la direction de Kestrel voudra mesurer et réduire ses kilomètres à vide, ce qui suppose des données de tournées fiables et un outil d'optimisation. D'où le bandeau rouge. Un facteur qui ne change rien aux applications, aux données, à l'infrastructure, à la sécurité, aux compétences ou au budget encombre votre section 5.1, même s'il est juste et bien sourcé. Écartez-le."}], "words": 361}, {"n": 96, "title": "Chaque facteur doit aboutir à un effet écrit sur le SI", "paras": [{"cue": "Le schéma : le SI au centre", "text": "Voici la figure du chapitre 9. Au centre, le SI de l'organisation, découpé en six cases : applications, données, infrastructure, sécurité, compétences, budget. Ce sont les six éléments que votre colonne « effet sur le SI » doit nommer."}, {"cue": "Cercle extérieur : le PESTEL, puis le bandeau du bas", "text": "Le cercle extérieur, c'est le PESTEL : politique, économique, socioculturel, technologique, environnemental, légal. L'idée remonte à Francis Aguilar, professeur à la Harvard Business School, qui proposait en 1967 de surveiller quatre secteurs de l'environnement. Le sigle à six lettres, lui, n'a pas d'auteur précis. Sa fonction est de ne rien oublier, pas de remplir six cases à tout prix. Une difficulté revient chaque année : où classer une loi ? La règle du cours est dans le bandeau. Une obligation opposable, c'est-à-dire un texte en vigueur ou adopté avec une date d'application, va en « légal », même si son objet est environnemental. Les orientations, les financements et les textes encore en discussion vont en « politique »."}, {"cue": "Cercle intérieur : les cinq forces", "text": "Le cercle intérieur porte les cinq forces de Michael Porter, présentées en 1979 dans la Harvard Business Review : rivalité entre concurrents, nouveaux entrants, produits de substitution, pouvoir des clients, pouvoir des fournisseurs. Pour le SI, on pose une question dérivée : face à chaque force, que doit savoir faire le SI ? Un client puissant impose ses formats et ses délais. Un fournisseur en position de force augmente ses prix ou arrête un produit. Attention : recopier le tableau des concurrents n'est pas une analyse de Porter. Votre section 5.1 contient au moins deux constats qui relient la pression concurrentielle à une exigence sur le SI."}, {"cue": "Carte de droite : la règle à trois niveaux", "text": "Reste à évaluer. Chaque facteur est classé en opportunité ou en menace, puis reçoit un niveau d'impact selon une règle écrite. La règle du cours combine la portée, l'échéance et la certitude. On teste d'abord le niveau 3, puis le niveau 2 ; tout ce qui reste reçoit le niveau 1. Vous pouvez l'adapter, à condition de l'écrire avant de l'appliquer. Un tableau où tous les facteurs sont au niveau 3 prouve seulement que la règle n'a pas été appliquée. Dernier point : beaucoup de facteurs ont deux faces. Un programme public qui finance l'interopérabilité est une opportunité, mais il devient une menace si le financement dépend d'indicateurs que l'organisation n'atteint pas. Deux solutions sont acceptées : dédoubler le facteur en deux lignes, ou retenir la face dominante en écrivant pourquoi."}], "words": 395}, {"n": 97, "title": "Chez Kestrel, trois des quatre facteurs forts visent TeleFleet", "paras": [{"cue": "Titre et première colonne", "text": "Voyons la méthode appliquée chez Kestrel Logistique. L'analyste part du plan Cap 2029 : livrer à J+1 sur toute la région, réduire de 20 % les kilomètres à vide, porter le e-commerce à 40 % du chiffre d'affaires, obtenir la certification ISO 14001. Ces quatre objectifs servent de repères pour juger l'impact. Il retient neuf facteurs ; le cours en montre huit, j'en affiche sept, au moins un par dimension. Le huitième concerne NIS2, qui pourrait s'appliquer à Kestrel au titre des services postaux et d'expédition : c'est une menace de niveau 2, parce que sa réalisation reste incertaine."}, {"cue": "Lignes « Économique » et « Socioculturel »", "text": "Regardez la colonne « effet sur le SI ». La hausse du gazole et des péages devient une menace de niveau 3, parce qu'elle touche l'objectif chiffré des kilomètres à vide : il faut des données de tournées fiables, dans TeleFleet et RoutePro, et une capacité d'optimisation dont Kestrel ne dispose pas, le module de RoutePro n'ayant jamais été acheté. L'attente des destinataires du e-commerce est au contraire une opportunité de niveau 3 : la synchronisation de KDriver toutes les deux minutes devient un argument commercial."}, {"cue": "Les deux lignes « Légal »", "text": "Les deux lignes légales illustrent le classement. L'obligation d'informer le donneur d'ordre des gaz à effet de serre émis par la prestation figure dans le code des transports depuis 2013. L'analyste la classe en opportunité, comme face dominante, parce que Kestrel dispose déjà des données dans TeleFleet ; et il écrit pourquoi. La doctrine de la CNIL sur la géolocalisation des salariés est une menace de niveau 3 : TeleFleet conserve les positions sans durée définie."}, {"cue": "Lignes « Politique » et « Technologique »", "text": "Dans le cours, plusieurs lignes portent la mention « à vérifier ». Le régime des zones à faibles émissions a été remis en discussion au Parlement en 2025 : c'est donc un facteur politique, de niveau 2. L'arrêt de la 2G et de la 3G est au niveau 1, car les boîtiers 4G des quarante camions ne sont pas concernés. Ces mentions sont honnêtes et acceptées, à condition de faire la vérification avant le rendu ou de laisser la mention dans le dossier."}, {"cue": "Bandeau sombre du bas", "text": "Le commentaire final tient en trois phrases. Trois des quatre facteurs de niveau 3 convergent vers TeleFleet et ses données ; le quatrième vise le couple Kestrel Track et KDriver. Deux sont des menaces, deux des opportunités. Et l'analyse ne propose aucune solution : elle ne dit pas qu'il faut changer de TMS, le logiciel de gestion du transport. Ce choix revient au schéma directeur, donc au dossier D3."}], "words": 413}, {"n": 98, "title": "Prenez la fiche FT 19 : le PESTEL du SI de Kestrel", "paras": [{"cue": "Titre", "text": "Avant votre PESTEL de Medisecure, sortez la fiche FT 19. Elle vous entraîne sur Kestrel avec des documents bruts, que le cours n'a pas montrés."}, {"cue": "Consigne", "text": "Hélène Garnier prépare l'analyse de l'environnement externe pour le comité de direction. Vous disposez d'un article de la presse professionnelle, d'un extrait de la base de veille de la DSI et des délais de recrutement des chauffeurs. Vous triez ce qui est externe et ce qui est interne, vous classez, vous évaluez chaque facteur, puis vous traduisez les cinq forces en exigences sur le SI. Soixante minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Le critère de qualité est toujours le même : un facteur sans effet écrit sur le SI n'a rien à faire dans le tableau. Nous mettrons en commun les cas difficiles, comme un texte encore en discussion."}], "words": 133}, {"n": 99, "title": "Votre PESTEL de Medisecure commence par une règle écrite", "paras": [{"cue": "Titre et durée", "text": "Premier atelier de l'après-midi : le PESTEL du SI de Medisecure et les cinq forces. Durée indicative : deux heures trente. Vous le commencez cet après-midi et vous l'achèverez pendant la période 2. Vous travaillez seuls ; vous pouvez comparer vos sources avec votre voisin, mais le tableau est le vôtre."}, {"cue": "Consigne", "text": "Commencez par écrire votre règle de niveau d'impact, et datez-la. Pas l'inverse : une règle écrite après coup sert à justifier des notes déjà posées. Identifiez ensuite au moins deux facteurs par dimension, chacun avec un fait sourcé et une phrase sur son effet sur le SI. Puis appliquez les cinq forces, en distinguant deux concurrences : celle pour les patients, et celle pour les médecins. Le chapitre le rappelle : quand une ressource est rare, son pouvoir de négociation devient une force à part entière."}, {"cue": "Dernière phrase de la consigne : les sources", "text": "Vos sources sont dans le dossier de présentation, aux sections affichées. Pour le réglementaire, remontez à la source primaire, ou reprenez vos fiches de veille du D1, mises à jour et citées : les consignes l'autorisent. Mais attention à la traduction. Une fiche de veille dit ce qu'une information change pour l'organisation ; la section 5.1 doit dire ce qu'elle change pour le SI, ce qui est plus étroit."}, {"cue": "Carte « Livrable »", "text": "En passant dans les rangs, je vérifierai trois choses : que votre règle est écrite avant le tableau, que chaque ligne a une source, et que la colonne « effet sur le SI » nomme un élément précis du SI. Ce travail devient votre section 5.1. Et n'oubliez pas : un facteur absent de la section 5.1 ne pourra pas apparaître dans votre SWOT. Si vous terminez vos douze facteurs avant la fin de l'après-midi, relisez votre tableau comme le ferait un directeur général : les trois facteurs les plus forts doivent sauter aux yeux. C'est l'objet du commentaire de cinq lignes."}], "words": 308}, {"n": 100, "title": "Un diagnostic juge, prouve et hiérarchise", "paras": [{"cue": "Titre", "text": "Passons au chapitre 10, le diagnostic critique du SI. Le directeur général de Medisecure a demandé un schéma directeur. Avant de décider où aller, il faut savoir d'où l'on part. La cartographie a décrit le SI, l'analyse de risques a dit ce qui pouvait mal tourner, l'analyse d'impact a mesuré les écarts de continuité, et le chapitre 9 a regardé l'environnement."}, {"cue": "Sous-titre", "text": "Le diagnostic rassemble ces matériaux et prononce un jugement : ce SI est-il en état de porter la stratégie, et sinon, où sont les écarts qui comptent le plus ? Un diagnostic n'est pas un inventaire. L'inventaire dit ce qui existe. Le diagnostic dit si c'est suffisant, au regard de quoi, et ce qui manque le plus."}], "words": 118}, {"n": 101, "title": "Une note de maturité ne vaut que par ses critères écrits", "paras": [{"cue": "Titre et texte du haut", "text": "Le diagnostic critique, selon les consignes, est un jugement argumenté sur l'état du SI, domaine par domaine. Il distingue forces et faiblesses, prouve chacune par des faits sourcés et les hiérarchise. Les consignes imposent les huit domaines écrits en haut de l'écran. Ce découpage protège contre un oubli classique chez les profils techniques : la gouvernance, les compétences et le budget. Pour chaque domaine, la section 5.2 attend au moins deux faits sourcés, une note de maturité justifiée et des indicateurs comparés à une référence."}, {"cue": "Le tableau des cinq niveaux", "text": "Noter la maturité, c'est situer des pratiques entre l'improvisation et l'amélioration continue. Le principe vient du Capability Maturity Model, développé à partir de la fin des années 1980 au Software Engineering Institute de l'université Carnegie Mellon, devenu le CMMI et géré aujourd'hui par le CMMI Institute, filiale de l'ISACA. COBIT 2019, le référentiel de gouvernance de l'ISACA, note aussi la capacité de ses processus de 0 à 5. L'ISACA annonce la parution de COBIT 7 le 19 novembre 2026 ; le certificat COBIT 7 Foundation est proposé depuis le 27 octobre, date que certains sites confondent avec la parution. Le cours cite COBIT 2019 : vérifiez sur le site de l'ISACA avant de citer la nouvelle version. Vous n'appliquez aucun de ces modèles à la lettre. Vous construisez une échelle inspirée d'eux, comme celle-ci. Lisez la colonne de droite. Au niveau 2, les sauvegardes sont automatiques, mais jamais testées et rangées au même endroit que les serveurs. Au niveau 3, la politique est écrite, la copie est hors site, la restauration est testée chaque année."}, {"cue": "Carte de droite : deux règles", "text": "Deux règles rendent la note défendable. La règle du maillon faible : un domaine ne peut pas être noté 3 si un critère du niveau 2 manque sur une partie importante du périmètre. La règle de preuve : chaque note est suivie de la phrase « noté N parce que… », qui cite les faits. Chez Kestrel, l'infrastructure est notée 2 : un NAS de sauvegarde et une copie hebdomadaire existent, mais la copie reste au siège et aucun test de restauration n'est documenté. La gouvernance est notée 1 : aucune règle d'arbitrage écrite, et les décisions dépendent des personnes présentes au comité."}, {"cue": "Question à la salle", "text": "Une question pour vous : que vaut une disponibilité de 99,2 % ? Rien, tant qu'on ne connaît pas la référence. Convertie, elle représente environ 70 heures d'arrêt par an. Dans votre dossier, retenez au moins cinq indicateurs du dossier de présentation, chacun comparé à une référence : une cible du plan 2030, un seuil, ou une valeur sourcée."}], "words": 422}, {"n": 102, "title": "Impact × urgence : F1 et F7 passent en tête chez Kestrel", "paras": [{"cue": "Titre et la matrice", "text": "Une fois les huit domaines notés, la section 5.3 rassemble les forces et les faiblesses et les classe. La méthode la plus simple croise l'impact et l'urgence, chacun noté de 1 à 3 selon une règle écrite. Le produit donne un score de 1 à 9. Voici la matrice des sept faiblesses de Kestrel."}, {"cue": "Case rouge en haut à droite : F1 et F7", "text": "En haut à droite, score 9, priorité 1 : F1 et F7. F1, c'est RoutePro et toute l'infrastructure du siège sur une seule salle serveur, sans site de secours ni restauration testée. L'urgence est à 3 parce que l'effet est déjà constaté : 9 heures de panne en novembre 2024, 38 000 euros de pénalités. F7, c'est la base de RoutePro, SQL Server 2016, hors support depuis le 14 juillet 2026. L'exposition est déjà effective."}, {"cue": "Case orange : F2, F3, F5, F6, puis F4", "text": "Viennent ensuite les scores de 6. F2, F3, F5 et F6 ont un impact de 3 et une urgence de 2. Prenez F2, les sauvegardes dans la salle des serveurs : urgence 2, car aucun incident ne les a encore touchées et aucune échéance ne tombe dans l'année. F4 est le cas inverse : Kestrel Track sur Django 3.2, hors support depuis avril 2024. Urgence 3, mais impact 2, car le portail fonctionne : la faiblesse renchérit et expose la croissance du e-commerce sans l'empêcher."}, {"cue": "Carte de droite et bandeau du bas", "text": "Regardez la règle d'impact. C'est là que vos parties 3 et 4 servent : une faiblesse qui rend vraisemblable un risque grave, ou qui explique un écart de continuité de plusieurs jours, mérite un 3. Écrivez ce lien dans une colonne dédiée. Dans votre section 5.3, il faut au moins quatre forces et huit faiblesses, et les cinq premières faiblesses doivent être reliées à un risque ou à un écart, et à un objectif du plan 2030. Enfin, une force n'est pas l'absence d'une faiblesse. C'est une ressource sur laquelle la stratégie peut s'appuyer, prouvée par un fait. Chez Kestrel : l'équipe de quatre développeurs, qui a construit Kestrel Track et KDriver, ou le canal d'échange de données informatisé, l'EDI, qui reçoit 70 % des ordres de transport. Les forces se classent de la même manière que les faiblesses, d'après leur utilité pour la stratégie."}], "words": 359}, {"n": 103, "title": "Prenez la fiche FT 20 : noter deux domaines de Kestrel", "paras": [{"cue": "Titre", "text": "Nous venons de voir l'échelle de maturité et la matrice impact × urgence. Sortez la fiche FT 20 : vous terminez le diagnostic de Kestrel sur les deux domaines que le cours n'a pas traités."}, {"cue": "Consigne", "text": "Vous relevez les faits sourcés des domaines « données » et « compétences », vous comparez chaque indicateur à une référence et vous attribuez une note justifiée, en respectant la règle du maillon faible. Puis vous classez quatre faiblesses nouvelles par impact et urgence, et vous vérifiez qu'un SWOT proposé n'introduit aucun fait nouveau. Soixante-quinze minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "La fiche contient aussi un calcul de moyenne des notes : demandez-vous ce qu'elle cache. C'est la discussion que nous aurons à la mise en commun."}], "words": 121}, {"n": 104, "title": "Un enjeu est une question à trancher, pas une solution", "paras": [{"cue": "Texte du haut : le SWOT", "text": "Le SWOT, pour strengths, weaknesses, opportunities, threats, rapproche les deux moitiés du diagnostic : forces et faiblesses internes, opportunités et menaces externes. Il n'apporte aucun fait nouveau. Sa valeur vient du croisement des cases, que Heinz Weihrich a formalisé en 1982 sous le nom de matrice TOWS. Retenez surtout l'une des quatre questions du cours : quelle menace frappe directement une faiblesse ? Chez Kestrel, le croisement le plus fort rapproche les pénalités de la grande distribution et la faiblesse F1."}, {"cue": "Le tableau EN1 à EN5", "text": "De ces croisements naissent les enjeux. Un enjeu est une question que la direction devra trancher, formulée sans imposer de solution, reliée à une faiblesse ou à un risque, et dotée d'une échéance. Lisez EN3 : « Quel avenir pour RoutePro, dont la base n'est plus maintenue ? » La question reste ouverte : migrer, remplacer, payer un support étendu, accepter le risque. Ce choix appartient au schéma directeur. Et chaque ligne renvoie à une faiblesse classée, par son numéro. Observez la chaîne complète : chaque enjeu renvoie à une faiblesse, chaque faiblesse à un fait sourcé, et aucun enjeu ne dit ce qu'il faut acheter. Dans votre dossier : au moins cinq enjeux, sans solution imposée, reliés et datés."}, {"cue": "Colonne « Échéance »", "text": "Chaque échéance est justifiée : le prochain pic d'activité de fin d'année pour EN1, le premier semestre pour EN3 parce que l'exposition est déjà effective, 2027 pour Kestrel Track. Il faut au moins cinq enjeux. Au-delà de sept, la direction ne les retient plus : regroupez."}, {"cue": "Bandeau rouge", "text": "Deux pièges pour finir. Un enjeu ne contient aucun verbe qui présuppose la réponse : « migrer », « remplacer », « externaliser ». « Remplacer RoutePro par un TMS en SaaS », c'est-à-dire par un logiciel loué en ligne, est une solution, qui relève du dossier D3. Et numérotez vos enjeux EN1, EN2, comme Kestrel. Une dernière précaution : un passage qui reprend la structure et les phrases de cet exemple en changeant seulement les noms ne rapporte aucun point."}], "words": 328}, {"n": 105, "title": "Deux synthèses du même constat : laquelle parle au comité ?", "paras": [{"cue": "Le document de gauche", "text": "Passons à l'étude de document du chapitre 10. Deux synthèses fictives, remises au comité de direction de Kestrel, sur le même constat. L'écran en montre des extraits abrégés ; le texte complet est dans le cours. Je vous laisse cinq minutes de lecture, crayon en main. Soulignez dans la synthèse A chaque sigle et chaque terme technique."}, {"cue": "Questions 1 et 2", "text": "Nous faisons ensuite un tour de table, une question par rangée, deux minutes chacune. Pour la première, comptez dans le texte complet : PRA, PCA, SPOF, TMS, EOL, NAS, VPN, MFA, CMMI, SOC, sans parler de « on-premise », « air-gappés » ou « zero trust ». Un directeur général en comprend peu. Pour la deuxième, reprenez les cinq contenus exigés par les consignes : ce que montre la cartographie, les trois risques les plus graves, les principaux écarts de continuité, les forces, les enjeux. La synthèse B complète en porte la plupart, avec des conséquences métier : des heures, des colis, des euros. Cherchez aussi ce qui reste implicite."}, {"cue": "Questions 3 et 4", "text": "La troisième question doit faire émerger une idée : la synthèse A se termine par des recommandations, alors que le dossier pose un diagnostic. « Une migration cloud du TMS » devient un enjeu : quelle solution de gestion du transport pour les années de Cap 2029 ? Pour la quatrième, la salle doit arriver seule à la conclusion : « 1,8 » ne vaut rien sans une échelle et ses critères, écrits avant la note."}, {"cue": "Question 5", "text": "La cinquième est une transposition, et je ne donnerai pas de réponse sur Medisecure : c'est votre synthèse. Retenez seulement la règle du chapitre : remplacez le nom d'un composant par sa fonction, et parlez de patients, d'heures et d'euros plutôt que de serveurs. La synthèse s'écrit en dernier, tient sur une page, ne contient aucun sigle non expliqué ni renvoi à un schéma. Un conseil pratique : faites relire votre synthèse par quelqu'un qui ne connaît pas l'informatique, et surlignez chaque sigle. S'il n'est pas expliqué à sa première apparition, développez-le."}], "words": 335}, {"n": 106, "title": "Prenez la fiche FT 21 : enjeux et synthèse d'une page", "paras": [{"cue": "Titre", "text": "Dernière fiche de la semaine : la FT 21. Elle porte sur ce qui est le plus difficile à écrire, les enjeux et la synthèse pour la direction."}, {"cue": "Consigne", "text": "Le diagnostic de Kestrel est terminé. Paul Vidal demande une synthèse d'une page et une présentation de huit minutes au comité de direction. Un stagiaire a fait un premier jet ; Hélène Garnier vous demande de le reprendre : les enjeux, les chiffres, le vocabulaire et le minutage. Soixante minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Un test simple pour chaque enjeu : la direction peut-elle y répondre par plusieurs décisions différentes ? Si une seule réponse est possible, c'est une solution déguisée. Ensuite, vous passerez au diagnostic de Medisecure."}], "words": 116}, {"n": 107, "title": "Deux domaines de Medisecure notés, trois enjeux formulés", "paras": [{"cue": "Titre et durée", "text": "Second atelier : diagnostiquer deux domaines de Medisecure et formuler des enjeux. Durée indicative : trois heures. Vous le commencez cet après-midi, après votre PESTEL, et vous l'achèverez pendant la période 2. Le travail est individuel."}, {"cue": "Consigne", "text": "Commencez par votre échelle de maturité à cinq niveaux, écrite avant toute note. Puis le domaine « données », imposé, et un second au choix : « compétences et ressources humaines », ou « budget ». Pour chacun : au moins quatre faits sourcés, deux indicateurs avec leur référence, l'écart calculé dans une unité parlante, une note justifiée par « noté N parce que… », et une phrase de jugement. Classez ensuite les faiblesses par impact et urgence, avec votre règle écrite. Formulez enfin trois enjeux. La liste complète des sections utiles est dans l'encadré du chapitre 10."}, {"cue": "Questions à vous poser", "text": "Posez-vous les questions du cours. Quelle cible du plan 2030 sert de référence à chaque indicateur ? Quels faits relèvent de la dette technique, lesquels de l'obsolescence ? Rappel : la dette technique, métaphore proposée par Ward Cunningham en 1992, c'est le surcoût futur de choix faits pour aller vite ; l'obsolescence, c'est un composant que son éditeur ne maintient plus, et elle se date avec précision. Une compétence portée par une seule personne est-elle une faiblesse, un risque de la partie 3, ou les deux ? Vos enjeux contiennent-ils un verbe qui impose déjà une solution ?"}, {"cue": "Carte « Livrable »", "text": "En passant, je relirai vos enjeux en priorité : c'est là que l'on glisse le plus souvent une solution. Ce travail prépare les sections 5.2 à 5.4. Pour les six autres domaines, ouvrez dès aujourd'hui un fichier de faits : chaque information utile, avec sa section entre parenthèses et le domaine qu'elle éclaire. À la fin de l'intersession, la section 5.2 se rédigera à partir de ce fichier, sans relire tout le dossier de présentation."}], "words": 307}, {"n": 108, "title": "Le QCM vérifie les notions des chapitres 1 à 10", "paras": [{"cue": "Titre", "text": "Il est temps de passer au QCM de l'UE2. Avant d'ouvrir l'épreuve, quatre repères, un par carte."}, {"cue": "Carte « Ce qu'il évalue »", "text": "Le QCM porte sur les notions des chapitres 1 à 10, de l'organisation et du SI jusqu'au diagnostic de ce matin. Les encadrés « Définition » du cours sont votre rappel de cours : ce sont eux qu'il faut connaître."}, {"cue": "Carte « Comment il se présente »", "text": "Chaque question propose quatre réponses, dont une seule est juste. Beaucoup sont des mises en situation. Les mauvaises réponses ressemblent à des erreurs réelles, celles que je vous ai signalées toute la semaine : confondre une redondance et un flux manuel, un facteur externe et une faiblesse interne, un enjeu et une solution. Lisez chaque proposition jusqu'au bout avant de choisir."}, {"cue": "Cartes « Pour réviser » et « Comment il se passe »", "text": "Pour réviser, reprenez les encadrés « Je retiens » de vos fiches de travail : ils reprennent les définitions exactes du cours. Le travail est individuel. Je vous donne maintenant la durée et les modalités d'accès."}, {"cue": "Bandeau du bas", "text": "Une précision qui devrait vous rassurer : une question sur Medisecure porte sur une notion, jamais sur une réponse que votre dossier doit établir. Le QCM ne corrige pas votre D2 par anticipation. Gérez votre temps : ne restez pas bloqués sur une question, avancez et revenez-y à la fin si les modalités le permettent. Bon courage."}], "words": 211}, {"n": 109, "title": "Le pitch : cinq minutes, l'outil ouvert, trois pièces à montrer", "paras": [{"cue": "Titre", "text": "Commençons par ce qui arrive tout de suite : le pitch d'étape. Cinq minutes chacun, pendant les ateliers de cet après-midi, dans l'ordre que je vais afficher. C'est un point d'étape, pour recevoir un retour oral avant de partir."}, {"cue": "Pastille 1 : l'outil et trois vues", "text": "Les consignes demandent trois choses. D'abord, votre outil de cartographie ouvert, avec au moins trois vues commencées, par exemple l'écosystème, la vue métier et la vue applicative. Ne cherchez pas à tout montrer. Passez d'une vue à l'autre en suivant un même objet pivot. Si cet objet change de nom en route, vous avez trouvé votre premier chantier."}, {"cue": "Pastilles 2 et 3 : échelles et valeurs métier", "text": "Ensuite, vos échelles de gravité et de vraisemblance, à quatre niveaux, avec des descripteurs propres à Medisecure. Rappelez-vous : l'échelle de gravité décrit chaque niveau pour cinq dimensions, la santé des patients, l'activité, les finances, la conformité et l'image. Enfin, vos valeurs métier, au moins cinq, reliées à des biens supports qui portent déjà le nom d'objets de votre cartographie."}, {"cue": "Pastille 4 : le retour", "text": "Pendant que vous parlez, vos pairs et moi notons nos remarques. Recopiez-les ensuite dans un fichier de suivi : elles orientent votre première période. Il est raisonnable d'avoir en plus, à ce stade, l'inventaire applicatif ouvert, la grille d'impact créée, le registre des hypothèses commencé."}, {"cue": "Bandeau rouge", "text": "Et voici l'erreur la plus coûteuse de l'intersession, celle qui se commet aujourd'hui : partir avec trois schémas dessinés à main levée, sans modèle ni règle de nommage. Il faudra renommer chaque objet dans chaque vue, dans les annexes A à D, puis dans l'analyse de risques. Or un objet pivot doit porter le même nom partout. Fixez votre nomenclature aujourd'hui, tant que je peux encore vous corriger. Si vous n'êtes pas encore prêts à tout montrer, montrez quand même ce que vous avez : un retour sur un modèle incomplet vaut mieux qu'aucun retour."}], "words": 297}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
