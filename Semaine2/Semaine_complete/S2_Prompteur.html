<!doctype html>

<head>

<title>Prompteur S2 · semaine complète</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

</head>
<body>
<div id="stage" aria-label="Texte du prompteur">
  <article id="script"></article>
</div>
<div class="fade-top"></div><div class="fade-bot"></div>
<div id="guide" aria-hidden="true"></div>
<div id="progress"></div>
<div id="hud"><span id="where"></span><span id="left"></span></div>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>
</div>

<script>
const DATA = [{"n": 1, "title": "Systèmes d'information, cartographie et risques", "paras": [{"cue": "Titre au centre, face à la salle", "text": "Bonjour à toutes et à tous, et bienvenue dans la semaine S2. Nous ouvrons aujourd'hui la deuxième unité d'enseignement du cycle, l'UE2 : « Systèmes d'information, cartographie et risques ». En S1, vous avez appris à regarder ce qui change autour d'une organisation. Cette semaine, nous regardons à l'intérieur : comment elle fonctionne, comment son système d'information est construit, ce qui peut mal tourner, et ce qu'il vaut."}, {"cue": "Sous-titre", "text": "Mon objectif est le même qu'en S1. À la fin de la semaine, vous devez être capables de produire seuls votre dossier D2 pendant l'intersession : une cartographie du SI de Medisecure, une analyse de risques menée avec une méthode reconnue, et un diagnostic critique. Ce dossier, c'est l'état des lieux dont la direction de Medisecure a besoin avant d'écrire son schéma directeur."}, {"cue": "Mentionnez le cours et les consignes sur Moodle", "text": "Comme en S1, ce diaporama suit le cours rédigé que vous trouverez sur Moodle, chapitre par chapitre. Je vous présente les méthodes et les exemples ; le cours contient les détails, les gabarits et les exercices. Gardez-le ouvert à côté de vous, avec le livret des fiches de travail : après chaque notion clé, je vous demanderai de prendre la fiche correspondante et de la réaliser."}], "words": 197}, {"n": 2, "title": "Aujourd'hui : comprendre l'organisation avant son SI", "paras": [{"cue": "Titre", "text": "Nous entrons tout de suite dans le cours. Aujourd'hui, une seule question nous occupe : qu'est-ce qu'une organisation, et comment son système d'information la sert-il ? On ne cartographie bien que ce que l'on comprend ; c'est pourquoi la semaine commence par les notions de base, le chapitre 1 du cours."}, {"cue": "Ligne « Matin »", "text": "Ce matin, nous décrivons l'organisation avec le vocabulaire de la gestion : ses finalités, ses ressources, sa structure, puis sa chaîne de valeur et ses processus. Après chacune de ces deux notions, vous prendrez une fiche de travail sur Kestrel Logistique, la FT 01 puis la FT 02, et vous la réaliserez en séance, seuls ou à deux."}, {"cue": "Lignes « Après-midi »", "text": "Cet après-midi, nous passons au système d'information lui-même, à ses familles d'applications, puis à la stratégie et aux objectifs SMART, avec les fiches FT 03 et FT 04 et une étude de document. Nous terminons par le premier atelier sur Medisecure : vous situez l'organisation, sa chaîne de valeur et sa stratégie. Vous le commencez ici et vous l'achèverez en autonomie."}, {"cue": "Bandeau du bas", "text": "Pour travailler, gardez trois documents ouverts : le cours, le livret des fiches de travail et le dossier de présentation de Medisecure. Allons-y."}], "words": 193}, {"n": 3, "title": "Organisation, système d'information, stratégie : les notions de base", "paras": [{"cue": "Écran de chapitre", "text": "Passons au chapitre 1, les notions de base. Il ne suppose aucune connaissance en gestion. Vous savez ce qu'est une base de données ou une API ; on vous a rarement expliqué ce qu'est une chaîne de valeur ou un processus support. Or on ne cartographie pas un système d'information sans comprendre l'organisation qu'il sert."}, {"cue": "Sous-titre", "text": "Le chapitre suit trois temps : l'organisation, puis le système d'information, puis la stratégie qui oriente les deux. Il fixe le vocabulaire de toute la semaine. Écrire « SI » quand on parle seulement d'applications, ou « stratégie » quand on liste des projets, est l'erreur la plus fréquente. Après chaque temps, vous réaliserez une fiche de travail sur Kestrel."}], "words": 115}, {"n": 4, "title": "Une organisation : des finalités, des ressources, une structure", "paras": [{"cue": "Encadré sombre : la définition", "text": "Commençons par le mot le plus simple, et pourtant rarement défini : l'organisation. C'est un ensemble de personnes qui coordonnent leurs activités, selon des règles et une répartition des rôles, pour atteindre des finalités communes en mobilisant des ressources. Retenez les trois questions qu'elle pose. Ses finalités : pourquoi existe-t-elle ? Ses ressources : avec quoi agit-elle ? Sa structure : comment répartit-elle le travail et l'autorité ? Ajoutez qu'elle échange en permanence avec son environnement : clients, fournisseurs, autorités, concurrents."}, {"cue": "Carte de droite : Kestrel", "text": "Prenons Kestrel. Sa finalité est celle d'une entreprise : vendre un service de transport avec profit. Ses ressources se rangent en cinq catégories. Humaines : 300 salariés, dont 140 chauffeurs et 95 agents de quai. Financières : 42 millions d'euros de chiffre d'affaires et le soutien de son groupe. Matérielles : trois sites, 40 camions porteurs, 60 scanners de quai. Immatérielles : ses contrats avec la grande distribution, sa connaissance du réseau routier régional. Informationnelles, enfin : les adresses de 2,5 millions de livraisons par an, les historiques de tournées, les positions GPS. C'est cette dernière ressource qui nous occupe toute la semaine. Côté statut, Kestrel est une SAS, une société par actions simplifiée, filiale à 100 % du groupe familial Vidal Participations, qui nomme sa direction."}, {"cue": "Bandeau rouge", "text": "Le statut juridique fixe qui décide et qui peut recevoir les bénéfices. Une société peut verser des dividendes ; une association, régie par la loi de 1901, réinvestit ses excédents dans son objet ; une administration agit selon le droit public. Medisecure illustre un cas fréquent dans la santé : deux structures travaillent ensemble. L'association Medisecure Santé gère les centres ; la société Medisecure Services SAS porte les fonctions support, dont la DSI, et facture ses prestations à l'association par une convention annuelle. Ne décrivez donc jamais Medisecure comme une seule entreprise : la relation entre les deux structures doit apparaître sur la vue de l'écosystème."}], "words": 314}, {"n": 5, "title": "Le SI relie le système opérant au système de pilotage", "paras": [{"cue": "Figure : les trois rectangles", "text": "Pour situer le SI dans l'organisation, le modèle le plus utilisé dans l'enseignement français est celui de Jean-Louis Le Moigne, dans « La théorie du système général », paru en 1977. Il voit l'organisation comme un système, tourné vers des finalités et ouvert sur son environnement, et le décompose en trois sous-systèmes. Le système opérant réalise l'activité : il transforme des entrées en sorties. Le système de pilotage décide, fixe les objectifs et contrôle les résultats. Le système d'information fait le lien : il mémorise, traite et transmet les informations qui remontent vers le pilotage, et les décisions qui redescendent."}, {"cue": "Les flèches et les noms de Kestrel", "text": "Appliqué à Kestrel, cela donne la figure du chapitre 1. En bas, les quais, les chauffeurs, les camions : environ 9 000 colis par jour. En haut, le comité de direction, le directeur des opérations, les chefs de quai et les trois planificateurs. Au milieu, le SI : les ordres arrivent par le portail EDI, RoutePro les affecte aux tournées, KDriver remonte les preuves de livraison, TeleFleet les positions des camions. Regardez les flèches : pleines pour les flux physiques, en pointillés pour les flux d'information."}, {"cue": "Bandeau du bas : la panne de RoutePro", "text": "Le modèle aide déjà à voir des fragilités. Les planificateurs décident de l'affectation : ils relèvent du pilotage. Leurs fichiers Excel, eux, font partie du SI : ils sont inscrits au parc applicatif, mais tenus à la main, selon des règles que seules trois personnes connaissent. La panne de novembre 2024 montre l'autre face : 9 heures sans RoutePro, 2 300 colis livrés en retard. Le système opérant a continué à tourner, mais à l'aveugle. Question pour vous : dans votre entreprise d'alternance, que se passe-t-il quand le SI s'arrête une matinée ?"}, {"cue": "Retour à la figure : les limites du modèle", "text": "Gardez aussi la limite du modèle. Il présente l'organisation comme une machine bien réglée, alors que les décisions réelles se prennent aussi dans les couloirs. Et il ne dit rien de la manière dont le travail est réparti entre les services. Pour cela, il faut regarder la structure."}], "words": 327}, {"n": 6, "title": "La structure divise le travail, et elle façonne le SI", "paras": [{"cue": "Titre", "text": "La structure est la manière dont une organisation divise le travail et coordonne les personnes qui l'exécutent. Elle se lit sur l'organigramme, mais pas seulement : elle comprend aussi les règles de délégation, les comités et les circuits de décision."}, {"cue": "Tableau, ligne par ligne", "text": "Quatre grands types sont classiquement distingués. La structure fonctionnelle regroupe les personnes par métier : elle favorise l'expertise, mais ralentit les décisions transversales, et produit souvent des applications par fonction, mal reliées entre elles. La structure divisionnelle découpe par produit, par marché ou par région : chaque division a ses propres fonctions, d'où des doublons, et souvent plusieurs applications pour le même besoin. La matricielle croise métier et projet, avec une double hiérarchie. La structure en réseau confie une part de l'activité à des partenaires liés par contrat : elle multiplie les échanges de données avec l'extérieur, et pose la question de la sécurité des interconnexions."}, {"cue": "Ligne « Fonctionnelle » et ligne « En réseau »", "text": "Kestrel a une structure fonctionnelle : un directeur général entouré d'une direction administrative et financière, d'une direction des opérations, d'une direction commerciale et d'une direction des ressources humaines. Les trois sites s'ajoutent comme une dimension géographique, mais ce ne sont pas des divisions autonomes : ils dépendent du directeur des opérations. Kestrel a aussi un trait de structure en réseau, puisque le dernier kilomètre est confié à des sous-traitants."}, {"cue": "Bandeau du bas : Mintzberg", "text": "Henry Mintzberg, dans « The Structuring of Organizations », en 1979, propose une lecture plus fine : cinq configurations, selon la partie de l'organisation qui domine et le mode de coordination. Prenez-les comme des repères, pas comme des cases. Les quais de Kestrel fonctionnent comme une bureaucratie mécaniste : les gestes de tri, de scan et de chargement sont standardisés. La DSI, dix personnes coordonnées directement par leur directrice, ressemble à une structure simple. Les quatre développeurs, eux, s'ajustent mutuellement, comme une petite adhocratie : une méthode imposée d'en haut à cette équipe risquerait d'être mal reçue. Tout à l'heure, vous ferez le même raisonnement sur les centres de Medisecure."}], "words": 325}, {"n": 7, "title": "Prenez la fiche FT 01 : l'agence de Clermont en système", "paras": [{"cue": "Titre", "text": "Sortez votre livret de fiches de travail et ouvrez la fiche FT 01. Elle reprend tout ce que nous venons de voir : les ressources, les trois sous-systèmes de Le Moigne et la structure. Vous travaillez sur Kestrel, mais sur un site que le cours n'a pas décrit : l'agence de Clermont-Ferrand."}, {"cue": "Consigne", "text": "Vous êtes stagiaire à la DSI. Hélène Garnier prépare un déplacement à l'agence et vous demande de la décrire avec le vocabulaire de la gestion. Les quatre annexes vous donnent un entretien, des chiffres et un circuit. Les sept questions vont du relevé à l'argumentation ; l'une d'elles demande un petit calcul. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Terminez par le « Je retiens », sans regarder le cours : c'est votre rappel des définitions. Nous corrigerons ensemble à la fin du temps imparti."}], "words": 138}, {"n": 8, "title": "Chaque application se place sur la chaîne de valeur", "paras": [{"cue": "Figure : la flèche de Porter", "text": "Michael Porter, professeur à Harvard, a présenté la chaîne de valeur dans « Competitive Advantage », en 1985. L'entreprise y est vue comme une suite d'activités, dont chacune ajoute de la valeur pour le client et un coût pour l'entreprise. Les activités principales, en bas, créent, vendent et servent le produit : logistique d'entrée, production, logistique de sortie, commercialisation et vente, services. Les activités de soutien, en haut, les rendent possibles : infrastructure de l'entreprise, gestion des ressources humaines, développement technologique, approvisionnements. La différence entre la valeur créée et le coût de l'ensemble forme la marge, à la pointe de la flèche."}, {"cue": "Colonnes du bas, noms en bleu", "text": "Le modèle a été conçu pour l'industrie ; pour un service, on reformule. Chez un transporteur, la production, c'est le tri et la préparation des tournées. Regardez les noms en bleu : chaque application trouve sa place auprès de l'activité qui l'utilise. Le portail EDI en logistique d'entrée, StockFlow, RoutePro et les fichiers Excel en production, KDriver et TeleFleet en logistique de sortie, Kestrel Track dans les services. Kestrel Track et KDriver apparaissent aussi, sans couleur, dans le développement technologique : la DSI les produit et les maintient, ce qui est une autre activité que leur usage."}, {"cue": "Carte de droite", "text": "Ce que la chaîne de valeur apporte aussi à l'informaticien, c'est de voir les activités sans application dédiée. Chez Kestrel, la commercialisation n'a pas d'outil de gestion de la relation client : les demandes de devis arrivent par courriel depuis le site web. Notez la prudence du constat. Il ne dit pas encore s'il faut un outil ; il dit qu'une activité repose sur la messagerie. C'est exactement le ton du diagnostic que vous écrirez dans la partie 5 du dossier."}], "words": 280}, {"n": 9, "title": "Les processus se classent en pilotage, réalisation, support", "paras": [{"cue": "Titre", "text": "Pour décrire le travail réel, on utilise la notion de processus, que vous retrouverez dans la vue métier, section 2.3 du dossier. Un processus est un enchaînement d'activités qui transforme des éléments d'entrée en résultats ayant de la valeur pour un client, interne ou externe. Il a un début et une fin identifiables, des acteurs, et il manipule des informations."}, {"cue": "Tableau : les trois familles", "text": "On classe les processus en trois familles, selon un usage courant dans les démarches qualité qui appliquent l'approche processus promue par la norme ISO 9001. Les processus de pilotage orientent, décident, contrôlent : chez Kestrel, élaborer et suivre le plan « Cap 2029 ». Les processus de réalisation produisent la valeur pour le client : recevoir les ordres de transport, trier, planifier les tournées, livrer et prouver la livraison, informer, facturer. Les processus de support fournissent les ressources aux deux autres : la paie, la flotte, les achats, et le système d'information lui-même."}, {"cue": "Ligne « Réalisation »", "text": "Un processus traverse souvent plusieurs services ; c'est ce qui le distingue d'une fonction. La livraison d'un colis chez Kestrel part du commercial qui a signé le client, passe par les quais, la planification et le chauffeur, et finit à la comptabilité qui facture. Chaque passage de relais est un endroit où une donnée peut être ressaisie, perdue ou retardée : c'est là que votre cartographie trouvera des flux manuels. Un processus se décrit à plusieurs niveaux : le nommer, puis enchaîner ses activités avec leurs acteurs, puis détailler chaque tâche. Pour le D2, le deuxième niveau suffit pour deux processus ; les autres restent nommés et classés."}, {"cue": "Bandeau du bas, puis les parties prenantes", "text": "Les minimums de la vue métier sont dans le bandeau. Un dernier mot sur les parties prenantes, notion popularisée par Edward Freeman en 1984 : ce sont les personnes ou les groupes qui influencent l'organisation ou qui sont affectés par ses décisions. Pour le SI, chaque partie prenante externe est un point d'échange de données, donc une dépendance et un risque possible. Chez Kestrel, 70 % des ordres de transport arrivent par le portail EDI d'un prestataire. La directrice commerciale ne voit pas ce prestataire ; pourtant, son arrêt bloquerait l'essentiel de l'activité."}], "words": 354}, {"n": 10, "title": "Prenez la fiche FT 02 : chaîne de valeur et processus", "paras": [{"cue": "Titre", "text": "Prenez maintenant la fiche FT 02. Elle fait travailler la chaîne de valeur et la notion de processus, à partir d'un problème réel de Kestrel : le démarrage trop lent d'un nouveau client e-commerçant."}, {"cue": "Consigne", "text": "Vous êtes alternant à la DSI. Hélène Garnier vous demande de décrire ce processus, de le situer dans la chaîne de valeur et de repérer les passages de relais. Vous calculerez un délai de bout en bout et un taux de transformation. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Soyez précis sur le déclencheur et le résultat du processus : c'est ce qui le distingue d'une simple liste de tâches. Nous mettrons en commun le classement des processus."}], "words": 113}, {"n": 11, "title": "Le SI, ce sont aussi des personnes et des procédures", "paras": [{"cue": "Encadré sombre : la définition de Reix", "text": "Le terme « système d'information » est souvent employé comme simple synonyme d'informatique. La définition de référence dans l'enseignement français de gestion est celle de Robert Reix : un ensemble organisé de ressources, matériels, logiciels, personnel, données, procédures, qui permet d'acquérir, de traiter, de stocker et de communiquer des informations, dans et entre des organisations. La formulation exacte a varié selon les éditions de l'ouvrage : citez celle que vous consultez. Trois expressions comptent, et la dernière ne figure que dans certaines éditions. « Ensemble organisé » : un tas d'applications sans règles d'échange ne forme pas un système. « Personnel » et « procédures » : ceux qui saisissent, contrôlent et décident font partie du SI. « Entre des organisations » : le SI inclut les échanges avec les clients, les fournisseurs et les autorités."}, {"cue": "Carte de droite : SI et système informatique", "text": "D'où une distinction capitale. Le système informatique, ce sont les moyens techniques : serveurs, postes, réseaux, logiciels, bases de données. Il n'est qu'une partie du SI. Chez Kestrel, un inventaire limité au système informatique listerait RoutePro et Microsoft 365 ; il ne montrerait pas que la tournée du lendemain dépend de trois planificateurs disponibles chaque soir. De même, la ressaisie des temps de conduite de TeleFleet dans la paie est un flux du SI, manuel, que seul un regard sur le SI complet fait apparaître. Votre cartographie devra montrer ces flux manuels."}, {"cue": "Bandeau sombre", "text": "Le SI remplit quatre fonctions : collecter, mémoriser, traiter, diffuser ; une faiblesse peut se loger dans chacune. Il joue trois rôles : opérationnel, aide à la décision, coordination. Distinguez enfin donnée, information et connaissance. Une donnée est un fait brut : « 45,73 ; 4,92 ; 06:42 ». Une information la met en contexte : « le camion 17 était à Vénissieux à 6 h 42, avec 40 minutes de retard sur sa tournée ». Une connaissance permet d'agir : « les tournées du sud lyonnais prennent du retard chaque lundi matin ». Les règles de construction des tournées de Kestrel ne sont écrites nulle part : le départ d'un planificateur serait une perte de connaissance qu'aucune sauvegarde ne compense."}], "words": 349}, {"n": 12, "title": "Les familles d'applications aident à lire un parc", "paras": [{"cue": "Titre", "text": "Connaître les grandes familles d'applications vous aide à lire un parc : à repérer ce qui manque et ce qui fait doublon. Le tableau reprend celui du chapitre 1, avec la colonne Kestrel."}, {"cue": "Lignes ERP, CRM et SCM", "text": "L'ERP, progiciel de gestion intégré, couvre la comptabilité, les achats, la facturation, parfois les stocks et la paie, sur une base unique : chez Kestrel, l'ERP finance. Le CRM, gestion de la relation client, suit les prospects, les devis, les réclamations : Kestrel n'en a pas, nous l'avons vu sur la chaîne de valeur. La gestion de la chaîne logistique, SCM, regroupe des outils spécialisés : le TMS pour le transport, c'est RoutePro ; le WMS pour l'entrepôt, c'est StockFlow ; l'EDI, l'échange de données informatisé, c'est le portail par lequel arrivent 70 % des ordres."}, {"cue": "Lignes décisionnel, métier et bureautique", "text": "Le décisionnel, ou BI, produit tableaux de bord et analyses : Kestrel n'a pas d'application dédiée, seulement des tableaux Excel. Les applications métier sont propres à un secteur : le dossier patient informatisé, le DPI, en santé ; KDriver, Kestrel Track et TeleFleet chez Kestrel. Ajoutez la bureautique, et les outils de la DSI elle-même, comme l'outil de tickets. Une même application peut relever de deux familles : le TMS est à la fois un outil de la chaîne logistique et l'application métier du transporteur. Dans votre inventaire, dites quelle famille vous retenez, et tenez ce choix."}, {"cue": "Bandeau du bas", "text": "Une application se décrit aussi par son mode d'acquisition. Un progiciel est acheté à un éditeur et paramétré ; un développement interne est écrit par l'équipe de l'organisation ; un service SaaS est loué et utilisé en ligne, l'éditeur en assurant l'exploitation. Ce mode change la maîtrise que l'organisation garde sur ses données et sur la disponibilité. Enfin, n'oubliez pas les usages informels : un fichier sur un poste personnel, une messagerie instantanée, un service en ligne gratuit adopté sans en informer la DSI. Ils traitent des données de l'organisation ; le D2 vous demande d'en inventorier au moins un pour Medisecure."}], "words": 328}, {"n": 13, "title": "Prenez la fiche FT 03 : ce que la note sur le SI oublie", "paras": [{"cue": "Titre", "text": "Fiche FT 03, maintenant. Elle porte sur la distinction que je vous ai présentée comme capitale : le système d'information n'est pas le système informatique."}, {"cue": "Consigne", "text": "La directrice administrative et financière a rédigé une note sur le SI de Kestrel pour le conseil de l'actionnaire. Vous la relisez avec ce que vous avez observé à la cellule service client. Votre travail : montrer ce que la note oublie, les personnes, les procédures, les échanges informels. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "La dernière question vous demande une réponse à un dirigeant : courte, factuelle, sans jargon. Je lirai quelques réponses à voix haute."}], "words": 104}, {"n": 14, "title": "Les objectifs de Cap 2029 passés à la grille SMART", "paras": [{"cue": "Phrase du haut : Chandler", "text": "Troisième temps du chapitre : la stratégie. Pour juger si un SI est adapté, il faut savoir où l'organisation veut aller. Alfred Chandler, historien de l'entreprise, la définit dans « Strategy and Structure », en 1962, comme la détermination des buts et objectifs à long terme, l'adoption des actions à mener et l'allocation des ressources nécessaires. Une destination, un chemin, des moyens. Il a aussi montré que la structure suit la stratégie. C'est vrai du SI : un SI qui ne suit pas la stratégie devient un frein."}, {"cue": "Phrase du haut : la stratégie de Kestrel", "text": "On distingue trois niveaux : le groupe décide dans quels métiers investir, le domaine d'activité comment gagner dans ce métier, les fonctions, dont le SI, comment y contribuer. La vision dit ce que l'organisation veut devenir, la mission ce qu'elle fait et pour qui, les objectifs les étapes. Porter, en 1980, ajoute trois stratégies génériques : domination par les coûts, différenciation, focalisation. Kestrel se concentre sur une région avec une promesse de service : c'est une focalisation par la différenciation. Mais avec 3,1 % de marge, elle ne peut pas négliger ses coûts. Son SI est donc tiré dans deux directions : rendre le service visible et réduire les coûts d'exploitation."}, {"cue": "Tableau : les quatre objectifs", "text": "Un objectif utile se vérifie : c'est le rôle de la grille SMART, rappelée dans le bandeau. Le plan « Cap 2029 » a quatre objectifs. « Livrer à J+1 sur toute la région » est spécifique, mais sans indicateur ni valeur de départ. « Réduire de 20 % les kilomètres à vide » est chiffré, mais la référence n'est pas établie et le kilomètre à vide n'est pas défini. La part e-commerce part d'une valeur connue, 30 %, mais aucun plan commercial chiffré n'en montre le réalisme. ISO 14001 est vérifiable par un tiers, sans date de certification visée dans la période."}, {"cue": "Colonne de droite, puis bandeau", "text": "La dernière colonne est la plus utile pour vous : ce que chaque objectif exige du SI. Les quatre en exigent quelque chose. Trois d'entre eux s'appuient en partie sur des données déjà collectées, par KDriver et TeleFleet, mais non exploitées faute d'outil décisionnel. C'est un constat de diagnostic, formulé sans proposer de solution. Notez la règle du cours : un objectif sans date propre est « daté par défaut » par l'horizon du plan, ce qui est plus faible qu'une date fixée. Et retenez que votre dossier est un diagnostic : il prépare le choix stratégique, il ne le fait pas."}], "words": 404}, {"n": 15, "title": "Prenez la fiche FT 04 : lire le plan Cap 2029", "paras": [{"cue": "Titre", "text": "Dernière fiche du chapitre, la fiche FT 04. Elle reprend la définition de Chandler, les niveaux de stratégie et la grille SMART, sur des documents de Kestrel que la diapositive précédente n'a pas montrés."}, {"cue": "Consigne", "text": "Vous êtes alternant à la DSI et vous lisez trois documents. Vous testerez les objectifs un par un, puis vous calculerez un taux de croissance annuel moyen. La question finale vous demande ce que la stratégie exige du SI. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Gardez votre fiche : la même démarche vous servira dans l'atelier, pour les huit axes du plan Medisecure 2030."}], "words": 100}, {"n": 16, "title": "Réduire son SI à son serveur, c'est ignorer ses risques", "paras": [{"cue": "Document à gauche", "text": "Place à l'étude de document du chapitre 1. C'est un entretien fictif, écrit pour le cours, avec Gérard Morvan, qui dirige une menuiserie de 120 salariés près d'Angers. L'écran en montre un résumé ; lisez la version complète dans le cours. Je vous laisse 5 minutes pour la lire et pour noter en quelques lignes vos réponses aux quatre premières questions. Travaillez seuls d'abord ; nous faisons ensuite un tour de table, une question par personne, pendant une quinzaine de minutes."}, {"cue": "Questions 1 et 2", "text": "Sur la question 1, je veux entendre que le dirigeant confond SI et système informatique : le serveur, l'ERP, les ordinateurs. Avec la définition de Reix, il exclut au moins les personnes, les procédures et une partie des données : le carnet de cotes, les photos envoyées à l'atelier, la messagerie des commerciaux. Sur la question 2, faites jouer les notions de donnée, d'information et de procédure : les devis étaient des informations de l'entreprise, stockées hors du SI officiel, sans procédure de départ. Le problème a été révélé par une personne, mais c'est un problème de SI."}, {"cue": "Question 3", "text": "La question 3 porte sur le RGPD, le règlement général sur la protection des données. Faites distinguer les données personnelles des catégories particulières de données de l'article 9. Les coordonnées de 4 000 clients particuliers sont des données personnelles ; une fiche de paie aussi, et elle peut en révéler davantage. Demandez à la salle où se rangent exactement les fiches de paie, et laissez le débat s'ouvrir. Faites aussi remarquer la sauvegarde rapportée chez le neveu chaque vendredi : où sont ces données, et qui y accède ?"}, {"cue": "Questions 4 et 5", "text": "La question 4 réutilise la grille SMART que nous venons de voir : doubler le chiffre d'affaires en cinq ans est chiffré et daté, mais rien ne dit d'où l'on part ni comment on y arrive. Et « le numérique suivra » oublie la leçon de Chandler, alors que la clientèle change : vendre à des promoteurs immobiliers demandera d'autres devis, d'autres échanges, d'autres données. La question 5 est pour vous seuls : quel échange de votre entreprise passe par un canal informel, et le verriez-vous sur une cartographie limitée aux applications ? Ne citez rien de sensible à l'oral."}], "words": 368}, {"n": 17, "title": "Situez Medisecure : structure, chaîne de valeur, stratégie", "paras": [{"cue": "Titre et durée", "text": "Dernière diapositive de la journée : l'atelier. L'exercice du chapitre 1, « Situer Medisecure », est indispensable : son livrable devient la première version de votre section 1.1 et la base de votre vue métier. Sa durée indicative est de 2 h 30. Nous en faisons la plus grande partie maintenant ; vous le reprendrez en fin de première période de l'intersession pour rédiger la section 1.1. Vous travaillez seuls, car le dossier est individuel ; à la fin du premier temps, vous pourrez comparer à deux votre lecture des structures pendant dix minutes."}, {"cue": "Consigne, temps 1 et 2", "text": "Premier temps, la structure. Appuyez-vous sur les sections « Carte d'identité », « Structure juridique et effectifs », « Les 14 centres » et « Organisation » du dossier de présentation, et cherchez dans « Ce que disent les acteurs » un verbatim qui confirme ou infirme votre lecture. Deuxième temps, la chaîne de valeur : adaptez les activités principales de Porter à des soins de proximité, placez-y les applications de la section « Parc applicatif », repérez au moins une activité sans application dédiée. Classez ensuite les processus de la section « Activités et processus métier » en pilotage, réalisation et support, et complétez la liste pour atteindre les minimums de la section 2.3 des consignes."}, {"cue": "Consigne, temps 3", "text": "Troisième temps, la stratégie, à partir de la section « Plan Medisecure 2030 ». Reconstituez une vision et une mission, en signalant qu'il s'agit de reconstitutions. Passez les huit axes du plan à la grille SMART : lesquels ont une valeur de départ mesurée, une cible, une échéance ? Pour chacun, écrivez en une phrase ce qu'il exige du SI, et demandez-vous à quel niveau de stratégie il se situe, et qui l'a validé."}, {"cue": "Carte « Livrable »", "text": "Je passerai dans les rangs et je vérifierai trois choses : que chaque fait porte sa section entre parenthèses, que les deux structures juridiques et leur relation apparaissent dans votre tableau d'identité, et que votre tableau SMART distingue ce qui est mesuré de ce qui ne l'est pas. Je ne vous donnerai pas les réponses : le dossier est le vôtre. Pour demain, regardez dès ce soir Archi et draw.io, les deux outils que nous comparerons au Jour 2 : votre cartographie commence demain."}], "words": 369}, {"n": 18, "title": "De la stratégie SI à la cartographie : décrire avant de décider", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Hier, nous avons lancé le dossier D2 et posé les notions de base : l'organisation, le système d'information, la stratégie. Aujourd'hui, nous passons du vocabulaire à la méthode. La journée a un fil simple : on ne décide pas de l'avenir d'un système d'information sans savoir d'abord ce qu'il est."}, {"cue": "Sous-titre", "text": "Le matin est consacré à la théorie. D'abord le chapitre 2, sur la stratégie SI, la gouvernance et l'urbanisation. Puis le chapitre 3, sur la cartographie, avec le guide de l'ANSSI, l'Agence nationale de la sécurité des systèmes d'information. L'après-midi, le chapitre 4, puis les ateliers sur Medisecure. Ce soir, votre cartographie doit exister dans un outil, même à l'état d'ébauche."}, {"cue": "Mentionnez le cours sur Moodle", "text": "Comme hier, ce support suit le cours rédigé, sur Moodle. Je vous donne les idées et les exemples ; les tableaux complets, les méthodes pas à pas et les exercices sont dans les chapitres 2, 3 et 4. Gardez-les ouverts à côté de vous."}], "words": 161}, {"n": 19, "title": "Aujourd'hui : penser le SI, puis le cartographier", "paras": [{"cue": "Titre", "text": "Voici le programme. Il suit la logique du cours : on comprend la place du SI dans la stratégie, puis on apprend à le cartographier, puis on construit la cartographie."}, {"cue": "Carte « Chapitre 2 »", "text": "Ce matin, d'abord, le chapitre 2. Quatre outils : la grille de McFarlan, pour qualifier le rôle de chaque application ; le modèle d'alignement de Henderson et Venkatraman ; la gouvernance et ses référentiels ; et l'urbanisation, qui découpe le SI comme une ville. Nous terminerons par une étude de document : un comité de direction de Kestrel qui arbitre ses projets informatiques."}, {"cue": "Carte « Chapitre 3 »", "text": "Ensuite, le chapitre 3, le cœur théorique de la journée. Ce qu'est une cartographie, la démarche en cinq étapes et les six vues du guide de l'ANSSI, les objets pivots, et le modèle de cartographie, que l'on écrit avant de dessiner quoi que ce soit."}, {"cue": "Carte sombre « Chapitre 4 et ateliers »", "text": "L'après-midi, le chapitre 4 : comment collecter, comment tenir les inventaires, quoi chercher sur les vues, quel outil choisir. Puis deux ateliers sur Medisecure. Le premier : le modèle de cartographie et la vue de l'écosystème. Le second : l'inventaire applicatif, la matrice des flux et la vue applicative. Vous ne les finirez pas cet après-midi ; vous les achèverez pendant la première période de l'intersession. Mais ils doivent être bien lancés."}, {"cue": "Bandeau du bas", "text": "Le bandeau dit l'objectif de la journée. Retenez-le : la cartographie est la base de tout le reste. Demain, l'analyse de risques nommera ses biens supports, et ce seront des objets de votre cartographie. Sans outil ni modèle ce soir, vous écrirez les risques sur des objets qui n'existent pas encore, et vous devrez tout renommer ensuite."}], "words": 267}, {"n": 20, "title": "Du SI à la stratégie SI : alignement, gouvernance, urbanisation", "paras": [{"cue": "Titre du chapitre", "text": "Commençons par le chapitre 2. Il relie les trois notions d'hier et répond à trois questions. Le SI doit-il seulement suivre la stratégie de l'entreprise, ou peut-il la transformer ? Qui décide de ce que devient le SI, et selon quelles règles ? Comment organiser un SI pour qu'il évolue sans tout casser ? Ce sont l'alignement, la gouvernance et l'urbanisation."}, {"cue": "Sous-titre", "text": "Le schéma directeur rassemble les trois. C'est précisément ce que le directeur général de Medisecure a demandé, et votre dossier D2 en est la première pièce : l'état des lieux. Ce chapitre sert surtout la section 2.4, la vue fonctionnelle, et le domaine « gouvernance du SI » du diagnostic, en section 5.2."}], "words": 114}, {"n": 21, "title": "Les applications stratégiques de Kestrel sont les plus fragiles", "paras": [{"cue": "Titre", "text": "Partons d'une idée simple. Pendant longtemps, l'informatique a été vue comme un outil de productivité : on automatisait la paie et la comptabilité pour faire la même chose plus vite. Cette vision reste juste pour une partie du SI. Mais quand les clients suivent leurs colis en ligne, le SI fait partie de l'offre. On distingue alors le SI support, qui exécute la stratégie au moindre coût, et le SI levier, qui rend possible une stratégie nouvelle. La stratégie SI, c'est l'ensemble des choix à moyen terme qui fixent ce que le SI doit devenir pour servir la stratégie de l'organisation, et parfois pour l'infléchir."}, {"cue": "Introduction et en-tête du tableau", "text": "Pour savoir quelle partie du SI joue quel rôle, McFarlan et McKenney ont proposé une grille en 1983, popularisée par un article de McFarlan dans la Harvard Business Review en 1984. Elle croise deux questions : l'impact actuel du SI sur l'activité, et son impact futur sur la stratégie. Quatre positions en sortent : support, production, avenir et stratégique. À l'origine, la grille qualifie le SI d'une entreprise entière. L'usage français l'applique aussi application par application : c'est une adaptation, et il faut la présenter comme telle."}, {"cue": "Les quatre lignes, puis la colonne de droite", "text": "Chez Kestrel, la DSI, la direction des systèmes d'information, a placé ses douze applications. Pour l'impact actuel, elle s'est demandé ce qui se passe si l'application s'arrête une journée. Pour l'impact futur, si elle porte un objectif du plan « Cap 2029 ». Regardez la ligne en couleur. Quatre applications sont stratégiques : Kestrel Track, RoutePro, KDriver et la planification des tournées. Or RoutePro est un progiciel de 2017 sur SQL Server 2016 ; Kestrel Track repose sur Django 3.2, hors support depuis avril 2024 ; et la planification se fait dans des fichiers Excel. Les applications que la stratégie va le plus solliciter sont les plus fragiles. C'est le message de la diapositive."}, {"cue": "Bandeau du bas", "text": "Deux applications étaient des cas limites : l'ERP finance et Microsoft 365, d'impact actuel moyen. La DSI a écrit une règle : un impact moyen va avec les forts si une direction a exprimé un besoin de continuité, avec les faibles sinon. L'ERP finance passe donc en production, Microsoft 365 en support. Les consignes du D2 n'exigent pas cette grille. Mais appliquée avec des faits, elle vous aidera à argumenter la hiérarchie des faiblesses du diagnostic."}], "words": 382}, {"n": 22, "title": "L'alignement relie quatre domaines et se corrige en continu", "paras": [{"cue": "Titre et figure", "text": "La grille de McFarlan dit quel rôle joue le SI ; elle ne dit pas comment l'ajuster à la stratégie. C'est l'objet du modèle d'alignement stratégique de John Henderson et N. Venkatraman, publié en 1993 dans l'IBM Systems Journal. Le carré compte quatre domaines. En haut, les deux stratégies : celle de l'entreprise à gauche, celle des technologies de l'information à droite. En bas, les deux infrastructures : l'organisation et ses processus, puis l'infrastructure et les processus du SI."}, {"cue": "Les flèches de la figure", "text": "Deux types de cohérence relient ces cases. Les flèches verticales, c'est la cohérence stratégique : entre le choix externe, sur quel marché et avec quelles compétences, et l'organisation interne qui le met en œuvre. Les flèches horizontales, c'est l'intégration fonctionnelle, entre le monde des métiers et celui des technologies. Les auteurs décrivent quatre perspectives, quatre manières de parcourir le carré : exécution de la stratégie, transformation technologique, potentiel concurrentiel et niveau de service. Le tableau du chapitre 2 précise, pour chacune, le rôle de la direction générale et celui de la DSI."}, {"cue": "Carte de droite « Kestrel »", "text": "Kestrel se trouve dans la première perspective sans l'avoir choisie : la direction fixe des objectifs, la DSI exécute ce qu'on lui demande. Or l'objectif de réduire de 20 % les kilomètres à vide suppose de choisir une technologie d'optimisation avant d'adapter l'infrastructure : c'est une transformation technologique. Personne chez Kestrel n'a formulé ce choix. Une question pour vous : dans votre entreprise d'alternance, qui part de quoi ? La direction, ou la technologie ?"}, {"cue": "Bandeau du bas", "text": "Connaissez les limites du modèle. Il suppose une stratégie explicite et stable, alors qu'elle est souvent implicite. Il présente l'alignement comme un réglage rationnel, alors qu'il résulte aussi de négociations entre directions. Il ignore les usages informels et les contournements. Claudio Ciborra l'a critiqué dans un article de 1997. Enfin, un SI trop étroitement aligné devient rigide quand la stratégie change. Utilisez le modèle pour poser des questions, pas comme une recette."}], "words": 318}, {"n": 23, "title": "Prenez la fiche FT 05 : place du SI et alignement", "paras": [{"cue": "Titre", "text": "Prenez la fiche FT 05. Elle met en pratique les deux outils que nous venons de voir : la grille de McFarlan et le modèle d'alignement."}, {"cue": "Consigne", "text": "Vous êtes l'alternant d'Hélène Garnier. Le directeur général veut changer la place de la DSI et créer une instance dédiée au SI ; vous préparez les éléments de la note. Vous calculerez la structure du budget et un dépassement, puis vous placerez des demandes dans la grille. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Une question vous demande les limites du modèle : ne la sautez pas. Un modèle sert à poser des questions, pas à donner la réponse. Nous corrigerons ensemble le placement dans la grille."}], "words": 114}, {"n": 24, "title": "La gouvernance décide et contrôle ; le management exécute", "paras": [{"cue": "Titre", "text": "L'alignement est un résultat ; la gouvernance est le dispositif qui permet de l'obtenir. Elle répond à une question : qui décide de quoi en matière de SI, selon quelles règles, et comment vérifie-t-on que les décisions sont appliquées ? Retenez la distinction du titre. La gouvernance fixe les orientations, arbitre et contrôle ; elle relève des instances dirigeantes, pas de la seule DSI. Le management planifie, construit, exploite et surveille dans le cadre ainsi fixé."}, {"cue": "Carte « ISO/IEC 38500 »", "text": "Trois référentiels sont à citer avec exactitude. La norme ISO/IEC 38500 est le texte international de référence ; sa troisième édition date de février 2024. Elle s'adresse aux organes de direction, quelle que soit la taille de l'organisation, et décrit un cycle en trois verbes : évaluer, diriger, surveiller. L'édition de 2024 a été restructurée : vérifiez la formulation de ses principes dans le texte avant de les citer."}, {"cue": "Cartes « COBIT » et « ITIL »", "text": "COBIT est publié par l'ISACA, une association internationale de professionnels de l'audit et de la gouvernance des SI. COBIT 2019 organise quarante objectifs en cinq domaines, dont un de gouvernance : évaluer, diriger, surveiller. L'ISACA annonce COBIT 7 pour le 19 novembre 2026 : vérifiez sur son site qu'il est paru avant de le citer, sinon citez COBIT 2019. ITIL est un recueil de bonnes pratiques pour gérer les services informatiques : incidents, demandes, changements. Aucun de ces textes n'est une obligation légale ; une PME n'en appliquera qu'une faible partie."}, {"cue": "Carte sombre « Kestrel »", "text": "Chez Kestrel, la DSI est rattachée à la directrice administrative et financière, pas au comité de direction. Il n'y a ni instance dédiée au SI, ni schéma directeur, ni recensement des projets. La sécurité est portée à temps partiel par le responsable de l'infrastructure. Le maillon manquant, souvent, c'est la gestion de portefeuille : recenser toutes les demandes, les évaluer sur des critères communs, les classer, puis suivre les projets retenus. Sans elle, le plus insistant l'emporte."}, {"cue": "Bandeau rouge", "text": "Deux erreurs reviennent dans les diagnostics. La première : décrire l'organigramme de la DSI et l'appeler gouvernance. La gouvernance, ce sont des décisions ; un fait comme « les demandes arrivent par courriel et sont arbitrées au cas par cas » en dit plus qu'un organigramme. La seconde : noter une organisation sur COBIT comme si elle devait l'appliquer en entier. Dites quel référentiel vous utilisez, pour quels critères, et adaptez-le à la taille de l'organisation."}], "words": 389}, {"n": 25, "title": "Prenez la fiche FT 06 : arbitrer sept demandes de projets", "paras": [{"cue": "Titre", "text": "Fiche FT 06. Après la gouvernance, vous allez arbitrer vous-mêmes un portefeuille de projets."}, {"cue": "Consigne", "text": "La DSI propose une grille de critères pondérés. Vous la testez sur les sept demandes, vous calculez les scores et vous classez. Puis vous regardez ce que ce classement dit de la gouvernance de Kestrel : qui décide, selon quelles règles, avec quel suivi. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Vérifiez vos calculs à deux avant de classer : une erreur de pondération change tout l'ordre. Nous comparerons les classements obtenus."}], "words": 87}, {"n": 26, "title": "Le plan d'urbanisation fait apparaître redondances et trous", "paras": [{"cue": "Titre", "text": "Troisième pilier : l'urbanisation. Elle répond à une question d'architecture : comment organiser un SI pour qu'il évolue par morceaux, sans qu'une modification locale casse l'ensemble ? La démarche s'est développée en France à la fin des années 1990 ; Christophe Longépé l'a présentée dans « Le projet d'urbanisation du système d'information ». L'image est celle de la ville : elle évolue sans jamais être rasée, selon un plan qui fixe des zones, des réseaux communs et des règles de construction."}, {"cue": "Carte de droite", "text": "Le plan d'urbanisation découpe le SI en zones, qui sont les grandes familles d'activités ; puis en quartiers, en îlots si besoin, et enfin en blocs fonctionnels. Un bloc est un ensemble cohérent de fonctions qui partagent leurs données. Il se nomme par un verbe et un objet, sans nom de logiciel : « Construire les tournées du lendemain ». C'est le niveau fonctionnel, le plus difficile à saisir : il dit ce que le SI doit faire, pas avec quel outil. Les quatre niveaux du référentiel sont donc métier, fonctionnel, applicatif et infrastructure."}, {"cue": "La figure : contour orange, hachures rouges, pointillé", "text": "Regardez le plan de Kestrel. On place les applications sur les blocs, et les défauts apparaissent. Le bloc « Construire les tournées du lendemain » est servi par RoutePro et par la planification sous Excel, inscrite au parc comme application : c'est une redondance. Le bloc « Optimiser les tournées » n'a aucune application : c'est un trou. De même pour « Suivre les prospects et les devis », fait par courriel, et pour « Produire les indicateurs de Cap 2029 », fait sous Excel au cas par cas : la messagerie et la bureautique ne comblent pas un trou. Le trait pointillé entre TeleFleet et la paie, lui, est une ressaisie : ni redondance ni trou, mais un flux manuel."}, {"cue": "Dernière ligne de la carte de droite : Medisecure", "text": "Pour Medisecure, vos blocs couvrent toutes les activités de la vue métier, chaque application de l'annexe A est placée sur au moins un bloc, et vous signalez au moins deux redondances et deux trous, sourcés. Kestrel n'a qu'une redondance : l'exemple montre la méthode, pas le nombre attendu. Et une adresse saisie dans trois applications de fonctions différentes est un défaut de donnée de référence, pas une redondance."}], "words": 364}, {"n": 27, "title": "Prenez la fiche FT 07 : redondances, trous, flux manuels", "paras": [{"cue": "Titre", "text": "Prenez la fiche FT 07. C'est la plus utile pour votre vue fonctionnelle : elle vous entraîne à appliquer les quatre définitions sans les confondre."}, {"cue": "Consigne", "text": "Vous êtes stagiaire à la DSI et vous aidez à compléter la vue fonctionnelle. Vous avez interrogé le responsable de l'agence de Clermont-Ferrand. Pour chaque constat, demandez-vous : est-ce une redondance, un trou, un flux manuel ou un défaut de donnée de référence ? Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Revenez aux définitions exactes du cours à chaque doute. Nous corrigerons le classement ensemble, ligne par ligne."}], "words": 94}, {"n": 28, "title": "L'état des lieux ouvre le schéma directeur : c'est le D2", "paras": [{"cue": "Titre et carte de droite « Schéma directeur »", "text": "Le schéma directeur rassemble tout ce que nous venons de voir. C'est un plan pluriannuel, en général sur trois à cinq ans, qui fixe la cible du SI, les projets pour l'atteindre, leur ordre, leur budget et l'organisation nécessaire. Il part d'un état des lieux et des orientations stratégiques. Il est validé par la direction générale et révisé au moins une fois par an."}, {"cue": "Les quatre chevrons", "text": "Son élaboration suit un cycle en quatre temps. L'état des lieux décrit le SI actuel. Les orientations traduisent la stratégie en exigences pour le SI. La cible décrit le SI visé et les scénarios pour l'atteindre. La trajectoire ordonne les projets dans le temps et le budget. Le premier chevron est en couleur : c'est le vôtre."}, {"cue": "Cartes « Dossier D2 » et « Dossier D3 »", "text": "Votre dossier D2 est l'état des lieux qui ouvre le schéma directeur de Medisecure. Il ne choisit ni la cible ni les projets : cela relève du dossier D3. Il fournit à ceux qui décideront une carte fiable, des risques classés et des enjeux formulés sans solution. Retenez cette frontière : un diagnostic qui recommande déjà de tout migrer dans le cloud sort de son rôle et perd en crédibilité."}, {"cue": "Bandeau du bas", "text": "Un mot sur les indicateurs de la DSI, que vous développerez dans le D3. Chez Kestrel, le budget SI représente 3,1 % du chiffre d'affaires, soit environ 4 330 € par salarié, et 80 % de ce budget va au fonctionnement. Un indicateur ne vaut que comparé à une référence : une cible, un seuil, une valeur passée ou une étude citée."}], "words": 253}, {"n": 29, "title": "Un comité arbitre cinq demandes de projets sans règle écrite", "paras": [{"cue": "Le document à gauche", "text": "Passons à l'étude de document du chapitre 2. C'est un compte rendu fictif, écrit pour le cours : le comité de direction de Kestrel, en février 2026, examine les projets informatiques. L'écran en donne un résumé ; le texte complet est dans le cours. Lisez-le seuls, cinq minutes. Répondez ensuite par deux aux questions 1 à 4, pendant quinze minutes. Puis nous ferons un tour de table, un binôme par question."}, {"cue": "Questions 1 et 2", "text": "Sur la question 1, faites émerger que les critères ne sont écrits nulle part : il faut les reconstituer à partir des décisions. On trouve le lien avec « Cap 2029 », le coût, et le fait que l'application « fonctionne ». Ils ne sont pas appliqués de la même façon : le module d'optimisation est jugé prioritaire mais reporté, l'outil client est accordé sous condition. Sur la question 2, revenez à la grille : Kestrel Track est stratégique, exposée au public et hors support, et le directeur général dit lui-même que le principal client veut du concret sur le suivi. Reporter sa migration parce qu'elle fonctionne, c'est traiter une application stratégique comme une application support."}, {"cue": "Questions 3 et 4", "text": "Pour la question 3, les notions du chapitre suffisent : aucune instance dédiée, aucun portefeuille, aucune demande chiffrée, aucun critère écrit, aucune date de suivi, une demande non examinée, et une demande de sécurité arrivée par courriel, que personne ne porte en comité. La question 4 vous entraîne à distinguer enjeu et solution : un enjeu est une question à trancher, pas une solution. « Comment arbitrer les demandes de projets SI selon des critères connus de tous ? » est un enjeu. « Créer un comité SI » est une solution, qui relève du D3."}, {"cue": "Question 5", "text": "La question 5 porte sur votre entreprise d'alternance. Gardez-la pour ce soir, par écrit, en quelques lignes. Enfin, l'exercice du chapitre 2, McFarlan et gouvernance chez Medisecure, est facultatif. Faites-le en autonomie si le temps le permet : il peut nourrir le domaine « gouvernance du SI » de votre section 5.2."}], "words": 335}, {"n": 30, "title": "Cartographier le SI : finalités, vues, niveaux, modèle", "paras": [{"cue": "Titre du chapitre", "text": "Deuxième temps de la matinée : le chapitre 3. Le chapitre 2 a présenté l'urbanisation comme une idée ; celui-ci passe au plan. Cartographier, c'est décrire ce qui existe, avant de décider ce qui doit changer. Le RSSI de Medisecure, le responsable de la sécurité des systèmes d'information, le résume en une phrase : sans cartographie, il ne saura pas ce qui a été touché en cas d'attaque."}, {"cue": "Sous-titre", "text": "Ce chapitre fixe les règles du jeu ; le chapitre 4, cet après-midi, montrera comment collecter et dessiner. Il prépare trois sections de votre dossier : la 1.2, mission, périmètre et méthode ; la 2.1, le modèle de cartographie ; la 2.2, la vue de l'écosystème."}], "words": 114}, {"n": 31, "title": "Une cartographie : un inventaire et des vues, indissociables", "paras": [{"cue": "Titre", "text": "Première idée, et elle corrige une erreur fréquente : une cartographie n'est pas un schéma. Une carte routière s'appuie sur un relevé précis du terrain, et c'est ce relevé qui la rend fiable. De même, une cartographie du SI repose sur deux éléments indissociables : un inventaire, qui recense et décrit les composants, et des vues, qui les représentent selon un point de vue."}, {"cue": "Encadré sombre de la définition", "text": "La définition est celle du guide de l'ANSSI, publié en novembre 2018 sous Licence ouverte. L'inventaire est une base de données, même s'il tient dans un tableur : une ligne par objet, une colonne par attribut. Les vues sont des extraits de cet inventaire mis en image, pour répondre à une question. Le guide s'adresse d'abord aux opérateurs d'importance vitale, mais il se présente comme utilisable par toute organisation, quelle que soit sa taille."}, {"cue": "Carte de droite « Cinq finalités »", "text": "Une cartographie coûte du temps ; elle se justifie par ce qu'elle permet. Le chapitre 3 retient cinq finalités : maîtrise, sécurité, gestion de crise, transformation et conformité. Elles ne demandent pas la même cartographie. La gestion de crise exige des dépendances exactes et une version accessible hors ligne ; la conformité, des attributs précis sur les données. Chez Kestrel, la finalité retenue est d'abord la gestion de crise, après la panne de RoutePro de novembre 2024, puis la préparation d'un schéma directeur. Dans votre dossier, la finalité est donnée : un état des lieux fiable pour le futur schéma directeur, réutilisable pour l'analyse de risques."}, {"cue": "Bandeau du bas", "text": "Les consignes reprennent cette double exigence. Une vue sans inventaire ne compte pas comme cartographie ; un inventaire sans vue non plus. Vos annexes A à D font donc partie de la cartographie : ce ne sont pas des compléments."}], "words": 284}, {"n": 32, "title": "Cinq étapes, et chacune a sa place dans le plan du D2", "paras": [{"cue": "Titre et tableau", "text": "Le guide découpe le projet en cinq étapes. Il insiste sur trois qualités : la démarche doit être pragmatique, participative et pérenne. Elle est aussi incrémentale, parce qu'on ajoute des vues au fil du temps, et itérative, parce qu'on affine les vues déjà construites. La dernière colonne vous montre où chaque étape se retrouve dans votre dossier."}, {"cue": "Ligne 1", "text": "L'étape 1 est souvent bâclée. Le guide demande un sponsor, membre de la direction, qui valide les objectifs. Une démarche orientée sur la sécurité est coordonnée par le RSSI ; une démarche plus globale peut être confiée au DSI. Le guide recommande aussi de commencer par les systèmes les plus exposés ou les plus critiques, puis d'élargir. Chez Kestrel, Romain Chevalier lance la cartographie, et la directrice administrative et financière, Isabelle Roux, accepte d'être le sponsor."}, {"cue": "Lignes 2 à 5", "text": "L'étape 2, le modèle, se mène en parallèle de la collecte : on définit le modèle, on recueille l'existant, on ajuste. Les étapes 3 à 5, outiller, construire et pérenniser, sont l'objet du chapitre 4 cet après-midi. Retenez déjà que le guide ne prescrit aucun outil. Il exige seulement que l'outil tienne l'inventaire, relie les vues et permette la mise à jour."}, {"cue": "Bandeau du bas", "text": "L'étape 1 fixe aussi la granularité, c'est-à-dire le niveau de détail des objets et des attributs. Le guide en distingue trois : le niveau 1 pour les informations indispensables, le niveau 2 pour les importantes, le niveau 3 pour les utiles. Ne la confondez pas avec la maturité, qui qualifie la cartographie entière : au niveau 2, elle représente toutes les vues et elle est orientée sécurité. En section 1.2, vous écrivez la granularité visée pour chaque vue. Attention, le D2 exige parfois plus que le niveau 1 : la vue métier demande deux processus détaillés en activités avec leurs acteurs."}], "words": 296}, {"n": 33, "title": "Prenez la fiche FT 08 : cadrer selon l'ANSSI", "paras": [{"cue": "Titre", "text": "Fiche FT 08. Elle reprend les cinq étapes du guide de l'ANSSI que nous venons de parcourir."}, {"cue": "Consigne", "text": "Romain Chevalier vous accueille en alternance. Le chef de projet applicatif a rédigé un projet de note de cadrage ; vous le confrontez au guide avant qu'il parte en comité. Vous estimerez une charge de travail, et vous ne confondrez pas granularité et maturité. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "La dernière question vous demande une proposition : une cible et une trajectoire réalistes pour une DSI de dix personnes. Nous en discuterons ensemble."}], "words": 93}, {"n": 34, "title": "Sept vues, du métier à la technique, reliées par des pivots", "paras": [{"cue": "La figure, de haut en bas", "text": "Le guide organise la cartographie en trois visions, du métier vers la technique, et chacune compte deux vues. La vision métier : la vue de l'écosystème, qui montre les entités avec lesquelles le SI interagit et délimite le périmètre, et la vue métier du SI, avec les processus et les informations. La vision applicative : la vue des applications et de leurs flux, et la vue de l'administration, qui montre les périmètres et les privilèges des administrateurs. La vision infrastructure : la vue logique, réseaux, filtrage et cloisonnement, et la vue physique, équipements et sites."}, {"cue": "La bande en pointillé : la vue fonctionnelle", "text": "Le guide n'a pas de vue fonctionnelle : il passe directement des processus aux applications. Or l'urbanisation raisonne en quatre niveaux : métier, fonctionnel, applicatif, infrastructure. Le D2 ajoute donc une septième vue, issue de l'urbanisation : le plan d'urbanisation du chapitre 2. La section 2.1 contient un tableau qui fait correspondre vos vues aux quatre niveaux."}, {"cue": "Carte de droite « Objet pivot »", "text": "Les flèches de la figure portent des noms : ce sont les objets pivots. Un objet pivot apparaît dans plusieurs vues sous le même nom et permet de passer de l'une à l'autre. Grâce à eux, on suit une chaîne du métier jusqu'au câble : le processus « Planifier les tournées » dépend de RoutePro, qui tourne sur une machine virtuelle, hébergée sur un serveur physique, dans la seule salle serveur de Kestrel. Si un maillon change de nom, la chaîne se rompt : un seul nom différent suffit à rendre la cartographie inexploitable."}, {"cue": "Vues métier et administration sur la figure", "text": "Deux remarques. La vue métier est la plus importante et la plus négligée par les informaticiens : un serveur n'a de valeur que par les activités qu'il soutient. Quant à la vue de l'administration, le guide n'en fait un schéma que s'il existe une gestion centralisée des droits sur plusieurs périmètres d'administration. Le D2 vous en demande un : cherchez dans le dossier ce qui centralise les droits et quels périmètres coexistent."}], "words": 318}, {"n": 35, "title": "Fixer le langage commun avant de dessiner la première vue", "paras": [{"cue": "Titre", "text": "Avant de dessiner, il faut un langage commun. Sans modèle, chaque contributeur dessine à sa façon : l'un met les applications en vert, l'autre en bleu ; l'un écrit « TMS », l'autre « RoutePro ». Les vues deviennent incomparables et les objets pivots se perdent. Le modèle de cartographie fixe, pour chaque vue, les objets, leurs attributs, la légende et la nomenclature. C'est l'étape 2 du guide et la section 2.1 de votre dossier."}, {"cue": "Cartes 1 et 2", "text": "La première composante est le tableau objets × vues : quels objets apparaissent dans quelle vue. Partez de l'annexe 1 du guide, et ajoutez les objets propres au cas, comme le bloc fonctionnel ou l'usage hors inventaire. La deuxième, ce sont les attributs et leur format. Préférez les listes fermées. « Maintenu par l'éditeur », « fin de support annoncée », « hors support », « non documenté » se comparent ; « vieux » et « pas terrible » ne se comparent pas. Une précision qui n'entre pas dans la liste va dans une remarque, pas dans la valeur."}, {"cue": "Carte 3 « La légende commune »", "text": "La troisième, la légende. Une forme par type d'objet, un style de trait par type de relation. Le D2 impose deux lectures : distinguer les flux automatiques des flux manuels, et repérer les applications hors support. Trait plein et trait pointillé ; bordure épaisse ou pictogramme. Et ne codez jamais une information par la seule couleur : un schéma imprimé en noir et blanc, ou lu par un daltonien, la perd."}, {"cue": "Carte sombre « La nomenclature »", "text": "La quatrième, la nomenclature : un préfixe de type, un numéro, puis le nom usuel employé par les métiers. « APP-03 Kestrel Track », « SRV-01 Virtualisation 1 ». Les flux, qui n'ont pas de nom d'usage, gardent le préfixe et le numéro : « FLX-12 ». La version n'entre pas dans le nom, car elle change : c'est un attribut. La méthode du cours demande de tester la règle sur dix objets réels, puis de la figer. Toute exception ultérieure est une erreur à corriger."}], "words": 332}, {"n": 36, "title": "La vue de l'écosystème montre déjà de qui dépend Kestrel", "paras": [{"cue": "La figure", "text": "Voici l'exemple travaillé du chapitre 3 : la vue de l'écosystème de Kestrel. Romain Chevalier a recensé vingt parties prenantes, chacune avec son identifiant, de PP-01 à PP-20. Au centre, Kestrel et ses trois sites ; autour, quatre secteurs : clients et usagers, fournisseurs de services numériques, partenaires opérationnels, autorités. L'épaisseur du trait code la dépendance, forte, moyenne ou faible ; les autorités sont reliées par un trait propre à l'obligation légale, sans niveau de dépendance."}, {"cue": "Carte de droite", "text": "La vue montre déjà un constat. Trois des quatre parties prenantes de dépendance forte sont des fournisseurs de services numériques : le prestataire EDI, l'éditeur de RoutePro et l'opérateur télécom. Et l'éditeur de RoutePro dispose d'un accès permanent au réseau interne, en rouge sur la figure. Remarquez ce qui est écrit quand on ne sait pas : « nom non documenté » pour l'opérateur, et « à confirmer » pour l'ANSSI, puisque Kestrel pourrait relever de NIS2, la directive européenne sur la sécurité des réseaux et des systèmes d'information. On ne cache pas l'incertitude : on l'écrit."}, {"cue": "Dernière ligne de la carte de droite", "text": "Cet exemple est un modèle de raisonnement, pas un gabarit à recopier. Les consignes sont claires : un passage qui reprend la structure et les formulations d'un exemple Kestrel en changeant seulement les noms et les chiffres ne rapporte aucun point. Medisecure n'a ni les mêmes partenaires ni les mêmes dépendances ; elle a en outre deux structures juridiques, que votre vue doit montrer avec leur relation."}], "words": 240}, {"n": 37, "title": "Prenez la fiche FT 09 : vues, pivots et écosystème", "paras": [{"cue": "Titre", "text": "Prenez la fiche FT 09 avant l'atelier : elle vous fait construire, sur Kestrel, ce que vous construirez ensuite sur Medisecure."}, {"cue": "Consigne", "text": "Vous êtes stagiaire à la DSI. À partir d'un courriel de la directrice administrative et financière et de la règle de dépendance écrite par Romain, vous décrivez sept parties prenantes. Vous vérifiez aussi qu'un objet pivot porte le même nom dans tous les documents. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Appliquez la règle de dépendance telle qu'elle est écrite, sans la réinterpréter : c'est tout l'intérêt d'une règle. Nous comparerons vos cotations."}], "words": 95}, {"n": 38, "title": "Construire et faire vivre la cartographie", "paras": [{"cue": "Titre du chapitre", "text": "Nous voici à l'après-midi, avec le chapitre 4. Le chapitre 3 a posé le cadre ; celui-ci suit les étapes 3 à 5 du guide : outiller, construire pas à pas, pérenniser. Il suit aussi l'ordre de votre travail pendant l'intersession. Vous collectez d'abord, vous inventoriez ensuite, vous dessinez enfin."}, {"cue": "Sous-titre", "text": "Je vous le dis comme le cours le dit : dessiner avant d'inventorier est la manière la plus sûre de produire de beaux schémas faux. Ce chapitre prépare les sections 2.3 à 2.8 et les annexes A, B, C, D et G."}], "words": 92}, {"n": 39, "title": "Documents, entretiens, outils : recouper les sources", "paras": [{"cue": "Titre et tableau", "text": "Aucune cartographie ne part de zéro. Le guide recommande de commencer par l'existant : inventaires, anciens schémas, contrats, factures, plans de continuité, rapports d'incident. L'outil de tickets montre ce qui casse. Chaque document a une date et un auteur : un schéma réseau de 2024 décrit le réseau de 2024. Le tableau montre ce que chaque type de source dit bien et ce qu'il dit mal. Une information confirmée par deux sources de nature différente vaut plus qu'une information répétée par deux personnes du même service."}, {"cue": "Ligne « Outils de collecte »", "text": "Les outils de collecte donnent l'état technique exact à une date : outil de gestion de parc comme GLPI, logiciel libre très répandu en France, outil de supervision, annuaire Active Directory, consoles des hébergeurs. Une CMDB, base de données de gestion des configurations, recense les éléments de configuration et leurs relations ; la notion vient d'ITIL. C'est une excellente source pour l'inventaire, mais elle ignore en général les processus métier, les flux manuels et les zones de confiance."}, {"cue": "Carte sombre « Entretien »", "text": "Les documents ignorent les usages réels : le fichier Excel qui remplace une fonction absente, la ressaisie quotidienne, le mot de passe partagé. D'où les entretiens. On les prépare à partir des trous de l'inventaire, et on envoie le schéma provisoire : on corrige plus volontiers un schéma qu'on ne décrit son travail à partir de rien. On pose des questions ouvertes : « Racontez-moi une journée type », « Que faites-vous quand l'application ne répond pas ? ». La plus productive est souvent la dernière : « Qu'est-ce que je n'ai pas demandé et que je devrais savoir ? ». Un compte rendu court, envoyé dans les 48 heures et validé par l'interlocuteur, devient une source citable."}, {"cue": "Bandeau du bas", "text": "Pour le D2, vous n'avez ni entretien ni outil de collecte. Le dossier de présentation de Medisecure joue le rôle de l'existant : c'est votre seule source de faits, et chaque fait se cite avec sa section. Ce que vous ne pouvez pas vérifier, vous le dites en partie 6 : quels entretiens, quels outils faudrait-il pour le confirmer ?"}], "words": 342}, {"n": 40, "title": "Quatre attributs de sécurité, sept champs par flux", "paras": [{"cue": "Titre", "text": "L'inventaire applicatif est la pièce maîtresse de la cartographie : c'est l'annexe A. Chaque application y occupe une ligne, avec au moins dix attributs en plus de son nom. Quatre sont des attributs de sécurité exigés par le D2 : les besoins de sécurité, l'exposition à Internet, l'hébergement et l'état du support. Le tableau en montre un extrait chez Kestrel."}, {"cue": "Les colonnes du tableau", "text": "Les besoins de sécurité se notent DICT : disponibilité, intégrité, confidentialité, traçabilité. Kestrel les cote de 1 à 4 ; la disponibilité vient des besoins exprimés par les directions, le reste est à valider avec les métiers. Les autres colonnes prennent leurs valeurs dans des listes fermées : pour l'hébergement, salle interne, cloud d'un hébergeur, SaaS du fournisseur, c'est-à-dire un logiciel fourni en ligne, ou poste ou terminal. Attention, l'état du support porte aussi sur les composants. RoutePro tourne sur SQL Server 2016, dont le support étendu a pris fin le 14 juillet 2026 : il est repéré comme reposant sur un composant hors support."}, {"cue": "Carte sombre « Annexe B »", "text": "Le détail des échanges va dans la matrice des flux, l'annexe B : au moins quinze flux, sept champs chacun. Source et cible sous leur nom exact ; données échangées, avec leur sensibilité ; format ; fréquence ; mode, automatique ou manuel ; protection du canal. Le flux FLX-02 de Kestrel en est un exemple : les tournées construites sous Excel sont saisies au clavier dans RoutePro, chaque soir. Quand une valeur manque, on écrit « non documentée », ou on pose une hypothèse numérotée. Chez Kestrel, le flux le plus critique, FLX-01, du Portail EDI vers RoutePro, n'a aucune protection documentée : c'est déjà un constat."}, {"cue": "Bandeau du bas", "text": "L'annexe A comprend aussi au moins un usage hors inventaire, ce qu'on appelle l'informatique fantôme : un outil utilisé sans être connu ni validé par la DSI. L'inventorier ne revient pas à l'approuver ; c'est rendre visible un risque. Le chapitre 4 présente enfin l'annexe C, la matrice processus × applications, et l'annexe D, l'inventaire de l'infrastructure, que vous ouvrirez plus tard."}], "words": 334}, {"n": 41, "title": "Prenez la fiche FT 10 : inventaire applicatif et flux", "paras": [{"cue": "Titre", "text": "Fiche FT 10. Elle vous entraîne exactement au travail de l'atelier : un inventaire et une matrice des flux, mais sur Kestrel."}, {"cue": "Consigne", "text": "Vous assistez le chef de projet applicatif. Les sources sont de natures différentes : deux entretiens et un relevé technique. Certains flux n'apparaissent que dans l'une d'elles. Utilisez les listes fermées du modèle, et calculez le taux de complétude de l'inventaire. Vous avez 75 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Un flux manuel est un flux : ne l'oubliez pas parce qu'aucune application ne le porte. Nous corrigerons la matrice des flux ensemble."}], "words": 94}, {"n": 42, "title": "Quatre anomalies à chercher systématiquement sur les vues", "paras": [{"cue": "Titre", "text": "Une vue n'est pas une fin : elle sert à voir ce qu'un tableau cache. Le cours demande de chercher systématiquement quatre anomalies, chacune sur une vue précise. Et c'est là que naissent vos constats de la section 2.8 : une relation entre plusieurs faits, que seule la mise en image révèle."}, {"cue": "Carte « Point unique de défaillance »", "text": "Un point unique de défaillance, single point of failure en anglais, est un élément dont la panne suffit à arrêter un service, faute de redondance ou de repli : un serveur, un lien, une salle, un fournisseur, une personne. Chez Kestrel, la vue physique en montre quatre : la salle serveur SAL-01, les liens RES-01 et RES-02 vers Moirans et Clermont-Ferrand, et la passerelle SEC-01. S'y ajoute un point humain : Romain Chevalier, seul à connaître la configuration du réseau. Attention au piège : le NAS de sauvegarde rangé dans la même pièce n'est pas un point unique de défaillance, puisque sa panne n'arrête rien. C'est un défaut d'isolement des sauvegardes, à signaler à part."}, {"cue": "Cartes « Flux manuel » et « Redondance et trou »", "text": "Les flux manuels se lisent sur la vue applicative, grâce aux traits pointillés : ce sont des ressaisies, donc des erreurs et des délais. Les redondances et les trous se lisent sur la vue fonctionnelle, avec les définitions des consignes vues ce matin."}, {"cue": "Carte rouge « Zone de confiance et franchissement »", "text": "Une zone de confiance regroupe des ressources auxquelles on accorde le même niveau de confiance : Internet, les prestataires, le réseau interne. Un franchissement est un passage autorisé vers une zone de niveau différent : un point de contrôle nécessaire et un chemin d'attaque possible. Le constat central chez Kestrel : FR-01 et FR-02, l'éditeur de RoutePro et les chauffeurs, entrent en permanence dans le réseau interne par SEC-01, une passerelle de réseau privé virtuel, ou VPN, dont une vulnérabilité critique a été c
