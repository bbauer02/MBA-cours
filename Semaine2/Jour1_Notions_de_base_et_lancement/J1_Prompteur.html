<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

</head>
<body>
<div id="stage" aria-label="Texte du prompteur">
  <article id="script"></article>
</div>
<div class="fade-top"></div><div class="fade-bot"></div>
<div id="guide" aria-hidden="true"></div>
<div id="progress"></div>
<div id="hud"><span id="where"></span><span id="left"></span></div>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>
</div>

<script>
const DATA = [{"n": 1, "title": "Systèmes d'information, cartographie et risques", "paras": [{"cue": "Titre au centre, face à la salle", "text": "Bonjour à toutes et à tous, et bienvenue dans la semaine S2. Nous ouvrons aujourd'hui la deuxième unité d'enseignement du cycle, l'UE2 : « Systèmes d'information, cartographie et risques ». En S1, vous avez appris à regarder ce qui change autour d'une organisation. Cette semaine, nous regardons à l'intérieur : comment elle fonctionne, comment son système d'information est construit, ce qui peut mal tourner, et ce qu'il vaut."}, {"cue": "Sous-titre", "text": "Mon objectif est le même qu'en S1. À la fin de la semaine, vous devez être capables de produire seuls votre dossier D2 pendant l'intersession : une cartographie du SI de Medisecure, une analyse de risques menée avec une méthode reconnue, et un diagnostic critique. Ce dossier, c'est l'état des lieux dont la direction de Medisecure a besoin avant d'écrire son schéma directeur."}, {"cue": "Mentionnez le cours et les consignes sur Moodle", "text": "Comme en S1, ce diaporama suit le cours rédigé que vous trouverez sur Moodle, chapitre par chapitre. Je vous présente les méthodes et les exemples ; le cours contient les détails, les gabarits et les exercices. Gardez-le ouvert à côté de vous, avec le livret des fiches de travail : après chaque notion clé, je vous demanderai de prendre la fiche correspondante et de la réaliser."}], "words": 197}, {"n": 2, "title": "Aujourd'hui : comprendre l'organisation avant son SI", "paras": [{"cue": "Titre", "text": "Nous entrons tout de suite dans le cours. Aujourd'hui, une seule question nous occupe : qu'est-ce qu'une organisation, et comment son système d'information la sert-il ? On ne cartographie bien que ce que l'on comprend ; c'est pourquoi la semaine commence par les notions de base, le chapitre 1 du cours."}, {"cue": "Ligne « Matin »", "text": "Ce matin, nous décrivons l'organisation avec le vocabulaire de la gestion : ses finalités, ses ressources, sa structure, puis sa chaîne de valeur et ses processus. Après chacune de ces deux notions, vous prendrez une fiche de travail sur Kestrel Logistique, la FT 01 puis la FT 02, et vous la réaliserez en séance, seuls ou à deux."}, {"cue": "Lignes « Après-midi »", "text": "Cet après-midi, nous passons au système d'information lui-même, à ses familles d'applications, puis à la stratégie et aux objectifs SMART, avec les fiches FT 03 et FT 04 et une étude de document. Nous terminons par le premier atelier sur Medisecure : vous situez l'organisation, sa chaîne de valeur et sa stratégie. Vous le commencez ici et vous l'achèverez en autonomie."}, {"cue": "Bandeau du bas", "text": "Pour travailler, gardez trois documents ouverts : le cours, le livret des fiches de travail et le dossier de présentation de Medisecure. Allons-y."}], "words": 193}, {"n": 3, "title": "Organisation, système d'information, stratégie : les notions de base", "paras": [{"cue": "Écran de chapitre", "text": "Passons au chapitre 1, les notions de base. Il ne suppose aucune connaissance en gestion. Vous savez ce qu'est une base de données ou une API ; on vous a rarement expliqué ce qu'est une chaîne de valeur ou un processus support. Or on ne cartographie pas un système d'information sans comprendre l'organisation qu'il sert."}, {"cue": "Sous-titre", "text": "Le chapitre suit trois temps : l'organisation, puis le système d'information, puis la stratégie qui oriente les deux. Il fixe le vocabulaire de toute la semaine. Écrire « SI » quand on parle seulement d'applications, ou « stratégie » quand on liste des projets, est l'erreur la plus fréquente. Après chaque temps, vous réaliserez une fiche de travail sur Kestrel."}], "words": 115}, {"n": 4, "title": "Une organisation : des finalités, des ressources, une structure", "paras": [{"cue": "Encadré sombre : la définition", "text": "Commençons par le mot le plus simple, et pourtant rarement défini : l'organisation. C'est un ensemble de personnes qui coordonnent leurs activités, selon des règles et une répartition des rôles, pour atteindre des finalités communes en mobilisant des ressources. Retenez les trois questions qu'elle pose. Ses finalités : pourquoi existe-t-elle ? Ses ressources : avec quoi agit-elle ? Sa structure : comment répartit-elle le travail et l'autorité ? Ajoutez qu'elle échange en permanence avec son environnement : clients, fournisseurs, autorités, concurrents."}, {"cue": "Carte de droite : Kestrel", "text": "Prenons Kestrel. Sa finalité est celle d'une entreprise : vendre un service de transport avec profit. Ses ressources se rangent en cinq catégories. Humaines : 300 salariés, dont 140 chauffeurs et 95 agents de quai. Financières : 42 millions d'euros de chiffre d'affaires et le soutien de son groupe. Matérielles : trois sites, 40 camions porteurs, 60 scanners de quai. Immatérielles : ses contrats avec la grande distribution, sa connaissance du réseau routier régional. Informationnelles, enfin : les adresses de 2,5 millions de livraisons par an, les historiques de tournées, les positions GPS. C'est cette dernière ressource qui nous occupe toute la semaine. Côté statut, Kestrel est une SAS, une société par actions simplifiée, filiale à 100 % du groupe familial Vidal Participations, qui nomme sa direction."}, {"cue": "Bandeau rouge", "text": "Le statut juridique fixe qui décide et qui peut recevoir les bénéfices. Une société peut verser des dividendes ; une association, régie par la loi de 1901, réinvestit ses excédents dans son objet ; une administration agit selon le droit public. Medisecure illustre un cas fréquent dans la santé : deux structures travaillent ensemble. L'association Medisecure Santé gère les centres ; la société Medisecure Services SAS porte les fonctions support, dont la DSI, et facture ses prestations à l'association par une convention annuelle. Ne décrivez donc jamais Medisecure comme une seule entreprise : la relation entre les deux structures doit apparaître sur la vue de l'écosystème."}], "words": 314}, {"n": 5, "title": "Le SI relie le système opérant au système de pilotage", "paras": [{"cue": "Figure : les trois rectangles", "text": "Pour situer le SI dans l'organisation, le modèle le plus utilisé dans l'enseignement français est celui de Jean-Louis Le Moigne, dans « La théorie du système général », paru en 1977. Il voit l'organisation comme un système, tourné vers des finalités et ouvert sur son environnement, et le décompose en trois sous-systèmes. Le système opérant réalise l'activité : il transforme des entrées en sorties. Le système de pilotage décide, fixe les objectifs et contrôle les résultats. Le système d'information fait le lien : il mémorise, traite et transmet les informations qui remontent vers le pilotage, et les décisions qui redescendent."}, {"cue": "Les flèches et les noms de Kestrel", "text": "Appliqué à Kestrel, cela donne la figure du chapitre 1. En bas, les quais, les chauffeurs, les camions : environ 9 000 colis par jour. En haut, le comité de direction, le directeur des opérations, les chefs de quai et les trois planificateurs. Au milieu, le SI : les ordres arrivent par le portail EDI, RoutePro les affecte aux tournées, KDriver remonte les preuves de livraison, TeleFleet les positions des camions. Regardez les flèches : pleines pour les flux physiques, en pointillés pour les flux d'information."}, {"cue": "Bandeau du bas : la panne de RoutePro", "text": "Le modèle aide déjà à voir des fragilités. Les planificateurs décident de l'affectation : ils relèvent du pilotage. Leurs fichiers Excel, eux, font partie du SI : ils sont inscrits au parc applicatif, mais tenus à la main, selon des règles que seules trois personnes connaissent. La panne de novembre 2024 montre l'autre face : 9 heures sans RoutePro, 2 300 colis livrés en retard. Le système opérant a continué à tourner, mais à l'aveugle. Question pour vous : dans votre entreprise d'alternance, que se passe-t-il quand le SI s'arrête une matinée ?"}, {"cue": "Retour à la figure : les limites du modèle", "text": "Gardez aussi la limite du modèle. Il présente l'organisation comme une machine bien réglée, alors que les décisions réelles se prennent aussi dans les couloirs. Et il ne dit rien de la manière dont le travail est réparti entre les services. Pour cela, il faut regarder la structure."}], "words": 327}, {"n": 6, "title": "La structure divise le travail, et elle façonne le SI", "paras": [{"cue": "Titre", "text": "La structure est la manière dont une organisation divise le travail et coordonne les personnes qui l'exécutent. Elle se lit sur l'organigramme, mais pas seulement : elle comprend aussi les règles de délégation, les comités et les circuits de décision."}, {"cue": "Tableau, ligne par ligne", "text": "Quatre grands types sont classiquement distingués. La structure fonctionnelle regroupe les personnes par métier : elle favorise l'expertise, mais ralentit les décisions transversales, et produit souvent des applications par fonction, mal reliées entre elles. La structure divisionnelle découpe par produit, par marché ou par région : chaque division a ses propres fonctions, d'où des doublons, et souvent plusieurs applications pour le même besoin. La matricielle croise métier et projet, avec une double hiérarchie. La structure en réseau confie une part de l'activité à des partenaires liés par contrat : elle multiplie les échanges de données avec l'extérieur, et pose la question de la sécurité des interconnexions."}, {"cue": "Ligne « Fonctionnelle » et ligne « En réseau »", "text": "Kestrel a une structure fonctionnelle : un directeur général entouré d'une direction administrative et financière, d'une direction des opérations, d'une direction commerciale et d'une direction des ressources humaines. Les trois sites s'ajoutent comme une dimension géographique, mais ce ne sont pas des divisions autonomes : ils dépendent du directeur des opérations. Kestrel a aussi un trait de structure en réseau, puisque le dernier kilomètre est confié à des sous-traitants."}, {"cue": "Bandeau du bas : Mintzberg", "text": "Henry Mintzberg, dans « The Structuring of Organizations », en 1979, propose une lecture plus fine : cinq configurations, selon la partie de l'organisation qui domine et le mode de coordination. Prenez-les comme des repères, pas comme des cases. Les quais de Kestrel fonctionnent comme une bureaucratie mécaniste : les gestes de tri, de scan et de chargement sont standardisés. La DSI, dix personnes coordonnées directement par leur directrice, ressemble à une structure simple. Les quatre développeurs, eux, s'ajustent mutuellement, comme une petite adhocratie : une méthode imposée d'en haut à cette équipe risquerait d'être mal reçue. Tout à l'heure, vous ferez le même raisonnement sur les centres de Medisecure."}], "words": 325}, {"n": 7, "title": "Prenez la fiche FT 01 : l'agence de Clermont en système", "paras": [{"cue": "Titre", "text": "Sortez votre livret de fiches de travail et ouvrez la fiche FT 01. Elle reprend tout ce que nous venons de voir : les ressources, les trois sous-systèmes de Le Moigne et la structure. Vous travaillez sur Kestrel, mais sur un site que le cours n'a pas décrit : l'agence de Clermont-Ferrand."}, {"cue": "Consigne", "text": "Vous êtes stagiaire à la DSI. Hélène Garnier prépare un déplacement à l'agence et vous demande de la décrire avec le vocabulaire de la gestion. Les quatre annexes vous donnent un entretien, des chiffres et un circuit. Les sept questions vont du relevé à l'argumentation ; l'une d'elles demande un petit calcul. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Terminez par le « Je retiens », sans regarder le cours : c'est votre rappel des définitions. Nous corrigerons ensemble à la fin du temps imparti."}], "words": 138}, {"n": 8, "title": "Chaque application se place sur la chaîne de valeur", "paras": [{"cue": "Figure : la flèche de Porter", "text": "Michael Porter, professeur à Harvard, a présenté la chaîne de valeur dans « Competitive Advantage », en 1985. L'entreprise y est vue comme une suite d'activités, dont chacune ajoute de la valeur pour le client et un coût pour l'entreprise. Les activités principales, en bas, créent, vendent et servent le produit : logistique d'entrée, production, logistique de sortie, commercialisation et vente, services. Les activités de soutien, en haut, les rendent possibles : infrastructure de l'entreprise, gestion des ressources humaines, développement technologique, approvisionnements. La différence entre la valeur créée et le coût de l'ensemble forme la marge, à la pointe de la flèche."}, {"cue": "Colonnes du bas, noms en bleu", "text": "Le modèle a été conçu pour l'industrie ; pour un service, on reformule. Chez un transporteur, la production, c'est le tri et la préparation des tournées. Regardez les noms en bleu : chaque application trouve sa place auprès de l'activité qui l'utilise. Le portail EDI en logistique d'entrée, StockFlow, RoutePro et les fichiers Excel en production, KDriver et TeleFleet en logistique de sortie, Kestrel Track dans les services. Kestrel Track et KDriver apparaissent aussi, sans couleur, dans le développement technologique : la DSI les produit et les maintient, ce qui est une autre activité que leur usage."}, {"cue": "Carte de droite", "text": "Ce que la chaîne de valeur apporte aussi à l'informaticien, c'est de voir les activités sans application dédiée. Chez Kestrel, la commercialisation n'a pas d'outil de gestion de la relation client : les demandes de devis arrivent par courriel depuis le site web. Notez la prudence du constat. Il ne dit pas encore s'il faut un outil ; il dit qu'une activité repose sur la messagerie. C'est exactement le ton du diagnostic que vous écrirez dans la partie 5 du dossier."}], "words": 280}, {"n": 9, "title": "Les processus se classent en pilotage, réalisation, support", "paras": [{"cue": "Titre", "text": "Pour décrire le travail réel, on utilise la notion de processus, que vous retrouverez dans la vue métier, section 2.3 du dossier. Un processus est un enchaînement d'activités qui transforme des éléments d'entrée en résultats ayant de la valeur pour un client, interne ou externe. Il a un début et une fin identifiables, des acteurs, et il manipule des informations."}, {"cue": "Tableau : les trois familles", "text": "On classe les processus en trois familles, selon un usage courant dans les démarches qualité qui appliquent l'approche processus promue par la norme ISO 9001. Les processus de pilotage orientent, décident, contrôlent : chez Kestrel, élaborer et suivre le plan « Cap 2029 ». Les processus de réalisation produisent la valeur pour le client : recevoir les ordres de transport, trier, planifier les tournées, livrer et prouver la livraison, informer, facturer. Les processus de support fournissent les ressources aux deux autres : la paie, la flotte, les achats, et le système d'information lui-même."}, {"cue": "Ligne « Réalisation »", "text": "Un processus traverse souvent plusieurs services ; c'est ce qui le distingue d'une fonction. La livraison d'un colis chez Kestrel part du commercial qui a signé le client, passe par les quais, la planification et le chauffeur, et finit à la comptabilité qui facture. Chaque passage de relais est un endroit où une donnée peut être ressaisie, perdue ou retardée : c'est là que votre cartographie trouvera des flux manuels. Un processus se décrit à plusieurs niveaux : le nommer, puis enchaîner ses activités avec leurs acteurs, puis détailler chaque tâche. Pour le D2, le deuxième niveau suffit pour deux processus ; les autres restent nommés et classés."}, {"cue": "Bandeau du bas, puis les parties prenantes", "text": "Les minimums de la vue métier sont dans le bandeau. Un dernier mot sur les parties prenantes, notion popularisée par Edward Freeman en 1984 : ce sont les personnes ou les groupes qui influencent l'organisation ou qui sont affectés par ses décisions. Pour le SI, chaque partie prenante externe est un point d'échange de données, donc une dépendance et un risque possible. Chez Kestrel, 70 % des ordres de transport arrivent par le portail EDI d'un prestataire. La directrice commerciale ne voit pas ce prestataire ; pourtant, son arrêt bloquerait l'essentiel de l'activité."}], "words": 354}, {"n": 10, "title": "Prenez la fiche FT 02 : chaîne de valeur et processus", "paras": [{"cue": "Titre", "text": "Prenez maintenant la fiche FT 02. Elle fait travailler la chaîne de valeur et la notion de processus, à partir d'un problème réel de Kestrel : le démarrage trop lent d'un nouveau client e-commerçant."}, {"cue": "Consigne", "text": "Vous êtes alternant à la DSI. Hélène Garnier vous demande de décrire ce processus, de le situer dans la chaîne de valeur et de repérer les passages de relais. Vous calculerez un délai de bout en bout et un taux de transformation. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Soyez précis sur le déclencheur et le résultat du processus : c'est ce qui le distingue d'une simple liste de tâches. Nous mettrons en commun le classement des processus."}], "words": 113}, {"n": 11, "title": "Le SI, ce sont aussi des personnes et des procédures", "paras": [{"cue": "Encadré sombre : la définition de Reix", "text": "Le terme « système d'information » est souvent employé comme simple synonyme d'informatique. La définition de référence dans l'enseignement français de gestion est celle de Robert Reix : un ensemble organisé de ressources, matériels, logiciels, personnel, données, procédures, qui permet d'acquérir, de traiter, de stocker et de communiquer des informations, dans et entre des organisations. La formulation exacte a varié selon les éditions de l'ouvrage : citez celle que vous consultez. Trois expressions comptent, et la dernière ne figure que dans certaines éditions. « Ensemble organisé » : un tas d'applications sans règles d'échange ne forme pas un système. « Personnel » et « procédures » : ceux qui saisissent, contrôlent et décident font partie du SI. « Entre des organisations » : le SI inclut les échanges avec les clients, les fournisseurs et les autorités."}, {"cue": "Carte de droite : SI et système informatique", "text": "D'où une distinction capitale. Le système informatique, ce sont les moyens techniques : serveurs, postes, réseaux, logiciels, bases de données. Il n'est qu'une partie du SI. Chez Kestrel, un inventaire limité au système informatique listerait RoutePro et Microsoft 365 ; il ne montrerait pas que la tournée du lendemain dépend de trois planificateurs disponibles chaque soir. De même, la ressaisie des temps de conduite de TeleFleet dans la paie est un flux du SI, manuel, que seul un regard sur le SI complet fait apparaître. Votre cartographie devra montrer ces flux manuels."}, {"cue": "Bandeau sombre", "text": "Le SI remplit quatre fonctions : collecter, mémoriser, traiter, diffuser ; une faiblesse peut se loger dans chacune. Il joue trois rôles : opérationnel, aide à la décision, coordination. Distinguez enfin donnée, information et connaissance. Une donnée est un fait brut : « 45,73 ; 4,92 ; 06:42 ». Une information la met en contexte : « le camion 17 était à Vénissieux à 6 h 42, avec 40 minutes de retard sur sa tournée ». Une connaissance permet d'agir : « les tournées du sud lyonnais prennent du retard chaque lundi matin ». Les règles de construction des tournées de Kestrel ne sont écrites nulle part : le départ d'un planificateur serait une perte de connaissance qu'aucune sauvegarde ne compense."}], "words": 349}, {"n": 12, "title": "Les familles d'applications aident à lire un parc", "paras": [{"cue": "Titre", "text": "Connaître les grandes familles d'applications vous aide à lire un parc : à repérer ce qui manque et ce qui fait doublon. Le tableau reprend celui du chapitre 1, avec la colonne Kestrel."}, {"cue": "Lignes ERP, CRM et SCM", "text": "L'ERP, progiciel de gestion intégré, couvre la comptabilité, les achats, la facturation, parfois les stocks et la paie, sur une base unique : chez Kestrel, l'ERP finance. Le CRM, gestion de la relation client, suit les prospects, les devis, les réclamations : Kestrel n'en a pas, nous l'avons vu sur la chaîne de valeur. La gestion de la chaîne logistique, SCM, regroupe des outils spécialisés : le TMS pour le transport, c'est RoutePro ; le WMS pour l'entrepôt, c'est StockFlow ; l'EDI, l'échange de données informatisé, c'est le portail par lequel arrivent 70 % des ordres."}, {"cue": "Lignes décisionnel, métier et bureautique", "text": "Le décisionnel, ou BI, produit tableaux de bord et analyses : Kestrel n'a pas d'application dédiée, seulement des tableaux Excel. Les applications métier sont propres à un secteur : le dossier patient informatisé, le DPI, en santé ; KDriver, Kestrel Track et TeleFleet chez Kestrel. Ajoutez la bureautique, et les outils de la DSI elle-même, comme l'outil de tickets. Une même application peut relever de deux familles : le TMS est à la fois un outil de la chaîne logistique et l'application métier du transporteur. Dans votre inventaire, dites quelle famille vous retenez, et tenez ce choix."}, {"cue": "Bandeau du bas", "text": "Une application se décrit aussi par son mode d'acquisition. Un progiciel est acheté à un éditeur et paramétré ; un développement interne est écrit par l'équipe de l'organisation ; un service SaaS est loué et utilisé en ligne, l'éditeur en assurant l'exploitation. Ce mode change la maîtrise que l'organisation garde sur ses données et sur la disponibilité. Enfin, n'oubliez pas les usages informels : un fichier sur un poste personnel, une messagerie instantanée, un service en ligne gratuit adopté sans en informer la DSI. Ils traitent des données de l'organisation ; le D2 vous demande d'en inventorier au moins un pour Medisecure."}], "words": 328}, {"n": 13, "title": "Prenez la fiche FT 03 : ce que la note sur le SI oublie", "paras": [{"cue": "Titre", "text": "Fiche FT 03, maintenant. Elle porte sur la distinction que je vous ai présentée comme capitale : le système d'information n'est pas le système informatique."}, {"cue": "Consigne", "text": "La directrice administrative et financière a rédigé une note sur le SI de Kestrel pour le conseil de l'actionnaire. Vous la relisez avec ce que vous avez observé à la cellule service client. Votre travail : montrer ce que la note oublie, les personnes, les procédures, les échanges informels. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "La dernière question vous demande une réponse à un dirigeant : courte, factuelle, sans jargon. Je lirai quelques réponses à voix haute."}], "words": 104}, {"n": 14, "title": "Les objectifs de Cap 2029 passés à la grille SMART", "paras": [{"cue": "Phrase du haut : Chandler", "text": "Troisième temps du chapitre : la stratégie. Pour juger si un SI est adapté, il faut savoir où l'organisation veut aller. Alfred Chandler, historien de l'entreprise, la définit dans « Strategy and Structure », en 1962, comme la détermination des buts et objectifs à long terme, l'adoption des actions à mener et l'allocation des ressources nécessaires. Une destination, un chemin, des moyens. Il a aussi montré que la structure suit la stratégie. C'est vrai du SI : un SI qui ne suit pas la stratégie devient un frein."}, {"cue": "Phrase du haut : la stratégie de Kestrel", "text": "On distingue trois niveaux : le groupe décide dans quels métiers investir, le domaine d'activité comment gagner dans ce métier, les fonctions, dont le SI, comment y contribuer. La vision dit ce que l'organisation veut devenir, la mission ce qu'elle fait et pour qui, les objectifs les étapes. Porter, en 1980, ajoute trois stratégies génériques : domination par les coûts, différenciation, focalisation. Kestrel se concentre sur une région avec une promesse de service : c'est une focalisation par la différenciation. Mais avec 3,1 % de marge, elle ne peut pas négliger ses coûts. Son SI est donc tiré dans deux directions : rendre le service visible et réduire les coûts d'exploitation."}, {"cue": "Tableau : les quatre objectifs", "text": "Un objectif utile se vérifie : c'est le rôle de la grille SMART, rappelée dans le bandeau. Le plan « Cap 2029 » a quatre objectifs. « Livrer à J+1 sur toute la région » est spécifique, mais sans indicateur ni valeur de départ. « Réduire de 20 % les kilomètres à vide » est chiffré, mais la référence n'est pas établie et le kilomètre à vide n'est pas défini. La part e-commerce part d'une valeur connue, 30 %, mais aucun plan commercial chiffré n'en montre le réalisme. ISO 14001 est vérifiable par un tiers, sans date de certification visée dans la période."}, {"cue": "Colonne de droite, puis bandeau", "text": "La dernière colonne est la plus utile pour vous : ce que chaque objectif exige du SI. Les quatre en exigent quelque chose. Trois d'entre eux s'appuient en partie sur des données déjà collectées, par KDriver et TeleFleet, mais non exploitées faute d'outil décisionnel. C'est un constat de diagnostic, formulé sans proposer de solution. Notez la règle du cours : un objectif sans date propre est « daté par défaut » par l'horizon du plan, ce qui est plus faible qu'une date fixée. Et retenez que votre dossier est un diagnostic : il prépare le choix stratégique, il ne le fait pas."}], "words": 404}, {"n": 15, "title": "Prenez la fiche FT 04 : lire le plan Cap 2029", "paras": [{"cue": "Titre", "text": "Dernière fiche du chapitre, la fiche FT 04. Elle reprend la définition de Chandler, les niveaux de stratégie et la grille SMART, sur des documents de Kestrel que la diapositive précédente n'a pas montrés."}, {"cue": "Consigne", "text": "Vous êtes alternant à la DSI et vous lisez trois documents. Vous testerez les objectifs un par un, puis vous calculerez un taux de croissance annuel moyen. La question finale vous demande ce que la stratégie exige du SI. Vous avez 60 minutes, seul ou à deux."}, {"cue": "Carte de droite", "text": "Gardez votre fiche : la même démarche vous servira dans l'atelier, pour les huit axes du plan Medisecure 2030."}], "words": 100}, {"n": 16, "title": "Réduire son SI à son serveur, c'est ignorer ses risques", "paras": [{"cue": "Document à gauche", "text": "Place à l'étude de document du chapitre 1. C'est un entretien fictif, écrit pour le cours, avec Gérard Morvan, qui dirige une menuiserie de 120 salariés près d'Angers. L'écran en montre un résumé ; lisez la version complète dans le cours. Je vous laisse 5 minutes pour la lire et pour noter en quelques lignes vos réponses aux quatre premières questions. Travaillez seuls d'abord ; nous faisons ensuite un tour de table, une question par personne, pendant une quinzaine de minutes."}, {"cue": "Questions 1 et 2", "text": "Sur la question 1, je veux entendre que le dirigeant confond SI et système informatique : le serveur, l'ERP, les ordinateurs. Avec la définition de Reix, il exclut au moins les personnes, les procédures et une partie des données : le carnet de cotes, les photos envoyées à l'atelier, la messagerie des commerciaux. Sur la question 2, faites jouer les notions de donnée, d'information et de procédure : les devis étaient des informations de l'entreprise, stockées hors du SI officiel, sans procédure de départ. Le problème a été révélé par une personne, mais c'est un problème de SI."}, {"cue": "Question 3", "text": "La question 3 porte sur le RGPD, le règlement général sur la protection des données. Faites distinguer les données personnelles des catégories particulières de données de l'article 9. Les coordonnées de 4 000 clients particuliers sont des données personnelles ; une fiche de paie aussi, et elle peut en révéler davantage. Demandez à la salle où se rangent exactement les fiches de paie, et laissez le débat s'ouvrir. Faites aussi remarquer la sauvegarde rapportée chez le neveu chaque vendredi : où sont ces données, et qui y accède ?"}, {"cue": "Questions 4 et 5", "text": "La question 4 réutilise la grille SMART que nous venons de voir : doubler le chiffre d'affaires en cinq ans est chiffré et daté, mais rien ne dit d'où l'on part ni comment on y arrive. Et « le numérique suivra » oublie la leçon de Chandler, alors que la clientèle change : vendre à des promoteurs immobiliers demandera d'autres devis, d'autres échanges, d'autres données. La question 5 est pour vous seuls : quel échange de votre entreprise passe par un canal informel, et le verriez-vous sur une cartographie limitée aux applications ? Ne citez rien de sensible à l'oral."}], "words": 368}, {"n": 17, "title": "Situez Medisecure : structure, chaîne de valeur, stratégie", "paras": [{"cue": "Titre et durée", "text": "Dernière diapositive de la journée : l'atelier. L'exercice du chapitre 1, « Situer Medisecure », est indispensable : son livrable devient la première version de votre section 1.1 et la base de votre vue métier. Sa durée indicative est de 2 h 30. Nous en faisons la plus grande partie maintenant ; vous le reprendrez en fin de première période de l'intersession pour rédiger la section 1.1. Vous travaillez seuls, car le dossier est individuel ; à la fin du premier temps, vous pourrez comparer à deux votre lecture des structures pendant dix minutes."}, {"cue": "Consigne, temps 1 et 2", "text": "Premier temps, la structure. Appuyez-vous sur les sections « Carte d'identité », « Structure juridique et effectifs », « Les 14 centres » et « Organisation » du dossier de présentation, et cherchez dans « Ce que disent les acteurs » un verbatim qui confirme ou infirme votre lecture. Deuxième temps, la chaîne de valeur : adaptez les activités principales de Porter à des soins de proximité, placez-y les applications de la section « Parc applicatif », repérez au moins une activité sans application dédiée. Classez ensuite les processus de la section « Activités et processus métier » en pilotage, réalisation et support, et complétez la liste pour atteindre les minimums de la section 2.3 des consignes."}, {"cue": "Consigne, temps 3", "text": "Troisième temps, la stratégie, à partir de la section « Plan Medisecure 2030 ». Reconstituez une vision et une mission, en signalant qu'il s'agit de reconstitutions. Passez les huit axes du plan à la grille SMART : lesquels ont une valeur de départ mesurée, une cible, une échéance ? Pour chacun, écrivez en une phrase ce qu'il exige du SI, et demandez-vous à quel niveau de stratégie il se situe, et qui l'a validé."}, {"cue": "Carte « Livrable »", "text": "Je passerai dans les rangs et je vérifierai trois choses : que chaque fait porte sa section entre parenthèses, que les deux structures juridiques et leur relation apparaissent dans votre tableau d'identité, et que votre tableau SMART distingue ce qui est mesuré de ce qui ne l'est pas. Je ne vous donnerai pas les réponses : le dossier est le vôtre. Pour demain, regardez dès ce soir Archi et draw.io, les deux outils que nous comparerons au Jour 2 : votre cartographie commence demain."}], "words": 369}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
