<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

<body>
<div id="stage" aria-label="Texte du prompteur">
  <article id="script"></article>
</div>

<div id="guide" aria-hidden="true"></div>
<div id="progress"></div>
<div id="hud"><span id="where"></span><span id="left"></span></div>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>
</div>

<script>
const DATA = [{"n": 47, "title": "Sécurité, risque et EBIOS Risk Manager : cadrer l'analyse", "paras": [{"cue": "Titre", "text": "Bonjour à toutes et à tous. Hier, vous avez appris à décrire le système d'information : ses vues, ses objets, ses flux, ses points uniques de défaillance. Aujourd'hui, on change de question. On ne demande plus « qu'y a-t-il dans le SI ? », mais « qu'est-ce qui peut lui arriver, et combien cela coûterait-il ? ». On passe de la carte au jugement."}, {"cue": "Sous-titre", "text": "Ce passage exige un vocabulaire précis. Dans la vie courante, on emploie « risque », « menace » et « vulnérabilité » à tort et à travers. Dans une analyse de risques, chacun de ces mots a un sens exact, et les confondre fausse tout le raisonnement. Nous allons donc poser les notions, les normes, le socle réglementaire et les échelles, puis entrer dans la méthode de l'ANSSI, l'Agence nationale de la sécurité des systèmes d'information : EBIOS Risk Manager. Tout cela prépare la partie 3 de votre dossier D2, l'analyse de risques. Gardez en tête une idée simple pour toute la journée : une analyse de risques ne vaut que par le fil qui la relie à votre cartographie."}], "words": 184}, {"n": 48, "title": "Le matin, les notions et la méthode ; l'après-midi, Medisecure", "paras": [{"cue": "Frise des cinq étapes", "text": "Voici le programme de la journée. La frise se lit de gauche à droite, et c'est aussi l'ordre dans lequel une analyse de risques se construit. D'abord les notions : les critères de sécurité, que l'on résume par le sigle DICT, puis le vocabulaire du risque. Ensuite les normes et le socle : ce que disent ISO/IEC 27001, 27002 et 27005, et quelles règles s'imposent déjà à une organisation avant même qu'elle analyse ses risques. Puis les échelles de gravité et de vraisemblance, et la matrice qui les croise. Enfin, la méthode EBIOS Risk Manager, avec ses principes et ses deux premiers ateliers."}, {"cue": "Carte « Matin »", "text": "Toute la matinée suit un seul exemple, Kestrel Logistique, le transporteur que vous connaissez depuis le début de la semaine. Vous verrez ses échelles, ses écarts au socle, ses valeurs métier, ses sources de risque. Nous ferons aussi une étude de document sur une attaque réelle contre un hôpital français : c'est le chapitre 5 qui la propose. Gardez le cours ouvert à côté de vous : les tableaux que je montre sont ceux des chapitres 5 et 6, parfois raccourcis pour l'écran. Quand je dis « le cours », c'est là que se trouvent les versions complètes, les définitions encadrées et les gabarits. Trois fiches de travail ponctuent la matinée : la FT 12 sur les critères de sécurité, la FT 13 sur la cotation, la FT 14 sur les ateliers 1 et 2. Je vous dirai à quel moment sortir chacune."}, {"cue": "Carte orangée « Après-midi », puis carte « Dossier D2 »", "text": "L'après-midi, vous passez à Medisecure avec trois ateliers. Je vous préviens tout de suite : le cours leur donne sept heures au total. Vous ne les finirez pas cet après-midi, et ce n'est pas le but. Le but est de les commencer ici, avec moi, pour que les questions de méthode soient réglées avant l'intersession. Ces trois ateliers alimentent les sections 3.1, 3.2 et 3.3 de votre dossier. Demain, nous terminerons la méthode avec les ateliers 3 à 5."}], "words": 325}, {"n": 49, "title": "Sécurité et risque : notions et cadre normatif", "paras": [{"cue": "Écran de chapitre", "text": "Nous ouvrons le chapitre 5. Il pose les fondations de l'analyse de risques : les notions, les normes, le socle réglementaire et les échelles. Le chapitre 6 les met ensuite en œuvre avec EBIOS Risk Manager. Les deux chapitres préparent ensemble la partie 3 du dossier."}, {"cue": "Sous-titre : ce que vous saurez faire", "text": "À la fin de ce chapitre, vous saurez exprimer un besoin de sécurité avec quatre critères, et décomposer un incident en actif, menace, vulnérabilité et impact. Vous saurez situer trois normes l'une par rapport à l'autre, et faire correspondre la démarche d'ISO/IEC 27005 avec les ateliers d'EBIOS Risk Manager. Vous saurez enfin identifier le socle de sécurité d'une organisation, en mesurer les écarts, et construire des échelles adaptées à son métier. Ce dernier point est le plus important pour votre dossier : sans échelles écrites à l'avance, aucune cotation ne tient."}], "words": 137}, {"n": 50, "title": "La sécurité protège quatre propriétés, pas des machines", "paras": [{"cue": "Titre", "text": "Première idée du chapitre, et elle surprend souvent : la sécurité de l'information ne protège pas des machines. Elle protège des propriétés de l'information et des processus qui l'utilisent. On les appelle critères de sécurité, ou besoins de sécurité quand on les exprime pour un élément donné."}, {"cue": "Bandeau d'introduction et colonne « Critère »", "text": "Il y en a quatre. La disponibilité, c'est être accessible et utilisable au moment voulu par une personne autorisée. L'intégrité, c'est être exact et complet, non modifié de façon illégitime. La confidentialité, c'est n'être accessible qu'aux personnes autorisées. La traçabilité, que l'on appelle aussi preuve, c'est pouvoir retrouver qui a fait quoi et quand. D'où les sigles DICT ou DICP. Les trois premiers viennent de la norme ISO/IEC 27000 ; le quatrième est un ajout courant des méthodes françaises."}, {"cue": "Colonne « Question à poser au métier »", "text": "Regardez la deuxième colonne : c'est la plus utile en entretien. Vous ne demandez pas à un directeur des opérations « quel est votre besoin d'intégrité ? ». Il ne saurait pas répondre. Vous lui demandez : « que se passe-t-il si les données sont fausses sans que vous le sachiez ? ». Chez Kestrel, la réponse est concrète : une commande EDI, c'est-à-dire reçue par échange de données informatisé, modifiée, et trente palettes partent à la mauvaise adresse."}, {"cue": "Bandeau du bas", "text": "Un même élément n'a pas les mêmes besoins sur chaque critère. RoutePro, l'application de gestion du transport, a un besoin de disponibilité très fort : les camions partent à 5 heures, et les directions tolèrent 2 heures d'arrêt au plus. Son besoin de confidentialité est moyen : un ordre de transport n'est pas un secret. À l'inverse, les données des destinataires ont un besoin de confidentialité élevé, car leur fuite exposerait Kestrel à une sanction de la CNIL. Vous avez déjà renseigné ces besoins dans l'inventaire applicatif du chapitre 4 : ils deviennent ici la matière première de l'analyse. La disponibilité, elle, s'exprimera en durée d'interruption admissible, la DMIA, que nous verrons demain au chapitre 8."}], "words": 321}, {"n": 51, "title": "Décomposer un incident montre où agir", "paras": [{"cue": "Bandeau d'introduction", "text": "Le langage courant dit « il y a un risque de piratage », sans préciser qui pirate, par quel moyen, ni avec quelles conséquences. Une analyse de risques fait l'inverse : elle décompose chaque risque en éléments distincts, que l'on peut vérifier et traiter séparément. La norme ISO 31000 définit le risque comme l'effet de l'incertitude sur les objectifs. En sécurité de l'information, c'est la possibilité qu'une menace exploite une vulnérabilité d'un actif et cause un impact. On le décrit comme un scénario, d'une cause à une conséquence, et on l'estime en combinant gravité et vraisemblance."}, {"cue": "Cartes « Valeur métier » et « Bien support »", "text": "Prenons la panne de novembre 2024 chez Kestrel : un disque du serveur de RoutePro lâche, l'affectation des tournées s'arrête 9 heures. L'actif, c'est tout ce qui a de la valeur. EBIOS Risk Manager le dédouble. La valeur métier est le processus ou l'information essentiels : ici « planifier les tournées ». Le bien support est l'élément du SI sur lequel elle repose : le serveur de virtualisation qui portait APP-01 RoutePro, dans la salle SAL-01. Retenez bien cette distinction : c'est le pont entre votre cartographie et votre analyse de risques. Les biens supports, ce sont vos objets de cartographie."}, {"cue": "Cartes « Menace » et « Vulnérabilité »", "text": "La menace est la cause potentielle : ici une panne matérielle, sans intention malveillante. La vulnérabilité est la faiblesse que la menace exploite : pas de stockage redondant, pas de bascule documentée vers l'autre serveur. Une menace sans vulnérabilité reste théorique ; une vulnérabilité sans menace crédible reste une faiblesse dormante. Et la vraisemblance, j'y insiste, n'est pas une prédiction : EBIOS Risk Manager la définit comme la facilité avec laquelle un attaquant décidé réussirait."}, {"cue": "Carte sombre « Impact », puis carte « Où agir »", "text": "L'impact est mesuré : 2 300 colis en retard et 38 000 euros de pénalités. Et voici l'intérêt de la décomposition : elle montre où agir. On ne supprime pas la menace, un disque finit toujours par tomber en panne. On traite la vulnérabilité, ou on réduit l'impact par une procédure dégradée. La même grille s'applique à la tentative de fraude au virement de septembre 2025 : la menace est un escroc, la vulnérabilité est l'absence de contre-appel avant un changement de coordonnées bancaires. Comme la fiche de Kestrel ne décrit pas cette procédure, le cours l'écrit comme hypothèse numérotée, H17, et non comme un fait. Une dernière remarque : les pannes et accidents relèvent surtout du socle et de l'analyse d'impact du chapitre 8 ; les scénarios d'EBIOS Risk Manager portent sur les attaques."}], "words": 407}, {"n": 52, "title": "Prenez la fiche FT 12 : qualifier les incidents de Kestrel", "paras": [{"cue": "Titre et bandeau vert", "text": "Avant d'aller plus loin, sortez la fiche de travail FT 12. Elle reprend exactement ce que nous venons de voir : les quatre critères de sécurité et la décomposition d'un incident. Vous la faites maintenant, en soixante minutes, seuls ou à deux."}, {"cue": "Consigne", "text": "La situation : nous sommes en janvier 2026, vous êtes stagiaire auprès de Romain Chevalier, le RSSI à temps partiel de Kestrel. Il veut que le bilan des incidents de 2025 parle le langage du risque, et non celui des pannes. Vous qualifiez chaque incident, puis vous décomposez les plus instructifs, et vous calculez l'écart entre l'interruption constatée et la durée tolérée par les métiers."}, {"cue": "Carte « À la fin de la fiche »", "text": "Terminez par l'encadré « Je retiens » : il reprend les définitions du cours avec des mots manquants. Nous mettrons en commun deux ou trois décompositions avant de passer aux échelles."}], "words": 138}, {"n": 53, "title": "Traiter un risque : quatre options, une acceptation écrite", "paras": [{"cue": "Bandeau d'introduction", "text": "Un même risque peut être estimé à trois moments. Le risque inhérent est estimé comme si aucune mesure n'existait : c'est le sens qu'il a en audit interne. Le risque initial, terme d'EBIOS Risk Manager, est le risque tel qu'il existe aujourd'hui, avec les mesures en place et leurs défauts. Le risque résiduel est celui qui subsiste après les mesures décidées. Ne confondez pas inhérent et initial : dans le cours et dans votre dossier, on parle de risque initial et de risque résiduel. Et un risque résiduel n'est jamais nul. Il doit être accepté par quelqu'un qui en a l'autorité : pour un risque significatif, c'est la direction, pas l'équipe technique qui a posé les mesures."}, {"cue": "Tableau, lignes « Réduire » et « Transférer »", "text": "Face à un risque, quatre options. La norme ISO/IEC 27005 parle de modifier, partager, éviter ou maintenir le risque ; le dossier D2 retient réduire, transférer, éviter et accepter. Réduire, c'est agir par des mesures, par exemple une copie des sauvegardes hors ligne. C'est l'option la plus fréquente, mais elle ne supprime jamais tout. Transférer, c'est faire porter une partie des conséquences par un tiers, typiquement un assureur. Attention à sa limite : une assurance rembourse, elle ne fait pas partir les camions et ne répare pas l'image."}, {"cue": "Lignes « Éviter » et « Accepter »", "text": "Éviter, c'est renoncer à ce qui crée le risque. Chez Kestrel, les chauffeurs ont un accès VPN au réseau interne uniquement pour déclarer leurs frais : le supprimer évite le risque, au prix d'un service. Accepter, c'est décider en connaissance de cause de ne rien faire de plus : par exemple, 24 heures d'arrêt de TeleFleet, la télématique, jugées tolérables par les opérations."}, {"cue": "Bandeau rouge du bas", "text": "Et voici le piège. Un risque que personne n'a traité n'est pas un risque accepté : c'est un risque ignoré. L'acceptation est une décision écrite, prise par un responsable identifié, avec un motif. Votre dossier en demande au moins une. Une phrase comme « risque accepté car le budget manque » est recevable si elle est assumée et datée. « Risque faible », sans autre explication, ne l'est pas. Question à la salle : dans votre entreprise d'alternance, savez-vous qui a le droit d'accepter un risque ?"}], "words": 355}, {"n": 54, "title": "ISO/IEC 27005 décrit la démarche, EBIOS RM la met en œuvre", "paras": [{"cue": "Carte de droite, en-tête « SMSI »", "text": "Une analyse de risques isolée vieillit vite. Les normes de la famille ISO/IEC 27000 l'insèrent dans un dispositif permanent : le système de management de la sécurité de l'information, le SMSI. C'est l'ensemble des politiques, responsabilités, processus et ressources par lesquels une organisation gère sa sécurité, selon la boucle planifier, faire, vérifier, agir. Ses exigences sont fixées par ISO/IEC 27001, dont l'édition en vigueur date de 2022. La transition depuis l'édition 2013 s'est achevée le 31 octobre 2025."}, {"cue": "Carte de droite, les trois normes", "text": "Distinguez bien les trois normes. 27001 fixe les exigences ; elle est certifiable, et son annexe A liste 93 mesures. 27002 détaille ces 93 mesures, réparties en quatre thèmes : organisationnelles, liées aux personnes, physiques et technologiques. Ce n'est qu'un catalogue, non certifiable. 27005, enfin, donne la démarche de gestion des risques. Chez Kestrel, personne ne demande de certificat, mais les clients de la grande distribution posent des questions de sécurité dans leurs appels d'offres : adopter la démarche sans viser le certificat est un choix fréquent pour une PME."}, {"cue": "Schéma : du contexte à l'acceptation", "text": "Le schéma reprend la figure du chapitre 5. Tout commence par l'établissement du contexte : périmètre, critères de risque, critère d'acceptation. Vient l'appréciation du risque, en trois activités : identifier, analyser, évaluer. Puis le traitement, et l'acceptation des risques résiduels. Sur les côtés, deux activités accompagnent tout le processus : la communication et la concertation, la surveillance et la revue. L'édition 2022 décrit deux approches pour identifier les risques : par les événements, qui part des sources de risque, et par les biens, qui part des actifs. Vous les reconnaîtrez demain, aux ateliers 3 et 4 : ce sont les scénarios stratégiques et opérationnels d'EBIOS."}, {"cue": "Bandeau « Pour votre dossier D2 »", "text": "Les consignes vous laissent le choix entre EBIOS Risk Manager et ISO/IEC 27005, à condition de produire des résultats équivalents. Le chapitre 5 contient un tableau de correspondance, activité par activité, avec son équivalent dans EBIOS Risk Manager : lisez-le. Mais sachez que la norme ne vous donne ni grille d'évaluation des parties prenantes, ni séquence d'attaque toute faite : il faudrait les construire et les justifier. C'est pourquoi le cours recommande EBIOS. Et quelle que soit la méthode, gardez un seul vocabulaire du début à la fin : « actif primordial » dans un tableau et « valeur métier » dans le suivant, c'est une erreur fréquente."}], "words": 381}, {"n": 55, "title": "Un écart au socle se prouve par un fait, sinon c'est une opinion", "paras": [{"cue": "Bandeau d'introduction", "text": "Toute organisation est soumise à des règles de sécurité avant même d'analyser ses risques : la loi, les contrats, les bonnes pratiques de son secteur, sa propre politique. EBIOS Risk Manager appelle cet ensemble le socle de sécurité. On liste les référentiels, on évalue l'état d'application de chacun, on relève les écarts. Et ces écarts ne restent pas dans un coin : ils deviennent souvent les vulnérabilités exploitées dans les scénarios."}, {"cue": "Colonne « Référentiel »", "text": "Quels référentiels ? D'abord le guide d'hygiène informatique de l'ANSSI, « Renforcer la sécurité de son système d'information en 42 mesures », version 2 de 2017 : c'est le minimum attendu de toute organisation. Ensuite le RGPD, le règlement général sur la protection des données, dès qu'il y a des données personnelles : son article 32 impose une sécurité adaptée au risque, son article 33 la notification d'une violation à la CNIL dans les 72 heures si possible. Pour la santé s'ajoute la certification HDS, hébergement de données de santé, référentiel en version 2 depuis 2024 ; elle ne concerne pas Kestrel. Enfin la PSSI, la politique de sécurité interne : une PSSI ancienne jamais révisée reste un référentiel, et son ancienneté est elle-même un écart."}, {"cue": "Lignes du tableau, colonnes « Constat » et « État »", "text": "Regardez la méthode sur Kestrel. On cite l'exigence, on décrit un constat appuyé sur un fait vérifiable, on qualifie : appliqué, partiellement appliqué, non appliqué. L'authentification multifacteur existe sur Microsoft 365, mais pour les cadres seulement : partiellement appliqué. L'éditeur de RoutePro dispose d'un accès VPN permanent : non appliqué. Les positions GPS de TeleFleet sont conservées sans durée définie : écart au RGPD. Notez que les biens portent leur nom de cartographie, identifiant compris. Un écart sans fait n'est qu'une opinion."}, {"cue": "Bandeau rouge sur NIS2", "text": "Un mot sur NIS2, la directive européenne 2022/2555. Elle étend les obligations de cybersécurité à la santé et aux services postaux et d'expédition, ce qui pourrait concerner Kestrel, point à confirmer. Les États devaient la transposer avant le 17 octobre 2024 ; la France ne l'a pas fait, et le projet de loi est toujours en discussion à la date du cours. Ne l'écrivez donc jamais de mémoire dans votre dossier : vérifiez sur le site de l'Assemblée nationale et sur Légifrance le jour où vous rédigez."}], "words": 366}, {"n": 56, "title": "Une gravité se lit sur une échelle ancrée dans les faits", "paras": [{"cue": "Titre", "text": "Une gravité n'a de sens que lue sur une échelle écrite à l'avance. Sans échelle, chacun note selon son intuition, et deux analyses du même risque divergent. Retenez la règle : l'échelle est définie avant toute cotation. La fiche méthode de l'ANSSI donne trois conseils : construire l'échelle avec les métiers, reprendre l'échelle de gestion des risques de l'organisation si elle existe, et choisir quatre niveaux, cinq seulement pour les organisations dont une crise toucherait tout un secteur ou une mission de l'État."}, {"cue": "Bandeau d'introduction et colonne « Finances »", "text": "Chez Kestrel, l'échelle a été construite avec la directrice administrative et financière et le directeur des opérations. Les seuils financiers sont ancrés sur la marge opérationnelle de 2025 : environ 1,3 million d'euros, soit 3,1 % de 42 millions. G4 commence donc à une année de marge. Ce n'est pas un chiffre au hasard : c'est un seuil que la direction comprend immédiatement. Les seuils d'activité, eux, sont ancrés sur l'heure de départ des camions et sur la panne de novembre 2024. Autrement dit, chaque frontière entre deux niveaux correspond à quelque chose que les directeurs ont déjà vécu ou déjà chiffré. C'est cela, une échelle propre à l'organisation : elle parle la langue de ceux qui l'utiliseront."}, {"cue": "Colonnes d'impact, lignes G1 à G4", "text": "Quatre dimensions ici : les livraisons, les finances, le juridique, l'image et les personnes. Chaque case est un descripteur concret, chiffré quand c'est possible. Et la règle de lecture est simple : une seule dimension atteinte suffit à classer l'événement à ce niveau. Une fuite de données de destinataires est G3, même si elle ne coûte rien sur le moment. Pour Medisecure, attention : la grille du D2 impose cinq dimensions, dont la santé des patients. Vous ne pouvez pas reprendre ces quatre colonnes."}, {"cue": "Bandeau sombre du bas", "text": "Dernière étape, indispensable : tester l'échelle sur un incident réel. La panne de novembre 2024 donne G2 : 9 heures, moins d'une journée, 2 300 colis, 38 000 euros, tout reste sous les seuils de G3. Les directeurs ont jugé ce niveau juste. Si le test avait donné G4, l'échelle aurait été trop sensible et aurait écrasé toutes les différences. Vous ferez le même test cet après-midi avec l'incident de Medisecure."}], "words": 356}, {"n": 57, "title": "La matrice croise les échelles et dit qui peut accepter", "paras": [{"cue": "Carte sombre de droite : V1 à V4", "text": "Passons à la vraisemblance. Le point de méthode est le suivant : on ne décrit pas une probabilité chiffrée, on décrit ce que l'attaquant doit faire pour réussir. V1, peu vraisemblable : il doit lever plusieurs protections efficaces, avec des moyens importants. V2, vraisemblable : l'attaque demande un vrai savoir-faire et la combinaison de plusieurs faiblesses. V3, très vraisemblable : la faiblesse est connue, documentée, et les outils existent. V4, quasi certain : un attaquant peu qualifié y arrive, ou le scénario s'est déjà produit. Les libellés reprennent ceux de l'échelle générique de l'ANSSI. Remarquez qu'aucun pourcentage n'apparaît. Dire « une chance sur dix » donnerait une fausse précision que personne ne pourrait justifier. Décrire l'effort de l'attaquant, en revanche, se vérifie : la faille est-elle publique, corrigée, exposée ?"}, {"cue": "Matrice, case G4 × V1 puis ligne G1", "text": "La matrice croise les deux échelles et donne quatre niveaux de risque. Regardez-la bien : elle n'est pas symétrique. Une gravité G4 donne un risque élevé même peu vraisemblable, et critique dès qu'elle est vraisemblable. Une gravité G1, elle, ne dépasse jamais le niveau moyen, même quasi certaine. C'est un choix assumé, qui traduit l'aversion de Kestrel pour l'arrêt total de ses livraisons. Pour Medisecure, vous pouvez faire un autre choix, à condition de l'écrire et de le justifier."}, {"cue": "Bandeau du bas : le seuil d'acceptation", "text": "La matrice ne suffit pas : il faut dire qui décide. C'est le seuil d'acceptation, fixé par la direction. Chez Kestrel, un risque faible peut être accepté par le responsable de l'infrastructure ; un risque moyen, par le comité de direction, avec un motif écrit ; un risque élevé ou critique doit être traité. Tant que son traitement est en cours, un risque élevé ne peut être accepté que temporairement, par le directeur général, avec une mesure compensatoire et une date de réexamen. Dans votre dossier, la matrice et ce seuil doivent figurer en section 3.1, avant le premier risque coté."}], "words": 310}, {"n": 58, "title": "Un hôpital paralysé : lire une crise avec les critères de sécurité", "paras": [{"cue": "Document à gauche", "text": "Nous terminons le chapitre 5 par une étude de document. C'est un cas réel, résumé dans le cours à partir de la presse professionnelle : la cyberattaque du centre hospitalier Sud Francilien, en août 2022. Je vous laisse cinq minutes pour lire la version complète, dans l'encadré ÉTUDE du chapitre 5, et pour noter une réponse courte à chacune des cinq questions. Travaillez seuls d'abord."}, {"cue": "Questions 1 et 2", "text": "Puis nous faisons un tour de table rapide, une question par personne. Sur la première question, je veux entendre les quatre critères. La disponibilité saute aux yeux : logiciels inaccessibles, retour au papier, patients orientés ailleurs. La confidentialité aussi : 11 gigaoctets publiés. Mais cherchez l'intégrité et la traçabilité : le texte dit que les bases métier n'ont pas été compromises. Sur la deuxième, faites remarquer que l'échelle de Kestrel n'a pas de dimension « santé des personnes » au sens des soins : une échelle hospitalière doit l'ajouter, et c'est justement l'une des cinq dimensions exigées pour Medisecure."}, {"cue": "Questions 3 à 5", "text": "La troisième question est la plus formatrice. Le texte ne dit rien de la porte d'entrée. Sans elle, impossible de nommer la vulnérabilité ni le bien support : on ne peut décrire que la menace et l'impact. Retenez-le : une décomposition incomplète se signale, elle ne s'invente pas. Pour la quatrième, je ne donne aucune réponse sur Medisecure : je vous demande seulement de comparer durée d'arrêt, exfiltration et coût rapporté à la taille de l'organisation. Sur la cinquième, laissez le débat s'ouvrir : refuser la rançon est une décision, mais elle se prépare avant la crise, pas pendant."}, {"cue": "Retour sur le titre", "text": "Pour conclure la discussion, je fais le lien avec la suite. Cette étude montre trois choses que vous retrouverez dans votre dossier. Une crise réelle touche plusieurs critères à la fois. Une échelle de gravité doit avoir des dimensions propres au métier, ici la santé des patients. Et une décomposition honnête signale ce qu'elle ignore. Le chapitre 5 rappelle que ces chiffres viennent de la presse et des communiqués de l'établissement : si vous les citez, vérifiez-les et donnez la source."}], "words": 344}, {"n": 59, "title": "Prenez la fiche FT 13 : coter quatre risques de Kestrel", "paras": [{"cue": "Titre", "text": "Deuxième fiche de la matinée : la FT 13. Elle vous fait manipuler les échelles et la matrice que nous venons de voir, avant que vous construisiez celles de Medisecure cet après-midi."}, {"cue": "Consigne", "text": "Vous assistez Isabelle Roux, la directrice administrative et financière. Romain Chevalier lui a signalé quatre risques hors de l'étude en cours : deux sur la paie, un sur le site web, un sur StockFlow. Pour chacun, vous citez le descripteur qui justifie le niveau de gravité et de vraisemblance, vous placez le risque sur la matrice, puis vous choisissez une option de traitement et vous désignez qui décide. Soixante minutes, seuls ou à deux."}, {"cue": "Carte « À la fin de la fiche »", "text": "Le piège à éviter : coter au jugé. Chaque niveau doit renvoyer à une phrase de l'échelle. Nous comparerons vos cotes ; quand elles divergent, c'est presque toujours un descripteur mal lu."}], "words": 138}, {"n": 60, "title": "Analyser les risques avec EBIOS Risk Manager", "paras": [{"cue": "Écran de chapitre", "text": "Nous ouvrons le chapitre 6, le plus long du cours. Il met en œuvre tout ce que nous venons de voir avec la méthode de l'ANSSI. Il suit une seule étude, conduite sur Kestrel, du premier au cinquième atelier : vous verrez comment les résultats d'un atelier deviennent les entrées du suivant. Ce matin, nous voyons les principes et les ateliers 1 et 2 ; demain, les ateliers 3 à 5."}, {"cue": "Sous-titre", "text": "Un avertissement dès maintenant. Les tableaux du chapitre sont simplifiés, et les consignes précisent que les livrables complets du guide de l'ANSSI ne sont pas exigés. Mais ces tableaux ne sont pas facultatifs : chaque colonne porte une information dont l'atelier suivant a besoin. Et l'étude Kestrel montre une manière de faire, pas la réponse. Un passage qui reprend la structure et les formulations de Kestrel en changeant seulement les noms ne rapporte aucun point."}], "words": 146}, {"n": 61, "title": "Cinq ateliers : les sorties de l'un nourrissent le suivant", "paras": [{"cue": "Carte de droite : la méthode", "text": "EBIOS signifie « Expression des besoins et identification des objectifs de sécurité ». La première méthode date de 1995. EBIOS 2010 était centrée sur les biens et leurs vulnérabilités. EBIOS Risk Manager, publiée par l'ANSSI en octobre 2018 avec le Club EBIOS, a renouvelé la démarche en partant de la menace et de l'écosystème. La version en vigueur est la 1.5, annoncée en mars 2024 ; le guide téléchargeable est daté de septembre 2024. Certains sites commerciaux parlent d'une version 2 : aucune source officielle ne la confirme. Citez donc la 1.5, avec sa référence exacte, en section 3.1. Le guide est complété par des fiches méthodes, mises à jour régulièrement, qui détaillent chaque étape avec des exemples."}, {"cue": "Carte de droite : conformité, puis scénarios", "text": "La méthode combine deux approches. L'approche par conformité vérifie d'abord le socle : elle traite les risques courants par les bonnes pratiques. L'approche par scénarios traite ensuite les attaquants motivés, qui contournent le socle. L'ANSSI le représente par une pyramide : la conformité protège contre la menace fréquente et peu élaborée, les scénarios servent pour la menace plus rare et plus sophistiquée."}, {"cue": "Schéma des cinq ateliers et flèches en pointillés", "text": "Le schéma reprend la figure du chapitre 6. Atelier 1 : que protège-t-on, et quelles règles s'appliquent déjà ? Atelier 2 : qui pourrait attaquer, et pour obtenir quoi ? Atelier 3 : par quels chemins, y compris par l'écosystème ? Atelier 4 : comment, concrètement, et avec quelle facilité ? Atelier 5 : que décide-t-on ? Regardez les flèches en pointillés : la gravité de l'atelier 1 sert à l'atelier 3, ses biens supports à l'atelier 4, ses écarts au socle à l'atelier 5. Et les deux boucles de retour : le cycle stratégique revisite toute l'étude à un rythme de quelques années, le cycle opérationnel revoit les scénarios et les mesures, souvent chaque année."}, {"cue": "Bandeau « Pour votre dossier D2 »", "text": "Pour le dossier, la correspondance est directe : un atelier, une section. L'atelier 1 remplit la section 3.2, et ainsi de suite jusqu'à l'atelier 5, section 3.6. La partie 3 présente les résultats et les choix ; les tableaux complets vont en annexe E. Pour outiller la méthode, un tableur et votre outil de cartographie suffisent. L'ANSSI labellise des logiciels, mais aucun ne réfléchira à votre place."}], "words": 363}, {"n": 62, "title": "Atelier 1 : ce que l'on protège, et à quel point c'est grave", "paras": [{"cue": "Carte de droite : VM1 à VM5", "text": "L'atelier 1 dit ce que l'on protège, à quel point c'est important, et quelles règles s'appliquent déjà. On commence par les valeurs métier, tirées de la vue métier : cinq à dix processus ou informations suffisent. Chez Kestrel, le groupe de travail en a retenu cinq, que vous voyez à droite : quatre processus et une information, les données des destinataires. Les valeurs métier sont sous la responsabilité des métiers ; les biens supports, sous celle de la DSI ou d'un tiers."}, {"cue": "Toujours la carte de droite : les biens supports", "text": "On relie ensuite chaque valeur métier à ses biens supports, en suivant la matrice processus × applications, puis la vue d'infrastructure. Par exemple, VM1 « Planifier les tournées » repose sur APP-01 RoutePro et sa base SQL Server 2016, sur SRV-01 et SRV-02, les deux serveurs de virtualisation, sur APP-09 Planification des tournées, et sur les planificateurs eux-mêmes : une personne est un bien support. Et la salle SAL-01, le NAS STO-01 et la passerelle SEC-01 servent toutes les valeurs métier. Un bien support partagé est un signal d'alerte : il concentre le risque. Règle du dossier : chaque bien support est un objet de votre cartographie, sous le même nom."}, {"cue": "Bandeau d'introduction et colonne « Événement redouté »", "text": "Viennent ensuite les événements redoutés. Lisez la formulation : « Tournées impossibles à affecter pendant deux à trois jours ». Pas « piratage de RoutePro ». L'événement redouté décrit la conséquence pour le métier, avec le critère atteint ; il ne dit ni qui attaque ni comment. Écrire une attaque à la place d'une conséquence est l'une des erreurs les plus fréquentes du chapitre 6."}, {"cue": "Colonne « Gravité », lignes ER1 et ER2", "text": "La gravité se lit sur l'échelle, avec les métiers, et elle reste attachée à l'événement dans tous les ateliers suivants. Le cours raconte la discussion sur ER1. Le directeur des opérations veut G4 : « sans RoutePro, on ne livre plus ». Romain Chevalier relit l'échelle avec lui. Deux jours d'arrêt dépassent G2 et correspondent exactement au descripteur de G3. G4 suppose un arrêt de plus de trois jours sur tout le réseau : c'est ER2. Le groupe retient G3 pour ER1, G4 pour ER2. Et la discussion fait apparaître un mode dégradé sur Excel, écrit nulle part : il est noté comme mesure existante à formaliser. L'atelier se termine par le socle et ses écarts, ceux que nous avons vus tout à l'heure."}], "words": 382}, {"n": 63, "title": "Atelier 2 : qui attaquerait, pour obtenir quoi, et le croit-on ?", "paras": [{"cue": "Titre", "text": "L'atelier 2 identifie qui pourrait vouloir atteindre les valeurs métier, et dans quel but. On ne parle pas encore de moyens techniques. Une source de risque est une personne, un groupe ou une organisation susceptible d'engendrer un risque : groupe cybercriminel, escroc, concurrent, salarié malveillant, militant, État. L'objectif visé est ce qu'elle cherche : extorquer, revendre, saboter, se venger. On raisonne sur le couple, noté SR/OV, parce qu'une même source peut poursuivre plusieurs objectifs. Les entrées sont les valeurs métier, les incidents passés et la veille sur la menace, par exemple le panorama de la cybermenace de l'ANSSI, que vous avez rencontré en S1."}, {"cue": "Bandeau d'introduction et colonne « M · R · A »", "text": "La démarche a trois temps. On dresse d'abord une liste large, sans censure. On évalue ensuite chaque couple selon des critères explicites : la motivation de la source, ses ressources, c'est-à-dire son argent, ses compétences et ses outils, et son activité, ce que l'on sait de ses attaques récentes contre des organisations comparables. Chez Kestrel, chaque critère est coté de 1 à 3, et la somme donne la pertinence. On retient enfin les couples les plus pertinents, en général trois à cinq."}, {"cue": "Lignes SR1 à SR3 et colonne « Justification »", "text": "Regardez la dernière colonne, c'est elle qui rapporte les points. Chaque couple retenu s'appuie sur un fait ou une source. SR1, le rançongiciel : le panorama de l'ANSSI compte les PME et les ETI parmi les premières victimes, et un arrêt de RoutePro au-delà de 2 heures pousse à payer. SR2, l'escroc : la tentative de septembre 2025 est un fait vécu, la meilleure justification qui soit. SR3 : les données de 2,5 millions de livraisons par an se revendent pour des campagnes de SMS frauduleux « colis en attente »."}, {"cue": "Lignes SR4 à SR6, puis bandeau du bas", "text": "Un couple écarté n'est pas oublié : on écrit pourquoi. C'est la preuve que la question a été posée. Et l'exclusion peut se discuter. Isabelle Roux, la DAF, conteste celle de SR5 : des chauffeurs licenciés auraient gardé leur accès VPN. Romain Chevalier vérifie : c'est exact pour l'un des trois. Le groupe maintient la pertinence faible, mais il ajoute un écart au socle, « comptes non désactivés au départ », qui sera traité à l'atelier 5. L'atelier 2 a enrichi l'atelier 1 : la méthode est itérative. Question pour vous : dans votre entreprise, qui vérifie que les comptes sont fermés au départ d'un salarié ?"}], "words": 384}, {"n": 64, "title": "Prenez la fiche FT 14 : ateliers 1 et 2 sur le e-commerce", "paras": [{"cue": "Titre", "text": "Avant de lancer les ateliers sur Medisecure, une dernière fiche ce matin : la FT 14. Elle vous fait refaire les ateliers 1 et 2 sur Kestrel, mais sur un autre périmètre que celui de l'exemple : l'activité e-commerce, à l'entrepôt de Moirans."}, {"cue": "Consigne", "text": "Hélène Garnier lance une étude complémentaire ; Romain Chevalier anime, et vous préparez les tableaux. Vous identifiez les valeurs métier, vous les reliez à des biens supports nommés comme dans la cartographie, vous formulez les événements redoutés et vous cotez leur gravité. Puis vous évaluez les couples source de risque et objectif visé, et vous justifiez par des faits ceux que vous retenez et ceux que vous écartez. Soixant  ne pourra être justifiée, et la matrice comme le seuil d'acceptation doivent être définis avant d'être utilisés."}], "words": 256}, {"n": 66, "title": "Deuxième atelier : valeurs métier et événements redoutés", "paras": [{"cue": "Titre et deux premières lignes de la consigne", "text": "Deuxième atelier : l'atelier 1 d'EBIOS sur Medisecure. Partez de votre vue métier et des sections « Activités et processus métier » et « Données et échanges ». Choisissez au moins cinq valeurs métier, dont au moins une liée aux soins et une liée à la télésurveillance. Reliez-les à au moins dix biens supports pris dans votre cartographie. Si un bien d'infrastructure n'est pas encore dessiné, créez-le d'abord dans votre outil, avec son nom définitif, puis reprenez ce nom ici."}, {"cue": "Troisième et quatrième lignes de la consigne", "text": "Formulez ensuite au moins six événements redoutés, comme des conséquences pour le métier, jamais comme des attaques. Pour chacun, décrivez les impacts et lisez la gravité sur l'échelle que vous venez de construire, en citant le descripteur qui la justifie. Les deux questions finales sont là pour vous faire réfléchir : un bien support partagé concentre le risque, et un événement qui touche la santé des patients n'a pas le même poids qu'un événement qui touche seulement l'activité."}, {"cue": "Carte « Livrable »", "text": "Vous travaillez seuls. En passant, je vérifie trois choses : que vos biens supports portent exactement le nom de vos objets de cartographie, que vos événements redoutés sont écrits du point de vue du métier, et que chaque gravité cite un descripteur de votre échelle. Si je lis « piratage » dans la colonne des événements redoutés, je vous le signalerai. Un conseil pour l'ordre de travail : écrivez d'abord vos valeurs métier et vos biens supports, montrez-les à votre voisin, puis passez aux événements redoutés. Le regard d'un autre repère vite un bien support qui manque ou un nom qui ne correspond pas à la cartographie. Le tableau des écarts au socle, vous l'avez déjà : il est repris tel quel."}], "words": 280}, {"n": 67, "title": "Troisième atelier : les sources de risque de Medisecure", "paras": [{"cue": "Titre et consigne", "text": "Troisième atelier, le plus court : l'atelier 2. Dressez une liste d'au moins cinq couples source de risque et objectif visé. Pensez aux attaquants qui visent les données de santé, à ceux qui veulent interrompre les soins pour obtenir une rançon, et à ceux qui exploitent les usages non encadrés. Évaluez chaque couple avec la motivation, les ressources et l'activité, selon un barème que vous écrivez avant de coter, en section 3.1."}, {"cue": "Troisième ligne de la consigne", "text": "Retenez-en au moins trois, et justifiez chaque choix par un fait du dossier de présentation, ou par une source publique citée en annexe H, comme le panorama de la cybermenace de l'ANSSI ou l'observatoire du CERT Santé. Justifiez aussi chaque exclusion. La dernière question vous aide à argumenter : réfléchissez à la valeur des données pour celui qui les vole. Et souvenez-vous de l'exemple de Kestrel : un couple écarté peut révéler un écart au socle. Si cela vous arrive, ajoutez cet écart à votre tableau de l'atelier 1 : c'est le caractère itératif de la méthode, et c'est un signe de rigueur."}, {"cue": "Carte « Livrable »", "text": "Si vous n'avez pas le temps de commencer cet atelier aujourd'hui, ce n'est pas grave : il se termine en autonomie. Mais avant de partir, relisez votre échelle : c'est elle que tout le reste utilisera. Demain, nous continuons avec les ateliers 3 à 5."}], "words": 220}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);

stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {

if (store.get("wide", false)) toggle("wide", "wide");

</script>
