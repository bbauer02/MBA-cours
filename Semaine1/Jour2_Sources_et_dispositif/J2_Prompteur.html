<!doctype html>

<head>

<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

<body>
<div id="stage" aria-label="Texte du prompteur">
  <article id="script"></article>
</div>
<div class="fade-top"></div><div class="fade-bot"></div>
<div id="guide" aria-hidden="true"></div>
<div id="progress"></div>
<div id="hud"><span id="where"></span><span id="left"></span></div>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>
</div>

<script>
const DATA = [{"n": 22, "title": "Trois distinctions indépendantes pour caractériser une source", "paras": [{"cue": "Titre", "text": "Le chapitre 3 traite du « où chercher ». Une veille vaut ce que valent ses sources : un dispositif bien outillé mais alimenté par des blogs anonymes produit des erreurs à grande vitesse. À l'inverse, une vingtaine de sources primaires bien choisies couvre souvent l'essentiel."}, {"cue": "Les trois lignes Origine, Mode de production, Coût", "text": "Trois distinctions permettent de caractériser une source, et elles sont indépendantes. Selon l'origine, une source primaire produit l'information, une source secondaire la rapporte ou la commente. Selon le mode de production, une source formelle publie un contenu validé et daté, une source informelle circule par des canaux moins contrôlés, comme un salon ou un forum. Selon le coût, enfin, elle est gratuite ou payante, et le coût n'est pas un indicateur de fiabilité."}, {"cue": "Phrase en italique sous les cartes", "text": "Retenez surtout ceci : une source secondaire est utile pour détecter et comprendre, elle ne suffit jamais pour prouver."}, {"cue": "Chaîne de droite, du post LinkedIn jusqu'à l'avis de l'éditeur", "text": "D'où le réflexe de remonter la chaîne, illustré à droite. Un post LinkedIn annonce une faille critique sur les routeurs 4G. Il renvoie à un article de presse, qui résume un avis du CERT-FR, qui lui-même s'appuie sur l'avis de l'éditeur et la fiche CVE. L'information se déforme à chaque reprise. Le veilleur remonte jusqu'à l'origine, et c'est celle-là qu'il cite."}], "words": 199}, {"n": 23, "title": "Le socle : primaire, gratuit, à l'autorité indiscutable", "paras": [{"cue": "Titre", "text": "Les sources institutionnelles forment le socle d'une veille réglementaire et de cybersécurité. Elles sont primaires, gratuites pour la plupart, et leur autorité ne se discute pas."}, {"cue": "Grille des douze sources, ligne par ligne", "text": "Pour les données, la CNIL et le Comité européen de la protection des données. Pour la cybersécurité, l'ANSSI, le CERT-FR qu'elle opère, et l'ENISA au niveau européen, qui gère depuis mai 2025 une base européenne des vulnérabilités, l'EUVD. Pour la santé, l'Agence du numérique en santé, le CERT Santé qui lui est rattaché, la HAS et l'ANSM. Pour le droit, Légifrance côté français et EUR-Lex côté européen, sans oublier la Commission européenne pour les lignes directrices de l'AI Act."}, {"cue": "Restez sur la grille", "text": "Leur défaut n'est pas la fiabilité, c'est le volume : elles publient beaucoup, dans des formats variés, et ne disent pas toujours ce qui a changé."}, {"cue": "Bandeau orange du bas", "text": "Deux remarques pratiques. D'abord, les adresses changent. Le CERT-FR est passé de cert.ssi.gouv.fr à cert.cyber.gouv.fr : un flux configuré sur l'ancienne adresse peut cesser de fonctionner sans prévenir. Vérifiez régulièrement que vos flux sont vivants. Ensuite, une autorité publie aussi de la vulgarisation : une fiche pratique de la CNIL n'a pas la valeur juridique d'une délibération. Notez toujours le type de document."}], "words": 194}, {"n": 24, "title": "Une norme se cite toujours avec sa version", "paras": [{"cue": "Carte de gauche « Les sources des producteurs »", "text": "La veille technologique repose sur les sources des producteurs. La documentation officielle et les notes de version disent ce qui change, ce qui est déprécié et ce qui ne sera plus maintenu. Les avis de sécurité des éditeurs sont la source primaire d'une vulnérabilité. Les dépôts de code montrent l'activité réelle d'un projet : un projet libre dont le dernier commit date de deux ans est un risque, quelle que soit sa popularité passée."}, {"cue": "Ligne « endoflife.date » de la carte", "text": "Pour les cycles de vie, le site endoflife.date recense les fins de support de plusieurs centaines de produits, avec une API et des calendriers. C'est une source secondaire très fiable en pratique, mais une date critique se confirme toujours chez l'éditeur. C'est exactement ce qui aurait évité à Medisecure l'épisode Node.js 14."}, {"cue": "Tableau des référentiels à droite", "text": "À droite, les normes et référentiels à surveiller, avec leur version à la date de rédaction du cours. Trois points étaient incertains à cette date : la publication du RGAA 5, la citation au Journal officiel de l'EN 301 549 version 4, et les normes harmonisées de l'AI Act. Ce sont d'excellents sujets de veille."}, {"cue": "Encadré rouge en bas à droite", "text": "La règle d'or : une norme se cite avec son numéro complet, son année et ses amendements. Et ne confondez jamais une norme volontaire, comme l'ISO 27001, avec une obligation légale, comme le RGPD ou NIS2. La première aide à démontrer la conformité à la seconde ; elle ne la remplace pas."}], "words": 233}, {"n": 25, "title": "Une grille explicite : cinq critères notés de 0 à 2", "paras": [{"cue": "Titre", "text": "Le dossier exige des critères de fiabilité explicites. Deux traditions vous inspirent. Le test CRAAP, proposé en 2004 par une bibliothèque universitaire californienne, évalue un document selon l'actualité, la pertinence, l'autorité, l'exactitude et l'objectif. Le code dit « de l'Amirauté », utilisé par l'OTAN, cote séparément la source par une lettre et l'information par un chiffre."}, {"cue": "Tableau des cinq critères à gauche", "text": "La grille proposée dans le cours combine les deux. Cinq critères notés de zéro à deux : l'autorité, qui publie et avec quelle compétence ; l'origine, primaire ou reprise ; l'actualité ; la vérifiabilité ; l'objectivité, c'est-à-dire l'intérêt éventuel à orienter l'information. La pertinence est volontairement retirée : une source peut être très fiable et sans intérêt pour vos axes. On la traite à part, par l'axe de rattachement."}, {"cue": "Les cotes A, B, C, D à droite", "text": "Le total sur dix se traduit en une cote. A, de neuf à dix : la source peut fonder seule une information. B, sept ou huit : utilisable, à confirmer par une primaire pour toute décision. C, cinq ou six : elle sert à détecter, jamais à être citée seule. D, quatre ou moins : écartée, ou gardée comme simple capteur de signaux faibles, avec mention explicite."}, {"cue": "Phrase en italique sous le tableau", "text": "Vous pouvez adapter cette grille. Ce que le correcteur attend, c'est une grille annoncée avant d'être appliquée, et une note justifiée pour chaque source."}], "words": 216}, {"n": 26, "title": "Cinq sources candidates chez Kestrel, et ce qu'exige le dossier", "paras": [{"cue": "Graphique : barres CERT-FR, CNIL, fabricant", "text": "Voici la grille appliquée à cinq sources candidates chez Kestrel. Le flux des avis du CERT-FR obtient dix sur dix. La fiche de la CNIL sur la géolocalisation obtient neuf : elle perd un point en actualité, parce que sa date de mise à jour doit être contrôlée. Le fabricant des boîtiers obtient huit : il est la source primaire pour son produit, mais il publie de façon irrégulière et a intérêt à minimiser une faille, donc on recoupe avec le CERT-FR."}, {"cue": "Barres magazine (5) et LinkedIn (3), puis phrase sous le graphique", "text": "L'article du magazine qui annonce « moins vingt pour cent de kilomètres grâce à l'IA » obtient cinq : il reprend un communiqué d'éditeur sans lien vers l'étude. On le garde comme capteur, et on cherche l'étude d'origine. Enfin, le post LinkedIn qui affirme que NIS2 s'applique à tous les transporteurs obtient trois : il ne cite aucun texte et généralise. Le veilleur l'écarte, et ajoute à la place les sources primaires sur le sujet."}, {"cue": "Encadré sombre à droite : 20, > 50 %, Motif, RGPD", "text": "Toutes ces sources se rassemblent dans la cartographie, livrable central de votre partie 3, avec en annexe B le tableau complet. Le correcteur vérifie quatre choses : au moins vingt sources retenues et renseignées ; plus de la moitié de primaires, et au moins une primaire par axe ; les sources écartées avec leur motif ; et, pour chaque axe, le texte de référence et la source officielle, ainsi que le RGPD de chaque outil."}, {"cue": "Restez sur l'encadré", "text": "Une bonne cartographie n'est pas la plus longue. Trois newsletters qui relaient le même bulletin du CERT-FR n'en valent qu'une."}], "words": 252}, {"n": 27, "title": "Concentrer les sources en un point d'entrée, filtrer avant de lire", "paras": [{"cue": "Titre", "text": "Le chapitre 4 dit comment faire venir l'information sans y passer ses journées. Le principe est simple : concentrer le plus de sources possible en un seul point d'entrée, puis filtrer avant de lire."}, {"cue": "Les quatre colonnes, de gauche à droite", "text": "Le circuit de collecte compte quatre étages. Les sources publient. Des capteurs détectent les nouveautés : flux RSS, alertes par mots-clés, newsletters reçues sur une adresse dédiée, surveillance de pages, outils de suivi des dépendances et des vulnérabilités. Un point d'entrée unique les rassemble, en général un agrégateur, organisé en un dossier par axe, avec des règles et des filtres : c'est là que le veilleur trie. Enfin, les informations retenues sont stockées et partagées dans une base de connaissances."}, {"cue": "Bande en pointillé « Pull » sous les colonnes", "text": "Ce circuit combine les deux modes vus au chapitre 1. Le push domine : l'information arrive seule. Le pull reste nécessaire pour les sources sans flux et pour les recherches ponctuelles. Conseil pratique : automatisez le push, et réservez au pull un créneau fixe dans la semaine."}, {"cue": "Phrase en italique du bas", "text": "Ce schéma, vous devrez le dessiner pour Medisecure dans votre dossier, légendé, avec le nom de l'outil à chaque étape, ou la mention « manuel »."}], "words": 187}, {"n": 28, "title": "Des outils réels, décrits honnêtement", "paras": [{"cue": "Titre et colonne « Fonction »", "text": "Passons en revue les briques de l'outillage. Pour chaque fonction, plusieurs outils réels existent, et vous devez les décrire honnêtement, avec leurs limites."}, {"cue": "Ligne « Agrégateur »", "text": "L'agrégateur est l'outil central. Feedly, en gratuit, plafonne à cent sources et trois dossiers. Inoreader accepte cent cinquante flux, avec de la publicité. FreshRSS est un logiciel libre, à installer soi-même : il garde les données en interne, mais son coût réel, c'est le temps d'administration."}, {"cue": "Lignes « Alertes » puis « Vulnérabilités et fins de support »", "text": "Les alertes par mots-clés, avec Google Alerts ou Talkwalker Alerts, se livrent de préférence en RSS dans l'agrégateur. Pour les vulnérabilités et les fins de support : les flux du CERT-FR et du CERT Santé, OpenCVE pour s'abonner aux produits de son parc, endoflife.date, et Dependabot ou Renovate sur un dépôt de code. Notez que la base américaine NVD a restreint depuis avril 2026 l'enrichissement de ses fiches : beaucoup de CVE n'ont plus de score dans la NVD."}, {"cue": "Lignes « Pages sans flux », « Recherche assistée par IA », « Stockage »", "text": "Pour les pages sans flux, changedetection.io ou Visualping. Pour défricher un sujet, des outils de recherche assistés par IA comme Perplexity, à condition de vérifier chaque lien. Pour le stockage, l'outil déjà présent dans l'organisation est souvent le meilleur choix."}, {"cue": "Phrase en italique du bas", "text": "Ces offres changent souvent. Netvibes, longtemps utilisé comme agrégateur, a fermé en juin 2025. Vérifiez donc tout chiffre sur la page tarifaire de l'éditeur avant de l'écrire."}], "words": 215}, {"n": 29, "title": "Une alerte utile, des outils justifiés par cinq critères", "paras": [{"cue": "Titre", "text": "Deux méthodes pratiques sur cette diapositive."}, {"cue": "Colonne de gauche : les six étapes, puis l'exemple de requête", "text": "À gauche, la construction d'une alerte utile. La qualité d'une alerte dépend entièrement de sa requête. Une alerte sur « IA santé » produit des centaines de résultats inutiles. La méthode : on part d'une question du plan de veille, pas d'un thème. On choisit deux ou trois expressions exactes, entre guillemets. On ajoute des synonymes avec OR et on exclut le bruit avec le signe moins. On teste la requête dans le moteur avant de créer l'alerte. On choisit une livraison en RSS vers l'agrégateur plutôt que par courriel. Et après deux semaines, si plus de la moitié des résultats sont inutiles, on reformule ou on supprime."}, {"cue": "Colonne de droite : les cinq critères", "text": "À droite, les cinq critères qui justifient le choix d'un outil, et c'est précisément ce que vérifie le correcteur. Le coût, aujourd'hui et quand le dispositif grandira. L'hébergement des données : des mots-clés qui révèlent un projet confidentiel ne devraient pas être stockés n'importe où. Le RGPD : l'outil traite-t-il des données personnelles, avec quelles garanties ? Le partage : plusieurs personnes peuvent-elles lire et contribuer ? Et la pérennité, souvent oubliée : l'outil existera-t-il dans trois ans, et peut-on en sortir ? Vérifiez par exemple qu'un agrégateur permet d'exporter ses sources au format OPML. Un dispositif de veille doit survivre au départ de celui qui l'a monté."}], "words": 222}, {"n": 30, "title": "Un dispositif réel pour une organisation fictive, et ses preuves", "paras": [{"cue": "Titre", "text": "Voici maintenant la méthode pour monter un dispositif réel au service d'une organisation fictive. C'est l'exercice le plus important du Jour 2."}, {"cue": "Les sept étapes numérotées à gauche", "text": "Un : créez une adresse courriel dédiée à la veille, qui indique qu'il s'agit d'un exercice de formation, et ouvrez-y tous vos comptes. Deux : abonnez votre agrégateur à des flux réels, par exemple le flux du CERT-FR et celui des alertes du portail Cyberveille Santé. Trois : créez un dépôt de démonstration privé, avec des fichiers de dépendances qui reprennent exactement les versions citées dans l'état des lieux du RSSI de Medisecure, comme Django 2.2, Flask 2.0, Angular 12 ou React Native 0.63. N'ajoutez rien que le dossier ne cite pas, et écrivez dans votre dossier que c'est une reconstitution. Quatre : activez Dependabot ou Renovate ; les alertes porteront sur de vraies vulnérabilités. Cinq : abonnez-vous dans OpenCVE aux produits du parc de Medisecure. Six : créez votre base de connaissances, et expliquez ce qui changerait dans l'environnement réel de Medisecure. Sept : prenez vos captures, sans jamais y mettre de données de votre entreprise d'alternance."}, {"cue": "Encadré sombre à droite : 4 × 3, Date, 2 × 3, 2", "text": "À droite, ce que vérifie l'élément E7, le fonctionnement réel : une capture de chaque outil dans chacune des trois périodes, avec la date visible dans l'image et l'identifiant du compte ; au moins deux séances datées par période dans le journal ; et au moins deux ajustements datés et justifiés. Tout cela commence maintenant, pas le jour du rendu."}], "words": 240}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>

</body>
</html>
