<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>

<script>
const DATA = [{"n": 31, "title": "Traiter, analyser, surveiller", "paras": [{"cue": "Écran de partie : titre et liste des chapitres 5 à 7", "text": "Troisième partie : traiter, analyser et surveiller. C'est le cœur du Jour 3 et d'une partie du Jour 4. Le chapitre 5 transforme le flux collecté en informations notées. Le chapitre 6 dresse la carte des textes qu'un acteur de santé numérique doit suivre. Le chapitre 7 traite de l'axe cybersécurité et de la sécurité de l'IA. La collecte produit du volume ; c'est l'analyse qui produit de la valeur."}], "words": 70}, {"n": 32, "title": "Cinq étapes, du flux à l'information notée", "paras": [{"cue": "Chevrons des cinq étapes ; « Analyser » en orange", "text": "Le chapitre 5 décrit la chaîne qui transforme un flux de plusieurs centaines d'articles en quelques informations notées, vérifiées, prêtes à être diffusées. Elle compte cinq étapes, dans cet ordre : filtrer, vérifier, catégoriser, analyser, consigner. L'ordre compte, car il est inutile de vérifier une information hors sujet, ou de noter une information fausse."}, {"cue": "Chevron « Filtrer »", "text": "Le filtrage écarte ce qui ne sert aucun axe. Le critère n'est pas l'intérêt général d'une information, mais son lien avec un besoin identifié. Il se fait en deux passes. La première est rapide : on lit le titre et le chapeau, on décide en quelques secondes. La seconde porte sur les informations retenues : on lit le texte et on vérifie qu'il apporte un fait nouveau."}, {"cue": "Graphique en barres : 140, 22, 9", "text": "Le graphique montre une semaine chez Kestrel : cent quarante éléments remontés, vingt-deux après la première passe, neuf après la seconde. Dans un dispositif réaliste, la première passe élimine souvent plus de huit informations sur dix."}, {"cue": "Carte « Trois questions pour filtrer », puis phrase en italique", "text": "Trois questions suffisent pour décider. L'information touche-t-elle un axe ? Concerne-t-elle un actif, un projet ou une obligation de l'organisation ? Apporte-t-elle un élément nouveau par rapport à la base ? Et un exemple concret : sur cinq articles qui commentent la même alerte du CERT-FR, un seul est conservé, le bulletin du CERT-FR lui-même."}], "words": 212}, {"n": 33, "title": "Rien n'entre dans la base sans vérification", "paras": [{"cue": "Titre et les quatre cartes de gauche", "text": "Une information n'entre dans la base qu'après vérification. Celle-ci répond à quatre questions : qui le dit, d'où vient l'information, quand, et qui la confirme."}, {"cue": "Carte « D'où vient l'information ? »", "text": "La règle principale, c'est de remonter à la source primaire. Un article sur un texte européen renvoie au texte publié au Journal officiel de l'Union, sur EUR-Lex. Un billet sur une faille renvoie à l'avis de l'éditeur, au bulletin du CERT-FR ou à la fiche CVE. Tant que la source primaire n'est pas trouvée, l'information reste « à confirmer »."}, {"cue": "Frise des trois dates à droite", "text": "Deuxième règle, dater, et distinguer trois dates : celle de l'événement, celle de la publication, et celle de l'entrée en vigueur ou de l'application. Un règlement européen peut entrer en vigueur vingt jours après sa publication et ne s'appliquer que deux ou trois ans plus tard. Confondre ces dates est une erreur classique."}, {"cue": "Carte « Qui le dit ? », puis carte « Qui confirme ? »", "text": "Troisième règle, identifier l'auteur. Un cabinet qui publie une étude alarmante sur une menace vend souvent la solution. Cela n'invalide pas l'information, mais oblige à la recouper avec une source indépendante. Et attention : deux articles qui reprennent la même dépêche ne sont pas deux sources."}, {"cue": "Les trois niveaux de confiance, puis la phrase rouge", "text": "À l'issue de la vérification, on note un niveau de confiance : confirmé, probable, ou à confirmer. Et une information suggérée par un assistant d'IA suit exactement la même démarche."}], "words": 214}, {"n": 34, "title": "Une taxonomie courte, un lexique contrôlé", "paras": [{"cue": "Titre", "text": "Une information vérifiée doit pouvoir être retrouvée dans six mois. C'est le rôle de la catégorisation, qui repose sur deux outils : une taxonomie, c'est-à-dire une liste fermée de catégories, et des mots-clés, plus libres."}, {"cue": "Tableau : lignes « Axe » et « Catégorie » ; carte de droite du haut", "text": "La taxonomie reprend les axes du plan de veille comme premier niveau. Le second niveau précise le sujet : sous l'axe réglementation, on trouve par exemple données personnelles, cybersécurité, IA. Une taxonomie utile reste courte, une vingtaine de catégories au plus. Au-delà, chaque contributeur classe à sa façon."}, {"cue": "Ligne « Mots-clés » ; carte de droite du bas", "text": "Les mots-clés désignent des objets précis : un texte comme NIS2, un produit comme PostgreSQL 13, un actif de l'organisation. Pour éviter les doublons, on fixe une forme unique dans un petit lexique : « IA », et pas tantôt « intelligence artificielle », tantôt « AI »."}, {"cue": "Tout le tableau, puis la phrase en gras du bas", "text": "Le tableau montre les six champs d'indexation, avec un exemple Kestrel. Ce sont aussi les champs de votre base de connaissances. Et attention à un détail qui coûte des points : la taxonomie que vous décrivez dans votre dossier doit être exactement celle que montre la capture de votre base."}], "words": 181}, {"n": 35, "title": "Faible ou fort : une question de connaissance", "paras": [{"cue": "Note en italique sous le tableau (Ansoff)", "text": "La notion de signal faible vient d'Igor Ansoff, en 1975. Il montre que les surprises stratégiques sont souvent précédées d'indices précoces, imprécis, incomplets, et qu'on peut agir de façon graduée sans attendre une information complète."}, {"cue": "En-têtes du tableau : signal faible, signal fort", "text": "Un signal faible est une information fragmentaire, isolée ou ambiguë, qui peut annoncer un changement important. Un signal fort est une information claire, confirmée, dont les conséquences et l'échéance sont connues. Le signal faible demande une surveillance ; le signal fort demande une décision. La différence ne tient pas à l'importance du sujet, mais au niveau de connaissance. Et un même phénomène passe souvent de l'un à l'autre."}, {"cue": "Ligne « Exemple réel » : XZ Utils", "text": "L'exemple réel de XZ Utils est parlant. En 2022, sur la liste de diffusion du projet, le mainteneur unique évoque sa fatigue tandis que des comptes inconnus le pressent de céder la main : c'est un signal faible. En mars 2024, une porte dérobée est découverte dans la bibliothèque, avec des versions identifiées et des correctifs : c'est un signal fort."}, {"cue": "Encadré sombre à droite : les trois indices", "text": "Repérer un signal faible demande de croiser des indices. Chez Kestrel, trois indices en trois mois, aucun ne concernant directement ses camions, posent ensemble une question : les boîtiers resteront-ils connectés jusqu'à la fin de leur amortissement ? Le veilleur ouvre une fiche et interroge le fournisseur. Pour votre dossier, vous devrez classer un signal faible et un signal fort, et dire pour le faible quel fait le rendrait fort."}], "words": 234}, {"n": 36, "title": "La grille d'impact : six critères notés de 0 à 3, total sur 18", "paras": [{"cue": "Titre et colonne « Critère »", "text": "Une fois l'information vérifiée et classée, il faut décider de son importance. La grille d'impact rend ce jugement explicite, comparable et discutable. Le dossier exige au minimum cinq critères : l'impact pour l'organisation, la maturité, les gains, les risques et l'impact environnemental. Le cours y ajoute l'effort de mise en œuvre, indispensable pour passer ensuite à la recommandation."}, {"cue": "Colonnes « 0 » et « 3 »", "text": "Chaque critère est noté de zéro à trois avec un barème écrit. Sans barème, deux veilleurs donnent des notes différentes à la même information. Le tableau montre ce que valent zéro et trois pour chaque critère."}, {"cue": "Colonne « Sens »", "text": "Attention au sens de chaque critère, que les consignes vous demandent d'écrire. Une note haute est favorable pour l'impact, la maturité, les gains, l'environnement et l'effort, qui est noté à l'envers : trois veut dire effort très faible. En revanche, une note haute en risques signale un enjeu élevé, donc une urgence."}, {"cue": "Les trois seuils à droite : ≥ 14, 8 à 13, ≤ 7", "text": "Le total sur dix-huit sert à classer, pas à décider seul. Trois seuils simples aident à agir : à partir de quatorze, on diffuse rapidement et on instruit une recommandation ; de huit à treize, on intègre à la revue suivante ; à sept ou moins, on archive. Deux exceptions : une information à zéro en impact sort du périmètre, quel que soit son total ; une obligation applicable notée trois en impact est traitée en priorité, même si l'effort est lourd."}, {"cue": "Phrase en italique du bas", "text": "Dernier point : datez l'adoption de votre barème en première ligne de votre journal de veille, avant de l'appliquer."}], "words": 247}, {"n": 37, "title": "Trois informations notées chez Kestrel Logistique", "paras": [{"cue": "Graphique : les trois barres et leur légende", "text": "Voici la grille appliquée à trois informations de la semaine chez Kestrel."}, {"cue": "Première barre (CNIL, 15) et carte orange à droite", "text": "La première est la page de la CNIL sur la géolocalisation des véhicules des salariés. Elle rappelle que les salariés doivent pouvoir désactiver la géolocalisation en dehors du temps de travail. Or les boîtiers de Kestrel émettent en continu. Impact trois, car c'est une obligation légale ; maturité trois, la règle est applicable ; gains deux ; risques trois, sanction de la CNIL et contentieux prud'homal ; environnement deux, neutre ; effort deux, paramétrage et procédure RH. Total : quinze sur dix-huit. Elle passe le seuil : elle est diffusée et instruite comme recommandation."}, {"cue": "Deuxième barre (OR-Tools, 12) et carte bleue", "text": "La deuxième est une nouvelle version d'OR-Tools, la bibliothèque libre d'optimisation de Google. Impact deux, maturité trois, environnement trois parce que moins de kilomètres, c'est moins de carburant, mais effort un : projet de plusieurs mois pour une équipe sans expérience. Total douze."}, {"cue": "Troisième barre (start-up, 5) et carte grise", "text": "La troisième est le communiqué d'une start-up qui annonce une IA capable de prédire les pannes « avec quatre-vingt-dix-huit pour cent de précision ». Aucune référence vérifiable. Total cinq, archivée avec la mention « à confirmer »."}, {"cue": "Revenez face à la salle", "text": "Et retenez ceci : le correcteur ne vérifie pas que vous avez donné des notes, il vérifie que chaque note est justifiée par un fait du cas. « Impact trois » ne suffit pas. « Impact trois, car l'application concernée porte la télésurveillance, que les métiers ne peuvent arrêter plus de deux heures », voilà une note justifiée."}], "words": 244}, {"n": 38, "title": "Radar technologique et matrice impact × maturité", "paras": [{"cue": "Titre", "text": "Deux outils de positionnement complètent la grille."}, {"cue": "Radar à gauche : anneaux puis points 1 à 6 (légende sous le radar)", "text": "À gauche, le radar technologique, popularisé par la société de conseil Thoughtworks, qui en publie un deux fois par an depuis 2010. Il place chaque technologie sur quatre anneaux qui traduisent une recommandation, du plus engagé au plus prudent : adopter, essayer, évaluer, suspendre. Chez Kestrel, l'authentification multifacteur est à adopter, le solveur libre de tournées est à essayer sur une agence pilote, les boîtiers compatibles 4G et 5G sont à évaluer pour le prochain renouvellement, et le framework hors support est suspendu pour tout nouveau développement. Le radar de votre organisation n'est pas celui de Thoughtworks : une technologie peut être en « adopter » chez eux et en « évaluer » chez vous, parce que personne ne la maîtrise. Dans le dossier, le radar est facultatif ; la grille d'impact, elle, est exigée."}, {"cue": "Matrice à droite : Agir, Préparer, Opportunité, Ignorer", "text": "À droite, la matrice impact-maturité, qui sert à toutes les informations, y compris réglementaires. Elle croise deux critères de la grille. Impact fort et maturité forte : on agit, on instruit une recommandation. Impact fort et maturité faible : on prépare, on surveille de près. Impact faible et maturité forte : opportunité ponctuelle. Impact et maturité faibles : on ignore pour l'instant. Une obligation applicable dans six mois tombe dans « agir » ; une proposition de règlement encore discutée, dans « préparer ». Et les positions bougent avec le temps."}], "words": 233}, {"n": 39, "title": "Des ordres de grandeur justes et une méthode honnête", "paras": [{"cue": "Titre", "text": "Le dossier vous demande d'évaluer l'impact environnemental de chaque information. Cela ne demande pas d'expertise particulière, mais des ordres de grandeur justes et une méthode honnête."}, {"cue": "Graphique : 2,5 % puis 4,4 %, et la note en italique", "text": "Les ordres de grandeur d'abord. Selon l'étude ADEME-Arcep, le numérique représentait deux virgule cinq pour cent de l'empreinte carbone de la France en 2020. Une mise à jour de l'ADEME publiée en janvier 2025 porte cette part à quatre virgule quatre pour cent pour 2022, notamment parce qu'elle intègre les centres de données situés à l'étranger. En 2020, les terminaux pesaient près de quatre-vingts pour cent de l'empreinte, et la fabrication dominait l'usage. La leçon pratique est stable : prolonger la durée de vie des équipements pèse souvent plus que réduire leur consommation."}, {"cue": "Carte verte « Raisonner en cycle de vie », puis carte « Outils et ressources »", "text": "La méthode de référence est l'analyse du cycle de vie, normalisée par les ISO 14040 et 14044. Vous n'aurez pas à en conduire une, mais à raisonner en cycle de vie : une solution qui consomme moins mais impose de remplacer cent postes n'est pas forcément plus sobre. Pour chiffrer, la Base Empreinte de l'ADEME donne des facteurs d'émission officiels, le RGESN aide à juger la conception d'un service, et CodeCarbon estime les émissions d'un calcul."}, {"cue": "Les cinq étapes à droite, puis la phrase verte", "text": "La méthode tient en cinq étapes, à droite. Exemple Kestrel : le solveur de tournées tourne la nuit sur un serveur existant, l'ajout est faible, et quelques pour cent de kilomètres en moins sur quarante camions réduisent la consommation de gazole. Note trois, avec l'hypothèse écrite dans la fiche."}], "words": 244}, {"n": 40, "title": "La fiche de veille : un fait, une source, une analyse", "paras": [{"cue": "Titre", "text": "Toute information traitée se consigne dans une fiche de veille. C'est l'unité de base de la base de connaissances, et l'un des livrables du dossier. Une bonne fiche se lit en deux minutes et permet à un tiers de comprendre l'information sans relire la source."}, {"cue": "Gabarit de fiche à gauche, de haut en bas", "text": "Ses rubriques sont à gauche. Le titre dit le fait, pas le thème : « La CNIL impose de pouvoir désactiver la géolocalisation hors temps de travail », plutôt que « Géolocalisation ». Viennent ensuite les trois dates de l'information, la source primaire avec sa cote, et deux rubriques exigées par les consignes : la date de collecte avec l'outil qui l'a captée, et la date à laquelle vous avez vérifié l'information sur sa source primaire. Puis le résumé factuel, l'indexation, le type de signal, la notation justifiée, l'analyse pour l'organisation, la suite proposée et le statut."}, {"cue": "Ligne surlignée « Analyse pour l'organisation » ; carte de droite du bas", "text": "La rubrique surlignée, l'analyse pour l'organisation, est la plus importante. C'est elle qui fait la différence entre une revue de presse et une fiche de veille. Une revue de presse dit ce qui s'est passé ; une fiche de veille dit ce que cela change pour l'organisation, en citant ses actifs, ses projets, ses obligations."}, {"cue": "Carte de droite du haut « Annexe E »", "text": "Pour l'annexe E, trois fiches d'une page au plus, et leur choix n'est pas libre : elles portent sur des informations du premier tiers de votre grille, sur au moins deux axes. L'exercice du chapitre 5 vous fait noter cinq informations et rédiger la fiche de la mieux notée."}], "words": 246}, {"n": 41, "title": "Lire un texte en veilleur", "paras": [{"cue": "Titre", "text": "Le chapitre 6 n'est pas un cours de droit. C'est une carte, arrêtée à la date de rédaction du cours, des textes qu'un acteur comme Medisecure doit suivre, avec leur calendrier. Les points qui bougeaient encore sont formulés en questions de veille, à vérifier pendant l'intersession."}, {"cue": "Les trois cartes : Règlement, Directive, Textes d'application", "text": "Avant les textes, trois réflexes de lecture. Un règlement européen s'applique directement dans tous les États membres : son calendrier est connu, c'est le cas de l'AI Act. Une directive doit être transposée par une loi nationale : tant que cette loi n'existe pas, les entreprises ignorent ce qui leur sera précisément demandé. C'est pourquoi NIS2 reste en suspens en France. Enfin, un veilleur suit aussi les textes d'application : actes d'exécution, lignes directrices, normes harmonisées, qui disent concrètement quoi faire."}, {"cue": "Bandeau sombre : 1er août 2024 → décembre 2027", "text": "Et surtout, ne confondez jamais entrée en vigueur et application. L'entrée en vigueur, c'est le moment où le texte existe. L'application, c'est le moment où ses obligations deviennent exigibles. L'AI Act est entré en vigueur le 1er août 2024, mais ses obligations sur les systèmes à haut risque ne s'appliqueront pas avant décembre 2027. Dans votre dossier, citez toujours la date d'application de l'obligation dont vous parlez, avec l'article qui la fixe."}], "words": 199}, {"n": 42, "title": "Données personnelles et données de santé", "paras": [{"cue": "Titre", "text": "Commençons le panorama par les données."}, {"cue": "Carte de gauche « RGPD »", "text": "Le RGPD s'applique depuis mai 2018. Les données de santé y sont des données sensibles, au titre de l'article 9 : leur traitement est interdit sauf exception, par exemple pour la prise en charge médicale. Pour un acteur de santé, trois obligations pèsent particulièrement : un registre complet, une analyse d'impact pour les traitements à risque élevé, et la notification d'une violation à la CNIL sous soixante-douze heures. Le dossier Medisecure montre que ces trois points sont fragiles."}, {"cue": "Graphique des sanctions au centre, puis phrase rouge sous le graphique", "text": "La CNIL montre où elle place la barre par ses sanctions. Son bilan 2025 compte quatre-vingt-trois sanctions. En santé, huit cent mille euros contre Cegedim Santé en 2024, et cinq millions d'euros contre IQVIA en mai 2026, parce que des données présentées comme anonymes permettaient en réalité de suivre le parcours de soins d'un patient. C'est exactement la question que posera un futur entrepôt de données chez Medisecure. Côté transferts, les flux vers les États-Unis reposent sur le Data Privacy Framework, contesté devant la Cour de justice. Et le Cloud Act rappelle que la nationalité du fournisseur compte plus que le lieu du centre de données. Question de veille : l'omnibus numérique propose de modifier la définition de la donnée pseudonymisée ; ce n'était pas adopté à la date du cours."}, {"cue": "Cartes de droite : HDS puis EHDS", "text": "Pour les données de santé, l'hébergement est encadré par l'article L. 1111-8 du Code de la santé publique. Le référentiel HDS de 2024 impose des données stockées dans l'Espace économique européen, et la transition s'est achevée le 16 mai 2026. Enfin, l'Espace européen des données de santé, l'EHDS, s'appliquera à partir de mars 2027, avec des échéances en 2029 et 2031. Medisecure Connect relève-t-il de l'exception pour les dossiers développés en interne ? C'est à vérifier."}], "words": 291}, {"n": 43, "title": "Dispositifs médicaux et intelligence artificielle", "paras": [{"cue": "Titre", "text": "Deuxième bloc : les dispositifs médicaux et l'intelligence artificielle, deux réglementations qui s'emboîtent."}, {"cue": "Carte de gauche « Dispositifs médicaux »", "text": "Le règlement européen sur les dispositifs médicaux, le MDR, s'applique depuis mai 2021. Un logiciel est un dispositif médical lorsque son fabricant lui assigne une finalité médicale : diagnostic, surveillance, prédiction, traitement. La règle 11 classe ces logiciels, et un logiciel d'aide à la décision diagnostique ou thérapeutique est au moins de classe IIa, ce qui impose un organisme notifié. C'est l'une des questions ouvertes du dossier Medisecure. Les délais de transition ont été prolongés, et une révision ciblée a été proposée en décembre 2025 : à suivre."}, {"cue": "Frise AI Act à droite, de 2024 à 2026", "text": "L'AI Act classe les systèmes d'IA selon leur niveau de risque : pratiques interdites, systèmes à haut risque soumis à des obligations lourdes, systèmes soumis à transparence. Les systèmes à haut risque sont de deux familles : ceux de l'annexe III, définis par leur domaine d'usage, et ceux de l'annexe I, intégrés à des produits réglementés comme les dispositifs médicaux. Un logiciel d'IA qui est un dispositif médical de classe IIa ou plus est donc, en principe, à haut risque."}, {"cue": "Les deux dernières dates en orange : 2027 et 2028", "text": "Le calendrier a été modifié. D'après les sources consultées, le règlement 2026/1744 reporte le haut risque de l'annexe III au 2 décembre 2027, et celui de l'annexe I au 2 août 2028. Ces dates sont à confirmer sur EUR-Lex."}, {"cue": "Encadré sombre « Trois questions par projet d'IA »", "text": "Pour chaque projet d'IA de Medisecure, posez trois questions : est-ce un dispositif médical ? Son usage relève-t-il de l'annexe III ? Medisecure en est-elle le fournisseur ou le déployeur ?"}], "words": 251}, {"n": 44, "title": "NIS2, CRA, Data Act, accessibilité, numérique responsable", "paras": [{"cue": "Titre", "text": "Troisième bloc, la cybersécurité et les autres textes."}, {"cue": "Grande carte orange « NIS2 »", "text": "NIS2 élargit les obligations de cybersécurité à de nombreux secteurs, dont la santé. Elle distingue les entités essentielles et importantes, impose des mesures de gestion des risques, la responsabilité des dirigeants, et un signalement des incidents en trois temps : alerte sous vingt-quatre heures, notification sous soixante-douze heures, rapport final sous un mois. Les États devaient la transposer avant octobre 2024. En France, la loi dite « Résilience » a été adoptée par le Sénat en mars 2025, puis par la commission spéciale de l'Assemblée en septembre 2025, mais son examen en séance, prévu le 7 octobre 2026, a été retiré de l'ordre du jour. C'est le point le plus incertain du chapitre, et un excellent sujet de suivi pendant l'intersession. En attendant, le secteur de la santé a déjà une obligation de signalement des incidents graves, traitée par le CERT Santé."}, {"cue": "Cartes « Cyber Resilience Act » et « Data Act »", "text": "Le Cyber Resilience Act impose des exigences aux produits numériques ; ses obligations de signalement s'appliquent depuis septembre 2026, le reste en décembre 2027. Le Data Act donne un droit d'accès aux données des produits connectés, et supprime les frais de changement de fournisseur cloud en janvier 2027 : utile pour Medisecure, qui dépend de la plateforme du fabricant de ses appareils de télésurveillance."}, {"cue": "Cartes du bas : Accessibilité puis Numérique responsable", "text": "Pour l'accessibilité, la loi de 2005 et le RGAA, et l'European Accessibility Act depuis juin 2025 : Medisecure est-elle concernée ? C'est une question ouverte. Enfin, le numérique responsable : la loi REEN et le RGESN, volontaire pour une entreprise privée, mais l'outil le plus solide pour donner un contenu à la cible de moins trente pour cent du plan 2030."}], "words": 275}, {"n": 45, "title": "Le calendrier réglementaire à suivre", "paras": [{"cue": "Titre et légende des couleurs en bas", "text": "Voici le calendrier récapitulatif de tous ces textes, année par année. Le code couleur est doublé d'une mention écrite : en vert, ce qui est applicable ; en gris, ce qui est à venir ; en jaune, avec la mention « à vérifier », ce qui était incertain à la date de rédaction du cours."}, {"cue": "Les colonnes, de « Avant 2024 » à « 2028-2031 »", "text": "Lisez cette frise comme un plan de travail. Avant 2024, le socle : RGPD, identité nationale de santé, MDR. En 2024 et 2025, l'entrée en vigueur puis les premières étapes de l'AI Act, l'European Accessibility Act, le Data Act. En 2026, la fin de la transition HDS, l'application générale de l'AI Act, les premières obligations du CRA. En 2027 et au-delà, l'EHDS, le haut risque de l'AI Act, l'application générale du CRA."}, {"cue": "Les cases jaunes « à vérifier »", "text": "Les cases jaunes sont vos meilleurs sujets de veille : la transposition de NIS2, les dates exactes de l'omnibus IA, l'omnibus données, le RGAA 5, le pourvoi contre le Data Privacy Framework. Montrer dans votre dossier comment vous avez suivi l'une d'elles pendant les trois périodes de l'intersession prouve que votre dispositif fonctionne."}, {"cue": "Revenez face à la salle", "text": "Et rappelez-vous : toutes ces dates ont été vérifiées à la date de rédaction du cours. Votre travail est d'en vérifier l'état actuel, sur la source officielle, et de dater cette vérification."}], "words": 212}, {"n": 46, "title": "Sept sujets minimum, vérifiés à la source et appliqués au cas", "paras": [{"cue": "Liste des sept sujets à gauche", "text": "Que vous demande concrètement le dossier sur la réglementation ? Sept sujets minimum dans la section 2.4 : le RGPD, l'hébergement de données de santé, l'AI Act, NIS2 et sa transposition, les dispositifs médicaux, l'accès aux données et la souveraineté, c'est-à-dire le Cloud Act et le Data Act, et l'accessibilité numérique. L'EHDS et les référentiels du Ségur sont recommandés."}, {"cue": "Carte « E3 » à droite", "text": "L'élément E3 vérifie que, pour chacun, l'état d'au moins son texte principal a été vérifié sur sa source officielle pendant l'intersession, à une date indiquée, et qu'au moins deux incertitudes sont suivies par votre dispositif."}, {"cue": "Carte « E4 » à droite", "text": "L'élément E4 vérifie que, pour chaque sujet, vous écrivez une conséquence concrète reliée à un fait nommé du dossier Medisecure, que vous classez les sujets par échéance puis par exposition, et que vous répondez de façon argumentée à au moins une question ouverte du tableau « Conformité ». Une liste générale de textes, sans lien avec le cas, ne rapporte rien."}, {"cue": "Phrase rouge en bas à droite", "text": "La méthode de suivi tient en quelques règles. Pour chaque texte, la source primaire : EUR-Lex et Légifrance. Pour les textes en cours d'adoption, la procédure elle-même : l'Observatoire législatif du Parlement européen, les dossiers législatifs de l'Assemblée et du Sénat. Les autorités qui interprètent. Et les sources secondaires, cabinets d'avocats ou presse, pour repérer une évolution, jamais pour la confirmer. Pendant la préparation du cours, certains sites présentaient l'omnibus IA comme en attente quand d'autres le donnaient en vigueur. Seul le texte publié tranche."}], "words": 240}, {"n": 47, "title": "Une vulnérabilité exploitée se traite en heures", "paras": [{"cue": "Titre", "text": "Le chapitre 7 porte sur l'axe cybersécurité, qui se distingue des autres par son rythme. Une évolution réglementaire se suit sur des mois ; une vulnérabilité exploitée sur un équipement exposé à Internet se traite en heures. Votre axe cybersécurité doit donc montrer deux choses : des sources rapides et fiables, et un circuit qui transforme une alerte en décision sans attendre la réunion mensuelle."}, {"cue": "Tableau des sources, ligne par ligne", "text": "Les sources sont dans le tableau. En France, la référence est le CERT-FR, qui publie des avis, des alertes sur les vulnérabilités activement exploitées, et des rapports sur la menace. Pour la santé, le CERT Santé. Les éditeurs publient leurs propres bulletins : Microsoft, par exemple, le deuxième mardi de chaque mois. Chaque vulnérabilité publique reçoit un identifiant CVE. Et deux indicateurs complètent la gravité : le catalogue KEV de l'agence américaine CISA, et le score EPSS."}, {"cue": "Encadré sombre à droite « Dépendre d'une source unique »", "text": "L'encadré de droite illustre un risque de dispositif : dépendre d'une source unique. En avril 2025, le programme CVE a frôlé l'interruption faute de renouvellement du contrat, avant une prolongation de onze mois signée la veille de l'échéance. L'Europe a ouvert sa propre base en mai 2025, et la NVD américaine a restreint l'enrichissement de ses fiches en avril 2026. La situation du programme CVE après mars 2026 n'était pas établie à la date du cours : c'est une question de veille."}], "words": 224}, {"n": 48, "title": "CVSS, KEV, EPSS : trois indicateurs, puis votre contexte", "paras": [{"cue": "Titre", "text": "Comment prioriser une vulnérabilité ? Avec trois indicateurs complémentaires, puis votre propre contexte."}, {"cue": "Cartes CVSS, KEV, EPSS, puis les deux phrases sous les cartes", "text": "Le score CVSS mesure la gravité technique, de zéro à dix. Un score de neuf virgule huit signifie qu'une vulnérabilité est grave dans l'absolu, pas qu'elle est dangereuse pour vous. Des milliers de vulnérabilités sont notées critiques chaque année ; aucune équipe ne peut toutes les traiter en urgence. Le catalogue KEV de la CISA répond à une autre question : est-elle déjà exploitée ? Et l'EPSS estime la probabilité qu'elle le soit dans les trente jours. Gravité, réalité de l'exploitation, probabilité. Reste à croiser avec votre contexte : le produit est-il dans votre parc, est-il exposé à Internet, porte-t-il des données de santé ? Et le délai de traitement doit découler d'une règle écrite à l'avance."}, {"cue": "Encadré sombre à droite : 9 h, 9 h 10, 13 h, Après", "text": "À droite, un scénario fictif chez Kestrel, construit sur le modèle de cas réels. Un mardi à neuf heures, le flux filtré du CERT-FR remonte une exécution de code à distance sur la passerelle VPN des chauffeurs : CVSS neuf virgule huit, inscrite au KEV la veille. En dix minutes, l'inventaire confirme que la version est concernée et exposée. La règle classe le cas en urgence vingt-quatre heures. Le correctif est appliqué à treize heures. Puis, parce que l'exploitation avait commencé avant le correctif, l'équipe cherche des traces de compromission dans les journaux, conservés six mois."}, {"cue": "Phrase rouge en bas à gauche", "text": "Retenez la leçon : un correctif ferme la porte, il ne dit pas si quelqu'un est déjà entré. Sans journaux conservés, cette recherche est impossible, et c'est exactement la situation que décrit le RSSI de Medisecure."}], "words": 262}, {"n": 49, "title": "La menace en santé, en chiffres vérifiables", "paras": [{"cue": "Titre", "text": "Pour l'axe cybersécurité en santé, appuyez-vous sur des chiffres publics vérifiés. Le graphique en reprend deux séries."}, {"cue": "Graphique : barres CERT Santé 749 et 764", "text": "L'observatoire 2025 du CERT Santé compte sept cent soixante-quatre incidents de sécurité déclarés en 2025, contre sept cent quarante-neuf en 2024, par six cent six structures. Les rançongiciels reculent d'environ trente pour cent, tandis que les compromissions de comptes, les fuites de données et les escroqueries progressent. Attention à la lecture : ce sont des incidents déclarés, ils mesurent aussi la propension à signaler."}, {"cue": "Barres ANSSI 130 et 196, puis note des sources", "text": "Le Panorama de la cybermenace 2025 de l'ANSSI, publié en mars 2026, relève cent vingt-huit compromissions par rançongiciel et cent quatre-vingt-seize incidents avec exfiltration de données, contre cent trente l'année précédente. L'ANSSI observe un glissement du rançongiciel vers le vol de données suivi de chantage, et la santé figure parmi les secteurs les plus touchés. Ces chiffres ont été relevés dans la presse : citez le rapport lui-même."}, {"cue": "Les trois cartes de droite, de haut en bas", "text": "Trois menaces dominent pour Medisecure. Le rançongiciel, parce qu'il interrompt les soins. L'hameçonnage et la compromission de comptes, porte d'entrée la plus fréquente, d'autant plus que la plupart des comptes ne sont pas protégés par une authentification multifacteur. Et la compromission de fournisseurs : début 2024, les attaques contre Viamedis et Almerys ont touché plus de trente-trois millions de personnes, sans qu'aucune complémentaire cliente ne soit attaquée directement. Medisecure dépend d'un hébergeur, d'éditeurs SaaS, d'un fabricant d'appareils et d'une régie avec un accès VPN : autant de portes d'entrée possibles."}], "words": 239}, {"n": 50, "title": "Sécurité de l'IA, IA fantôme et fins de support", "paras": [{"cue": "Titre", "text": "Dernière diapositive de cette partie : la sécurité de l'IA, l'IA fantôme et les fins de support."}, {"cue": "Grille OWASP : LLM01 et LLM02 en rouge, puis la note en italique", "text": "Dès qu'une organisation intègre un grand modèle de langage dans un service, elle hérite de risques nouveaux. La référence la plus utilisée est le Top 10 de l'OWASP pour les applications LLM. Son édition 2025 est affichée : en tête, l'injection de prompt, par exemple un document patient qui contient une instruction cachée qui détourne l'assistant, et la divulgation d'informations sensibles, quand l'assistant restitue les données d'un autre patient. Une édition 2026 est parue en août 2026 et l'ordre a changé : consultez le document officiel avant de citer un numéro. Pour aller plus loin, le Top 10 dédié aux applications agentiques, la base MITRE ATLAS des techniques d'attaque contre l'IA, et les recommandations de l'ANSSI d'avril 2024 pour les systèmes d'IA générative."}, {"cue": "Carte orange « IA fantôme »", "text": "L'IA fantôme, c'est l'usage d'outils d'IA non approuvés, souvent gratuits, avec un compte personnel. Le risque principal est juridique : les données sortent du périmètre, sans contrat et sans hébergement certifié. En 2023, Samsung a restreint les assistants publics après que des ingénieurs y ont collé du code interne. Interdire ne suffit pas, parce que l'usage naît d'un besoin réel. La veille porte donc sur les usages réels, les conditions d'utilisation des outils, et les offres professionnelles qui pourraient les remplacer."}, {"cue": "Carte « Fins de support »", "text": "Enfin, les fins de support : un composant hors support reste vulnérable pour toujours. Windows 10 n'est plus maintenu depuis octobre 2025. Croiser l'inventaire et les dates de fin de support suffit à rendre la dette technique visible. L'exercice du chapitre 7 vous fait construire l'axe cybersécurité de Medisecure sur ces bases."}], "words": 273}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
