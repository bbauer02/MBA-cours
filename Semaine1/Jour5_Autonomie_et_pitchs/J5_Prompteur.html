<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

<script>
const DATA = [{"n": 63, "title": "Passer à l'autonomie", "paras": [{"cue": "Écran de partie : titre et liste des chapitres 11 et 12", "text": "Dernière partie : passer à l'autonomie. Le Jour 5 au soir, la partie encadrée du cours s'arrête. Vous retournez en entreprise avec un dispositif à faire vivre et un dossier à écrire, sur trois périodes d'une semaine environ. Le chapitre 11 vous donne un plan de travail, des points de contrôle et la préparation du contrôle. Le chapitre 12 rassemble tous les gabarits du cours."}], "words": 65}, {"n": 64, "title": "Le Jour 5, vous partez avec un dispositif qui tourne déjà", "paras": [{"cue": "Titre", "text": "Vous ne quittez pas la semaine S1 avec une idée de dispositif, mais avec un dispositif qui fonctionne déjà. Voici le minimum à avoir terminé avant votre pitch."}, {"cue": "Les dix cases, de gauche à droite ; « Outils » et « Preuves » en orange", "text": "Les symptômes de Medisecure, au moins trois, chacun cité avec la section du dossier où il apparaît. Le tableau des besoins des six parties prenantes minimum. Le QQOQCCP, même provisoire, avec ses exclusions. Exactement cinq axes. Au moins quinze sources identifiées, majoritairement primaires ; l'objectif de vingt sources retenues sera atteint en période 1. Les quatre fonctions de votre dispositif assurées, sur des comptes à votre nom : agrégateur par axe, alertes actives, suivi des vulnérabilités filtré sur les composants de Medisecure, base de connaissances. Vos premières captures datées. Votre grille d'impact, avec son barème et son sens, et son adoption datée dans le journal. Le journal de veille, créé. Et votre pitch."}, {"cue": "Case « Journal de veille »", "text": "Les informations collectées depuis le Jour 1, y compris celle de votre pitch, peuvent compter parmi vos quinze informations notées."}, {"cue": "Encadré sombre à droite", "text": "Je vous le redis, parce que c'est l'erreur la plus coûteuse de l'intersession : elle se commet le Jour 5. Celui qui part avec l'idée d'utiliser un agrégateur perd sa période 1 à le configurer. Il n'aura ni captures ni séances pour cette période, et l'élément E7 sera perdu. Configurez vos outils pendant la semaine, quand je suis disponible pour vous débloquer."}], "words": 223}, {"n": 65, "title": "Trois périodes : stabiliser, analyser, diffuser et recommander", "paras": [{"cue": "Titre", "text": "Voici le planning des trois périodes de l'intersession. Il suppose environ huit à dix heures d'autoformation au total, en plus de la rédaction et de la veille courante. Les durées sont des ordres de grandeur ; gardez surtout l'ordre des étapes."}, {"cue": "Chevron et carte « Période 1 »", "text": "La période 1 sert à stabiliser. Vous complétez la cartographie à vingt sources notées, vous rédigez les parties 1 et 2, et vous commencez la vérification datée des sept sujets réglementaires sur leur source officielle."}, {"cue": "Chevron et carte « Période 2 »", "text": "La période 2 sert à passer de la collecte à l'analyse. Vous appliquez la grille à toutes vos informations, au moins quinze, vous repérez signaux faibles et forts, vous rédigez les parties 3 et 4, vous organisez la base, et vous commencez la partie 6 sans attendre la fin de la notation."}, {"cue": "Chevron orange et carte « Période 3 »", "text": "La période 3 sert à diffuser et recommander. Vous choisissez vos trois fiches, vous produisez les trois livrables et leur tableau d'accessibilité, vous achevez les recommandations et la feuille de route, puis la conclusion et la synthèse. Vous vous auto-évaluez, et vous déposez."}, {"cue": "Les quatre exigences rouges en bas", "text": "Quatre exigences ne se rattrapent pas après coup : au moins deux séances datées dans chaque période ; au moins une capture de chaque outil dans chaque période ; la vérification datée des sept sujets réglementaires ; et une information nouvelle par axe, gardée hors du dossier, pour le contrôle. Enfin, visez un dépôt la veille du jour du rendu : un dossier déposé une minute avant l'heure limite a rarement été relu."}], "words": 244}, {"n": 66, "title": "Le journal de veille, votre preuve principale", "paras": [{"cue": "Titre", "text": "Une veille qui tourne se reconnaît à sa régularité, pas à son volume. Organisez-la en deux rituels."}, {"cue": "Carte « Rituel quotidien » en haut à droite", "text": "Le rituel quotidien dure quinze à vingt minutes, idéalement à heure fixe : vous parcourez l'agrégateur et les alertes, vous écartez le hors sujet, vous marquez ce qui mérite une lecture complète."}, {"cue": "Les six étapes de la séance à droite", "text": "La séance de veille dure environ une heure, au moins deux fois par période. Six étapes : ouvrir les éléments marqués, remonter à la source primaire, noter chaque information retenue avec la grille, en indiquant sa date de collecte et l'outil qui l'a captée, la classer dans la base, prendre une capture si la période n'en compte pas encore, et compléter le journal."}, {"cue": "Graphique à gauche", "text": "Le journal de veille est votre preuve principale. C'est un simple tableau, une ligne par séance : date, durée, informations collectées, informations retenues, ajustements. Sa première ligne date l'adoption du barème de votre grille."}, {"cue": "Barres du graphique, de P1 à P3, puis la note en italique", "text": "Le graphique montre le journal d'un apprenant chez Kestrel. Les volumes collectés baissent de quatre-vingts à quarante-cinq. Ce n'est pas un échec : cela montre qu'il a réglé ses filtres. Le ratio entre informations retenues et collectées, autour de huit pour cent, devient un indicateur qu'il commente en conclusion. Notez aussi ses ajustements : deux flux trop bruyants supprimés, une alerte reformulée, une page surveillée ajoutée. Les consignes demandent au moins deux ajustements datés et justifiés : un dispositif qui évolue prouve que vous l'avez réellement utilisé."}], "words": 233}, {"n": 67, "title": "Environ 19 pages, rédigées dans l'ordre du cycle", "paras": [{"cue": "Graphique des pages à gauche", "text": "Le plan type des consignes suit le cycle de la veille et l'ordre de la grille. Vous pouvez renommer les titres, pas supprimer ni déplacer de section. Rédigez dans le même ordre, car chaque partie s'appuie sur la précédente. Le graphique donne les repères de pages : une demi-page de synthèse, deux pages pour le contexte, trois et demie pour les axes et la réglementation, trois pour le dispositif, deux pour l'analyse, deux pour la diffusion, cinq pour les recommandations et une pour la conclusion. Environ dix-neuf pages au total."}, {"cue": "Tableau des points à droite", "text": "Le tableau rappelle comment se répartissent les points : sept pour C1, six pour C2, six pour C3, un pour la forme. Et indépendamment de la note, le jury considère une compétence acquise à partir de trois virgule cinq points pour C1, et de trois points pour C2 et C3."}, {"cue": "Carte orange « La partie 6 pèse 6 points »", "text": "La partie 6 est la plus lourde. Commencez-la dès la période 2, sans attendre la fin de la notation."}, {"cue": "Revenez face à la salle", "text": "Pour chaque partie, un piège est signalé dans le cours. Par exemple, résumer le dossier Medisecure au lieu d'en extraire des besoins ; recopier l'état réglementaire du cours sans vérification datée ; présenter la grille vide ; ou écrire une conclusion qui résume au lieu d'analyser les limites et la pérennité. Pour cette conclusion, décrivez la passation comme un responsable qui quitte son poste : un responsable désigné, les documents transmis, dont l'export OPML de l'agrégateur, un rythme de revue, et un signe d'abandon à surveiller."}], "words": 245}, {"n": 68, "title": "Le contrôle : trois veilles flash, premier jour de S2", "paras": [{"cue": "Titre", "text": "Le contrôle a lieu le premier jour de la semaine S2. Il vérifie que votre dispositif fonctionne et que vous savez en tirer vite une information utile. Il est noté sur vingt, à part du dossier."}, {"cue": "Les quatre chevrons : Tirage, 30 minutes, Dépôt, 6 min + 2 min", "text": "Le déroulé est en quatre temps. Au début de la séance, je tire au sort, pour chacun, trois de ses cinq axes. Toute la promotion dispose ensuite de trente minutes pour retrouver dans son dispositif, pour chaque axe, une information publiée ou mise à jour entre le début de la période 2 et le jour du contrôle, et absente du dossier déposé. Vous déposez les liens sur Moodle, et vous ne pouvez plus en changer. Puis chacun présente en six minutes, écran partagé, en partant de l'outil où l'information a été collectée, suivies de deux minutes de questions."}, {"cue": "Graphique du barème, puis carte de droite", "text": "Chaque information suit quatre temps : le fait, sa source primaire, l'impact pour Medisecure, l'action proposée et à qui. Le barème est sur la diapositive : six points pour une information récente, réelle et trouvée dans votre dispositif ; quatre pour la source primaire ouverte et la date vérifiée ; six pour un impact relié à un fait nommé du dossier, comme une application, un chiffre ou une échéance ; quatre pour une action précise, bornée dans le temps, adressée à la bonne fonction. La note est la moyenne des trois veilles flash."}, {"cue": "Revenez face à la salle", "text": "Préparez-vous dès la période 2 : gardez hors du dossier au moins une information nouvelle par axe. La veille du contrôle, mettez votre agrégateur à jour et laissez tous vos outils actifs. Le contrôle ne récompense pas la mémoire, mais la capacité à trouver, vérifier et formuler vite."}], "words": 275}, {"n": 69, "title": "Dix erreurs qui reviennent d'une promotion à l'autre", "paras": [{"cue": "Titre", "text": "Voici les dix erreurs qui reviennent d'une promotion à l'autre. Elles ne viennent presque jamais d'un manque de compétence, mais d'un manque de temps ou d'une mauvaise lecture des consignes."}, {"cue": "Erreurs 1 à 10, de gauche à droite et de haut en bas", "text": "Un : commencer par les outils au lieu des problèmes de Medisecure. Deux : démarrer la veille en période 2, et perdre l'élément E7. Trois : une cartographie dominée par des blogs et de la presse généraliste, alors que plus de la moitié de sources primaires est exigée. Quatre : une grille d'impact présentée vide, sans quinze informations notées. Cinq : citer des textes sans les appliquer à Medisecure, ou recopier leur état depuis le cours sans vérification datée. Six : trois livrables de diffusion qui disent la même chose avec une mise en page différente. Sept : des recommandations vagues, ou des mesures de base présentées comme innovantes. Huit : des recommandations qui ne viennent pas de la veille, alors que le lien entre veille et décision est le cœur du dossier. Neuf : citer une IA générative comme source. Dix : tout rédiger pendant la période 3, avec une relecture bâclée et une partie 6 sacrifiée."}, {"cue": "Revenez face à la salle", "text": "Pour chacune, le remède est dans le cours, et la check-list d'auto-évaluation du chapitre 11 reprend exactement les vingt éléments de la grille. Faites-la une première fois à la fin de la période 2, avec l'exercice de mi-parcours, et une seconde fois avant le dépôt."}, {"cue": "Revenez face à la salle", "text": "Un dernier mot sur l'aide : adressez-vous à vos pairs pour les questions pratiques, constituez un binôme de relecture dès le Jour 5, et posez-moi les questions de fond, de façon précise, en disant ce que vous avez déjà essayé. Une question posée en période 1 coûte moins cher qu'une erreur découverte la veille du rendu."}], "words": 289}, {"n": 70, "title": "Les gabarits, prêts à copier", "paras": [{"cue": "Titre", "text": "Le chapitre 12 rassemble tous les gabarits du cours, prêts à copier dans votre tableur ou votre traitement de texte. Chaque gabarit se présente sous forme de tableau, avec une colonne « À renseigner » et une colonne « Exemple Kestrel ». Pour Medisecure, c'est à vous de les remplir."}, {"cue": "Les quinze cartes de gabarits, ligne par ligne", "text": "Vous y trouverez la fiche de veille, pour votre annexe E ; la cartographie des sources, pour l'annexe B ; le journal de veille, pour l'annexe C ; la grille de fiabilité ; le tableau des parties prenantes et la grille QQOQCCP, pour la partie 1 ; la grille d'impact, pour l'annexe D ; la fiche de recommandation et la feuille de route, pour la partie 6 ; les modèles des trois livrables de diffusion, pour l'annexe F ; et le tableau de preuves d'accessibilité, pour la section 5.4."}, {"cue": "Cartes orange « Glossaire » et « Sitographie »", "text": "Le chapitre se termine par un glossaire de la veille et par une sitographie vérifiée, classée par catégorie. Servez-vous-en comme point de départ de votre cartographie, mais n'oubliez pas de vérifier que chaque source est active au moment où vous l'ajoutez."}, {"cue": "Phrase en italique du bas", "text": "Vous pouvez adapter ces gabarits, ajouter une colonne ou changer un seuil, à condition de justifier vos changements dans le dossier."}], "words": 201}, {"n": 71, "title": "Une veille utile fait décider", "paras": [{"cue": "Titre « Une veille utile fait décider »", "text": "Nous arrivons au terme de ce parcours. Si vous ne deviez retenir qu'une phrase de ce cours, ce serait celle-ci : une veille utile se juge à sa capacité à faire décider, pas à la quantité d'informations collectées."}, {"cue": "Face à la salle", "text": "Tout ce que nous avons vu s'enchaîne. On part des symptômes de l'organisation, pas des outils. On cadre le besoin, on choisit des sources primaires et on les évalue. On monte un dispositif réel, et on prouve qu'il tourne. On filtre, on vérifie, on note avec une grille explicite. On diffuse au bon lecteur, sous la bonne forme. Et on en tire des recommandations chiffrées, conformes, ordonnées dans une feuille de route."}, {"cue": "Les deux premières lignes du sous-titre", "text": "Pour la suite, concrètement : dès lundi, votre dispositif doit tourner. Deux séances de veille datées dans chaque période, une capture de chaque outil dans chaque période, et le journal tenu à jour. Pensez aussi au contrôle du premier jour de S2 : gardez hors du dossier au moins une information nouvelle par axe. Et ajustez votre dispositif en l'utilisant : un flux inutile se supprime, une alerte trop bavarde se reformule."}, {"cue": "Dernière ligne : les consignes font foi", "text": "Deux rappels pour finir. En cas de divergence entre ce cours et les consignes du dossier D1, ce sont les consignes qui font foi. Et toute information datée de ce cours a été vérifiée à la date de sa rédaction : quand le cours signale un point incertain, vérifiez-le. C'est déjà un acte de veille."}, {"cue": "Ouvrez les questions", "text": "Merci pour votre attention. Je prends maintenant vos questions."}], "words": 246}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
