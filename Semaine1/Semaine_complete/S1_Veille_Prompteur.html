à au moins une question ouverte du tableau « Conformité ». Une liste générale de textes, sans lien avec le cas, ne rapporte rien."}, {"cue": "Phrase rouge en bas à droite", "text": "La méthode de suivi tient en quelques règles. Pour chaque texte, la source primaire : EUR-Lex et Légifrance. Pour les textes en cours d'adoption, la procédure elle-même : l'Observatoire législatif du Parlement européen, les dossiers législatifs de l'Assemblée et du Sénat. Les autorités qui interprètent. Et les sources secondaires, cabinets d'avocats ou presse, pour repérer une évolution, jamais pour la confirmer. Pendant la préparation du cours, certains sites présentaient l'omnibus IA comme en attente quand d'autres le donnaient en vigueur. Seul le texte publié tranche."}], "words": 240}, {"n": 47, "title": "Une vulnérabilité exploitée se traite en heures", "paras": [{"cue": "Titre", "text": "Le chapitre 7 porte sur l'axe cybersécurité, qui se distingue des autres par son rythme. Une évolution réglementaire se suit sur des mois ; une vulnérabilité exploitée sur un équipement exposé à Internet se traite en heures. Votre axe cybersécurité doit donc montrer deux choses : des sources rapides et fiables, et un circuit qui transforme une alerte en décision sans attendre la réunion mensuelle."}, {"cue": "Tableau des sources, ligne par ligne", "text": "Les sources sont dans le tableau. En France, la référence est le CERT-FR, qui publie des avis, des alertes sur les vulnérabilités activement exploitées, et des rapports sur la menace. Pour la santé, le CERT Santé. Les éditeurs publient leurs propres bulletins : Microsoft, par exemple, le deuxième mardi de chaque mois. Chaque vulnérabilité publique reçoit un identifiant CVE. Et deux indicateurs complètent la gravité : le catalogue KEV de l'agence américaine CISA, et le score EPSS."}, {"cue": "Encadré sombre à droite « Dépendre d'une source unique »", "text": "L'encadré de droite illustre un risque de dispositif : dépendre d'une source unique. En avril 2025, le programme CVE a frôlé l'interruption faute de renouvellement du contrat, avant une prolongation de onze mois signée la veille de l'échéance. L'Europe a ouvert sa propre base en mai 2025, et la NVD américaine a restreint l'enrichissement de ses fiches en avril 2026. La situation du programme CVE après mars 2026 n'était pas établie à la date du cours : c'est une question de veille."}], "words": 224}, {"n": 48, "title": "CVSS, KEV, EPSS : trois indicateurs, puis votre contexte", "paras": [{"cue": "Titre", "text": "Comment prioriser une vulnérabilité ? Avec trois indicateurs complémentaires, puis votre propre contexte."}, {"cue": "Cartes CVSS, KEV, EPSS, puis les deux phrases sous les cartes", "text": "Le score CVSS mesure la gravité technique, de zéro à dix. Un score de neuf virgule huit signifie qu'une vulnérabilité est grave dans l'absolu, pas qu'elle est dangereuse pour vous. Des milliers de vulnérabilités sont notées critiques chaque année ; aucune équipe ne peut toutes les traiter en urgence. Le catalogue KEV de la CISA répond à une autre question : est-elle déjà exploitée ? Et l'EPSS estime la probabilité qu'elle le soit dans les trente jours. Gravité, réalité de l'exploitation, probabilité. Reste à croiser avec votre contexte : le produit est-il dans votre parc, est-il exposé à Internet, porte-t-il des données de santé ? Et le délai de traitement doit découler d'une règle écrite à l'avance."}, {"cue": "Encadré sombre à droite : 9 h, 9 h 10, 13 h, Après", "text": "À droite, un scénario fictif chez Kestrel, construit sur le modèle de cas réels. Un mardi à neuf heures, le flux filtré du CERT-FR remonte une exécution de code à distance sur la passerelle VPN des chauffeurs : CVSS neuf virgule huit, inscrite au KEV la veille. En dix minutes, l'inventaire confirme que la version est concernée et exposée. La règle classe le cas en urgence vingt-quatre heures. Le correctif est appliqué à treize heures. Puis, parce que l'exploitation avait commencé avant le correctif, l'équipe cherche des traces de compromission dans les journaux, conservés six mois."}, {"cue": "Phrase rouge en bas à gauche", "text": "Retenez la leçon : un correctif ferme la porte, il ne dit pas si quelqu'un est déjà entré. Sans journaux conservés, cette recherche est impossible, et c'est exactement la situation que décrit le RSSI de Medisecure."}], "words": 262}, {"n": 49, "title": "La menace en santé, en chiffres vérifiables", "paras": [{"cue": "Titre", "text": "Pour l'axe cybersécurité en santé, appuyez-vous sur des chiffres publics vérifiés. Le graphique en reprend deux séries."}, {"cue": "Graphique : barres CERT Santé 749 et 764", "text": "L'observatoire 2025 du CERT Santé compte sept cent soixante-quatre incidents de sécurité déclarés en 2025, contre sept cent quarante-neuf en 2024, par six cent six structures. Les rançongiciels reculent d'environ trente pour cent, tandis que les compromissions de comptes, les fuites de données et les escroqueries progressent. Attention à la lecture : ce sont des incidents déclarés, ils mesurent aussi la propension à signaler."}, {"cue": "Barres ANSSI 130 et 196, puis note des sources", "text": "Le Panorama de la cybermenace 2025 de l'ANSSI, publié en mars 2026, relève cent vingt-huit compromissions par rançongiciel et cent quatre-vingt-seize incidents avec exfiltration de données, contre cent trente l'année précédente. L'ANSSI observe un glissement du rançongiciel vers le vol de données suivi de chantage, et la santé figure parmi les secteurs les plus touchés. Ces chiffres ont été relevés dans la presse : citez le rapport lui-même."}, {"cue": "Les trois cartes de droite, de haut en bas", "text": "Trois menaces dominent pour Medisecure. Le rançongiciel, parce qu'il interrompt les soins. L'hameçonnage et la compromission de comptes, porte d'entrée la plus fréquente, d'autant plus que la plupart des comptes ne sont pas protégés par une authentification multifacteur. Et la compromission de fournisseurs : début 2024, les attaques contre Viamedis et Almerys ont touché plus de trente-trois millions de personnes, sans qu'aucune complémentaire cliente ne soit attaquée directement. Medisecure dépend d'un hébergeur, d'éditeurs SaaS, d'un fabricant d'appareils et d'une régie avec un accès VPN : autant de portes d'entrée possibles."}], "words": 239}, {"n": 50, "title": "Sécurité de l'IA, IA fantôme et fins de support", "paras": [{"cue": "Titre", "text": "Dernière diapositive de cette partie : la sécurité de l'IA, l'IA fantôme et les fins de support."}, {"cue": "Grille OWASP : LLM01 et LLM02 en rouge, puis la note en italique", "text": "Dès qu'une organisation intègre un grand modèle de langage dans un service, elle hérite de risques nouveaux. La référence la plus utilisée est le Top 10 de l'OWASP pour les applications LLM. Son édition 2025 est affichée : en tête, l'injection de prompt, par exemple un document patient qui contient une instruction cachée qui détourne l'assistant, et la divulgation d'informations sensibles, quand l'assistant restitue les données d'un autre patient. Une édition 2026 est parue en août 2026 et l'ordre a changé : consultez le document officiel avant de citer un numéro. Pour aller plus loin, le Top 10 dédié aux applications agentiques, la base MITRE ATLAS des techniques d'attaque contre l'IA, et les recommandations de l'ANSSI d'avril 2024 pour les systèmes d'IA générative."}, {"cue": "Carte orange « IA fantôme »", "text": "L'IA fantôme, c'est l'usage d'outils d'IA non approuvés, souvent gratuits, avec un compte personnel. Le risque principal est juridique : les données sortent du périmètre, sans contrat et sans hébergement certifié. En 2023, Samsung a restreint les assistants publics après que des ingénieurs y ont collé du code interne. Interdire ne suffit pas, parce que l'usage naît d'un besoin réel. La veille porte donc sur les usages réels, les conditions d'utilisation des outils, et les offres professionnelles qui pourraient les remplacer."}, {"cue": "Carte « Fins de support »", "text": "Enfin, les fins de support : un composant hors support reste vulnérable pour toujours. Windows 10 n'est plus maintenu depuis octobre 2025. Croiser l'inventaire et les dates de fin de support suffit à rendre la dette technique visible. L'exercice du chapitre 7 vous fait construire l'axe cybersécurité de Medisecure sur ces bases."}], "words": 273}, {"n": 51, "title": "Diffuser et recommander", "paras": [{"cue": "Écran de partie : titre et liste des chapitres 8 à 10", "text": "Quatrième partie : diffuser et recommander. Une veille qui n'est ni conservée ni partagée n'existe pas pour l'organisation. Et une veille qui ne débouche sur aucune décision n'a pas démontré son utilité. Le chapitre 8 traite de la capitalisation et de la diffusion, le chapitre 9 du passage à la recommandation, qui pèse six points sur vingt dans votre dossier, et le chapitre 10 de l'usage de l'IA générative dans tout ce travail."}], "words": 73}, {"n": 52, "title": "Une base de connaissances qui survit à son créateur", "paras": [{"cue": "Titre", "text": "Le chapitre 8 traite des deux dernières étapes du cycle. Capitaliser, c'est conserver l'information traitée pour la retrouver et la réutiliser. Diffuser, c'est la faire parvenir à la bonne personne, sous la bonne forme, au bon moment."}, {"cue": "Carte « Trois usages » en bas à gauche", "text": "La base de connaissances rassemble les fiches de veille. Elle a trois usages : retrouver une information, suivre l'évolution d'un sujet dans le temps, et transmettre la veille à un successeur. Ce dernier usage compte : votre conclusion devra dire comment le dispositif survit à votre départ."}, {"cue": "Carte « L'outil importe moins que la structure »", "text": "L'outil importe moins que la structure. Une liste SharePoint, un espace Notion, un wiki ou un classeur partagé peuvent convenir. Le bon choix dépend de ce que l'organisation possède déjà : chez Medisecure, qui dispose de Microsoft 365, une liste SharePoint ou un canal Teams évite d'ajouter un outil. Choisir un outil que personne d'autre n'utilise condamne la base à disparaître avec son créateur."}, {"cue": "Les quatre statuts en haut, puis carte « Revue trimestrielle »", "text": "Chaque fiche a un cycle de vie, en haut de la diapositive. Elle naît « à confirmer », devient « vérifiée » après recoupement, puis « diffusée » quand elle a alimenté un livrable, et enfin « archivée » quand elle n'est plus d'actualité. L'archivage n'est pas une suppression : une fiche archivée documente l'historique d'une décision. Une revue trimestrielle évite que la base se dégrade."}], "words": 214}, {"n": 53, "title": "Un même sujet, trois formats, trois questions", "paras": [{"cue": "Titre", "text": "Un même sujet ne s'écrit pas de la même façon pour un directeur, un tech lead et une équipe d'accueil. Le dossier vous demande trois livrables sur le même sujet, qui doivent différer par l'angle, le vocabulaire, la longueur et l'action demandée au lecteur."}, {"cue": "Colonne sombre « Note de synthèse »", "text": "La note de synthèse, d'une page, s'adresse à la DSI et sert à faire décider. Elle commence par la conclusion : le premier paragraphe dit ce que le lecteur doit décider et pourquoi maintenant. Puis le contexte, les options avec leur coût et leurs risques, la recommandation. Si elle dépasse une page, c'est que l'analyse n'est pas terminée."}, {"cue": "Colonne « Fiche technique »", "text": "La fiche technique, deux pages au plus, s'adresse au tech lead et sert à faire agir. Elle nomme les composants avec leur version exacte, les identifiants de vulnérabilités, renvoie à la documentation officielle et dit ce qu'il faut tester. Un tech lead doit pouvoir créer un ticket à partir de la fiche, sans recherche complémentaire."}, {"cue": "Colonne « Flash d'information »", "text": "Le flash d'information, une page, s'adresse aux équipes et sert à faire appliquer une consigne. Son titre dit ce qui change. Il répond à trois questions : que dois-je faire, à partir de quand, à qui m'adresser. Un seul message par flash."}, {"cue": "Les exemples Kestrel en italique, puis le bandeau rouge", "text": "L'exemple Kestrel porte sur la géolocalisation. Les trois livrables partagent le même fait et la même source, mais ils répondent à trois questions différentes : que décider, comment faire, que changer dans mon travail. Et l'erreur la plus fréquente consiste à produire la note, puis à la couper pour obtenir le flash. Le résultat parle au mauvais lecteur."}], "words": 257}, {"n": 54, "title": "Le bon canal, le bon rythme, un livrable lisible par tous", "paras": [{"cue": "Tableau des canaux à gauche", "text": "Le canal se choisit selon l'urgence, le public et la trace attendue. Une alerte critique ne peut pas attendre la newsletter mensuelle ; une note de synthèse envoyée par message instantané se perd dans le fil de la journée. Le tableau donne les usages conseillés : Teams pour les flashs et les alertes, l'intranet pour la newsletter et l'accès à la base, le courriel pour la note à la direction, la réunion pour l'arbitrage, et l'affichage pour les équipes qui n'ont pas de poste de travail."}, {"cue": "Phrase en italique sous le tableau", "text": "Le rythme combine un flux régulier, qui installe une habitude, et des envois à l'événement selon des seuils fixés à l'avance : une information notée quatorze ou plus, ou une vulnérabilité critique activement exploitée, part dans la journée. Attention à la lassitude : trop d'envois font ignorer l'alerte importante."}, {"cue": "Les quatre règles à droite, puis la note en italique", "text": "Les livrables doivent aussi être lisibles par tous, y compris par les personnes qui utilisent un lecteur d'écran ou un zoom. C'est une exigence de l'élément E11, avec quatre règles minimum. Des titres hiérarchisés avec les styles de l'outil, pas du gras agrandi. Un contraste d'au moins quatre virgule cinq pour un, mesuré avec un outil que vous nommez. Un texte alternatif pour chaque image, qui dit ce qu'il faut retenir et pas seulement ce que c'est. Et un langage clair. Ajoutez une règle de bon sens : l'information ne passe jamais par la couleur seule. Votre section 5.4 contiendra un tableau de preuves pour chaque livrable, dont le gabarit est au chapitre 12."}], "words": 249}, {"n": 55, "title": "Animer un réseau, mesurer l'utilité réelle", "paras": [{"cue": "Carte « Animer le réseau de correspondants »", "text": "Un veilleur seul ne couvre pas tous les sujets. Les organisations qui font vivre leur veille s'appuient sur un réseau de correspondants. Chez Medisecure, ce réseau existe déjà : le RSSI suit les bulletins du CERT-FR, le DPO la doctrine de la CNIL, la directrice innovation les start-ups de l'e-santé. Il n'est simplement pas organisé. Animer ce réseau, c'est rendre la contribution facile, avec un lien et une phrase déposés dans un canal ; c'est la rendre visible, en citant le contributeur et en lui disant à quoi son signalement a servi ; et c'est le réunir régulièrement. Un réseau qui ne reçoit jamais de retour s'éteint en quelques mois."}, {"cue": "Carte « Les clients de la veille »", "text": "Le dossier demande un partage animé avec la DSI, les équipes et les clients de la veille. Ce sont les clients internes, DSI, directions métier, centres, mais aussi au moins un acteur externe, comme un partenaire."}, {"cue": "Tableau des indicateurs à droite", "text": "Enfin, il faut montrer que la veille sert. Le tableau propose cinq indicateurs : le taux de lecture, les décisions alimentées, qui est le plus exigeant et le plus convaincant, le délai d'alerte, particulièrement parlant en cybersécurité, les retours des destinataires et les contributions du réseau."}, {"cue": "Bandeau orange en bas à droite", "text": "Dans votre dossier, Medisecure étant fictive, vos livrables n'ont pas de vrais lecteurs. Proposez trois à cinq indicateurs avec leur mode de calcul, mesurez ceux que votre propre activité permet de chiffrer, comme le délai entre une publication et votre fiche, et déclarez explicitement « non mesuré » les autres. Un indicateur inventé fait perdre plus de crédit qu'un indicateur honnêtement absent."}], "words": 254}, {"n": 56, "title": "Une recommandation exploitable se décide", "paras": [{"cue": "Titre", "text": "Le chapitre 9 franchit la dernière marche : passer de « voici ce qui change » à « voici ce que nous devrions faire, pour quel coût, avec quel résultat ». C'est la partie la plus lourde du dossier : six éléments, de E14 à E19, soit six points sur vingt. Et c'est elle qui relie votre veille au schéma directeur demandé par le directeur général de Medisecure."}, {"cue": "Bandeau sombre du bas (définition)", "text": "Une recommandation exploitable est une proposition qu'un décideur peut accepter ou refuser en connaissance de cause. Elle répond à un problème identifié, propose une solution précise, en estime le coût et les effets, et dit comment on saura qu'elle a réussi."}, {"cue": "Tableau : colonne de gauche, puis colonne de droite", "text": "Le tableau donne quatre contre-exemples. « Il faut s'intéresser à l'IA » ne propose aucune action. « Attention à NIS2 » est une alerte, pas une action. « Mettre à jour les logiciels » a un périmètre flou. « Être plus écoresponsable » est une intention sans moyen ni mesure. À droite, leur version exploitable : une mesure, un périmètre, une durée, un coût, un problème visé."}, {"cue": "Bandeau sombre du bas", "text": "Et l'erreur classique, c'est de partir d'une technologie séduisante découverte en veille, puis de lui chercher un usage. Le correcteur vérifie l'inverse : chaque recommandation est reliée à un problème cité avec sa section du dossier Medisecure, et découle d'une information de veille identifiable dans votre grille."}], "words": 223}, {"n": 57, "title": "Treize rubriques pour qu'aucun élément ne manque", "paras": [{"cue": "Grille des treize rubriques", "text": "La fiche de recommandation est le gabarit qui garantit qu'aucun élément ne manque. Elle compte treize rubriques. Onze reprennent exactement ce que les consignes exigent de toute recommandation : l'intitulé, le problème visé, la solution, les sources de veille, les gains, les risques, le coût, le délai, la conformité réglementaire, l'impact environnemental et le caractère innovant. Deux servent au pilotage : l'indicateur de succès et la place dans la feuille de route."}, {"cue": "Phrase « Indicateur de succès » sous la grille ; rubrique 12 en orange", "text": "L'indicateur de succès est souvent oublié, alors que c'est lui qui rend la recommandation évaluable. « Améliorer la sécurité » n'est pas un indicateur. « Part des comptes protégés par authentification multifacteur : de dix à cent pour cent en trois mois », c'en est un : une valeur de départ, une cible, une échéance."}, {"cue": "Restez sur la grille", "text": "Pour le dossier : au moins cinq recommandations dans la vue d'ensemble, dont au moins trois innovantes, et trois fiches détaillées d'une page sur les trois recommandations innovantes les mieux placées."}, {"cue": "Encadré sombre « Recommandation innovante »", "text": "Qu'est-ce qu'une recommandation innovante au sens des consignes ? Une solution absente aujourd'hui du SI de Medisecure, dont la nouveauté et la maturité sont établies par votre veille, et réaliste dans les contraintes du cas. Une mesure de base n'est jamais innovante. L'authentification multifacteur, par exemple, peut figurer dans la vue d'ensemble si elle conditionne une recommandation innovante ; écrivez alors ce lien. Mais elle ne compte pas parmi les trois innovantes, et elle ne fait pas l'objet d'une fiche détaillée."}], "words": 239}, {"n": 58, "title": "Des ordres de grandeur, des hypothèses déclarées", "paras": [{"cue": "Titre", "text": "Un décideur ne demande pas un devis au centime. Il demande un ordre de grandeur crédible : cinq mille, cinquante mille ou cinq cent mille euros ? La directrice administrative et financière de Medisecure le dit dans le dossier : on lui demande d'arbitrer des projets sans aucun chiffrage. Un chiffrage même approximatif, s'il est honnête, change la discussion."}, {"cue": "Rappelez la section « Coûts de référence » du dossier Medisecure", "text": "La règle est de déclarer toutes ses hypothèses. Un chiffrage, ce sont des quantités multipliées par des coûts unitaires, et chacun doit être visible pour que le lecteur puisse le contester. Le dossier Medisecure fournit une section « Coûts de référence » : vos chiffrages doivent s'appuyer sur elle, et tout coût ajouté doit être sourcé ou posé comme hypothèse."}, {"cue": "Encadré sombre : 63 000 € ÷ 210 jours", "text": "Un piège fréquent : les coûts de personnel sont annuels, le travail se chiffre en jours. Chez Kestrel, un développeur coûte soixante-trois mille euros par an charges comprises ; avec une hypothèse de deux cent dix jours travaillés, cela fait environ trois cents euros par jour, et quinze jours représentent quatre mille cinq cents euros."}, {"cue": "Trois cartes à gauche, puis graphique R2 à droite", "text": "Un chiffrage complet distingue l'investissement, ponctuel, le fonctionnement, récurrent, et les gains. Le graphique montre la recommandation R2 de Kestrel, le pilote OR-Tools : environ vingt-cinq à trente mille euros pour le pilote, pour un gain estimé à vingt mille euros par an sur l'agence pilote, quatre-vingts mille si on généralise. Retour sur un an et demi environ."}, {"cue": "Phrase rouge en bas à droite", "text": "Deux mises en garde. La précision apparente trompe : arrondissez. Et un gain de temps n'est une économie que si le temps libéré est réellement employé autrement."}], "words": 259}, {"n": 59, "title": "Matrice valeur × effort, puis feuille de route", "paras": [{"cue": "Titre", "text": "Avec cinq recommandations ou plus, il faut un ordre. L'organisation ne peut pas tout faire en même temps : son budget, ses équipes et sa capacité d'absorption du changement sont limités."}, {"cue": "Matrice valeur × effort et ses bulles R1 à R5", "text": "L'outil le plus simple est la matrice valeur-effort. La valeur regroupe les gains, la réduction des risques et la contribution aux objectifs. L'effort regroupe le coût, la durée et la difficulté. Quatre zones : les gains rapides, à lancer en premier, parce qu'ils financent la confiance du décideur ; les projets structurants, à planifier avec un jalon intermédiaire ; les compléments ; et ce qu'il faut écarter. Chez Kestrel, la mise en conformité de la géolocalisation et l'authentification multifacteur sont des gains rapides, le pilote OR-Tools et le renouvellement des boîtiers sont des projets structurants, et la maintenance prédictive par IA est écartée. Pour la sécurité et la conformité, une variante croise le risque traité et le gain : une mesure qui réduit un risque grave reste prioritaire même si elle rapporte peu."}, {"cue": "Restez sur la matrice", "text": "Deux contraintes s'ajoutent : les échéances imposées, comme une fin de maintenance, et les dépendances entre recommandations."}, {"cue": "Chevrons court, moyen, long terme", "text": "La feuille de route ordonne ensuite les recommandations sur trois horizons : court terme, trois à six mois ; moyen terme, six à dix-huit mois ; long terme, au-delà. Chaque recommandation y figure avec sa date de début, sa durée, son responsable, son jalon de décision et son budget par année."}, {"cue": "Encadré sombre « Contraintes de Medisecure »", "text": "Pour Medisecure, l'encadré rappelle les contraintes que l'élément E19 vérifie : aucun budget de projet en 2026, une enveloppe de quatre virgule cinq millions sur 2027-2029, une hausse du fonctionnement plafonnée à dix pour cent par an, quatre postes supplémentaires au plus, et la fin de maintenance de MediDossier version 8."}], "words": 283}, {"n": 60, "title": "Le pitch de trois minutes, environ 400 mots", "paras": [{"cue": "Titre", "text": "Un directeur général accorde rarement plus de quelques minutes à un sujet en comité de direction. Trois minutes, c'est environ quatre cents mots à l'oral. Il faut donc choisir."}, {"cue": "Bandeau du temps : 0 à 30 s, puis les quatre séquences", "text": "La structure est simple. Les trente premières secondes posent le problème, avec un fait marquant tiré du cas. La minute suivante présente la solution et ce qui la rend crédible : la source de veille, un exemple de pair. Une minute présente le coût, les gains et les risques, en ordres de grandeur. Et les trente dernières secondes formulent la demande : ce que le décideur doit valider aujourd'hui."}, {"cue": "Cartes sous chaque séquence ; la demande en orange", "text": "Vous avez l'exemple Kestrel sur la diapositive, séquence par séquence. Remarquez qu'il se termine par une demande précise : valider le plan et désigner un pilote."}, {"cue": "Carte « Les deux questions à préparer »", "text": "Un pitch se répète à voix haute, chronomètre en main ; il ne se lit pas. Un seul visuel suffit souvent : la matrice ou la feuille de route. Et préparez les deux questions qu'un décideur pose presque toujours : « Que se passe-t-il si on ne fait rien ? » et « Pourquoi maintenant ? »."}, {"cue": "Carte « À ne pas confondre avec le pitch du Jour 5 »", "text": "Attention à ne pas confondre cet exercice avec le pitch de veille du Jour 5. Celui-là présente votre besoin, vos axes, vos sources clés, votre dispositif qui tourne et une première information repérée, pas une recommandation. Mais les règles de forme sont les mêmes : un fait d'entrée, un message par séquence, une conclusion claire, un temps tenu."}], "words": 239}, {"n": 61, "title": "Transformer un texte, oui ; dire le vrai, non", "paras": [{"cue": "Titre", "text": "Le chapitre 10 traite de l'IA générative, devenue un outil de travail ordinaire. Pour un veilleur, elle est précieuse sur les tâches de transformation de texte, et dangereuse dès qu'on lui demande de dire ce qui est vrai."}, {"cue": "Carte verte « Ce qu'une IA fait bien »", "text": "Ce qu'une IA fait bien, c'est travailler sur un texte que vous lui fournissez : reformuler un passage juridique pour une équipe d'accueil, résumer un rapport à condition de relire les points qui comptent, traduire une ligne directrice publiée en anglais, proposer des mots-clés pour une alerte, comparer deux versions d'un texte. Dans tous ces cas, l'information vient de vous, et vous pouvez contrôler le résultat."}, {"cue": "Carte rouge « Ce qu'une IA fait mal »", "text": "Ce qu'une IA fait mal, c'est produire l'information elle-même. Premier risque, l'invention : un modèle génère un texte plausible, pas un texte vrai. En 2023, un tribunal de New York a sanctionné des avocats qui avaient cité des décisions de justice inventées par ChatGPT. Deuxième risque, la fuite de données. Troisième, les biais : le modèle peut ignorer le droit français. Quatrième, l'obsolescence : interrogé sur l'AI Act, il peut répondre avec un calendrier dépassé."}, {"cue": "Bandeau sombre « Une IA n'est pas une source »", "text": "D'où la règle du cycle : une information produite par une IA n'est jamais une source. C'est une piste. Elle ne devient une information de veille que lorsque vous l'avez retrouvée dans un document d'origine, lu et cité. Dans votre dossier, la référence est toujours le texte officiel ou le rapport, jamais « selon ChatGPT »."}], "words": 235}, {"n": 62, "title": "La charte d'usage de l'IA, applicable à vos travaux", "paras": [{"cue": "Titre", "text": "Les consignes vous demandent d'utiliser l'IA dans le respect de la charte d'usage du cycle. La voici traduite en usages concrets. Si l'équipe pédagogique publie une version mise à jour sur Moodle, c'est elle qui fait foi."}, {"cue": "Colonne verte « Autorisé »", "text": "Est autorisé sans condition : reformuler, corriger ou traduire vos propres textes, et vous faire proposer des mots-clés, des requêtes ou un plan."}, {"cue": "Colonne orange « Autorisé sous conditions »", "text": "Est autorisé sous conditions : résumer ou traduire un document public, à condition de relire le document sur les points utilisés et de citer le document, pas l'IA ; rechercher des sources, à condition d'ouvrir et de lire chacune ; comparer des textes, à condition de les fournir vous-même ; obtenir un chiffre ou une date, seulement comme piste confirmée par la source primaire ; rédiger une partie d'analyse, avec un usage déclaré et une analyse que vous relisez et assumez."}, {"cue": "Colonne rouge « Interdit »", "text": "Est interdit : citer une IA comme source ; saisir des données réelles de patients, de salariés ou d'une entreprise dans un outil public ; saisir des informations techniques internes de votre entreprise d'alternance, comme une architecture, des versions ou des journaux, dans un outil public ; présenter un texte généré sans le déclarer."}, {"cue": "Les deux cartes du bas", "text": "Deux rappels. Anonymiser n'est pas retirer le nom : l'âge, la commune, la pathologie et la date suffisent souvent à réidentifier un patient. Dans le doute, ne saisissez rien. Et tenez pendant l'intersession un journal court de vos usages : date, outil, tâche, données fournies, vérification. Il deviendra votre annexe G. Attention : le correcteur ouvre au hasard deux sources et trois informations de votre dossier, et une information introuvable met à zéro chaque élément qui s'appuie dessus."}], "words": 273}, {"n": 63, "title": "Passer à l'autonomie", "paras": [{"cue": "Écran de partie : titre et liste des chapitres 11 et 12", "text": "Dernière partie : passer à l'autonomie. Le Jour 5 au soir, la partie encadrée du cours s'arrête. Vous retournez en entreprise avec un dispositif à faire vivre et un dossier à écrire, sur trois périodes d'une semaine environ. Le chapitre 11 vous donne un plan de travail, des points de contrôle et la préparation du contrôle. Le chapitre 12 rassemble tous les gabarits du cours."}], "words": 65}, {"n": 64, "title": "Le Jour 5, vous partez avec un dispositif qui tourne déjà", "paras": [{"cue": "Titre", "text": "Vous ne quittez pas la semaine S1 avec une idée de dispositif, mais avec un dispositif qui fonctionne déjà. Voici le minimum à avoir terminé avant votre pitch."}, {"cue": "Les dix cases, de gauche à droite ; « Outils » et « Preuves » en orange", "text": "Les symptômes de Medisecure, au moins trois, chacun cité avec la section du dossier où il apparaît. Le tableau des besoins des six parties prenantes minimum. Le QQOQCCP, même provisoire, avec ses exclusions. Exactement cinq axes. Au moins quinze sources identifiées, majoritairement primaires ; l'objectif de vingt sources retenues sera atteint en période 1. Les quatre fonctions de votre dispositif assurées, sur des comptes à votre nom : agrégateur par axe, alertes actives, suivi des vulnérabilités filtré sur les composants de Medisecure, base de connaissances. Vos premières captures datées. Votre grille d'impact, avec son barème et son sens, et son adoption datée dans le journal. Le journal de veille, créé. Et votre pitch."}, {"cue": "Case « Journal de veille »", "text": "Les informations collectées depuis le Jour 1, y compris celle de votre pitch, peuvent compter parmi vos quinze informations notées."}, {"cue": "Encadré sombre à droite", "text": "Je vous le redis, parce que c'est l'erreur la plus coûteuse de l'intersession : elle se commet le Jour 5. Celui qui part avec l'idée d'utiliser un agrégateur perd sa période 1 à le configurer. Il n'aura ni captures ni séances pour cette période, et l'élément E7 sera perdu. Configurez vos outils pendant la semaine, quand je suis disponible pour vous débloquer."}], "words": 223}, {"n": 65, "title": "Trois périodes : stabiliser, analyser, diffuser et recommander", "paras": [{"cue": "Titre", "text": "Voici le planning des trois périodes de l'intersession. Il suppose environ huit à dix heures d'autoformation au total, en plus de la rédaction et de la veille courante. Les durées sont des ordres de grandeur ; gardez surtout l'ordre des étapes."}, {"cue": "Chevron et carte « Période 1 »", "text": "La période 1 sert à stabiliser. Vous complétez la cartographie à vingt sources notées, vous rédigez les parties 1 et 2, et vous commencez la vérification datée des sept sujets réglementaires sur leur source officielle."}, {"cue": "Chevron et carte « Période 2 »", "text": "La période 2 sert à passer de la collecte à l'analyse. Vous appliquez la grille à toutes vos informations, au moins quinze, vous repérez signaux faibles et forts, vous rédigez les parties 3 et 4, vous organisez la base, et vous commencez la partie 6 sans attendre la fin de la notation."}, {"cue": "Chevron orange et carte « Période 3 »", "text": "La période 3 sert à diffuser et recommander. Vous choisissez vos trois fiches, vous produisez les trois livrables et leur tableau d'accessibilité, vous achevez les recommandations et la feuille de route, puis la conclusion et la synthèse. Vous vous auto-évaluez, et vous déposez."}, {"cue": "Les quatre exigences rouges en bas", "text": "Quatre exigences ne se rattrapent pas après coup : au moins deux séances datées dans chaque période ; au moins une capture de chaque outil dans chaque période ; la vérification datée des sept sujets réglementaires ; et une information nouvelle par axe, gardée hors du dossier, pour le contrôle. Enfin, visez un dépôt la veille du jour du rendu : un dossier déposé une minute avant l'heure limite a rarement été relu."}], "words": 244}, {"n": 66, "title": "Le journal de veille, votre preuve principale", "paras": [{"cue": "Titre", "text": "Une veille qui tourne se reconnaît à sa régularité, pas à son volume. Organisez-la en deux rituels."}, {"cue": "Carte « Rituel quotidien » en haut à droite", "text": "Le rituel quotidien dure quinze à vingt minutes, idéalement à heure fixe : vous parcourez l'agrégateur et les alertes, vous écartez le hors sujet, vous marquez ce qui mérite une lecture complète."}, {"cue": "Les six étapes de la séance à droite", "text": "La séance de veille dure environ une heure, au moins deux fois par période. Six étapes : ouvrir les éléments marqués, remonter à la source primaire, noter chaque information retenue avec la grille, en indiquant sa date de collecte et l'outil qui l'a captée, la classer dans la base, prendre une capture si la période n'en compte pas encore, et compléter le journal."}, {"cue": "Graphique à gauche", "text": "Le journal de veille est votre preuve principale. C'est un simple tableau, une ligne par séance : date, durée, informations collectées, informations retenues, ajustements. Sa première ligne date l'adoption du barème de votre grille."}, {"cue": "Barres du graphique, de P1 à P3, puis la note en italique", "text": "Le graphique montre le journal d'un apprenant chez Kestrel. Les volumes collectés baissent de quatre-vingts à quarante-cinq. Ce n'est pas un échec : cela montre qu'il a réglé ses filtres. Le ratio entre informations retenues et collectées, autour de huit pour cent, devient un indicateur qu'il commente en conclusion. Notez aussi ses ajustements : deux flux trop bruyants supprimés, une alerte reformulée, une page surveillée ajoutée. Les consignes demandent au moins deux ajustements datés et justifiés : un dispositif qui évolue prouve que vous l'avez réellement utilisé."}], "words": 233}, {"n": 67, "title": "Environ 19 pages, rédigées dans l'ordre du cycle", "paras": [{"cue": "Graphique des pages à gauche", "text": "Le plan type des consignes suit le cycle de la veille et l'ordre de la grille. Vous pouvez renommer les titres, pas supprimer ni déplacer de section. Rédigez dans le même ordre, car chaque partie s'appuie sur la précédente. Le graphique donne les repères de pages : une demi-page de synthèse, deux pages pour le contexte, trois et demie pour les axes et la réglementation, trois pour le dispositif, deux pour l'analyse, deux pour la diffusion, cinq pour les recommandations et une pour la conclusion. Environ dix-neuf pages au total."}, {"cue": "Tableau des points à droite", "text": "Le tableau rappelle comment se répartissent les points : sept pour C1, six pour C2, six pour C3, un pour la forme. Et indépendamment de la note, le jury considère une compétence acquise à partir de trois virgule cinq points pour C1, et de trois points pour C2 et C3."}, {"cue": "Carte orange « La partie 6 pèse 6 points »", "text": "La partie 6 est la plus lourde. Commencez-la dès la période 2, sans attendre la fin de la notation."}, {"cue": "Revenez face à la salle", "text": "Pour chaque partie, un piège est signalé dans le cours. Par exemple, résumer le dossier Medisecure au lieu d'en extraire des besoins ; recopier l'état réglementaire du cours sans vérification datée ; présenter la grille vide ; ou écrire une conclusion qui résume au lieu d'analyser les limites et la pérennité. Pour cette conclusion, décrivez la passation comme un responsable qui quitte son poste : un responsable désigné, les documents transmis, dont l'export OPML de l'agrégateur, un rythme de revue, et un signe d'abandon à surveiller."}], "words": 245}, {"n": 68, "title": "Le contrôle : trois veilles flash, premier jour de S2", "paras": [{"cue": "Titre", "text": "Le contrôle a lieu le premier jour de la semaine S2. Il vérifie que votre dispositif fonctionne et que vous savez en tirer vite une information utile. Il est noté sur vingt, à part du dossier."}, {"cue": "Les quatre chevrons : Tirage, 30 minutes, Dépôt, 6 min + 2 min", "text": "Le déroulé est en quatre temps. Au début de la séance, je tire au sort, pour chacun, trois de ses cinq axes. Toute la promotion dispose ensuite de trente minutes pour retrouver dans son dispositif, pour chaque axe, une information publiée ou mise à jour entre le début de la période 2 et le jour du contrôle, et absente du dossier déposé. Vous déposez les liens sur Moodle, et vous ne pouvez plus en changer. Puis chacun présente en six minutes, écran partagé, en partant de l'outil où l'information a été collectée, suivies de deux minutes de questions."}, {"cue": "Graphique du barème, puis carte de droite", "text": "Chaque information suit quatre temps : le fait, sa source primaire, l'impact pour Medisecure, l'action proposée et à qui. Le barème est sur la diapositive : six points pour une information récente, réelle et trouvée dans votre dispositif ; quatre pour la source primaire ouverte et la date vérifiée ; six pour un impact relié à un fait nommé du dossier, comme une application, un chiffre ou une échéance ; quatre pour une action précise, bornée dans le temps, adressée à la bonne fonction. La note est la moyenne des trois veilles flash."}, {"cue": "Revenez face à la salle", "text": "Préparez-vous dès la période 2 : gardez hors du dossier au moins une information nouvelle par axe. La veille du contrôle, mettez votre agrégateur à jour et laissez tous vos outils actifs. Le contrôle ne récompense pas la mémoire, mais la capacité à trouver, vérifier et formuler vite."}], "words": 275}, {"n": 69, "title": "Dix erreurs qui reviennent d'une promotion à l'autre", "paras": [{"cue": "Titre", "text": "Voici les dix erreurs qui reviennent d'une promotion à l'autre. Elles ne viennent presque jamais d'un manque de compétence, mais d'un manque de temps ou d'une mauvaise lecture des consignes."}, {"cue": "Erreurs 1 à 10, de gauche à droite et de haut en bas", "text": "Un : commencer par les outils au lieu des problèmes de Medisecure. Deux : démarrer la veille en période 2, et perdre l'élément E7. Trois : une cartographie dominée par des blogs et de la presse généraliste, alors que plus de la moitié de sources primaires est exigée. Quatre : une grille d'impact présentée vide, sans quinze informations notées. Cinq : citer des textes sans les appliquer à Medisecure, ou recopier leur état depuis le cours sans vérification datée. Six : trois livrables de diffusion qui disent la même chose avec une mise en page différente. Sept : des recommandations vagues, ou des mesures de base présentées comme innovantes. Huit : des recommandations qui ne viennent pas de la veille, alors que le lien entre veille et décision est le cœur du dossier. Neuf : citer une IA générative comme source. Dix : tout rédiger pendant la période 3, avec une relecture bâclée et une partie 6 sacrifiée."}, {"cue": "Revenez face à la salle", "text": "Pour chacune, le remède est dans le cours, et la check-list d'auto-évaluation du chapitre 11 reprend exactement les vingt éléments de la grille. Faites-la une première fois à la fin de la période 2, avec l'exercice de mi-parcours, et une seconde fois avant le dépôt."}, {"cue": "Revenez face à la salle", "text": "Un dernier mot sur l'aide : adressez-vous à vos pairs pour les questions pratiques, constituez un binôme de relecture dès le Jour 5, et posez-moi les questions de fond, de façon précise, en disant ce que vous avez déjà essayé. Une question posée en période 1 coûte moins cher qu'une erreur découverte la veille du rendu."}], "words": 289}, {"n": 70, "title": "Les gabarits, prêts à copier", "paras": [{"cue": "Titre", "text": "Le chapitre 12 rassemble tous les gabarits du cours, prêts à copier dans votre tableur ou votre traitement de texte. Chaque gabarit se présente sous forme de tableau, avec une colonne « À renseigner » et une colonne « Exemple Kestrel ». Pour Medisecure, c'est à vous de les remplir."}, {"cue": "Les quinze cartes de gabarits, ligne par ligne", "text": "Vous y trouverez la fiche de veille, pour votre annexe E ; la cartographie des sources, pour l'annexe B ; le journal de veille, pour l'annexe C ; la grille de fiabilité ; le tableau des parties prenantes et la grille QQOQCCP, pour la partie 1 ; la grille d'impact, pour l'annexe D ; la fiche de recommandation et la feuille de route, pour la partie 6 ; les modèles des trois livrables de diffusion, pour l'annexe F ; et le tableau de preuves d'accessibilité, pour la section 5.4."}, {"cue": "Cartes orange « Glossaire » et « Sitographie »", "text": "Le chapitre se termine par un glossaire de la veille et par une sitographie vérifiée, classée par catégorie. Servez-vous-en comme point de départ de votre cartographie, mais n'oubliez pas de vérifier que chaque source est active au moment où vous l'ajoutez."}, {"cue": "Phrase en italique du bas", "text": "Vous pouvez adapter ces gabarits, ajouter une colonne ou changer un seuil, à condition de justifier vos changements dans le dossier."}], "words": 201}, {"n": 71, "title": "Une veille utile fait décider", "paras": [{"cue": "Titre « Une veille utile fait décider »", "text": "Nous arrivons au terme de ce parcours. Si vous ne deviez retenir qu'une phrase de ce cours, ce serait celle-ci : une veille utile se juge à sa capacité à faire décider, pas à la quantité d'informations collectées."}, {"cue": "Face à la salle", "text": "Tout ce que nous avons vu s'enchaîne. On part des symptômes de l'organisation, pas des outils. On cadre le besoin, on choisit des sources primaires et on les évalue. On monte un dispositif réel, et on prouve qu'il tourne. On filtre, on vérifie, on note avec une grille explicite. On diffuse au bon lecteur, sous la bonne forme. Et on en tire des recommandations chiffrées, conformes, ordonnées dans une feuille de route."}, {"cue": "Les deux premières lignes du sous-titre", "text": "Pour la suite, concrètement : dès lundi, votre dispositif doit tourner. Deux séances de veille datées dans chaque période, une capture de chaque outil dans chaque période, et le journal tenu à jour. Pensez aussi au contrôle du premier jour de S2 : gardez hors du dossier au moins une information nouvelle par axe. Et ajustez votre dispositif en l'utilisant : un flux inutile se supprime, une alerte trop bavarde se reformule."}, {"cue": "Dernière ligne : les consignes font foi", "text": "Deux rappels pour finir. En cas de divergence entre ce cours et les consignes du dossier D1, ce sont les consignes qui font foi. Et toute information datée de ce cours a été vérifiée à la date de sa rédaction : quand le cours signale un point incertain, vérifiez-le. C'est déjà un acte de veille."}, {"cue": "Ouvrez les questions", "text": "Merci pour votre attention. Je prends maintenant vos questions."}], "words": 246}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);

}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }
async function full() { try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); } catch {} }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }
});

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
