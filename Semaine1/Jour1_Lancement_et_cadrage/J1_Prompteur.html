<style>
/* Layout : un plateau de prompteur plein écran, texte centré sur une colonne étroite, ligne de lecture fixe au tiers haut, commandes en bas. Look sombre assumé (usage en salle et en caméra). */
:root {
  --ink: #0d1417;        /* fond du plateau */
  --panel: #152126;      /* barre de commandes */
  --text: #f1f4f2;       /* texte lu */
  --dim: #8fa3a6;        /* texte secondaire */
  --accent: #e8a94a;     /* repères de diapositive, ligne de lecture */
  --line: #24353b;
  --cue: #7cc4c0;        /* repères scéniques, non lus */
  --font: "Atkinson Hyperlegible", "Segoe UI", Calibri, Arial, sans-serif;
  --size: 44px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--text); font-family: var(--font); overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }

#stage { position: fixed; inset: 0; overflow-y: auto; scrollbar-width: none; cursor: pointer; }
#stage::-webkit-scrollbar { display: none; }
#script { max-width: 30ch; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 38vh 70vh; font-size: var(--size); line-height: 1.45; transition: transform .2s; }
#script.wide { max-width: 40ch; }
#script.mirror { transform: scaleX(-1); }
#script p { margin: 0 0 .9em; }
.slide { padding-top: .6em; }
.marker { display: flex; gap: .6em; align-items: baseline; font-size: .42em; font-weight: 700; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; border-top: 2px solid var(--line); padding-top: .8em; margin-bottom: .8em; }
.marker .t { text-transform: none; letter-spacing: 0; color: var(--dim); font-weight: 400; }
.cue { display: block; font-size: .4em; line-height: 1.35; color: var(--cue); font-weight: 700; margin-bottom: .35em; }
.cue::before { content: "➜ "; }
.marker .clic { background: var(--accent); color: var(--ink); padding: .1em .5em; border-radius: 4px; }
.end { text-align: center; color: var(--dim); font-size: .6em; padding-top: 2em; }

#guide { position: fixed; left: 0; right: 0; top: 34vh; height: calc(var(--size) * 1.45); pointer-events: none; border-block: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
#guide::before, #guide::after { content: ""; position: absolute; top: 50%; translate: 0 -50%; border: 10px solid transparent; }
#guide::before { left: max(8px, env(safe-area-inset-left, 0px)); border-left-color: var(--accent); }
#guide::after { right: max(8px, env(safe-area-inset-right, 0px)); border-right-color: var(--accent); }
.fade-top, .fade-bot { position: fixed; left: 0; right: 0; pointer-events: none; }
.fade-top { top: 0; height: 22vh; background: linear-gradient(var(--ink), transparent); }
.fade-bot { bottom: 0; height: 30vh; background: linear-gradient(transparent, var(--ink)); }

#hud { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--dim); pointer-events: none; font-variant-numeric: tabular-nums; }
#hud b { color: var(--text); font-weight: 700; }
#progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; height: 3px; width: 0; background: var(--accent); }

#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; font-size: 14px; transition: opacity .4s, transform .4s; }
body.playing.idle #bar { opacity: 0; transform: translateY(100%); pointer-events: none; }
body.playing.idle #stage { cursor: none; }
.grp { display: flex; align-items: center; gap: 6px; }
.lab { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.val { min-width: 4.6em; text-align: center; font-variant-numeric: tabular-nums; }
button, select { font: inherit; color: var(--text); background: #1e2e34; border: 1px solid var(--line); border-radius: 6px; padding: 7px 11px; cursor: pointer; }
button:hover, select:hover { border-color: var(--dim); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
#play { background: var(--accent); color: var(--ink); border-color: var(--accent); font-weight: 700; min-width: 7.5em; }
select { max-width: min(22em, 80vw); }
#help { color: var(--dim); font-size: 12px; flex-basis: 100%; text-align: center; }
#help kbd { font: inherit; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--text); }
@media (max-width: 640px) { :root { --size: 30px; } #help { display: none; } #hud .t { display: none; } }
@media (prefers-reduced-motion: reduce) { #bar, #script { transition: none; } }
</style>

<div id="bar" role="toolbar" aria-label="Commandes du prompteur">
  <button id="play" type="button">▶ Lecture</button>
  <div class="grp"><span class="lab">Vitesse</span><button id="slower" type="button" aria-label="Ralentir">−</button><span class="val" id="speed"></span><button id="faster" type="button" aria-label="Accélérer">+</button></div>
  <div class="grp"><span class="lab">Taille</span><button id="smaller" type="button" aria-label="Réduire le texte">A−</button><button id="bigger" type="button" aria-label="Agrandir le texte">A+</button></div>
  <div class="grp"><button id="prev" type="button" aria-label="Diapositive précédente">◀</button><select id="jump" aria-label="Aller à la diapositive"></select><button id="next" type="button" aria-label="Diapositive suivante">▶</button></div>
  <div class="grp"><button id="wide" type="button" aria-pressed="false">Colonne large</button><button id="mirror" type="button" aria-pressed="false">Miroir</button><button id="full" type="button">Plein écran</button></div>
  <div id="help"><kbd>Espace</kbd> lecture/pause · <kbd>↑</kbd><kbd>↓</kbd> vitesse · <kbd>←</kbd><kbd>→</kbd> diapositive · <kbd>+</kbd><kbd>−</kbd> taille · <kbd>M</kbd> miroir · <kbd>F</kbd> plein écran · molette pour recaler · en vert : où regarder sur la diapositive (ne pas lire)</div>

<script>
const DATA = [{"n": 1, "title": "Veille technologique et réglementaire", "paras": [{"cue": "Titre au centre, face à la salle", "text": "Bonjour à toutes et à tous, et bienvenue dans le premier cours du cycle Expert en informatique et systèmes d'information. Cette semaine, nous allons travailler sur la veille technologique et réglementaire. C'est l'unité d'enseignement numéro un, et c'est aussi la porte d'entrée du bloc « Définir une stratégie de systèmes d'information »."}, {"cue": "Sous-titre : « Concevoir, outiller, faire vivre… »", "text": "Mon objectif est simple. À la fin de la semaine, vous devez être capables de concevoir seuls un dispositif de veille, de le monter avec de vrais outils, de le faire tourner pendant trois semaines en entreprise, et d'en tirer des recommandations argumentées. Tout cela aboutit à votre premier dossier, le dossier D1."}, {"cue": "Mentionnez le cours sur Moodle", "text": "Ce support suit le cours rédigé que vous trouverez sur Moodle, chapitre par chapitre. Je vais vous présenter les méthodes ; le cours, lui, contient tous les détails, les gabarits et les exercices. Gardez-le ouvert à côté de vous pendant toute la semaine."}], "words": 148}, {"n": 2, "title": "Une DSI décide chaque mois sur de l'information", "paras": [{"cue": "Titre", "text": "Commençons par la question la plus importante : à quoi sert une veille ?"}, {"cue": "Bloc de texte à gauche, puis les quatre cartes de décisions", "text": "Une direction des systèmes d'information prend chaque mois des décisions qui l'engagent pour plusieurs années. Choisir un logiciel, migrer une infrastructure, lancer un projet d'intelligence artificielle, répondre à une obligation légale nouvelle. Toutes ces décisions reposent sur une information à jour. Quand cette information manque, l'organisation subit : elle découvre trop tard qu'un composant n'est plus maintenu, qu'une règle a changé, ou qu'un concurrent a pris de l'avance."}, {"cue": "Encadré sombre à droite : « Avril 2023 » puis « 2024 »", "text": "Regardez l'encadré de droite, tiré de notre cas fil rouge. Node.js 14 n'est plus maintenu depuis avril 2023. Les développeurs de Medisecure ne l'ont découvert qu'en 2024. Pendant plus d'un an, une application a tourné sans correctif de sécurité. Et pourtant, l'information était publique. Ce qui manquait, ce n'était pas l'information, c'était le circuit qui la relie au parc applicatif et à un décideur."}, {"cue": "Phrase en italique en bas à gauche", "text": "Retenez donc dès maintenant cette idée : la veille ne consiste pas à accumuler des articles. Elle consiste à livrer, à la bonne personne et au bon moment, l'information qui lui permet de décider."}], "words": 180}, {"n": 3, "title": "Deux organisations fictives, deux usages", "paras": [{"cue": "Titre", "text": "Le cours s'appuie sur deux organisations fictives, et il est important de comprendre pourquoi il y en a deux."}, {"cue": "Carte de gauche « Kestrel Logistique »", "text": "La première, Kestrel Logistique, est un transporteur régional de 300 salariés, avec 40 camions connectés, une plateforme de suivi des colis développée en interne et un projet d'optimisation des tournées par IA. Elle sert aux exemples travaillés. Chaque fois que je vous présente une méthode, vous la verrez appliquée de bout en bout sur Kestrel."}, {"cue": "Carte de droite « Medisecure »", "text": "La seconde, Medisecure, est un réseau de 14 centres de santé. C'est notre cas fil rouge pour toute l'année, et c'est sur elle que portent les exercices et votre dossier D1. Medisecure n'a ni les mêmes métiers ni les mêmes obligations que Kestrel : elle traite des données de santé, elle est concernée par l'hébergement de données de santé, par l'AI Act, par NIS2, peut-être par la réglementation des dispositifs médicaux."}, {"cue": "Les deux bandeaux colorés du bas", "text": "D'où la règle du cours : les exemples Kestrel se lisent comme des modèles de raisonnement, jamais comme des textes à recopier. Et les exercices sur Medisecure ne sont pas corrigés, parce que le dossier est le vôtre."}], "words": 183}, {"n": 4, "title": "Trois compétences, un dossier noté sur 20", "paras": [{"cue": "Titre", "text": "Le dossier D1 valide les trois premières compétences du bloc 1 du titre RNCP. Je vous les présente dans l'ordre où elles s'enchaînent."}, {"cue": "Pastille C1 et sa carte « E1 à E7 · 7 points »", "text": "C1, c'est concevoir et structurer une veille : un besoin cadré, des axes justifiés, au moins vingt sources évaluées selon des critères explicites, les grandes orientations réglementaires, et un dispositif réellement monté. C'est sept points sur vingt."}, {"cue": "Pastille C2 et sa carte « E8 à E13 »", "text": "C2, c'est synthétiser et restituer : une méthode de tri, une grille d'impact appliquée à au moins quinze informations, trois fiches de veille, trois livrables de diffusion adaptés à leurs publics. Six points."}, {"cue": "Pastille C3 et sa carte « E14 à E19 »", "text": "C3, c'est recommander des solutions innovantes : au moins cinq recommandations, dont trois innovantes, trois fiches chiffrées et conformes, et une feuille de route. Six points. Le dernier point porte sur la forme."}, {"cue": "Bandeau du bas : règle de notation et acquisition", "text": "La règle de notation est très précise, et je vous demande de la retenir. Chaque élément vaut un point et repose sur trois conditions vérifiables. Trois conditions remplies, un point. Deux, un demi-point. Une ou aucune, zéro. Une condition est remplie ou ne l'est pas, jamais à moitié. Beaucoup de conditions portent sur une justification : chaque fois que vous retenez un axe, une source ou un outil, écrivez en une phrase pourquoi, et pour quel besoin de Medisecure."}], "words": 205}, {"n": 5, "title": "La semaine S1 : des méthodes et un dispositif qui tourne", "paras": [{"cue": "Frise des cinq jours", "text": "Voici comment la semaine est organisée. Elle lance le dossier et vous donne les méthodes ; le travail de fond se fera ensuite, en autonomie, pendant l'intersession."}, {"cue": "Pastille 1 et carte « À produire » du Jour 1", "text": "Le Jour 1, après la réunion de rentrée, nous découvrons le cas Medisecure et les consignes du dossier, puis les chapitres 1 et 2. Vous repartez avec les symptômes de Medisecure, le tableau des besoins des parties prenantes, un premier QQOQCCP et vos axes."}, {"cue": "Pastille 2 : Jour 2", "text": "Le Jour 2 est consacré aux sources et aux outils. C'est le jour le plus important de la semaine : le soir, votre agrégateur, vos alertes, votre suivi des vulnérabilités et votre base de connaissances doivent être configurés."}, {"cue": "Pastille 3 : Jour 3", "text": "Le Jour 3 porte sur le traitement, l'analyse et le panorama réglementaire. Vous testez la grille d'impact sur de vraies informations."}, {"cue": "Pastille 4 : Jour 4", "text": "Le Jour 4 couvre la cybersécurité, l'IA, la diffusion et les recommandations. Vous ajoutez les sources de l'axe cybersécurité et vous ouvrez votre journal de veille."}, {"cue": "Pastille 5 (orange) et phrase en italique du bas", "text": "Le Jour 5, enfin, chacun présente un pitch de veille de trois minutes, avec au plus trois diapositives et une démonstration de son agrégateur. Ce pitch n'est pas noté : c'est un point d'étape pour recevoir un retour avant de partir."}], "words": 197}, {"n": 6, "title": "Du Jour 1 au jour du contrôle", "paras": [{"cue": "Frise de chevrons en haut", "text": "Regardons maintenant le calendrier complet, du Jour 1 jusqu'au jour du contrôle."}, {"cue": "Chevrons Période 1 à 3, puis Jour du rendu et Jour du contrôle", "text": "Après la semaine S1 vient l'intersession, en entreprise, découpée en trois périodes d'une semaine environ. La période 1 commence le lendemain du Jour 5 ; la période 3 s'achève le jour du rendu. Le dossier se dépose ce jour-là sur Moodle. Puis, le premier jour de la semaine S2, a lieu le contrôle : trois veilles flash portant sur trois de vos axes, tirés au sort. Les dates exactes de votre promotion sont dans les consignes publiées sur Moodle."}, {"cue": "Carte « Le dossier » à gauche", "text": "Le dossier est individuel. Vous pouvez comparer des outils avec vos pairs et vous relire, mais votre cartographie, vos notes, votre analyse et vos recommandations sont personnelles. Il compte quinze à vingt pages et se dépose en un seul PDF, annexes comprises."}, {"cue": "Liste des annexes A à G", "text": "Les sept annexes, de A à G, servent de preuves : captures du dispositif, cartographie, journal, grille remplie, fiches, livrables et usage de l'IA."}, {"cue": "Bandeau rouge en bas à droite", "text": "Et je vous signale tout de suite le piège principal. Le dossier doit prouver que votre veille a fonctionné pendant les trois périodes : captures de chaque outil dans chaque période, deux séances datées par période. Si vos outils ne sont pas configurés à la fin de S1, la période 1 est perdue, et elle ne se rattrape pas le jour du rendu."}], "words": 220}, {"n": 7, "title": "Comprendre la veille", "paras": [{"cue": "Écran de partie : titre et liste des chapitres", "text": "Entrons dans le vif du sujet avec la première partie : comprendre ce qu'est la veille. C'est le chapitre 1 du cours. Il pose le vocabulaire que nous utiliserons toute la semaine, et surtout le cycle de la veille, qui structure aussi le plan de votre dossier."}], "words": 47}, {"n": 8, "title": "Une activité organisée, continue, au service d'une décision", "paras": [{"cue": "Titre", "text": "Définissons d'abord la veille. C'est une activité organisée et continue, qui consiste à surveiller l'environnement d'une organisation pour repérer les évolutions qui peuvent l'affecter, puis à transmettre ce qui compte à ceux qui décident."}, {"cue": "Les trois cartes : Organisée, Continue, Décider (sombre)", "text": "Trois mots portent cette définition. « Organisée » : il y a un besoin, des sources et une méthode, pas une lecture au fil de l'eau. « Continue » : la veille ne se fait pas une fois pour toutes. Et « décider » : c'est sa finalité. Une veille qui ne sert aucune décision, c'est un loisir."}, {"cue": "Tableau du bas : veille, audit, recherche documentaire", "text": "La veille regarde à l'extérieur de l'organisation. C'est ce qui la distingue de l'audit, qui examine l'interne, et de la recherche documentaire ponctuelle, qui répond à une question unique puis s'arrête. En pratique, la veille combine les deux mouvements : elle surveille en continu un périmètre, et elle approfondit quand un signal le justifie."}], "words": 146}, {"n": 9, "title": "Quatre familles, des frontières poreuses", "paras": [{"cue": "Les quatre cartes de familles, de haut en bas", "text": "On distingue plusieurs familles de veille selon l'objet surveillé. La veille technologique suit les technologies, les versions, les fins de support. La veille réglementaire suit les lois, les règlements, la doctrine des autorités. La veille concurrentielle suit les concurrents et leurs offres. La veille sociétale et environnementale suit les attentes des clients et des salariés et les contraintes climatiques. Pour chacune, vous avez un exemple Kestrel sur la diapositive."}, {"cue": "Restez sur les quatre cartes", "text": "Les frontières sont poreuses : une même information relève souvent de plusieurs familles. Ce cours se concentre sur la veille technologique et la veille réglementaire, parce que ce sont elles que le référentiel évalue. Les deux autres les éclairent."}, {"cue": "Encadré sombre à droite : AI Act, haut risque", "text": "L'encadré de droite montre pourquoi la veille réglementaire doit être continue. L'AI Act, entré en vigueur le 1er août 2024, prévoyait l'application des obligations sur les systèmes à haut risque de l'annexe III au 2 août 2026. D'après les sources consultées pour le cours, le règlement 2026/1744, en vigueur depuis le 27 juillet 2026, reporte cette échéance au 2 décembre 2027. Une organisation qui a lu le texte en 2024 sans le suivre travaille aujourd'hui sur un calendrier faux. Premier réflexe de veilleur : confirmer ce report sur EUR-Lex, dans le texte publié au Journal officiel."}], "words": 204}, {"n": 10, "title": "Une information devient utile quand elle répond à « et alors ? »", "paras": [{"cue": "Titre", "text": "Voici la distinction qui sert de fil directeur à tout le cours : celle entre information et renseignement."}, {"cue": "Première carte « Information brute »", "text": "Une information est un fait mis en forme. « La version 14 de Node.js n'est plus maintenue depuis le 30 avril 2023. » Elle est vraie ou fausse, mais elle ne dit rien de ce qu'il faut faire."}, {"cue": "Cartes « + Contexte », « + Impact », « + Option de décision », de gauche à droite", "text": "Chez Kestrel, le veilleur transforme cette information en renseignement en ajoutant trois éléments. D'abord le contexte : le serveur de la plateforme de suivi des colis tourne encore sur cette version. Ensuite l'impact : plus aucun correctif de sécurité ne sera publié, sur une application exposée à Internet qui manipule des adresses de clients. Enfin l'option de décision : migrer vers une version maintenue, avec une estimation de charge."}, {"cue": "Bandeau sombre « Renseignement » en bas", "text": "Le directeur des systèmes d'information n'a pas à lire la page de l'éditeur. Il lit trois lignes et il décide. C'est cela, un renseignement : une information sélectionnée, vérifiée, mise en contexte et interprétée pour un destinataire précis. Une veille qui transmet de l'information brute déplace le travail vers le décideur, qui n'a pas le temps de le faire. Une veille qui produit du renseignement fait ce travail à sa place."}], "words": 196}, {"n": 11, "title": "Le cycle de la veille en sept étapes", "paras": [{"cue": "Anneau du cycle, étape 1 en haut", "text": "La veille est décrite comme un cycle, parce que chaque tour améliore le suivant. Les auteurs ne découpent pas toujours les étapes de la même façon ; nous en retenons sept, qui correspondent au plan de votre dossier."}, {"cue": "Faites le tour des étapes 1 à 7 dans le sens des aiguilles d'une montre ; l'étape 4 est en orange", "text": "Un, l'expression du besoin : qui a besoin d'information, pour quelles décisions, avec quelle urgence. C'est l'étape la plus négligée. Deux, le ciblage : on traduit les besoins en axes, en mots-clés et en sources, et on fixe ce qu'on ne suit pas. Trois, la collecte, manuelle ou automatisée. Quatre, le traitement et l'analyse : on élimine le bruit, on vérifie, on classe, on évalue l'impact. C'est l'étape qui demande le plus de compétence, et elle ne s'automatise qu'en partie. Cinq, la diffusion, sous une forme adaptée à chaque destinataire. Six, la capitalisation, pour que l'information survive à sa diffusion et aux départs. Sept, l'évaluation et l'ajustement : la veille a-t-elle servi ? C'est cette dernière étape qui fait du processus un cycle et non une chaîne."}, {"cue": "Centre « Décision », puis tableau de droite", "text": "Au centre, la décision. Et à droite, le lien avec votre dossier : le plan type suit exactement ce cycle, et le respecter compte dans l'élément de forme."}], "words": 193}, {"n": 12, "title": "La veille est la brique d'entrée de l'intelligence économique", "paras": [{"cue": "Titre", "text": "La veille s'inscrit dans un ensemble plus large : l'intelligence économique. En France, la définition de référence reste celle du rapport Martre, publié en 1994 par le Commissariat général du Plan : l'ensemble des actions coordonnées de recherche, de traitement et de distribution de l'information utile aux acteurs économiques, menées légalement."}, {"cue": "Les trois cartes : Maîtrise de l'information, Protection, Influence ; puis la définition en dessous", "text": "L'intelligence économique a trois volets. La maîtrise de l'information, c'est la veille. La protection, ou sécurité économique, consiste à protéger ses informations sensibles, son savoir-faire et ses systèmes. L'influence consiste à agir sur son environnement, par exemple en répondant à une consultation publique. La veille est donc la brique d'entrée, mais une veille qui ignore la protection de ses propres informations est incomplète. Côté public, c'est le SISSE, rattaché à la Direction générale des entreprises, qui coordonne la politique de sécurité économique."}, {"cue": "Colonne de droite : carte rouge « Annulée » puis carte verte « En vigueur »", "text": "Un mot sur les normes, parce que c'est un piège classique. Beaucoup de supports présentent encore la norme AFNOR XP X50-053 de 1998 comme la norme de la veille. Elle est aujourd'hui annulée : vous pouvez la citer comme repère historique, pas comme norme applicable. La norme en vigueur est l'ISO 56006 de 2021, qui donne des lignes directrices non certifiables. Moralité : vérifiez toujours le statut d'une norme avant de la citer. Le correcteur valorise une citation exacte."}], "words": 212}, {"n": 13, "title": "Push, pull : un bon dispositif est mixte, et le justifie", "paras": [{"cue": "Titre et en-têtes du tableau Pull / Push", "text": "Il existe deux modes de collecte. En mode pull, « tirer », le veilleur va chercher l'information : il consulte des sites, interroge des bases, lance des recherches. En mode push, « pousser », l'information vient à lui : alertes, flux RSS, newsletters, notifications d'un outil de suivi des vulnérabilités."}, {"cue": "Lignes « Points forts » et « Points faibles »", "text": "Le pull permet une recherche ciblée et approfondie, et c'est le seul moyen de suivre les sources sans flux. Mais il est chronophage et dépend de la discipline du veilleur. Le push est régulier et rapide, mais il risque la surcharge, et il ne vaut que ce que vaut son paramétrage."}, {"cue": "Ligne « Chez Kestrel »", "text": "En pratique, un bon dispositif est mixte. Le push assure la surveillance continue des sources qui publient beaucoup et vite, comme les bulletins de sécurité. Le pull complète pour les sources sans flux et pour les approfondissements déclenchés par un signal. Chez Kestrel, on consulte chaque mois les délibérations de la CNIL, et on reçoit en continu les avis du CERT-FR filtrés sur les produits de la plateforme."}, {"cue": "Bandeau orange du bas", "text": "Attention pour votre dossier : écrire « méthode mixte » ne suffit pas. Vous devez dire quelles sources relèvent de quel mode, et pourquoi, en vous appuyant sur les besoins de la partie 1."}], "words": 203}, {"n": 14, "title": "Quatre rôles, parfois tenus par une seule personne", "paras": [{"cue": "Les quatre pastilles V, E, D, C", "text": "Un dispositif de veille fait intervenir quatre rôles. Dans une petite structure, une seule personne peut les tenir tous, mais les distinguer aide à répartir le travail."}, {"cue": "Pastilles V, E puis D et leurs cartes « Mission »", "text": "Le veilleur, ou animateur, organise le dispositif, configure les outils, collecte, fait le premier tri, rédige et diffuse. Chez Kestrel, c'est un ingénieur de la DSI, à vingt pour cent de son temps. L'expert analyse et valide les informations de son domaine : le responsable de la plateforme pour la technique, le délégué à la protection des données pour les données personnelles. Le décideur exprime les besoins, reçoit le renseignement, décide, et dit si la veille a servi."}, {"cue": "Pastille orange C, « Réseau de correspondants »", "text": "Le quatrième rôle est souvent oublié : le réseau de correspondants. Ce sont les personnes qui font remonter du terrain des informations qu'aucun flux ne donnera. Un chauffeur qui signale qu'un client a équipé ses quais d'un nouveau système de rendez-vous apporte une information concurrentielle précieuse. Encore faut-il qu'il sache à qui la transmettre, et qu'il ait un retour : sans retour, les correspondants cessent vite de signaler."}, {"cue": "Phrase en gras en bas", "text": "Petite précision de vocabulaire : dans ce cours, le mot « capteur » désigne les outils qui détectent les nouveautés. Les personnes sont des correspondants."}], "words": 198}, {"n": 15, "title": "Quatre erreurs rendent une veille inutile", "paras": [{"cue": "Titre", "text": "Terminons ce chapitre par les quatre erreurs qui rendent une veille inutile. Vous les retrouverez toutes, à un moment ou à un autre, dans votre entreprise."}, {"cue": "Erreur 1, en haut à gauche", "text": "La première est l'infobésité : collecter trop, trier trop peu. Un veilleur abonné à cinquante newsletters ne lit plus rien en profondeur. Le volume donne une impression de sérieux, mais il noie les signaux importants. Le remède, c'est un cadrage strict des axes et une sélection exigeante des sources."}, {"cue": "Erreur 2, en haut à droite", "text": "La deuxième est la veille sans destinataire : une revue de presse soignée que personne n'a demandée et que personne ne lit. Chez Medisecure, plusieurs alertes publiques sur l'hameçonnage visant les établissements de santé ont été diffusées en 2024 sans jamais être relayées en interne. L'information existait ; le circuit vers un destinataire n'existait pas."}, {"cue": "Erreur 3, en bas à gauche", "text": "La troisième est l'absence de capitalisation. L'information circule par courriel ou à l'oral, puis disparaît, et le départ d'un collaborateur emporte toute la mémoire du sujet. C'est encore le cas de Medisecure."}, {"cue": "Erreur 4, en bas à droite", "text": "La quatrième, plus discrète, consiste à ne jamais évaluer. Sans mesure de l'utilité, la veille ne s'améliore pas, et elle finit supprimée au premier arbitrage budgétaire."}, {"cue": "Mentionnez l'exercice du chapitre 1", "text": "Pour vous entraîner, l'exercice facultatif du chapitre 1 vous fait diagnostiquer la veille actuelle de Medisecure à partir de ces erreurs."}], "words": 209}, {"n": 16, "title": "Concevoir le dispositif", "paras": [{"cue": "Écran de partie : titre et liste des chapitres 2 à 4", "text": "Deuxième partie : concevoir le dispositif. Elle regroupe trois chapitres qui correspondent aux Jours 1 et 2 de la semaine. D'abord cadrer, c'est-à-dire savoir qui a besoin de quoi. Ensuite trouver et évaluer les sources. Enfin outiller la collecte avec de vrais outils. L'ordre compte : on cadre avant de chercher des sources, et on choisit les sources avant les outils."}], "words": 61}, {"n": 17, "title": "Partir des symptômes, pas des outils", "paras": [{"cue": "Titre", "text": "Le chapitre 2 traite du cadrage, l'étape qui décide de l'utilité de toute la veille. Le réflexe naturel consiste à commencer par les outils : choisir un agrégateur, s'abonner à des newsletters. C'est exactement l'inverse qu'il faut faire. On commence par ce qui ne va pas dans l'organisation."}, {"cue": "Première carte rouge « Symptôme »", "text": "Un symptôme est un fait observable qui révèle un problème : un incident, un indicateur dégradé, une plainte récurrente. Il doit être factuel, sourcé, si possible chiffré. « La sécurité est insuffisante » n'est pas un symptôme exploitable. « La plateforme de suivi a été indisponible onze heures pendant le pic de décembre, et deux de ses composants ne sont plus maintenus », en est un."}, {"cue": "Flèches vers « Décision » et « Besoin », puis la formule dans le bandeau sombre", "text": "De chaque symptôme, on déduit une décision en jeu, puis un besoin d'information, que je vous demande de formuler toujours de la même manière : « Pour décider de X, telle personne a besoin de savoir Y, avant telle date. » Cette formule vous oblige à nommer un destinataire, une décision et une échéance. Sans ces trois éléments, le besoin reste vague et la veille dérive."}, {"cue": "Tableau Kestrel du bas, deuxième ligne (NIS2)", "text": "Le tableau montre les trois symptômes de Kestrel. Remarquez le deuxième : savoir si Kestrel est concernée par NIS2 suppose de suivre une transposition qui, à la date du cours, n'est pas faite en France. Le veilleur l'écrit tel quel, et en fait une priorité de suivi."}], "words": 227}, {"n": 18, "title": "Qui décide quoi, et sous quelle forme veut-il l'information ?", "paras": [{"cue": "Titre", "text": "Une fois les besoins identifiés, on cartographie les parties prenantes : les personnes qui prennent des décisions éclairées par la veille, ou qui en subissent les conséquences. Pour chacune, on note ce qu'elle doit décider, ce qu'elle a besoin de savoir, sous quelle forme et à quel rythme."}, {"cue": "Tableau Kestrel à gauche, ligne par ligne", "text": "Regardez le tableau Kestrel. Le directeur général veut une note d'une page par mois, et une alerte immédiate en cas de risque majeur. Le responsable de la plateforme veut une fiche technique hebdomadaire avec des numéros de version. Les chauffeurs veulent un message court, au moment d'un changement. Ce ne sont pas les mêmes lecteurs, ni les mêmes formats."}, {"cue": "Phrase en italique sous le tableau", "text": "Cette cartographie a deux usages. Elle garantit que la veille a des destinataires, ce qui évite l'erreur de la veille sans lecteur. Et elle prépare déjà la diffusion, que nous verrons au chapitre 8."}, {"cue": "Encadré sombre à droite : les six fonctions de Medisecure", "text": "Pour votre dossier, les consignes imposent au minimum six parties prenantes chez Medisecure : la direction générale, la DSI, le RSSI, le tech lead, le DPO et les soignants. Et posez-vous une question en lisant le dossier de présentation : parmi les acteurs cités, qui n'a encore jamais reçu d'information de veille ?"}], "words": 194}, {"n": 19, "title": "Le QQOQCCP, avec une colonne d'exclusions", "paras": [{"cue": "Titre et colonne « Question »", "text": "Pour cadrer le périmètre, nous utilisons le QQOQCCP : qui, quoi, où, quand, comment, combien, pourquoi. Son intérêt, c'est de faire apparaître les angles morts. On pense spontanément au « quoi », rarement au « combien » ou au « quand »."}, {"cue": "Colonne centrale « Réponse pour Kestrel »", "text": "La méthode tient en cinq temps. On part des symptômes et de la cartographie des parties prenantes. On répond à chaque question par des éléments précis et vérifiables, jamais par « toutes les technologies utiles ». Pour chaque question, on écrit aussi ce qui est exclu. On vérifie la cohérence : le « combien » doit permettre de tenir le « quand », et le « pourquoi » doit justifier chaque élément du « quoi ». Enfin, on fait relire par un décideur et on date le tableau."}, {"cue": "Colonne de droite « Exclusions », puis bandeau orange", "text": "Regardez la troisième colonne. Le veilleur de Kestrel a écrit une exclusion à chaque question : la réglementation du transport hors numérique est suivie par le service juridique, les marchés hors Europe ne sont pas suivis, aucun recrutement n'est prévu. Cette discipline protège la veille contre l'élargissement progressif du périmètre, qui est la première cause d'infobésité. Pour votre dossier, les exclusions sont explicitement vérifiées par le correcteur."}], "words": 197}, {"n": 20, "title": "Cinq axes, priorisés par une méthode explicite", "paras": [{"cue": "Titre", "text": "Un axe de veille est un domaine de surveillance cohérent, rattaché à un ou plusieurs besoins. On en retient généralement entre quatre et six. Pour votre dossier, c'est exactement cinq : quatre axes obligatoires, et un axe libre que vous choisissez et justifiez."}, {"cue": "Liste de droite : les quatre axes obligatoires et le +1", "text": "Les quatre axes obligatoires sont imposés : la réglementation, qui couvre la santé, les dispositifs médicaux, les données et l'IA ; les technologies, qui couvrent l'architecture, les données et l'IA ; la cybersécurité en santé ; et le numérique responsable. Votre travail est de les préciser pour Medisecure, et de justifier leur priorité."}, {"cue": "Matrice de gauche : quadrants et bulles des axes Kestrel", "text": "Pour prioriser, on utilise ici une matrice importance-urgence. L'importance mesure l'ampleur de l'impact possible : coût, sanction, risque pour les personnes. L'urgence mesure la proximité de l'échéance. Le croisement donne quatre niveaux de priorité. Vous voyez les cinq axes de Kestrel placés sur la matrice : cybersécurité et réglementation en priorité 1, technologies en priorité 2, concurrents en 3, numérique responsable en 4."}, {"cue": "Phrase rouge en bas à droite", "text": "D'autres méthodes sont possibles, par exemple une note de 1 à 5 multipliée. Le correcteur ne note pas l'outil ; il note la cohérence de la justification. Et attention : une priorité faible ne veut pas dire un axe abandonné. Chez Medisecure, le plan 2030 fixe déjà un objectif de moins trente pour cent d'empreinte numérique par patient. Tenez-en compte avant de classer cet axe."}], "words": 224}, {"n": 21, "title": "Un planning tenable et un plan de veille en huit rubriques", "paras": [{"cue": "Titre", "text": "La fréquence de suivi découle de deux choses : la priorité de l'axe, et le rythme de publication des sources. Un axe de priorité 1 sur les vulnérabilités se suit en continu, avec des alertes. Un axe réglementaire se suit au moins chaque semaine. Une tendance technique, souvent chaque mois. Il serait inutile de consulter tous les jours une source qui publie quatre fois par an."}, {"cue": "Tableau de production à gauche", "text": "Le planning de production fixe ensuite ce que le veilleur livre, à qui et quand, une fois le dispositif installé. Il distingue les productions régulières, qui créent un rendez-vous, et les productions d'alerte, déclenchées par un événement. Chez Kestrel, une alerte de sécurité part sous vingt-quatre heures, la fiche technique est hebdomadaire, la note de direction mensuelle. Et ce planning doit tenir dans le temps réellement disponible, celui du « combien ». Ne le confondez pas avec votre planning personnel d'intersession, qui est au chapitre 11."}, {"cue": "Les huit rubriques numérotées à droite ; 6 et 7 en orange", "text": "Tout ce cadrage se rassemble dans le plan de veille : un document court, daté, en huit rubriques, qui sert de contrat entre le veilleur et ses commanditaires. Les rubriques 6 et 7, ressources et indicateurs, sont souvent oubliées. Sans ressources nommées, le plan reste une intention ; sans indicateurs, personne ne pourra dire dans trois mois si la veille a servi."}, {"cue": "Phrase rouge sous les rubriques", "text": "L'exercice indispensable du chapitre 2 vous fait produire ce plan de veille pour Medisecure, en deux pages. C'est la base de vos parties 1 et 2, et de votre pitch du Jour 5."}], "words": 247}, {"n": 22, "title": "Trois distinctions indépendantes pour caractériser une source", "paras": [{"cue": "Titre", "text": "Le chapitre 3 traite du « où chercher ». Une veille vaut ce que valent ses sources : un dispositif bien outillé mais alimenté par des blogs anonymes produit des erreurs à grande vitesse. À l'inverse, une vingtaine de sources primaires bien choisies couvre souvent l'essentiel."}, {"cue": "Les trois lignes Origine, Mode de production, Coût", "text": "Trois distinctions permettent de caractériser une source, et elles sont indépendantes. Selon l'origine, une source primaire produit l'information, une source secondaire la rapporte ou la commente. Selon le mode de production, une source formelle publie un contenu validé et daté, une source informelle circule par des canaux moins contrôlés, comme un salon ou un forum. Selon le coût, enfin, elle est gratuite ou payante, et le coût n'est pas un indicateur de fiabilité."}, {"cue": "Phrase en italique sous les cartes", "text": "Retenez surtout ceci : une source secondaire est utile pour détecter et comprendre, elle ne suffit jamais pour prouver."}, {"cue": "Chaîne de droite, du post LinkedIn jusqu'à l'avis de l'éditeur", "text": "D'où le réflexe de remonter la chaîne, illustré à droite. Un post LinkedIn annonce une faille critique sur les routeurs 4G. Il renvoie à un article de presse, qui résume un avis du CERT-FR, qui lui-même s'appuie sur l'avis de l'éditeur et la fiche CVE. L'information se déforme à chaque reprise. Le veilleur remonte jusqu'à l'origine, et c'est celle-là qu'il cite."}], "words": 199}, {"n": 23, "title": "Le socle : primaire, gratuit, à l'autorité indiscutable", "paras": [{"cue": "Titre", "text": "Les sources institutionnelles forment le socle d'une veille réglementaire et de cybersécurité. Elles sont primaires, gratuites pour la plupart, et leur autorité ne se discute pas."}, {"cue": "Grille des douze sources, ligne par ligne", "text": "Pour les données, la CNIL et le Comité européen de la protection des données. Pour la cybersécurité, l'ANSSI, le CERT-FR qu'elle opère, et l'ENISA au niveau européen, qui gère depuis mai 2025 une base européenne des vulnérabilités, l'EUVD. Pour la santé, l'Agence du numérique en santé, le CERT Santé qui lui est rattaché, la HAS et l'ANSM. Pour le droit, Légifrance côté français et EUR-Lex côté européen, sans oublier la Commission européenne pour les lignes directrices de l'AI Act."}, {"cue": "Restez sur la grille", "text": "Leur défaut n'est pas la fiabilité, c'est le volume : elles publient beaucoup, dans des formats variés, et ne disent pas toujours ce qui a changé."}, {"cue": "Bandeau orange du bas", "text": "Deux remarques pratiques. D'abord, les adresses changent. Le CERT-FR est passé de cert.ssi.gouv.fr à cert.cyber.gouv.fr : un flux configuré sur l'ancienne adresse peut cesser de fonctionner sans prévenir. Vérifiez régulièrement que vos flux sont vivants. Ensuite, une autorité publie aussi de la vulgarisation : une fiche pratique de la CNIL n'a pas la valeur juridique d'une délibération. Notez toujours le type de document."}], "words": 194}, {"n": 24, "title": "Une norme se cite toujours avec sa version", "paras": [{"cue": "Carte de gauche « Les sources des producteurs »", "text": "La veille technologique repose sur les sources des producteurs. La documentation officielle et les notes de version disent ce qui change, ce qui est déprécié et ce qui ne sera plus maintenu. Les avis de sécurité des éditeurs sont la source primaire d'une vulnérabilité. Les dépôts de code montrent l'activité réelle d'un projet : un projet libre dont le dernier commit date de deux ans est un risque, quelle que soit sa popularité passée."}, {"cue": "Ligne « endoflife.date » de la carte", "text": "Pour les cycles de vie, le site endoflife.date recense les fins de support de plusieurs centaines de produits, avec une API et des calendriers. C'est une source secondaire très fiable en pratique, mais une date critique se confirme toujours chez l'éditeur. C'est exactement ce qui aurait évité à Medisecure l'épisode Node.js 14."}, {"cue": "Tableau des référentiels à droite", "text": "À droite, les normes et référentiels à surveiller, avec leur version à la date de rédaction du cours. Trois points étaient incertains à cette date : la publication du RGAA 5, la citation au Journal officiel de l'EN 301 549 version 4, et les normes harmonisées de l'AI Act. Ce sont d'excellents sujets de veille."}, {"cue": "Encadré rouge en bas à droite", "text": "La règle d'or : une norme se cite avec son numéro complet, son année et ses amendements. Et ne confondez jamais une norme volontaire, comme l'ISO 27001, avec une obligation légale, comme le RGPD ou NIS2. La première aide à démontrer la conformité à la seconde ; elle ne la remplace pas."}], "words": 233}, {"n": 25, "title": "Une grille explicite : cinq critères notés de 0 à 2", "paras": [{"cue": "Titre", "text": "Le dossier exige des critères de fiabilité explicites. Deux traditions vous inspirent. Le test CRAAP, proposé en 2004 par une bibliothèque universitaire californienne, évalue un document selon l'actualité, la pertinence, l'autorité, l'exactitude et l'objectif. Le code dit « de l'Amirauté », utilisé par l'OTAN, cote séparément la source par une lettre et l'information par un chiffre."}, {"cue": "Tableau des cinq critères à gauche", "text": "La grille proposée dans le cours combine les deux. Cinq critères notés de zéro à deux : l'autorité, qui publie et avec quelle compétence ; l'origine, primaire ou reprise ; l'actualité ; la vérifiabilité ; l'objectivité, c'est-à-dire l'intérêt éventuel à orienter l'information. La pertinence est volontairement retirée : une source peut être très fiable et sans intérêt pour vos axes. On la traite à part, par l'axe de rattachement."}, {"cue": "Les cotes A, B, C, D à droite", "text": "Le total sur dix se traduit en une cote. A, de neuf à dix : la source peut fonder seule une information. B, sept ou huit : utilisable, à confirmer par une primaire pour toute décision. C, cinq ou six : elle sert à détecter, jamais à être citée seule. D, quatre ou moins : écartée, ou gardée comme simple capteur de signaux faibles, avec mention explicite."}, {"cue": "Phrase en italique sous le tableau", "text": "Vous pouvez adapter cette grille. Ce que le correcteur attend, c'est une grille annoncée avant d'être appliquée, et une note justifiée pour chaque source."}], "words": 216}, {"n": 26, "title": "Cinq sources candidates chez Kestrel, et ce qu'exige le dossier", "paras": [{"cue": "Graphique : barres CERT-FR, CNIL, fabricant", "text": "Voici la grille appliquée à cinq sources candidates chez Kestrel. Le flux des avis du CERT-FR obtient dix sur dix. La fiche de la CNIL sur la géolocalisation obtient neuf : elle perd un point en actualité, parce que sa date de mise à jour doit être contrôlée. Le fabricant des boîtiers obtient huit : il est la source primaire pour son produit, mais il publie de façon irrégulière et a intérêt à minimiser une faille, donc on recoupe avec le CERT-FR."}, {"cue": "Barres magazine (5) et LinkedIn (3), puis phrase sous le graphique", "text": "L'article du magazine qui annonce « moins vingt pour cent de kilomètres grâce à l'IA » obtient cinq : il reprend un communiqué d'éditeur sans lien vers l'étude. On le garde comme capteur, et on cherche l'étude d'origine. Enfin, le post LinkedIn qui affirme que NIS2 s'applique à tous les transporteurs obtient trois : il ne cite aucun texte et généralise. Le veilleur l'écarte, et ajoute à la place les sources primaires sur le sujet."}, {"cue": "Encadré sombre à droite : 20, > 50 %, Motif, RGPD", "text": "Toutes ces sources se rassemblent dans la cartographie, livrable central de votre partie 3, avec en annexe B le tableau complet. Le correcteur vérifie quatre choses : au moins vingt sources retenues et renseignées ; plus de la moitié de primaires, et au moins une primaire par axe ; les sources écartées avec leur motif ; et, pour chaque axe, le texte de référence et la source officielle, ainsi que le RGPD de chaque outil."}, {"cue": "Restez sur l'encadré", "text": "Une bonne cartographie n'est pas la plus longue. Trois newsletters qui relaient le même bulletin du CERT-FR n'en valent qu'une."}], "words": 252}, {"n": 27, "title": "Concentrer les sources en un point d'entrée, filtrer avant de lire", "paras": [{"cue": "Titre", "text": "Le chapitre 4 dit comment faire venir l'information sans y passer ses journées. Le principe est simple : concentrer le plus de sources possible en un seul point d'entrée, puis filtrer avant de lire."}, {"cue": "Les quatre colonnes, de gauche à droite", "text": "Le circuit de collecte compte quatre étages. Les sources publient. Des capteurs détectent les nouveautés : flux RSS, alertes par mots-clés, newsletters reçues sur une adresse dédiée, surveillance de pages, outils de suivi des dépendances et des vulnérabilités. Un point d'entrée unique les rassemble, en général un agrégateur, organisé en un dossier par axe, avec des règles et des filtres : c'est là que le veilleur trie. Enfin, les informations retenues sont stockées et partagées dans une base de connaissances."}, {"cue": "Bande en pointillé « Pull » sous les colonnes", "text": "Ce circuit combine les deux modes vus au chapitre 1. Le push domine : l'information arrive seule. Le pull reste nécessaire pour les sources sans flux et pour les recherches ponctuelles. Conseil pratique : automatisez le push, et réservez au pull un créneau fixe dans la semaine."}, {"cue": "Phrase en italique du bas", "text": "Ce schéma, vous devrez le dessiner pour Medisecure dans votre dossier, légendé, avec le nom de l'outil à chaque étape, ou la mention « manuel »."}], "words": 187}, {"n": 28, "title": "Des outils réels, décrits honnêtement", "paras": [{"cue": "Titre et colonne « Fonction »", "text": "Passons en revue les briques de l'outillage. Pour chaque fonction, plusieurs outils réels existent, et vous devez les décrire honnêtement, avec leurs limites."}, {"cue": "Ligne « Agrégateur »", "text": "L'agrégateur est l'outil central. Feedly, en gratuit, plafonne à cent sources et trois dossiers. Inoreader accepte cent cinquante flux, avec de la publicité. FreshRSS est un logiciel libre, à installer soi-même : il garde les données en interne, mais son coût réel, c'est le temps d'administration."}, {"cue": "Lignes « Alertes » puis « Vulnérabilités et fins de support »", "text": "Les alertes par mots-clés, avec Google Alerts ou Talkwalker Alerts, se livrent de préférence en RSS dans l'agrégateur. Pour les vulnérabilités et les fins de support : les flux du CERT-FR et du CERT Santé, OpenCVE pour s'abonner aux produits de son parc, endoflife.date, et Dependabot ou Renovate sur un dépôt de code. Notez que la base américaine NVD a restreint depuis avril 2026 l'enrichissement de ses fiches : beaucoup de CVE n'ont plus de score dans la NVD."}, {"cue": "Lignes « Pages sans flux », « Recherche assistée par IA », « Stockage »", "text": "Pour les pages sans flux, changedetection.io ou Visualping. Pour défricher un sujet, des outils de recherche assistés par IA comme Perplexity, à condition de vérifier chaque lien. Pour le stockage, l'outil déjà présent dans l'organisation est souvent le meilleur choix."}, {"cue": "Phrase en italique du bas", "text": "Ces offres changent souvent. Netvibes, longtemps utilisé comme agrégateur, a fermé en juin 2025. Vérifiez donc tout chiffre sur la page tarifaire de l'éditeur avant de l'écrire."}], "words": 215}, {"n": 29, "title": "Une alerte utile, des outils justifiés par cinq critères", "paras": [{"cue": "Titre", "text": "Deux méthodes pratiques sur cette diapositive."}, {"cue": "Colonne de gauche : les six étapes, puis l'exemple de requête", "text": "À gauche, la construction d'une alerte utile. La qualité d'une alerte dépend entièrement de sa requête. Une alerte sur « IA santé » produit des centaines de résultats inutiles. La méthode : on part d'une question du plan de veille, pas d'un thème. On choisit deux ou trois expressions exactes, entre guillemets. On ajoute des synonymes avec OR et on exclut le bruit avec le signe moins. On teste la requête dans le moteur avant de créer l'alerte. On choisit une livraison en RSS vers l'agrégateur plutôt que par courriel. Et après deux semaines, si plus de la moitié des résultats sont inutiles, on reformule ou on supprime."}, {"cue": "Colonne de droite : les cinq critères", "text": "À droite, les cinq critères qui justifient le choix d'un outil, et c'est précisément ce que vérifie le correcteur. Le coût, aujourd'hui et quand le dispositif grandira. L'hébergement des données : des mots-clés qui révèlent un projet confidentiel ne devraient pas être stockés n'importe où. Le RGPD : l'outil traite-t-il des données personnelles, avec quelles garanties ? Le partage : plusieurs personnes peuvent-elles lire et contribuer ? Et la pérennité, souvent oubliée : l'outil existera-t-il dans trois ans, et peut-on en sortir ? Vérifiez par exemple qu'un agrégateur permet d'exporter ses sources au format OPML. Un dispositif de veille doit survivre au départ de celui qui l'a monté."}], "words": 222}, {"n": 30, "title": "Un dispositif réel pour une organisation fictive, et ses preuves", "paras": [{"cue": "Titre", "text": "Voici maintenant la méthode pour monter un dispositif réel au service d'une organisation fictive. C'est l'exercice le plus important du Jour 2."}, {"cue": "Les sept étapes numérotées à gauche", "text": "Un : créez une adresse courriel dédiée à la veille, qui indique qu'il s'agit d'un exercice de formation, et ouvrez-y tous vos comptes. Deux : abonnez votre agrégateur à des flux réels, par exemple le flux du CERT-FR et celui des alertes du portail Cyberveille Santé. Trois : créez un dépôt de démonstration privé, avec des fichiers de dépendances qui reprennent exactement les versions citées dans l'état des lieux du RSSI de Medisecure, comme Django 2.2, Flask 2.0, Angular 12 ou React Native 0.63. N'ajoutez rien que le dossier ne cite pas, et écrivez dans votre dossier que c'est une reconstitution. Quatre : activez Dependabot ou Renovate ; les alertes porteront sur de vraies vulnérabilités. Cinq : abonnez-vous dans OpenCVE aux produits du parc de Medisecure. Six : créez votre base de connaissances, et expliquez ce qui changerait dans l'environnement réel de Medisecure. Sept : prenez vos captures, sans jamais y mettre de données de votre entreprise d'alternance."}, {"cue": "Encadré sombre à droite : 4 × 3, Date, 2 × 3, 2", "text": "À droite, ce que vérifie l'élément E7, le fonctionnement réel : une capture de chaque outil dans chacune des trois périodes, avec la date visible dans l'image et l'identifiant du compte ; au moins deux séances datées par période dans le journal ; et au moins deux ajustements datés et justifiés. Tout cela commence maintenant, pas le jour du rendu."}], "words": 240}];
const $ = (id) => document.getElementById(id);
const stage = $("script").parentElement, script = $("script");
const store = { get(k, d) { try { const v = localStorage.getItem("prompteur." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("prompteur." + k, JSON.stringify(v)); } catch {} } };

let wpm = store.get("wpm", 130), size = store.get("size", innerWidth < 640 ? 30 : 44);
let playing = false, last = 0, carry = 0, wordsTotal = 0;
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Construction du texte
const html = [];
DATA.forEach((d) => {
  wordsTotal += d.words;
  html.push(`<section class="slide" id="d${d.n}" data-n="${d.n}"><div class="marker"><span class="clic">▶ Diapo ${d.n}</span><span class="t">${esc(d.title)}</span></div>${d.paras.map((p) => `<p><span class="cue">${esc(p.cue)}</span>${esc(p.text)}</p>`).join("")}</section>`);
  const o = document.createElement("option"); o.value = d.n; o.textContent = `${d.n} · ${d.title}`; $("jump").append(o);
});
html.push(`<p class="end">Fin du script</p>`);
script.innerHTML = html.join("");
const slides = [...script.querySelectorAll(".slide")];

function applySize() { document.documentElement.style.setProperty("--size", size + "px"); store.set("size", size); }
function pxPerWord() { const h = slides.at(-1).offsetTop + slides.at(-1).offsetHeight - slides[0].offsetTop; return h / wordsTotal; }
function showSpeed() { $("speed").textContent = wpm + " mots/min"; store.set("wpm", wpm); }
function guideY() { return innerHeight * 0.34 + size * 0.7; }
function current() { const y = stage.scrollTop + guideY(); let c = slides[0]; for (const s of slides) { if (s.offsetTop <= y) c = s; else break; } return c; }
function fmt(min) { const m = Math.max(0, Math.round(min)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`; }

function hud() {
  const c = current(), i = slides.indexOf(c), d = DATA[i];
  $("where").innerHTML = `<b>Diapo ${d.n}</b> (${i + 1}/${DATA.length}) <span class="t">· ${esc(d.title)}</span>`;
  const max = stage.scrollHeight - stage.clientHeight;
  const ratio = max > 0 ? stage.scrollTop / max : 0;
  $("progress").style.width = (ratio * 100).toFixed(2) + "%";
  const before = DATA.slice(0, i).reduce((a, x) => a + x.words, 0);
  const inSlide = Math.min(1, Math.max(0, (stage.scrollTop + guideY() - c.offsetTop) / c.offsetHeight));
  const remain = wordsTotal - before - inSlide * d.words;
  $("left").textContent = `reste ${fmt(remain / wpm)}`;
  if ($("jump").value != d.n) $("jump").value = d.n;
}

let wakeLock = null;
async function lock(on) { try { if (on && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {} }

function setPlay(p) {
  playing = p; document.body.classList.toggle("playing", p);
  $("play").textContent = p ? "❚❚ Pause" : "▶ Lecture";
  if (p) { last = performance.now(); carry = 0; requestAnimationFrame(tick); idleSoon(); } else document.body.classList.remove("idle");
  lock(p);
}
function tick(t) {
  if (!playing) return;
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  carry += (wpm / 60) * pxPerWord() * dt;
  const step = Math.floor(carry); if (step) { stage.scrollTop += step; carry -= step; }
  if (stage.scrollTop >= stage.scrollHeight - stage.clientHeight - 1) setPlay(false);
  requestAnimationFrame(tick);
}
function goTo(n) { const s = $("d" + n); if (s) stage.scrollTop = s.offsetTop - innerHeight * 0.34 + size * 0.2; hud(); }
function step(k) { const i = slides.indexOf(current()); const j = Math.min(slides.length - 1, Math.max(0, i + k)); goTo(DATA[j].n); }
function speed(k) { wpm = Math.min(260, Math.max(60, wpm + k)); showSpeed(); hud(); }
function resize(k) { const c = current(), off = stage.scrollTop - c.offsetTop; const r = off / c.offsetHeight; size = Math.min(96, Math.max(22, size + k)); applySize(); stage.scrollTop = c.offsetTop + r * c.offsetHeight; hud(); }
function toggle(id, cls) { const b = $(id), on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); script.classList.toggle(cls, on); store.set(cls, on); hud(); }

let idleT; function idleSoon() { document.body.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => { if (playing) document.body.classList.add("idle"); }, 2500); }

$("play").onclick = () => setPlay(!playing);
stage.onclick = () => setPlay(!playing);
$("slower").onclick = () => speed(-10); $("faster").onclick = () => speed(10);
$("smaller").onclick = () => resize(-4); $("bigger").onclick = () => resize(4);
$("prev").onclick = () => step(-1); $("next").onclick = () => step(1);
$("jump").onchange = (e) => goTo(e.target.value);
$("mirror").onclick = () => toggle("mirror", "mirror"); $("wide").onclick = () => toggle("wide", "wide");
$("full").onclick = full;
stage.addEventListener("scroll", hud, { passive: true });
addEventListener("mousemove", idleSoon); addEventListener("touchstart", idleSoon, { passive: true });
addEventListener("resize", hud);
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" && !["Space", "KeyM", "KeyF"].includes(e.code)) return;
  const map = { Space: () => setPlay(!playing), ArrowUp: () => speed(10), ArrowDown: () => speed(-10), ArrowRight: () => step(1), ArrowLeft: () => step(-1), PageDown: () => step(1), PageUp: () => step(-1), Home: () => goTo(1), KeyM: () => toggle("mirror", "mirror"), KeyF: full, Equal: () => resize(4), NumpadAdd: () => resize(4), Minus: () => resize(-4), NumpadSubtract: () => resize(-4) };
  if (e.key === "+") { e.preventDefault(); return resize(4); }
  const f = map[e.code]; if (f) { e.preventDefault(); f(); idleSoon(); }

if (store.get("mirror", false)) toggle("mirror", "mirror");
if (store.get("wide", false)) toggle("wide", "wide");
applySize(); showSpeed(); requestAnimationFrame(hud);
</script>
