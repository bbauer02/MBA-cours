<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 758" width="760" height="758" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect width="760" height="758" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="ahq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">La démarche de gestion des risques selon ISO/IEC 27005:2022</text><text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">L’appréciation reboucle sur le contexte, le traitement sur lui-même ; deux activités accompagnent tout le processus</text><rect x="24" y="72" width="40" height="644" rx="8" fill="#f3f0ff" stroke="#5f3dc4" stroke-width="1.2"/><g transform="translate(49,394.0) rotate(-90)"><text x="0" y="0" font-size="13" font-weight="700" fill="#5f3dc4" text-anchor="middle">Communication et concertation</text></g><rect x="696" y="72" width="40" height="644" rx="8" fill="#ebfbee" stroke="#2b8a3e" stroke-width="1.2"/><g transform="translate(721,394.0) rotate(-90)"><text x="0" y="0" font-size="13" font-weight="700" fill="#2b8a3e" text-anchor="middle">Surveillance et revue</text></g><rect x="170" y="72" width="420" height="52" rx="9" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="380" y="93" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">Établissement du contexte</text><text x="380" y="111" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">(périmètre, critères de risque, critère d’acceptation)</text><line x1="380" y1="124" x2="380" y2="146" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><rect x="120" y="148" width="520" height="238" rx="10" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.2"/><text x="136" y="170" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="start">Appréciation du risque</text><rect x="170" y="184" width="420" height="50" rx="9" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="380" y="205" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">Identification</text><text x="380" y="223" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">(approche par les événements ; approche par les biens)</text><line x1="380" y1="234" x2="380" y2="250" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><rect x="170" y="252" width="420" height="50" rx="9" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="380" y="273" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">Analyse</text><text x="380" y="291" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">(conséquences, vraisemblance)</text><line x1="380" y1="302" x2="380" y2="318" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><rect x="170" y="320" width="420" height="50" rx="9" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="380" y="341" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">Évaluation</text><text x="380" y="359" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">(comparaison aux critères, priorités)</text><line x1="380" y1="386" x2="380" y2="406" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><path d="M380,408 L530,442 L380,476 L230,442 z" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/><text x="380" y="446.5" font-size="12.5" font-weight="700" fill="#d9480f" text-anchor="middle">Appréciation satisfaisante ?</text><path d="M230,442 H96 V98 H168" fill="none" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="220" y="436" font-size="12" font-weight="700" fill="#d9480f" text-anchor="end">non</text><line x1="380" y1="476" x2="380" y2="504" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><text x="388" y="494" font-size="12" font-weight="700" fill="#2b8a3e" text-anchor="start">oui</text><rect x="170" y="506" width="420" height="52" rx="9" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="380" y="527" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">Traitement du risque</text><text x="380" y="545" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">(options, mesures, plan de traitement)</text><line x1="380" y1="558" x2="380" y2="580" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><path d="M380,582 L540,616 L380,650 L220,616 z" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/><text x="380" y="620.5" font-size="12.5" font-weight="700" fill="#d9480f" text-anchor="middle">Risques résiduels acceptables ?</text><path d="M540,616 H664 V532 H592" fill="none" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="550" y="610" font-size="12" font-weight="700" fill="#d9480f" text-anchor="start">non</text><line x1="380" y1="650" x2="380" y2="674" stroke="#0b7285" stroke-width="1.6" marker-end="url(#ah)"/><text x="388" y="666" font-size="12" font-weight="700" fill="#2b8a3e" text-anchor="start">oui</text><rect x="170" y="676" width="420" height="40" rx="9" fill="#ebfbee" stroke="#0b7285" stroke-width="1.5"/><text x="380" y="701" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">Acceptation du risque</text><text font-style="italic" x="24" y="744" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">D’après ISO/IEC 27005:2022, schéma simplifié pour le cours</text></svg>