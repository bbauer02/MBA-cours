<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect width="760" height="424" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="ahq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f6c"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f3dc4"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1864ab"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c92a2a" stroke-width="2.4" opacity="0.45"/></pattern></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">De la veille au schéma directeur : la place du dossier D2</text><text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">Les trois dossiers du bloc 1 s’enchaînent ; le D2 établit l’état des lieux dont le D3 a besoin</text><rect x="24" y="116" width="170" height="118" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="109" y="142" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">D1 · Veille (S1)</text><text x="109" y="169" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">ce qui change autour de</text><text x="109" y="184" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">Medisecure</text><rect x="566" y="116" width="170" height="118" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="1.5"/><text x="651" y="142" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">D3 · Stratégie SI et</text><text x="651" y="159" font-size="13" font-weight="700" fill="#0b4f6c" text-anchor="middle">architecture (S3)</text><text x="651" y="186" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">où aller, dans quel</text><text x="651" y="201" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">ordre, avec quel budget</text><rect x="244" y="70" width="272" height="284" rx="12" fill="#e3f2f4" stroke="#0b7285" stroke-width="2.2"/><text x="380" y="95" font-size="13.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">D2 · Cartographie, risques,</text><text x="380" y="112" font-size="13.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">diagnostic (S2)</text><rect x="262" y="130" width="236" height="54" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.3"/><text x="380" y="152" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Cartographie :</text><text x="380" y="170" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle">le SI tel qu’il est</text><line x1="380" y1="185" x2="380" y2="204" stroke="#0b7285" stroke-width="1.4" marker-end="url(#ah)"/><rect x="262" y="206" width="236" height="54" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.3"/><text x="380" y="228" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Risques et continuité :</text><text x="380" y="246" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle">ce qui peut mal tourner</text><line x1="380" y1="261" x2="380" y2="280" stroke="#0b7285" stroke-width="1.4" marker-end="url(#ah)"/><rect x="262" y="282" width="236" height="54" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.3"/><text x="380" y="304" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Diagnostic :</text><text x="380" y="322" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="middle">forces, faiblesses, enjeux</text><line x1="195" y1="175" x2="241" y2="175" stroke="#0b7285" stroke-width="2" marker-end="url(#ah)"/><line x1="517" y1="175" x2="563" y2="175" stroke="#0b7285" stroke-width="2" marker-end="url(#ah)"/><path d="M80,235 V309 H259" fill="none" stroke="#5f3dc4" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ahv)"/><text x="92" y="262" font-size="11" font-weight="600" fill="#5f3dc4" text-anchor="start">environnement externe,</text><text x="92" y="276" font-size="11" font-weight="600" fill="#5f3dc4" text-anchor="start">réglementation</text><rect x="24" y="374" width="712" height="32" rx="8" fill="#f1f4f6" stroke="none" stroke-width="0"/><line x1="219" y1="380" x2="219" y2="400" stroke="#9aa5b1" stroke-width="1.25"/><line x1="541" y1="380" x2="541" y2="400" stroke="#9aa5b1" stroke-width="1.25"/><text x="109" y="395" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">Compétences : C1 à C3</text><text x="380" y="395" font-size="12" font-weight="700" fill="#0b4f6c" text-anchor="middle">C4</text><text x="651" y="395" font-size="12" font-weight="600" fill="#1f2933" text-anchor="middle">C5 à C9</text></svg>