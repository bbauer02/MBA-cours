<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 501" width="760" height="501" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect width="760" height="501" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="ahq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker><marker id="a5f3dc4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f3dc4"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">Les cinq ateliers d’EBIOS Risk Manager et leurs liens</text><text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">Chaque atelier nourrit le suivant ; l’atelier 1 fournit aussi des entrées directes aux ateliers 3, 4 et 5</text><rect x="20" y="196" width="128" height="64" rx="9" fill="#fff4e6" stroke="#d9480f" stroke-width="1.5"/><text x="30" y="215" font-size="11.5" font-weight="700" fill="#d9480f" text-anchor="start">Atelier 1</text><text x="30" y="233" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Cadrage et socle</text><text x="30" y="248" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">de sécurité</text><text x="26" y="277" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">valeurs métier, biens</text><text x="26" y="291" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">supports, événements</text><text x="26" y="305" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">redoutés, socle</text><line x1="148" y1="228.0" x2="166" y2="202.0" stroke="#0b7285" stroke-width="2" marker-end="url(#ah)"/><rect x="168" y="170" width="128" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.5"/><text x="178" y="189" font-size="11.5" font-weight="700" fill="#0b7285" text-anchor="start">Atelier 2</text><text x="178" y="207" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Sources de risque</text><text x="174" y="251" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">couples SR/OV retenus</text><line x1="296" y1="202.0" x2="314" y2="190.0" stroke="#0b7285" stroke-width="2" marker-end="url(#ah)"/><rect x="316" y="158" width="128" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.5"/><text x="326" y="177" font-size="11.5" font-weight="700" fill="#0b7285" text-anchor="start">Atelier 3</text><text x="326" y="195" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Scénarios</text><text x="326" y="210" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">stratégiques</text><text x="322" y="239" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">cartographie de la</text><text x="322" y="253" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">menace, scénarios</text><text x="322" y="267" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">stratégiques, mesures</text><text x="322" y="281" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">sur l’écosystème</text><line x1="444" y1="190.0" x2="462" y2="202.0" stroke="#0b7285" stroke-width="2" marker-end="url(#ah)"/><rect x="464" y="170" width="128" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.5"/><text x="474" y="189" font-size="11.5" font-weight="700" fill="#0b7285" text-anchor="start">Atelier 4</text><text x="474" y="207" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Scénarios</text><text x="474" y="222" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">opérationnels</text><text x="470" y="251" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">graphes d’attaque,</text><text x="470" y="265" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">vraisemblance</text><line x1="592" y1="202.0" x2="610" y2="228.0" stroke="#0b7285" stroke-width="2" marker-end="url(#ah)"/><rect x="612" y="196" width="128" height="64" rx="9" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.5"/><text x="622" y="215" font-size="11.5" font-weight="700" fill="#0b7285" text-anchor="start">Atelier 5</text><text x="622" y="233" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Traitement du</text><text x="622" y="248" font-size="12.5" font-weight="700" fill="#0b4f6c" text-anchor="start">risque</text><text x="618" y="277" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">risques initiaux et</text><text x="618" y="291" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">résiduels, mesures,</text><text x="618" y="305" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">cadre de suivi</text><path d="M724,194 C724,60 84.0,60 84.0,193" fill="none" stroke="#5f3dc4" stroke-width="2" marker-end="url(#a5f3dc4)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="404.0" y="82" font-size="12" font-weight="700" fill="#5f3dc4" text-anchor="middle">cycle stratégique (quelques années)</text><path d="M662.0,194 C662.0,132 548.0,126 548.0,167" fill="none" stroke="#5f3dc4" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a5f3dc4)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="494.0" y="140" font-size="11.5" font-weight="700" fill="#5f3dc4" text-anchor="middle">cycle opérationnel (annuel)</text><path d="M120.0,315 V329 H380.0 V289" fill="none" stroke="#5f6b76" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahq)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="250.0" y="333" font-size="11" font-weight="600" fill="#5f6b76" text-anchor="middle">événements redoutés et gravité</text><path d="M84.0,315 V353 H528.0 V273" fill="none" stroke="#5f6b76" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahq)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="306.0" y="357" font-size="11" font-weight="600" fill="#5f6b76" text-anchor="middle">biens supports</text><path d="M48.0,315 V377 H676.0 V313" fill="none" stroke="#5f6b76" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahq)"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="380.0" y="381" font-size="11" font-weight="600" fill="#5f6b76" text-anchor="middle">écarts au socle</text><rect x="20" y="397" width="128" height="38" rx="7" fill="#fff4e6" stroke="#d9480f" stroke-width="1.2"/><text x="84.0" y="413" font-size="11.5" font-weight="700" fill="#d9480f" text-anchor="middle">Approche par</text><text x="84.0" y="427" font-size="11.5" font-weight="700" fill="#d9480f" text-anchor="middle">conformité</text><rect x="168" y="397" width="424" height="38" rx="7" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.2"/><text x="380.0" y="421" font-size="12" font-weight="700" fill="#0b7285" text-anchor="middle">Approche par scénarios</text><line x1="24" y1="457" x2="54" y2="457" stroke="#0b7285" stroke-width="2"/><path d="M54,453 l8,4 l-8,4 z" fill="#0b7285"/><text x="68" y="461" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">enchaînement des ateliers</text><line x1="250" y1="457" x2="290" y2="457" stroke="#5f6b76" stroke-width="1.4" stroke-dasharray="5 4"/><text x="298" y="461" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">résultat de l’atelier 1 repris plus loin</text><line x1="540" y1="457" x2="580" y2="457" stroke="#5f3dc4" stroke-width="2"/><text x="588" y="461" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">cycles de mise à jour</text><text font-style="italic" x="24" y="485" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">D’après le guide EBIOS Risk Manager de l’ANSSI, schéma simplifié pour le cours</text></svg>