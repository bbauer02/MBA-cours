="11.5" font-weight="400" fill="#1f2933" text-anchor="start">public Kestrel Track</text><text x="52.0" y="154.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">et de sa version</text><rect x="43.0" y="169.5" width="62" height="17" rx="8" fill="#ffffff" stroke="#c92a2a" stroke-width="1.2"/><text x="74.0" y="182.0" font-size="10.8" font-weight="700" fill="#c92a2a" text-anchor="middle">Pr 4 (4)</text><text font-style="italic" x="45.0" y="200.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">APP-03 Kestrel Track</text><text font-style="italic" x="45.0" y="213.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">(portail public)</text><rect x="43.0" y="270.5" width="140" height="72.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><text x="52.0" y="289.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">Recensement des</text><text x="52.0" y="304.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">contacts logistiques</text><text x="52.0" y="318.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">des clients</text><text x="52.0" y="333.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">e-commerçants</text><rect x="43.0" y="348.5" width="62" height="17" rx="8" fill="#ffffff" stroke="#d9480f" stroke-width="1.2"/><text x="74.0" y="361.0" font-size="10.8" font-weight="700" fill="#d9480f" text-anchor="middle">Pr 3 (3)</text><text font-style="italic" x="45.0" y="379.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">réseaux professionnels</text><text font-style="italic" x="45.0" y="392.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">(hors SI)</text><rect x="221.0" y="106" width="140" height="72.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><text x="230.0" y="125.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">Exploitation d’une</t