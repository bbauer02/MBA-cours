ht="20" rx="3" fill="#ffffff" stroke="#9aa5b1" stroke-width="1"/><circle cx="624" cy="506" r="4" fill="#5f3dc4"/><path d="M624,506 L624,532 L590,532" fill="none" stroke="#5f3dc4" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahv)"/><text x="650" y="510" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="start">4. Niveau de</text><text x="650" y="525" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="start">service</text><text x="24" y="566" font-size="11" font-weight="400" fill="#5f6b76" text-anchor="start">Petites cases : en haut les stratégies, en bas les infrastructures ; à gauche le métier, à droite les TI. Le point marque le domaine moteur.</text></svg>