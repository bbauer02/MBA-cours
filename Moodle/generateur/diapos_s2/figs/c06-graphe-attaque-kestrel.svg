<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 653.5" width="760" height="653.5" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect width="760" height="653.5" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="ahq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker><marker id="ac92a2a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="a868e96" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#868e96"/></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">Graphe d’attaque du scénario opérationnel SO1 de Kestrel Logistique</text><text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">Un attaquant passe par l’accès VPN de l’éditeur de RoutePro pour chiffrer le SI du siège</text><rect x="30" y="64" width="166" height="26" rx="6" fill="#0b4f6c" stroke="none" stroke-width="0"/><text x="113.0" y="82" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">CONNAÎTRE</text><rect x="208" y="64" width="166" height="26" rx="6" fill="#0b4f6c" stroke="none" stroke-width="0"/><text x="291.0" y="82" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">RENTRER</text><rect x="386" y="64" width="166" height="26" rx="6" fill="#0b4f6c" stroke="none" stroke-width="0"/><text x="469.0" y="82" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">TROUVER</text><rect x="564" y="64" width="166" height="26" rx="6" fill="#0b4f6c" stroke="none" stroke-width="0"/><text x="647.0" y="82" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">EXPLOITER</text><rect x="37.0" y="104" width="152" height="111.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="38.0" y="194.0" width="150" height="20" rx="7" fill="#f1f4f6"/><line x1="37.0" y1="194.0" x2="189.0" y2="194.0" stroke="#9aa5b1" stroke-width="0.8"/><text x="46.0" y="124.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">1. Reconnaissance en</text><text x="46.0" y="138.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">sources ouvertes de</text><text x="46.0" y="153.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">l’éditeur de RoutePro</text><text x="46.0" y="167.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">et de ses techniciens</text><text x="46.0" y="185.0" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 4 (4)</text><text font-style="italic" x="46.0" y="209.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">PP-05 Éditeur de RoutePro</text><rect x="215.0" y="104" width="152" height="124.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="216.0" y="194.0" width="150" height="33" rx="7" fill="#f1f4f6"/><line x1="215.0" y1="194.0" x2="367.0" y2="194.0" stroke="#9aa5b1" stroke-width="0.8"/><text x="224.0" y="124.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">2a. Hameçonnage d’un</text><text x="224.0" y="138.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">technicien de</text><text x="224.0" y="153.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">l’éditeur, vol des</text><text x="224.0" y="167.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">identifiants VPN</text><text x="224.0" y="185.0" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 3 (3)</text><text font-style="italic" x="224.0" y="209.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">PP-05 Éditeur de RoutePro</text><text font-style="italic" x="224.0" y="222.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">(poste d’un technicien)</text><rect x="215.0" y="262.0" width="152" height="96.5" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="216.0" y="337.5" width="150" height="20" rx="7" fill="#f1f4f6"/><line x1="215.0" y1="337.5" x2="367.0" y2="337.5" stroke="#9aa5b1" stroke-width="0.8"/><text x="224.0" y="282.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">3. Connexion par</text><text x="224.0" y="296.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">l’accès VPN permanent</text><text x="224.0" y="311.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">de l’éditeur</text><text x="224.0" y="328.5" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 4 (3)</text><text font-style="italic" x="224.0" y="352.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">SEC-01 Passerelle VPN</text><rect x="215.0" y="418.5" width="152" height="111.0" rx="8" fill="#ffffff" stroke="#5f6b76" stroke-width="1" stroke-dasharray="5 3"/><rect x="216.0" y="508.5" width="150" height="20" rx="7" fill="#f1f4f6"/><line x1="215.0" y1="508.5" x2="367.0" y2="508.5" stroke="#9aa5b1" stroke-width="0.8"/><text x="224.0" y="438.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">2b. Achat</text><text x="224.0" y="453.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">d’identifiants VPN d’un</text><text x="224.0" y="467.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">technicien de l’éditeur</text><text x="224.0" y="482.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">sur un forum criminel</text><text x="224.0" y="499.5" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 2 (2)</text><text font-style="italic" x="224.0" y="523.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">PP-05 Éditeur de RoutePro</text><rect x="393.0" y="104" width="152" height="124.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="394.0" y="194.0" width="150" height="33" rx="7" fill="#f1f4f6"/><line x1="393.0" y1="194.0" x2="545.0" y2="194.0" stroke="#9aa5b1" stroke-width="0.8"/><text x="402.0" y="124.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">4. Exploration du</text><text x="402.0" y="138.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">réseau du siège,</text><text x="402.0" y="153.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">obtention d’un compte</text><text x="402.0" y="167.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">d’administration</text><text x="402.0" y="185.0" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 3 (3)</text><text font-style="italic" x="402.0" y="209.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">SRV-01 et SRV-02</text><text font-style="italic" x="402.0" y="222.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">Virtualisation</text><rect x="393.0" y="262.0" width="152" height="82.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="394.0" y="323.0" width="150" height="20" rx="7" fill="#f1f4f6"/><line x1="393.0" y1="323.0" x2="545.0" y2="323.0" stroke="#9aa5b1" stroke-width="0.8"/><text x="402.0" y="282.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">5. Localisation du NAS</text><text x="402.0" y="296.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">de sauvegarde</text><text x="402.0" y="314.0" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 4 (3)</text><text font-style="italic" x="402.0" y="338.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">STO-01 NAS de sauvegarde</text><rect x="571.0" y="104" width="152" height="82.0" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="572.0" y="165.0" width="150" height="20" rx="7" fill="#f1f4f6"/><line x1="571.0" y1="165.0" x2="723.0" y2="165.0" stroke="#9aa5b1" stroke-width="0.8"/><text x="580.0" y="124.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">6. Suppression des</text><text x="580.0" y="138.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">sauvegardes du NAS</text><text x="580.0" y="156.0" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 4 (3)</text><text font-style="italic" x="580.0" y="180.0" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">STO-01 NAS de sauvegarde</text><rect x="571.0" y="262.0" width="152" height="122.5" rx="8" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><rect x="572.0" y="337.5" width="150" height="46" rx="7" fill="#f1f4f6"/><line x1="571.0" y1="337.5" x2="723.0" y2="337.5" stroke="#9aa5b1" stroke-width="0.8"/><text x="580.0" y="282.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">7. Chiffrement des 12</text><text x="580.0" y="296.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">machines virtuelles du</text><text x="580.0" y="311.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">siège un dimanche à 3 h</text><text x="580.0" y="328.5" font-size="11.5" font-weight="700" fill="#0b4f6c" text-anchor="start">Pr 4 (3)</text><text font-style="italic" x="580.0" y="352.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">SRV-01, SRV-02 ; APP-01</text><text font-style="italic" x="580.0" y="365.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">RoutePro, APP-07 ERP</text><text font-style="italic" x="580.0" y="378.5" font-size="10.8" font-weight="400" fill="#5f6b76" text-anchor="start">finance</text><line x1="202" y1="64" x2="202" y2="545.5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="380" y1="64" x2="380" y2="545.5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="558" y1="64" x2="558" y2="545.5" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="189.0" y1="148.4" x2="213.0" y2="148.4" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><line x1="291.0" y1="228.0" x2="291.0" y2="260.0" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><line x1="469.0" y1="228.0" x2="469.0" y2="260.0" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><line x1="647.0" y1="186.0" x2="647.0" y2="260.0" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><path d="M367.0,295.775 H373.0 V141.2 H391.0" fill="none" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><path d="M545.0,290.7 H551.0 V128.6 H569.0" fill="none" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><path d="M189.0,198.35 H198.0 V462.9 H213.0" fill="none" stroke="#868e96" stroke-width="1.6" marker-end="url(#a868e96)"/><line x1="321.0" y1="418.5" x2="321.0" y2="360.5" stroke="#868e96" stroke-width="1.6" marker-end="url(#a868e96)"/><line x1="647.0" y1="384.5" x2="647.0" y2="420.5" stroke="#c92a2a" stroke-width="2.2" marker-end="url(#ac92a2a)"/><path d="M589.0,422.5 L705.0,422.5 L729.0,462.5 L705.0,502.5 L589.0,502.5 L565.0,462.5 z" fill="#fff1f0" stroke="#c92a2a" stroke-width="2"/><text x="647.0" y="450.5" font-size="13" font-weight="700" fill="#c92a2a" text-anchor="middle">ER2 (et ER1)</text><text x="647.0" y="467.5" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle">Livraisons arrêtées sur</text><text x="647.0" y="480.5" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle">tout le réseau plus de 3</text><text x="647.0" y="493.5" font-size="11" font-weight="600" fill="#c92a2a" text-anchor="middle">jours · G4</text><rect x="512" y="565.5" width="224" height="46" rx="8" fill="#fff1f0" stroke="#c92a2a" stroke-width="1.4"/><text x="624" y="584.5" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">Vraisemblance retenue</text><text x="624" y="601.5" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="middle">V3 très vraisemblable</text><line x1="24" y1="575.5" x2="56" y2="575.5" stroke="#c92a2a" stroke-width="2.2"/><text x="64" y="579.5" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">mode opératoire le plus vraisemblable (1, 2a, 3, 4, 5, 6, 7)</text><line x1="24" y1="595.5" x2="56" y2="595.5" stroke="#868e96" stroke-width="1.6"/><text x="64" y="599.5" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">mode opératoire alternatif (1, 2b, 3), cadre en trait fin</text><text x="24" y="621.5" font-size="11.5" font-weight="600" fill="#1f2933" text-anchor="start">Pr = probabilité de succès de 1 à 4 ; entre parenthèses, indice cumulé</text><text font-style="italic" x="24" y="639.5" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">En gris sous chaque action : le bien support visé</text></svg>