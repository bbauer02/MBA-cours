<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 546" width="760" height="546" font-family="Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"><rect width="760" height="546" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7285"/></marker><marker id="ahq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker><marker id="ahd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b4f6c"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c92a2a"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><marker id="ahv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5f3dc4"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1864ab"/></marker><marker id="aho" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b8a3e"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c92a2a" stroke-width="2.4" opacity="0.45"/></pattern></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#1f2933" text-anchor="start">Les trois sous-systèmes de l’organisation selon Le Moigne, appliqués à Kestrel Logistique</text><text x="24" y="50" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">Le système d’information relie le pilotage, qui décide, et le système opérant, qui transporte</text><rect x="170" y="68" width="420" height="426" rx="12" fill="#f1f4f6" stroke="#9aa5b1" stroke-width="1.4"/><text x="380" y="89" font-size="13.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Kestrel Logistique</text><rect x="250" y="100" width="260" height="72" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><text x="380" y="124" font-size="13.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Système de pilotage</text><text x="380" y="144" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">comité de direction, directeur des</text><text x="380" y="159" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">opérations, chefs de quai, planificateurs</text><rect x="250" y="250" width="260" height="72" rx="10" fill="#e3f2f4" stroke="#0b7285" stroke-width="1.6"/><text x="380" y="274" font-size="13.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Système d’information</text><text x="380" y="294" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">Portail EDI, RoutePro, Kestrel Track,</text><text x="380" y="309" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">KDriver, TeleFleet, ERP finance, Excel</text><rect x="250" y="408" width="260" height="72" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="1.6"/><text x="380" y="432" font-size="13.5" font-weight="700" fill="#0b4f6c" text-anchor="middle">Système opérant</text><text x="380" y="452" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">quais de tri, tournées, chauffeurs,</text><text x="380" y="467" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="middle">camions</text><line x1="330" y1="173" x2="330" y2="248" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><line x1="430" y1="249" x2="430" y2="174" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="322" y="207.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">décisions, objectifs,</text><text x="322" y="222.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">plans de tournée</text><text x="438" y="207.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">tableaux de bord,</text><text x="438" y="222.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">alertes</text><line x1="330" y1="323" x2="330" y2="406" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><line x1="430" y1="407" x2="430" y2="324" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="322" y="361.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">ordres de transport,</text><text x="322" y="376.5" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">tournées affectées</text><text x="438" y="354.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">scans, preuves de</text><text x="438" y="369.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">livraison, positions</text><text x="438" y="384.0" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">GPS</text><text x="24" y="96" font-size="11" font-weight="600" fill="#0b7285" text-anchor="start">Informations de</text><text x="24" y="110" font-size="11" font-weight="600" fill="#0b7285" text-anchor="start">l’environnement :</text><text x="24" y="124" font-size="11" font-weight="600" fill="#0b7285" text-anchor="start">marché, réglementation,</text><text x="24" y="138" font-size="11" font-weight="600" fill="#0b7285" text-anchor="start">concurrents</text><line x1="24" y1="156" x2="248" y2="156" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="24" y="262" font-size="12" font-weight="700" fill="#0b4f6c" text-anchor="start">Entrée d’information :</text><text x="24" y="282" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">commandes EDI des clients</text><line x1="24" y1="290" x2="248" y2="290" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="24" y="422" font-size="12" font-weight="700" fill="#0b4f6c" text-anchor="start">Entrée physique :</text><text x="24" y="442" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="start">colis et palettes</text><line x1="24" y1="450" x2="248" y2="450" stroke="#0b4f6c" stroke-width="2.2" marker-end="url(#ahd)"/><text x="736" y="248" font-size="12" font-weight="700" fill="#0b4f6c" text-anchor="end">Sortie d’information :</text><text x="736" y="266" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">informations de suivi</text><text x="736" y="281" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">aux clients</text><line x1="512" y1="290" x2="736" y2="290" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/><text x="736" y="422" font-size="12" font-weight="700" fill="#0b4f6c" text-anchor="end">Sortie physique :</text><text x="736" y="442" font-size="11.5" font-weight="400" fill="#1f2933" text-anchor="end">colis livrés</text><line x1="512" y1="450" x2="736" y2="450" stroke="#0b4f6c" stroke-width="2.2" marker-end="url(#ahd)"/><line x1="170" y1="526" x2="214" y2="526" stroke="#0b4f6c" stroke-width="2.2"/><text x="222" y="530" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">flux physique</text><line x1="340" y1="526" x2="384" y2="526" stroke="#0b7285" stroke-width="1.6" stroke-dasharray="6 4"/><text x="392" y="530" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">flux d’information</text></svg>