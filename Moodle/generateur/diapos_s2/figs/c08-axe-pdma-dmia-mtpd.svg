ht="700" fill="#1971c2" text-anchor="middle">Dernière</text><text x="112" y="255" font-size="11.5" font-weight="700" fill="#1971c2" text-anchor="middle">sauvegarde</text><text x="112" y="270" font-size="11.5" font-weight="700" fill="#1971c2" text-anchor="middle">utilisable</text><line x1="112" y1="262" x2="112" y2="277" stroke="#1971c2" stroke-width="1.2" stroke-dasharray="3 3"/><path d="M112,298 Q112,307 121,307 L170.0,307 Q179.0,307 179.0,316 Q179.0,307 188.0,307 L237,307 Q246,307 246,298" fill="none" stroke="#1971c2" stroke-width="1.8"/><text x="179.0" y="338" font-size="11.5" font-weight="700" fill="#1971c2" text-anchor="middle">Données perdues : doit</text><text x="179.0" y="353" font-size="11.5" font-weight="700" fill="#1971c2" text-anchor="middle">rester inférieure à la PDMA</text><text x="179.0" y="368" font-size="11.5" font-weight="700" fill="#1971c2" text-anchor="middle">(RPO)</text><polygon points="260.0,246.0 230.0,288.0 248.0,288.0 236.0,324.0 272.0,273.0 254.0,273.0 266.0,246.0" fill="#c92a2a"/><text stroke="#ffffff" stroke-width="5" stroke-linejoin="round" paint-order="stroke" x="274" y="330" font-size="13" font-weight="700" fill="#c92a2a" text-anchor="start">Sinistre</text><line x1="24" y1="470" x2="730" y2="470" stroke="#9aa5b1" stroke-width="1.25"/><line x1="460" y1="312" x2="460" y2="470" stroke="#2b8a3e" stroke-width="1" stroke-dasharray="4 3"/><line x1="650" y1="312" x2="650" y2="470" stroke="#d9480f" stroke-width="1" stroke-dasharray="4 3"/><path d="M260,470 H300 V460 H360 V448 H420 V440 H460 V428 H540 V414 H600 V400 H650 V374 H722 V470 z" fill="#c92a2a" fill-opacity="0.08"/><path d="M260,470 H300 V460 H360 V448 H420 V440 H460 V428 H540 V414 H600 V400 H650 V374 H722" fill="none" stroke="#c92a2a" stroke-width="2.2"/><text x="24" y="418" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="start">Impact cumulé (financier,</text><text x="24" y="433" font-size="12" font-weight="700" fill="#c92a2a" text-anchor="start">clients, juridique, image)</text><rect x="24" y="489" width="22" height="12" rx="3" fill="#1971c2" stroke="none" stroke-width="0"/><text x="54" y="500" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">bleu : regard vers le passé (données perdues)</text><rect x="352" y="489" width="22" height="12" rx="3" fill="#2b8a3e" stroke="none" stroke-width="0"/><rect x="378" y="489" width="22" height="12" rx="3" fill="#d9480f" stroke="none" stroke-width="0"/><text x="408" y="500" font-size="11.5" font-weight="400" fill="#5f6b76" text-anchor="start">vert et orange : regard vers l’avenir (durées d’arrêt)</text></svg>